FG.FINISHES = ['Plated', 'Etched', 'Woven', 'Infused', 'Bound'];

FG.SUFFIXES = ['Grounding', 'the Dawn', 'Embers', 'the Tides', 'Storms',
  'the Frost', 'Radiance', 'Shadows', 'the Abyss', 'Beginnings'];

/* rarity odds by character level: [Common, Rare, Epic, Legendary, Master] */
FG.ODDS = function(level){
  var l = Math.max(1, Math.floor(level) || 1);
  if(l >= 13) return [0, 0, 30, 45, 25];
  if(l >= 8)  return [0, 40, 35, 20, 5];
  if(l >= 4)  return [45, 35, 15, 5, 0];
  return [70, 25, 5, 0, 0];
};
FG.RARITIES = ['Common', 'Rare', 'Epic', 'Legendary', 'Elemental Master'];

/* ---------------- 2. the forge ---------------- */
FG.rng = function(seed){
  var s = (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0 || 1;
  return function(){
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
};

function generateElementalArmor(characterLevel, targetSlot, seed){
  var r = FG.rng(seed);
  var pick = function(a){ return a[Math.floor(r() * a.length)]; };
  var slot = FG.SLOTS.indexOf(targetSlot) >= 0 ? targetSlot : pick(FG.SLOTS);
  var el = pick(FG.ELEMENTS);

  /* rarity roll, level-gated */
  var odds = FG.ODDS(characterLevel), roll = r() * 100, acc = 0, rarity = 'Common';
  for(var i = 0; i < odds.length; i++){
    acc += odds[i];
    if(roll < acc){ rarity = FG.RARITIES[i]; break; }
  }

  var material = pick(FG.MATERIALS[rarity]);
  var finish = pick(FG.FINISHES);
  var piece = pick(FG.PIECES[slot]);
  var suffix = pick(FG.SUFFIXES);
  var name = material + '-' + finish + ' ' + el.noun + ' ' + piece + ' of ' + suffix;
  var idNum = Math.floor(r() * 46656); /* 36^3 */
  var id = 'ar-' + el.name.toLowerCase().replace(/[^a-z]/g, '') + '-' +
           slot + '-' + idNum.toString(36);

  return {
    id: id,
    name: name,
    slot: slot,
    primaryElement: el.name,
    opposingElement: el.opposing,
    cosmeticPalette: {
      primaryColor: el.palette.primaryColor,
      accentColor: el.palette.accentColor,
      glowColor: el.palette.glowColor
    },
    rarity: rarity
  };
}

/* expose globally: the game (and future store UI) calls this */
if(typeof window !== 'undefined'){
  window.generateElementalArmor = generateElementalArmor;
  window.__ARFORGE_DEBUG = {
    ELEMENTS: FG.ELEMENTS, SLOTS: FG.SLOTS, RARITIES: FG.RARITIES,
    ODDS: FG.ODDS, MATERIALS: FG.MATERIALS,
    generate: generateElementalArmor
  };
} else if(typeof global !== 'undefined'){
  global.generateElementalArmor = generateElementalArmor;
}

})();

<script>
/* =================================================================

   ================================================================= */
/* =====================================================================
   PATCH 011 — keychain-redeem
   Date: 2026-10-01 | For: Jeff (Fire Babys)
   Directive: "Keychains with QR codes that give you in game armor" —
     physical merch unlocks digital armor. Each keychain carries a
     unique redeem code (as a QR); entering it in the game's ARMORY
     forges that keychain's one true armor piece.
   Code design (offline-validated, no server needed):
     FB<T>-<6 chars>-<2 checksum>   e.g.  FB3-K7M2PQ-9X
     - Alphabet: 32 unambiguous chars (no 0/O, 1/I/L).
     - T = keychain tier: 1 Common, 2 Rare, 3 Epic, 4 Legendary.
     - Checksum: FNV-1a hash of the payload, mod 32^2 — the game
       recomputes it, so fakes don't redeem.
     - Deterministic: the code hashes to the forge seed, so the SAME
       code always forges the SAME armor (patch 010's seed param).
     - Tier guarantees minimum rarity: a Legendary keychain can never
       forge below Legendary (bounded re-roll, still deterministic).
   What it changes:
     - window.redeemArmorCode(code) -> {ok:true, armor} or
       {ok:false, error}. Global, so the future store/redeem page can
       call it too.
     - ARMORY overlay (HUD button): redeem-code input + your owned
       armor list, persisted in localStorage (guarded try/catch).
     - Duplicate codes are rejected — one keychain, one armor.
   Touches: DOM only (#armoryBtn in #hud, #armoryOv overlay).
     No canvas, combat, or baseline changes. Cosmetic-only, per 008.
   How to disable: set "enabled": false in patches/manifest.json, rebuild.
   Test: redeemArmorCode on a made-up code fails checksum; a real
     generated code forges armor of at least its tier.
   ===================================================================== */
(function(){
'use strict';

var RD = {};

/* security: armor records live in localStorage — escape everything rendered */
RD.esc = function(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};

/* ---------------- 1. codec ---------------- */
RD.ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; /* unambiguous chars, no 0/O/1/I/L */
RD.BASE = RD.ALPHA.length; /* 31 */
RD.TIERS = { 1:'Common', 2:'Rare', 3:'Epic', 4:'Legendary' };
RD.TIER_LEVEL = { 1:3, 2:6, 3:10, 4:15 };       /* forge level per tier */
RD.RANK = { 'Common':0, 'Rare':1, 'Epic':2, 'Legendary':3, 'Elemental Master':4 };

RD.fnv1a = function(str){
  var h = 0x811c9dc5;
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
};

/* make a fresh code for manufacturing: tier 1-4, rng optional (seedable) */
RD.makeCode = function(tier, rand){
  tier = Math.min(4, Math.max(1, Math.floor(tier) || 1));
  var r = rand || Math.random;
  var body = '';
  for(var i = 0; i < 6; i++) body += RD.ALPHA[Math.floor(r() * RD.BASE)];
  var payload = 'FB' + tier + body;
  var chk = RD.fnv1a(payload) % (RD.BASE * RD.BASE);
  var c1 = RD.ALPHA[Math.floor(chk / RD.BASE)], c2 = RD.ALPHA[chk % RD.BASE];
  return 'FB' + tier + '-' + body + '-' + c1 + c2;
};

/* parse + validate; returns {tier} or {error} */
RD.parseCode = function(raw){
  if(!raw || typeof raw !== 'string') return { error:'empty' };
  var code = raw.toUpperCase().replace(/[\s]/g, '');
  var m = /^FB([1-4])-?([A-Z2-9]{6})-?([A-Z2-9]{2})$/.exec(code);
  if(!m) return { error:'format' };
  var tier = parseInt(m[1], 10), body = m[2], chk = m[3];
  var payload = 'FB' + tier + body;
  var want = RD.fnv1a(payload) % (RD.BASE * RD.BASE);
  var got = RD.ALPHA.indexOf(chk[0]) * RD.BASE + RD.ALPHA.indexOf(chk[1]);
  if(got !== want) return { error:'checksum' };
  return { tier: tier, code: 'FB' + tier + '-' + body + '-' + chk };
};

/* ---------------- 2. inventory (localStorage + in-memory fallback) ---------------- */
RD.mem = [];
RD.store = {
  load: function(){
    try{
      if(typeof localStorage !== 'undefined'){
        var s = localStorage.getItem('fb_armory');
        if(s) return JSON.parse(s);
      }
    }catch(e){}
    return RD.mem.slice();
  },
  save: function(list){
    RD.mem = list.slice();
    try{ localStorage.setItem('fb_armory', JSON.stringify(list)); }catch(e){}
  }
};

/* ---------------- 3. redeem ---------------- */
function redeemArmorCode(rawCode){
  var p = RD.parseCode(rawCode);
  if(p.error){
    return { ok:false, error: p.error === 'checksum'
      ? 'That code didn\'t check out — double-check it and try again.'
      : 'Codes look like FB3-K7M2PQ-9X. Try again?' };
  }
  var owned = RD.store.load();
  for(var i = 0; i < owned.length; i++){
    if(owned[i].code === p.code)
      return { ok:false, error:'That keychain already gave you its armor!' };
  }
  var forge = (typeof window !== 'undefined' && window.generateElementalArmor)
    ? window.generateElementalArmor : null;
  if(!forge) return { ok:false, error:'The armor forge isn\'t loaded.' };

  /* deterministic: same code -> same armor, always */
  var seed = RD.fnv1a(p.code);
  var level = RD.TIER_LEVEL[p.tier];
  var minRank = RD.RANK[RD.TIERS[p.tier]];
  var armor = null, tries = 0;
  while(tries < 40){
    var cand = forge(level, 'random', seed + tries);
    if(RD.RANK[cand.rarity] >= minRank){ armor = cand; break; }
    tries++;
  }
  if(!armor) armor = forge(level, 'random', seed); /* fallback, never null */
  armor.code = p.code;
  armor.keychainTier = RD.TIERS[p.tier];
  owned.push(armor);
  RD.store.save(owned);
  return { ok:true, armor: armor };
}

if(typeof window !== 'undefined'){
  window.redeemArmorCode = redeemArmorCode;
  window.__REDEEM_DEBUG = { parse: RD.parseCode, makeCode: RD.makeCode,
    TIERS: RD.TIERS, store: RD.store,
    button: function(){ return RD.btn || null; },
    overlay: function(){ return RD.ov || null; } };
}

RD.ensureDom = function(){

  if(!hud) return false;

    var btn = document.createElement('button');

    btn.textContent = '🎁';
    btn.setAttribute('aria-label', 'open the armory — redeem keychain codes');
    btn.style.cssText = 'pointer-events:auto;background:rgba(12,6,4,.72);' +
      'border:1px solid rgba(255,150,60,.25);border-radius:10px;' +
      'font-size:20px;padding:6px 9px;margin-right:6px;cursor:pointer;';
    btn.addEventListener('click', function(){ RD.open(); });
    var mute = document.getElementById('muteBtn');
    if(mute) hud.insertBefore(btn, mute); else hud.appendChild(btn);
    RD.btn = btn;
  }
  if(!RD.ov && !document.getElementById('armoryOv')){
    var ov = document.createElement('div');
    ov.id = 'armoryOv';
    ov.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;z-index:30;' +
      'display:none;justify-content:center;align-items:flex-start;' +
      'background:rgba(8,3,2,0.94);padding-top:12%;overflow-y:auto;';
    var card = document.createElement('div');
    card.style.cssText = 'width:88%;max-width:480px;background:rgba(24,10,32,0.97);' +
      'border:2px solid #b06eff;border-radius:14px;padding:16px;color:#ffe9d6;' +
      'font:600 13px/1.6 system-ui,sans-serif;';
    card.innerHTML =
      '<div style="font-weight:900;letter-spacing:1.5px;color:#d9b8ff;font-size:15px">🎁 ARMORY</div>' +
      '<div style="opacity:0.85;margin:4px 0 10px">Got a Fire Babys keychain? Type the code from its QR card to forge its armor.</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      '<input id="armoryInput" placeholder="FB3-K7M2PQ-9X" style="flex:1;background:#160a20;color:#ffe9d6;' +
      'border:1px solid #b06eff;border-radius:8px;padding:9px;font:700 14px system-ui;letter-spacing:1px"/>' +
      '<button id="armoryGo" style="background:#b06eff;color:#fff;border:none;border-radius:8px;' +
      'font:800 13px system-ui;padding:9px 14px;cursor:pointer">FORGE</button></div>' +
      '<div id="armoryMsg" style="min-height:20px;margin-bottom:8px;color:#ffb347"></div>' +
      '<div id="armoryList"></div>' +
      '<div style="text-align:center;margin-top:10px"><button id="armoryClose" style="background:#ff5d2e;' +
      'color:#fff;border:none;border-radius:20px;font:800 13px system-ui;padding:8px 18px;cursor:pointer">CLOSE</button></div>';
    ov.appendChild(card);

RD.renderList = function(){
  var list = (typeof document === 'undefined') ? null :
    (document.getElementById('armoryList') ||
     (RD.ov && RD.ov.querySelector ? RD.ov.querySelector('#armoryList') : null));
  if(!list) return;
  var owned = RD.store.load();
  if(!owned.length){
    list.innerHTML = '<div style="opacity:0.6">No armor yet — your keychains are waiting.</div>';
    return;
  }
  list.innerHTML = owned.map(function(a){
    var pal = (a && a.cosmeticPalette) || {};
    return '<div style="border:1px solid ' + RD.esc(pal.glowColor || '#888') + ';border-radius:8px;' +
      'padding:8px 10px;margin:6px 0;background:rgba(0,0,0,0.3)">' +
      '<div style="font-weight:800;color:' + RD.esc(pal.primaryColor || '#fff') + '">' + RD.esc(a.name) + '</div>' +
      '<div style="font-size:12px;opacity:0.85">' + RD.esc(a.primaryElement) + ' · ' + RD.esc(a.slot) +
      ' · <span style="color:#ffd76a">' + RD.esc(a.rarity) + '</span>' +
      (a.keychainTier ? ' · 🔑 ' + RD.esc(a.keychainTier) + ' keychain' : '') + '</div></div>';
  }).join('');
};

RD.say = function(msg, ok){
  var el = (typeof document === 'undefined') ? null :
    (document.getElementById('armoryMsg') ||
     (RD.ov && RD.ov.querySelector ? RD.ov.querySelector('#armoryMsg') : null));
  if(el){ el.textContent = msg; el.style.color = ok ? '#9be15d' : '#ffb347'; }
};

RD.doRedeem = function(raw){
  var res = redeemArmorCode(raw);
  if(res.ok){
    RD.say('FORGED! ' + res.armor.name + ' [' + res.armor.rarity + ']', true);
    RD.renderList();
  } else {
    RD.say(res.error, false);
  }

RD.open = function(){
  if(!RD.ensureDom()) return;
  var ov = RD.ov || document.getElementById('armoryOv');
  if(ov){ ov.style.display = 'flex'; RD.renderList(); }
};
RD.close = function(){
  var ov = (typeof document === 'undefined') ? null :
    (RD.ov || document.getElementById('armoryOv'));
  if(ov) ov.style.display = 'none';
};

RD.ensureDom();

})();

SM.buildMap = function(){

    'border-radius:14px;font:900 16px system-ui;padding:14px 34px;cursor:pointer;';
  if(go.addEventListener) go.addEventListener('click', function(){

  box.appendChild(go);
  ov.appendChild(box);

SM.ensureBtn();

if(typeof window !== 'undefined'){
  window.__STORY_DEBUG = {
    TOWNS: SM.TOWNS, load: SM.load, isUnlocked: SM.isUnlocked, isDone: SM.isDone,
    wins: SM.wins, activeTown: SM.activeTown, onWin: SM.onWin,

  };
}

})();

   Touches: DOM only (#profileBtn, #profileOv). Game.checkEnd (chained).

(function(){

var PF = {};
PF.KEY = 'fb_profile_v1';

/* ---------------- 1. store ---------------- */
PF.mem = null;
PF.load = function(){

    if(typeof localStorage !== 'undefined'){
      var raw = localStorage.getItem(PF.KEY);
      if(raw){ var p = JSON.parse(raw); if(p && typeof p === 'object') d = p; }
    }

  if(typeof d.wins !== 'number' || d.wins < 0) d.wins = 0;

};
PF.save = function(){

};

/* ---------------- 2. battle stats hook (chains with 003/014) ---------------- */
PF.recordResult = function(won){
  var d = PF.load();

};
if(typeof Game !== 'undefined' && Game.checkEnd){
  var __pf_origCheckEnd = Game.checkEnd;
  Game.checkEnd = function(){
    var wasWon = this.won, wasLost = this.lost;
    __pf_origCheckEnd.apply(this, arguments);
    try{
      if(this.won && !wasWon) PF.recordResult(true);
      else if(this.lost && !wasLost) PF.recordResult(false);
    }catch(e){}
  };
}

/* ---------------- 3. live readers (guarded; never throw) ---------------- */
PF.readJSON = function(key, fallback){
  try{
    if(typeof localStorage === 'undefined') return fallback;
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    var p = JSON.parse(raw);
    return (p && typeof p === 'object') ? p : fallback;
  }catch(e){ return fallback; }
};

/* story towns liberated — reads 014's store directly */
PF.towns = function(){
  var names = [];
  try{
    var s = PF.readJSON('fb_story_v1', null);
    var doneIds = (s && s.done instanceof Array) ? s.done : [];
    var map = {};
    if(typeof window !== 'undefined' && window.__STORY_DEBUG && window.__STORY_DEBUG.TOWNS){
      var towns = window.__STORY_DEBUG.TOWNS;
      for(var i = 0; i < towns.length; i++) map[towns[i].id] = towns[i].name;
    }
    for(var k = 0; k < doneIds.length; k++){
      names.push(map[doneIds[k]] || doneIds[k]);
    }
  }catch(e){}
  return names;
};

/* armor collection — reads 011's armory */
PF.armor = function(){
  var list = PF.readJSON('fb_armory', []);
  if(!(list instanceof Array)) list = [];
  var mix = {};
  for(var i = 0; i < list.length; i++){
    var r = (list[i] && list[i].rarity) || 'unknown';
    mix[r] = (mix[r] || 0) + 1;

PF.baby = function(){

PF.esc = function(s){

/* ---------------- 4. rank ---------------- */
PF.RANKS = [

  { towns:5, icon:'⭐', title:'Senior Trainee' },

/* ---------------- 5. avatar (mini fireball, baby's colors) ---------------- */
PF.drawAvatar = function(canvas, baby){
  try{
    if(!canvas || !canvas.getContext) return false;
    var ctx = canvas.getContext('2d');
    if(!ctx) return false;
    var S = canvas.width || 96, cx = S / 2, cy = S / 2, r = S * 0.36;
    var g = ctx.createRadialGradient(cx, cy - r * 0.25, r * 0.1, cx, cy, r * 1.25);
    g.addColorStop(0, baby.core);
    g.addColorStop(0.55, baby.body);
    g.addColorStop(1, baby.dark);
    ctx.clearRect(0, 0, S, S);
    /* flame licks */
    ctx.fillStyle = baby.body;
    for(var f = 0; f < 5; f++){
      var a = -Math.PI / 2 + (f - 2) * 0.5;
      var fx = cx + Math.cos(a) * r * 0.75, fy = cy + Math.sin(a) * r * 0.75;

      ctx.ellipse(fx, fy, r * 0.22, r * 0.42, (f - 2) * 0.18, 0, Math.PI * 2);

    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

    var er = r * 0.16, ey = cy - r * 0.12, ex = r * 0.34;

    ctx.beginPath(); ctx.arc(cx + ex, ey, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff2e1a';
    ctx.beginPath(); ctx.arc(cx - ex, ey, er * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + ex, ey, er * 0.45, 0, Math.PI * 2); ctx.fill();

  dealDamageCastle = function(side, raw, isCrit, sx, sy){
    __fsc_origDDC(side, raw, isCrit, sx, sy);
    if(side === 0 && typeof castles !== 'undefined' && castles[0] &&
       castles[0].hp <= 0 && !FSC.evacDone){
      FSC.evacDone = true;
      FSC.startEvac();
    }
  };
}

FSC.tickEvac = function(){
  var now = (typeof performance !== 'undefined' && performance.now) ?
    performance.now() : Date.now();
  var dt = FSC._lastEvac ? Math.min(0.1, (now - FSC._lastEvac) / 1000) : 0.016;
  FSC._lastEvac = now;
  FSC.evacT -= dt;
  if(FSC.evacT <= 0){ FSC.evacT = 0; FSC._lastEvac = 0; return; }
  if(typeof units === 'undefined' || typeof CFG === 'undefined') return;
  for(var i = 0; i < CFG.MAX_UNITS; i++){
    var u = units[i];
    if(!u.active || u.side !== 0 || u.state === ST.DYING || u.fled) continue;
    var laneX = (u.x < CFG.W * 0.5) ? CFG.W * 0.22 : CFG.W * 0.78;
    var dx = laneX - u.x, dy = (CFG.H - 36) - u.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    if(d < 30){
      u.fled = true;
      try{ burst(u.x, u.y, '#b6ffce', 8, 120, 0.5, 4, -60); }catch(e){}
      freeUnit(u.idx);
      continue;
    }
    var sp = u.moveSpeed * 1.7;
    u.x += dx / d * sp * dt;
    u.y += dy / d * sp * dt;
    u.faceX = dx >= 0 ? 1 : -1;
    u.walkPh += dt * 16;
    u.x = clamp(u.x, 20, CFG.W - 20);
    u.y = clamp(u.y, 120, CFG.H - 20);
  }
};

FSC.drawLanes = function(){
  if(FSC.evacT <= 0 || typeof CFG === 'undefined') return;
  var alpha = Math.min(1, FSC.evacT);
  var now = (typeof performance !== 'undefined' && performance.now) ?
    performance.now() : Date.now();
  ctx.save();
  ctx.globalAlpha = 0.8 * alpha;
  var lanes = [CFG.W * 0.22, CFG.W * 0.78], k, c;
  for(k = 0; k < 2; k++){
    var lx = lanes[k];
    var g = null;
    try{
      g = ctx.createLinearGradient(0, CFG.H * 0.45, 0, CFG.H - 20);
      g.addColorStop(0, 'rgba(90,220,120,0)');
      g.addColorStop(1, 'rgba(90,220,120,0.55)');
    }catch(e){}
    ctx.fillStyle = g || 'rgba(90,220,120,0.3)';
    ctx.fillRect(lx - 34, CFG.H * 0.45, 68, CFG.H * 0.55 - 20);
    ctx.fillStyle = '#b6ffce';
    for(c = 0; c < 4; c++){
      var cy = CFG.H - 60 - c * 44 - ((now / 180) % 44);
      ctx.beginPath();
      ctx.moveTo(lx - 22, cy); ctx.lineTo(lx, cy + 16); ctx.lineTo(lx + 22, cy);
      ctx.lineTo(lx + 22, cy + 8); ctx.lineTo(lx, cy + 24); ctx.lineTo(lx - 22, cy + 8);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = alpha;
  ctx.font = '900 17px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,40,16,0.9)';
  var msg = '\uD83D\uDEA8 TWO WAYS OUT \u2014 GET OUT, STAY OUT!';
  try{ ctx.strokeText(msg, CFG.W / 2, 96); }catch(e){}
  ctx.fillStyle = '#c9ffd9';
  try{ ctx.fillText(msg, CFG.W / 2, 96); }catch(e){}
  ctx.restore();
};

var __fsc_origRender = (typeof render !== 'undefined') ? render : null;
if(__fsc_origRender){
  render = function(){
    if(FSC.evacT > 0) FSC.tickEvac();
    __fsc_origRender();
    if(FSC.evacT > 0) FSC.drawLanes();
  };
}

/* ---------------- 5. Mechanic 2: burning + stop, drop & roll ---------------- */
var __fsc_origDamage = (typeof dealDamage !== 'undefined') ? dealDamage : null;
if(__fsc_origDamage){
  dealDamage = function(t, raw, isCrit, sx, sy, byHero){
    __fsc_origDamage(t, raw, isCrit, sx, sy, byHero);
    /* heroes can catch fire from enemy attacks — no re-entry, no lecture */
    if(t && t.active && t.isHero && t.side === 0 && t.state !== ST.DYING &&
       !t.burning && !t.rolling && Math.random() < 0.30){
      t.burning = 3.0; t.burnTick = 0;
      if(t.baseArmor === undefined) t.baseArmor = t.armor;
      FSC.hintOnce('burn-' + (t.idx || 0),
        '\uD83D\uDD25 Blaze is BURNING! SWIPE \u2192 fast to Stop, Drop & Roll!');
    }
  };
}

FSC.tryRoll = function(){
  if(typeof units === 'undefined' || typeof CFG === 'undefined') return false;
  var i, u, hero = null;
  for(i = 0; i < CFG.MAX_UNITS; i++){
    u = units[i];
    if(u.active && u.isHero && u.side === 0 && u.state !== ST.DYING){
      if(u.burning > 0){ hero = u; break; }
      if(!hero) hero = u;
    }
  }
  if(!hero || !(hero.burning > 0)) return false;
  hero.burning = 0;
  if(hero.baseArmor !== undefined) hero.armor = hero.baseArmor;
  hero.rolling = 1.1;
  try{
    burst(hero.x, hero.y, '#cfc8bc', 16, 170, 0.7, 6, 120);
    if(typeof AudioSys !== 'undefined') AudioSys.extinguishSizzle();
  }catch(e){}
  if(typeof UI !== 'undefined' && UI.hint)
    UI.hint('\uD83D\uDED1 STOP, DROP & ROLL! Flames out, armor back!');
  return true;
};

/* ---------------- 6. Mechanic 3: Buzz overloads on the pillow ---------------- */
var __fsc_origSpawn = (typeof spawnUnit !== 'undefined') ? spawnUnit : null;
if(__fsc_origSpawn){
  spawnUnit = function(side, key, tier, x, y, hpMult, isHero){
    var i = __fsc_origSpawn(side, key, tier, x, y, hpMult, isHero);
    if(i >= 0 && side === 1 && !isHero && typeof units !== 'undefined' &&
       units[i].villain === 'Buzz' && Math.random() < 0.6){
      units[i].overload = true;
      units[i].zapT = 1.0;
    }
    return i;
  };
}

FSC.tryUnplug = function(px, py){
  if(typeof units === 'undefined' || typeof CFG === 'undefined') return false;
  for(var i = 0; i < CFG.MAX_UNITS; i++){
    var u = units[i];
    if(u.active && u.overload && u.state !== ST.DYING){
      var r = u.size + 18;
      var dx = px - u.x, dy = py - u.y;
      if(dx * dx + dy * dy < r * r){
        u.overload = false;
        u.stunT = 2.0; /* moved somewhere hard and flat */
        try{ if(typeof AudioSys !== 'undefined') AudioSys.extinguishSizzle(); }catch(e){}
        FSC.hintOnce('unplug',
          '\uD83D\uDD0C Unplugged! Buzz is on a hard, flat surface now.');
        return true;
      }
    }
  }
  return false;
};

/* per-unit tick: burning DoT, roll spin-down, stun, overload zaps.
   Chains after every earlier updateUnit wrapper (none exist yet). */
var __fsc_origUpdateUnit = (typeof updateUnit !== 'undefined') ? updateUnit : null;
if(__fsc_origUpdateUnit){
  updateUnit = function(u, dt){
    if(!u.active) return;
    if(u.stunT > 0){ u.stunT -= dt; return; }
    if(u.rolling > 0){
      u.rolling -= dt;
      u.walkPh += dt * 22;
      if(u.rolling <= 0) u.rolling = 0;
    }
    if(u.burning > 0 && u.state !== ST.DYING){
      u.burning -= dt; u.burnTick += dt;
      if(u.burnTick >= 0.5){
        u.burnTick = 0;
        u.hp -= 3; u.flash = 1;
        try{
          spawnDmgNum(u.x, u.y - u.size - 6, 3, false);
          burst(u.x, u.y, '#ff7a3c', 4, 120, 0.4, 4, -40);
        }catch(e){}
        if(u.hp <= 0 && typeof killUnit !== 'undefined'){ killUnit(u, u.x, u.y, 0); return; }
      }
      if(u.burning <= 0) u.burning = 0;
    }
    if(u.overload && u.state !== ST.DYING){
      u.zapT -= dt;
      if(u.zapT <= 0){
        u.zapT = 1.4;
        var zapped = 0;
        for(var i = 0; i < CFG.MAX_UNITS; i++){
          var o = units[i];
          if(o.active && o.side === 0 && o.state !== ST.DYING &&
             dist2(u.x, u.y, o.x, o.y) < 110 * 110){
            o.hp -= 6; o.flash = 1;
            try{ spawnDmgNum(o.x, o.y - o.size - 6, 6, false); }catch(e){}
            if(o.hp <= 0 && typeof killUnit !== 'undefined') killUnit(o, u.x, u.y, 0);
            if(++zapped >= 3) break;
          }
        }
        try{
          burst(u.x, u.y, '#fff36a', 10, 240, 0.4, 4, 100);
          if(typeof AudioSys !== 'undefined') AudioSys.crackle();
        }catch(e){}
        FSC.hintOnce('buzz-over',
          '\u26A1 Buzz is OVERLOADING on that pillow! TAP him to unplug the charger!');
      }
    }
    __fsc_origUpdateUnit(u, dt);
  };
}

/* draw extras: pillow + frayed charger (overload), flames (burning),
   motion swirl (rolling). Chains after 007's extras. */
var __fsc_origExtras = (typeof drawBabyExtras !== 'undefined') ? drawBabyExtras : null;
if(__fsc_origExtras){
  drawBabyExtras = function(u, s, t){
    __fsc_origExtras(u, s, t);
    ctx.save();
    if(u.overload){
      var pw = s * 1.5, ph = s * 0.5;
      ctx.fillStyle = '#e8e4da';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(-pw / 2, s * 0.75, pw, ph, ph / 2);
      else ctx.rect(-pw / 2, s * 0.75, pw, ph);
      ctx.fill();
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = Math.max(2, s * 0.08);
      ctx.beginPath();
      ctx.moveTo(s * 0.7, s * 0.9);
      ctx.quadraticCurveTo(s * 1.3, s * 1.2, s * 1.5, s * 0.6);
      ctx.stroke();
      var fl = 0.5 + 0.5 * Math.sin(t * 25);
      ctx.fillStyle = 'rgba(255,240,150,' + fl.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(s * 1.5, s * 0.6, s * 0.12, 0, 6.2832); ctx.fill();
    }
    if(u.burning > 0){
      var bf = 0.6 + 0.4 * Math.sin(t * 30);
      ctx.fillStyle = 'rgba(255,120,30,' + bf.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(-s * 0.4, -s * 0.9, s * 0.22, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.35, -s * 1.0, s * 0.18, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,80,' + bf.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(0, -s * 1.05, s * 0.15, 0, 6.2832); ctx.fill();
    }
    if(u.rolling > 0){
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.25, t * 14, t * 14 + 4.2); ctx.stroke();
    }
    ctx.restore();
  };
}

/* swipe (stop-drop-roll) + tap (unplug Buzz) gestures on the canvas */
if(typeof canvas !== 'undefined' && canvas && canvas.addEventListener &&
   typeof canvasPos !== 'undefined'){
  (function(){
    var g = null;
    canvas.addEventListener('pointerdown', function(e){
      if(typeof Game === 'undefined' || Game.phase !== 'fight'){ g = null; return; }
      var p = canvasPos(e);
      g = { x0: p.x, y0: p.y, t0: (performance.now ? performance.now() : Date.now()),
            id: e.pointerId };
    });
    canvas.addEventListener('pointerup', function(e){
      if(!g || e.pointerId !== g.id){ g = null; return; }
      var p = canvasPos(e);
      var dx = p.x - g.x0, dy = p.y - g.y0;
      var dtms = (performance.now ? performance.now() : Date.now()) - g.t0;
      var s = g; g = null;
      if(typeof Game === 'undefined' || Game.phase !== 'fight') return;
      if(typeof CFG === 'undefined') return;
      /* tap: quick + small — try to unplug an overloaded Buzz */
      if(Math.abs(dx) < 16 && Math.abs(dy) < 16 && dtms < 350){
        FSC.tryUnplug(s.x0, s.y0);
        return;
      }
      /* swipe: fast, mostly-horizontal, starts right of the joystick zone */
      if(dx > 90 && Math.abs(dy) < 60 && dtms < 600 && s.x0 > CFG.W * 0.5){
        FSC.tryRoll();
      }
    });
    canvas.addEventListener('pointercancel', function(){ g = null; });
  })();
}

/* reset per-run state on a fresh deploy */
if(typeof Game !== 'undefined' && typeof Game.toDeploy === 'function'){
  var __fsc_origToDeploy = Game.toDeploy;
  Game.toDeploy = function(){
    __fsc_origToDeploy.call(Game);
    FSC.evacT = 0; FSC.evacDone = false; FSC._lastEvac = 0; FSC.hinted = {};
  };
}

/* debug/test handle for the verifier harness */
if(typeof window !== 'undefined'){
  window.__FSC_DEBUG = {
    NFPA: FSC.NFPA,
    MECHANICS: FSC.MECHANICS,
    TOYETIC: FSC.TOYETIC,
    open: FSC.open, close: FSC.close,
    startEvac: FSC.startEvac, tryRoll: FSC.tryRoll, tryUnplug: FSC.tryUnplug,
    tagCodexCards: FSC.tagCodexCards,
    academyButton: function(){
      if(typeof document === 'undefined') return null;
      return document.getElementById('fsAcadBtn');
    }
  };
}

})();

</script>
</body>
