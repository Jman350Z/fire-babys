<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ember Angler — Fire Babys Fire World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#140800;display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{width:min(100vw,480px)}
canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,LAVA_Y=300;
const LESSON="Never go near real lava or fire! If you see fire, tell a grown-up right away.";
let state='title',score=0,best=0,timeLeft=60,last=0,t=0;
let rodX=W/2,hookY=150,hookDir=1,caught=null,flash=0;
let embers=[],smokes=[],msgs=[];
try{best=parseInt(localStorage.getItem('fb_g24_best')||'0');}catch(e){}

function T(txt,x,y,size,color,align){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);}
function wrap(txt,x,y,maxW,lh,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';let words=txt.split(' '),line='',yy=y;for(const w of words){const t2=line?line+' '+w:w;if(ctx.measureText(t2).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t2;}ctx.fillText(line,x,yy);return yy;}
function baby(x,y,r,mood){ctx.save();ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.9);
  g.addColorStop(0,'rgba(255,180,60,.55)');g.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.9,0,7);ctx.fill();
  ctx.fillStyle='#ff8c1a';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#ffc63f';ctx.beginPath();
  ctx.moveTo(-r*0.62,-r*0.35);ctx.quadraticCurveTo(0,-r*2.1,r*0.62,-r*0.35);
  ctx.quadraticCurveTo(0,-r*0.75,-r*0.62,-r*0.35);ctx.fill();
  ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(-r*0.25,r*0.15,r*0.45,0,7);ctx.fill();
  ctx.fillStyle='#40200a';
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  if(mood==='sad'){ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.6,r*0.3,1.15*Math.PI,1.85*Math.PI);ctx.stroke();}
  else{ctx.fillStyle='rgba(255,120,120,.55)';ctx.beginPath();ctx.arc(-r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.1,r*0.32,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  ctx.restore();}

function newEmber(){return{x:40+Math.random()*(W-80),y:LAVA_Y+40+Math.random()*330,r:13+Math.random()*9,ph:Math.random()*7,sp:25+Math.random()*35};}
function newSmoke(){return{x:40+Math.random()*(W-80),y:LAVA_Y+40+Math.random()*330,r:15+Math.random()*9,ph:Math.random()*7,sp:18+Math.random()*25};}
function reset(){score=0;timeLeft=60;rodX=W/2;hookY=150;hookDir=1;caught=null;flash=0;msgs=[];embers=[];smokes=[];
  for(let i=0;i<7;i++)embers.push(newEmber());
  for(let i=0;i<3;i++)smokes.push(newSmoke());}

function update(dt){
  t+=dt;timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;state='over';if(score>best){best=score;try{localStorage.setItem('fb_g24_best',best);}catch(e){}}return;}
  hookY+=hookDir*280*dt;
  if(hookY>640){hookY=640;hookDir=-1;} if(hookY<150){hookY=150;hookDir=1;
    if(caught){score+=10;msgs.push({txt:'+10',x:rodX,y:200,life:1});caught=null;embers.push(newEmber());}}
  for(const e of embers){e.y-=e.sp*dt;e.ph+=dt*3;if(e.y<LAVA_Y+20){e.y=H-30;e.x=40+Math.random()*(W-80);}}
  for(const s of smokes){s.y-=s.sp*dt;s.ph+=dt*2;if(s.y<LAVA_Y+20){s.y=H-30;s.x=40+Math.random()*(W-80);}}
  if(flash>0)flash-=dt;
  if(!caught&&hookY>LAVA_Y+10){
    for(let i=0;i<embers.length;i++){const e=embers[i];
      if(Math.hypot(rodX-e.x,hookY-e.y)<e.r+12){caught=e;embers.splice(i,1);break;}}
    if(!caught)for(let i=0;i<smokes.length;i++){const s=smokes[i];
      if(Math.hypot(rodX-s.x,hookY-s.y)<s.r+12){score=Math.max(0,score-5);flash=0.4;
        msgs.push({txt:'-5 yucky smoke!',x:rodX,y:hookY-30,life:1.2});
        smokes[i]=newSmoke();break;}}
  }
  for(const m of msgs){m.y-=40*dt;m.life-=dt;}
  msgs=msgs.filter(m=>m.life>0);
}

function draw(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,LAVA_Y);
  sky.addColorStop(0,'#2b1508');sky.addColorStop(1,'#572a0e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,LAVA_Y);
  // stars
  ctx.fillStyle='rgba(255,220,150,.7)';
  for(let i=0;i<30;i++){const sx=(i*97)%W,sy=(i*61)%(LAVA_Y-60);ctx.fillRect(sx,sy,2,2);}
  // dock
  ctx.fillStyle='#6b4423';ctx.fillRect(0,86,W,26);
  ctx.fillStyle='#8a5a2e';for(let x=0;x<W;x+=48)ctx.fillRect(x,86,6,26);
  // lava
  const lv=ctx.createLinearGradient(0,LAVA_Y,0,H);
  lv.addColorStop(0,'#ff5a00');lv.addColorStop(0.5,'#e63c00');lv.addColorStop(1,'#8f1e00');
  ctx.fillStyle=lv;ctx.fillRect(0,LAVA_Y,W,H-LAVA_Y);
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.beginPath();
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,LAVA_Y+Math.sin(x*0.05+t*3)*8);
  ctx.stroke();
  // lava glow spots
  for(let i=0;i<8;i++){const bx=(i*173+t*40)%W,by=LAVA_Y+60+((i*89)%(H-LAVA_Y-100));
    ctx.fillStyle='rgba(255,220,80,.25)';ctx.beginPath();ctx.arc(bx,by,26+Math.sin(t*2+i)*8,0,7);ctx.fill();}
  // embers
  for(const e of embers){const bob=Math.sin(e.ph)*6;
    const g=ctx.createRadialGradient(e.x,e.y+bob,2,e.x,e.y+bob,e.r*2);
    g.addColorStop(0,'#fff3a0');g.addColorStop(0.4,'#ffb300');g.addColorStop(1,'rgba(255,90,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y+bob,e.r*2,0,7);ctx.fill();
    ctx.fillStyle='#ffdf5e';ctx.beginPath();ctx.arc(e.x,e.y+bob,e.r*0.7,0,7);ctx.fill();}
  // smokes
  for(const s of smokes){const bob=Math.sin(s.ph)*8;
    ctx.fillStyle='rgba(90,90,95,.75)';ctx.beginPath();ctx.arc(s.x,s.y+bob,s.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(140,140,145,.6)';ctx.beginPath();ctx.arc(s.x-5,s.y+bob-5,s.r*0.6,0,7);ctx.fill();
    T('~',s.x,s.y+bob,20,'#3a3a3e');}
  // rod + line + hook
  ctx.strokeStyle='#8a5a2e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(rodX-40,60);ctx.lineTo(rodX+40,100);ctx.stroke();
  baby(rodX-52,44,20);
  ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(rodX,100);ctx.lineTo(rodX,hookY);ctx.stroke();
  ctx.fillStyle=caught?'#ffb300':'#cfd8dc';
  ctx.beginPath();ctx.moveTo(rodX,hookY);ctx.lineTo(rodX-9,hookY+16);ctx.lineTo(rodX+9,hookY+16);ctx.closePath();ctx.fill();
  if(caught){const e=caught;ctx.fillStyle='#ffdf5e';ctx.beginPath();ctx.arc(rodX,hookY+26,e.r*0.8,0,7);ctx.fill();}
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.6)+')';ctx.fillRect(0,0,W,H);}
  for(const m of msgs)T(m.txt,m.x,m.y,22,'#fff');
  // HUD
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,44);
  T('🎣 '+score,70,24,24,'#ffd76a','left');
  T('⏱️ '+Math.ceil(timeLeft)+'s',W-90,24,24,'#fff','left');
  T('BEST '+best,W/2,24,20,'#ffb26a');
}

function drawTitle(){
  draw();ctx.fillStyle='rgba(10,4,0,.78)';ctx.fillRect(0,0,W,H);
  baby(W/2,150,54);T('EMBER ANGLER',W/2,240,44,'#ffb300');
  T('🎣 Fire Babys Fire World 🎣',W/2,280,20,'#ffd76a');
  wrap('Drag to move your rod. Your hook dips automatically — catch the glowing embers! Avoid the yucky smoke puffs (-5). You have 60 seconds!',W/2,340,400,30,21,'#fff');
  ctx.fillStyle='#3a2408';ctx.fillRect(40,470,W-80,120);
  T('🔥 FIRE SAFETY 🔥',W/2,495,22,'#ffb300');
  wrap(LESSON,W/2,530,380,26,19,'#ffe6b0');
  T('Tap to start fishing!',W/2,640,26,'#7dff9a');
  T('Made by Jman350Z & the Fire Team',W/2,690,15,'#a07a4a');
}
function drawOver(){
  draw();ctx.fillStyle='rgba(10,4,0,.8)';ctx.fillRect(0,0,W,H);
  baby(W/2,170,54,score>=30?'happy':'sad');
  T("TIME'S UP!",W/2,270,44,'#ffb300');
  T('Score: '+score,W/2,330,34,'#fff');
  T('Best: '+best,W/2,370,24,'#ffd76a');
  ctx.fillStyle='#3a2408';ctx.fillRect(40,410,W-80,130);
  T('🔥 FIRE SAFETY 🔥',W/2,438,22,'#ffb300');
  wrap(LESSON,W/2,475,380,26,19,'#ffe6b0');
  T('Tap to play again!',W/2,600,26,'#7dff9a');
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);
  if(state==='title')drawTitle();else if(state==='over')drawOver();else draw();
  requestAnimationFrame(loop);}
function press(x,y){
  if(state==='title'){reset();state='play';}
  else if(state==='over'){reset();state='play';}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width;press(x,0);});
cv.addEventListener('pointermove',e=>{if(state!=='play')return;const r=cv.getBoundingClientRect();
  rodX=Math.max(20,Math.min(W-20,(e.clientX-r.left)*W/r.width));});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rodX=Math.max(20,rodX-24);
  if(e.key==='ArrowRight')rodX=Math.min(W-20,rodX+24);
  if((e.key===' '||e.key==='Enter')&&(state==='title'||state==='over'))press(0,0);});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
