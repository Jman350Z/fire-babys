<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pool Party Panic — Fire Babys Fire World</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b1626;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Trebuchet MS',Verdana,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 50px rgba(60,180,255,.25)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* GAME 13: POOL PARTY PANIC — guide your Fire Baby down to the pool! */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=400,H=600;cv.width=W;cv.height=H;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
function P(e){var r=cv.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e;return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};}
var LESSON="FIRE SAFETY: Cool a burn under cool running water for 10 minutes. Water puts out fire on skin and clothes!";
var state='title',score=0,lives=3,round=1,bx,by,inv,rocks,spawnT,drag=false,parts=[],keys={};
function reset(){bx=W/2;by=80;rocks=[];spawnT=0;inv=0;parts=[];}
reset();
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(t,x,y,mw,lh){var ws=t.split(' '),ln='',yy=y;for(var i=0;i<ws.length;i++){var s=ln+ws[i]+' ';if(ctx.measureText(s).width>mw&&i>0){ctx.fillText(ln,x,yy);ln=ws[i]+' ';yy+=lh;}else ln=s;}ctx.fillText(ln,x,yy);}
function baby(x,y,r){
  var g=ctx.createRadialGradient(x-r*.2,y-r*.3,r*.1,x,y,r*1.1);
  g.addColorStop(0,'#ffe680');g.addColorStop(.55,'#ff9f1c');g.addColorStop(1,'#e8590c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-r*.75,y-r*.35);
  ctx.quadraticCurveTo(x-r*.25,y-r*1.7,x+r*.05,y-r*1.05);
  ctx.quadraticCurveTo(x+r*.35,y-r*1.7,x+r*.75,y-r*.35);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#a33b00';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#40260f';
  ctx.beginPath();ctx.arc(x-r*.32,y-r*.05,r*.12,0,7);ctx.arc(x+r*.32,y-r*.05,r*.12,0,7);ctx.fill();
  ctx.strokeStyle='#40260f';ctx.lineWidth=Math.max(2,r*.09);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x,y+r*.28,r*.32,.35,Math.PI-.35);ctx.stroke();
  ctx.fillStyle='rgba(255,110,110,.55)';
  ctx.beginPath();ctx.arc(x-r*.55,y+r*.22,r*.11,0,7);ctx.arc(x+r*.55,y+r*.22,r*.11,0,7);ctx.fill();
}
function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b6cb0');g.addColorStop(.55,'#90cdf4');g.addColorStop(.78,'#f6e05e');g.addColorStop(1,'#38b2ac');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2c7a7b';ctx.fillRect(0,H-100,W,100);
  ctx.fillStyle='#1d8fd1';
  ctx.beginPath();ctx.ellipse(W/2,H-45,W/2-14,42,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;
  for(var i=0;i<4;i++){ctx.beginPath();ctx.arc(60+i*95,H-45,16+((i*7)%3)*4,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.font='bold 15px Trebuchet MS';ctx.textAlign='center';
  ctx.fillText('💧 THE POOL 💧',W/2,H-12);
}
function drawPanel(title,lines,foot){
  ctx.fillStyle='rgba(8,18,34,.88)';rr(20,80,W-40,H-220,18);ctx.fill();
  ctx.strokeStyle='#4db2ff';ctx.lineWidth=3;rr(20,80,W-40,H-220,18);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.font='bold 28px Trebuchet MS';ctx.fillText(title,W/2,130);
  ctx.font='16px Trebuchet MS';var y=165;
  lines.forEach(function(l){ctx.fillText(l,W/2,y);y+=26;});
  ctx.fillStyle='#ffd166';ctx.font='bold 14px Trebuchet MS';
  wrap(LESSON,W/2,y+12,W-90,20);
  ctx.fillStyle='#7CFC00';ctx.font='bold 20px Trebuchet MS';
  ctx.fillText(foot,W/2,H-170);
}
function spawnRock(){
  var lanes=[170,270,370,470];
  var y=lanes[(Math.random()*lanes.length)|0];
  var side=Math.random()<.5?-30:W+30;
  rocks.push({x:side,y:y,r:16+Math.random()*10,v:(side<0?1:-1)*(1.4+round*.35+Math.random())});
}
function update(){
  if(state!=='play')return;
  if(keys.left)bx-=4;if(keys.right)bx+=4;
  bx=Math.max(24,Math.min(W-24,bx));
  by+=1.3+round*.3;
  if(inv>0)inv--;
  spawnT++;
  if(spawnT>Math.max(28,70-round*5)){spawnT=0;spawnRock();}
  for(var i=rocks.length-1;i>=0;i--){var k=rocks[i];k.x+=k.v;
    if(k.x<-40||k.x>W+40){rocks.splice(i,1);continue;}
    var dx=bx-k.x,dy=by-k.y;
    if(inv<=0&&dx*dx+dy*dy<Math.pow(20+k.r-6,2)){
      lives--;inv=90;parts.push({x:bx,y:by,t:20});
      if(lives<=0){state='over';}
    }
  }
  for(var j=parts.length-1;j>=0;j--){parts[j].t--;if(parts[j].t<=0)parts.splice(j,1);}
  if(by>=H-118){ // SPLASH!
    score++;round++;
    for(var s=0;s<14;s++)parts.push({x:bx+(Math.random()-.5)*60,y:H-60,t:25+Math.random()*15,blue:true});
    reset();inv=60;
  }
}
function draw(){
  drawBG();
  rocks.forEach(function(k){
    ctx.fillStyle='#718096';ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,7);ctx.fill();
    ctx.fillStyle='#4a5568';ctx.beginPath();ctx.arc(k.x-k.r*.3,k.y-k.r*.3,k.r*.35,0,7);ctx.fill();
  });
  parts.forEach(function(p){
    ctx.fillStyle=p.blue?'rgba(120,200,255,'+(p.t/40)+')':'rgba(255,200,80,'+(p.t/40)+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.blue?5:8,0,7);ctx.fill();
  });
  if(state==='play'||state==='over'){
    if(!(inv>0&&((inv/6)|0)%2===0))baby(bx,by,20);
  }
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 18px Trebuchet MS';
  ctx.fillText('⭐ '+score,12,28);
  ctx.textAlign='right';ctx.fillText('❤'.repeat(Math.max(0,lives)),W-12,28);
  ctx.textAlign='center';ctx.font='bold 15px Trebuchet MS';ctx.fillStyle='#ffe680';
  ctx.fillText('ROUND '+round,W/2,28);
  if(state==='title'){
    drawBG();
    drawPanel('POOL PARTY PANIC',
      ['Drag (or ← →) to steer your Fire Baby!','Dodge the rolling rocks.','Reach the POOL at the bottom to score!','3 hearts — bonking a rock costs one.'],
      '👆 TAP TO START 👆');
  }else if(state==='over'){
    drawPanel('GAME OVER',['You scored '+score+' pool splashes!','The Fire Babys had a blast!'],'👆 TAP TO PLAY AGAIN 👆');
  }
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
  if(state!=='play'){state='play';score=0;lives=3;round=1;reset();return;}
  drag=true;bx=P(e).x;
});
addEventListener('pointermove',function(e){if(drag&&state==='play'){bx=P(e).x;}});
addEventListener('pointerup',function(){drag=false;});
addEventListener('keydown',function(e){keys[e.key==='ArrowLeft'||e.key==='a'?'left':e.key==='ArrowRight'||e.key==='d'?'right':'x']=true;
  if((e.key===' '||e.key==='Enter')&&state!=='play'){state='play';score=0;lives=3;round=1;reset();}});
addEventListener('keyup',function(e){keys[e.key==='ArrowLeft'||e.key==='a'?'left':e.key==='ArrowRight'||e.key==='d'?'right':'x']=false;});
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
