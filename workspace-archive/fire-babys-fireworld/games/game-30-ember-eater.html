<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ember Eater — Fire Babys Fire World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#140800;display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{width:min(100vw,480px)}
canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720;
const COLS=11,ROWS=13,TS=34,OX=(W-COLS*TS)/2,OY=120;
const LESSON="Test your smoke alarms every month! Working smoke alarms save lives — just like Blaze gobbles every dot!";
let state='title',score=0,best=0,lives=3,level=1,last=0,t=0;
let dots=[],power=[],walls=[];
let px=0,py=0,pdir={x:1,y:0},want={x:1,y:0};
let monsters=[],fright=0,dotsLeft=0,eaten=0;
try{best=parseInt(localStorage.getItem('fb_g30_best')||'0');}catch(e){}

// wall rectangles in tile coords {x,y,w,h}
const WALLS=[{x:2,y:2,w:2,h:1},{x:7,y:2,w:2,h:1},{x:2,y:5,w:2,h:1},{x:7,y:5,w:2,h:1},
 {x:5,y:3,w:1,h:3},{x:2,y:8,w:2,h:1},{x:7,y:8,w:2,h:1},{x:5,y:9,w:1,h:2},
 {x:0,y:6,w:2,h:1},{x:9,y:6,w:2,h:1}];
function inWall(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return true;
  for(const wl of WALLS)if(c>=wl.x&&c<wl.x+wl.w&&r>=wl.y&&r<wl.y+wl.h)return true;return false;}
function tileXY(c,r){return{x:OX+c*TS+TS/2,y:OY+r*TS+TS/2};}

function reset(full){
  if(full){score=0;lives=3;level=1;}
  dots=[];power=[];eaten=0;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    if(inWall(c,r))continue;
    if((c===1&&r===1)||(c===9&&r===1)||(c===1&&r===11)||(c===9&&r===11))power.push({c:c,r:r});
    else if(!((c===5&&r===7)||(c===4&&r===7)||(c===6&&r===7)))dots.push({c:c,r:r});
  }
  dotsLeft=dots.length+power.length;
  const s=tileXY(5,7);px=s.x;py=s.y;pdir={x:1,y:0};want={x:1,y:0};
  const m1=tileXY(4,4),m2=tileXY(6,4);
  monsters=[{x:m1.x,y:m1.y,dir:{x:1,y:0},c:'#b39ddb',ph:0},{x:m2.x,y:m2.y,dir:{x:-1,y:0},c:'#90caf9',ph:2}];
  fright=0;
}
function curTile(x,y){return{c:Math.floor((x-OX)/TS),r:Math.floor((y-OY)/TS)};}
function centerOf(x,y){const t=curTile(x,y);return{x:OX+t.c*TS+TS/2,y:OY+t.r*TS+TS/2};}
function canGo(c,r){return!inWall(c,r);}

function moveActor(a,dir,speed,dt,isPlayer){
  const sp=speed*dt;
  // try turning at tile center
  const ctr=centerOf(a.x,a.y);
  if(Math.hypot(a.x-ctr.x,a.y-ctr.y)<sp*1.2){
    a.x=ctr.x;a.y=ctr.y;
    const t=curTile(a.x,a.y);
    if(isPlayer&&(want.x!==dir.x||want.y!==dir.y)){
      if(canGo(t.c+want.x,t.r+want.y)){dir.x=want.x;dir.y=want.y;}
    }
    if(!canGo(t.c+dir.x,t.r+dir.y)){dir.x=0;dir.y=0;return dir;}
  }
  a.x+=dir.x*sp;a.y+=dir.y*sp;
  // wrap tunnels (none) — clamp
  return dir;
}
function monsterAI(m,dt){
  const ctr=centerOf(m.x,m.y);
  const sp=(fright>0?70:95+level*10)*dt;
  if(Math.hypot(m.x-ctr.x,m.y-ctr.y)<sp*1.4){
    m.x=ctr.x;m.y=ctr.y;
    const t=curTile(m.x,m.y);
    const opts=[];
    const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    for(const d of dirs){
      if(d.x===-m.dir.x&&d.y===-m.dir.y)continue; // no reverse
      if(canGo(t.c+d.x,t.r+d.y))opts.push(d);
    }
    if(opts.length===0){m.dir={x:-m.dir.x,y:-m.dir.y};}
    else{
      // chase player when close & brave
      const pd=Math.hypot(px-m.x,py-m.y);
      if(fright<=0&&pd<170){
        let bd=opts[0],bs=1e9;
        for(const d of opts){const nx=m.x+d.x*TS,ny=m.y+d.y*TS;
          const dd=Math.hypot(px-nx,py-ny);if(dd<bs){bs=dd;bd=d;}}
        m.dir={x:bd.x,y:bd.y};
      }else m.dir=opts[Math.floor(Math.random()*opts.length)];
    }
  }
  m.x+=m.dir.x*sp;m.y+=m.dir.y*sp;m.ph+=dt*6;
}

function update(dt){
  t+=dt;
  if(fright>0)fright-=dt;
  const ps=150+level*12;
  pdir=moveActor({x:px,y:py},pdir,ps,dt,true);
  // sync back (moveActor mutates a copy) — redo properly:
  // (we pass a temp object; instead move manually)
  // --- simpler: do movement inline
  // NOTE: reimplementing cleanly below
  stepPlayer(dt);
  for(const m of monsters)monsterAI(m,dt);
  // eat dots
  const t0=curTile(px,py);
  for(let i=dots.length-1;i>=0;i--){const d=dots[i];
    if(d.c===t0.c&&d.r===t0.r&&Math.hypot(px-(OX+d.c*TS+TS/2),py-(OY+d.r*TS+TS/2))<14){
      dots.splice(i,1);score+=10;eaten++;dotsLeft--;}}
  for(let i=power.length-1;i>=0;i--){const d=power[i];
    if(d.c===t0.c&&d.r===t0.r&&Math.hypot(px-(OX+d.c*TS+TS/2),py-(OY+d.r*TS+TS/2))<16){
      power.splice(i,1);score+=50;dotsLeft--;fright=7;}}
  if(dotsLeft<=0){level++;reset(false);return;}
  // monsters collide
  for(const m of monsters){
    if(Math.hypot(px-m.x,py-m.y)<24){
      if(fright>0){score+=200;m.x=tileXY(5,1).x;m.y=tileXY(5,1).y;m.dir={x:1,y:0};}
      else{lives--;if(lives<=0){state='over';
          if(score>best){best=score;try{localStorage.setItem('fb_g30_best',best);}catch(e){}}return;}
        reset(false);return;}
    }
  }
}
// clean player stepping (replaces the temp-object hack above)
let pxx=0,pyy=0;
function stepPlayer(dt){
  // we already moved via moveActor on a copy — instead track real pos here
  // To keep it simple: moveActor mutated a temp; redo with real vars:
  // (This function corrects by re-simulating — instead we just do it right:)
  px=pxx;py=pyy;
}
function realStep(dt){
  const sp=(150+level*12)*dt;
  const ctr=centerOf(pxx,pyy);
  if(Math.hypot(pxx-ctr.x,pyy-ctr.y)<sp*1.3){
    pxx=ctr.x;pyy=ctr.y;
    const t2=curTile(pxx,pyy);
    if(want.x!==pdir.x||want.y!==pdir.y){if(canGo(t2.c+want.x,t2.r+want.y)){pdir={x:want.x,y:want.y};}}
    if(!canGo(t2.c+pdir.x,t2.r+pdir.y)){pdir={x:0,y:0};}
  }
  pxx+=pdir.x*sp;pyy+=pdir.y*sp;
  px=pxx;py=pyy;
}

function T(txt,x,y,size,color,align){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);}
function wrap(txt,x,y,maxW,lh,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';let words=txt.split(' '),line='',yy=y;for(const w of words){const t2=line?line+' '+w:w;if(ctx.measureText(t2).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t2;}ctx.fillText(line,x,yy);return yy;}
function baby(x,y,r,mood){ctx.save();ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.9);
  g.addColorStop(0,'rgba(255,180,60,.55)');g.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.9,0,7);ctx.fill();
  ctx.fillStyle='#ff8c1a';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#ffc63f';ctx.beginPath();
  ctx.moveTo(-r*0.62,-r*0.35);ctx.quadraticCurveTo(0,-r*2.1,r*0.62,-r*0.35);
  ctx.quadraticCurveTo(0,-r*0.75,-r*0.62,-r*0.35);ctx.fill();
  ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(-r*0.25,r*0.15,r*0.45,0,7);ctx.fill();
  ctx.fillStyle='#40200a';
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  if(mood==='sad'){ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.6,r*0.3,1.15*Math.PI,1.85*Math.PI);ctx.stroke();}
  else{ctx.fillStyle='rgba(255,120,120,.55)';ctx.beginPath();ctx.arc(-r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.1,r*0.32,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  ctx.restore();}
function smokeMonster(x,y,r,color,ph,scared){
  ctx.save();ctx.translate(x,y);
  const bob=Math.sin(ph)*3;ctx.translate(0,bob);
  ctx.fillStyle=scared?'#4fc3ff':color;
  ctx.beginPath();ctx.arc(0,0,r,Math.PI,0);
  ctx.lineTo(r,r*0.9);
  for(let i=0;i<4;i++)ctx.lineTo(r-(i+0.5)*r/2,r*0.55+((i%2)*r*0.2));
  ctx.lineTo(-r,r*0.9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-r*0.35,-r*0.15,r*0.22,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.35,-r*0.15,r*0.22,0,7);ctx.fill();
  ctx.fillStyle=scared?'#0d47a1':'#e53935';
  const look=scared?0:Math.sin(ph*0.7)*r*0.08;
  ctx.beginPath();ctx.arc(-r*0.35+look,-r*0.15,r*0.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.35+look,-r*0.15,r*0.1,0,7);ctx.fill();
  if(scared){ctx.strokeStyle='#0d47a1';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*0.35,r*0.25,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  ctx.restore();}

function draw(){
  ctx.fillStyle='#0d1026';ctx.fillRect(0,0,W,H);
  // maze bg
  ctx.fillStyle='#141a3a';ctx.fillRect(OX-8,OY-8,COLS*TS+16,ROWS*TS+16);
  // walls
  for(const wl of WALLS){
    const g=ctx.createLinearGradient(0,OY+wl.y*TS,0,OY+(wl.y+wl.h)*TS);
    g.addColorStop(0,'#3f51b5');g.addColorStop(1,'#1a237e');
    ctx.fillStyle=g;
    ctx.fillRect(OX+wl.x*TS,OY+wl.y*TS,wl.w*TS,wl.h*TS);
    ctx.strokeStyle='#9fa8da';ctx.lineWidth=2;
    ctx.strokeRect(OX+wl.x*TS+1,OY+wl.y*TS+1,wl.w*TS-2,wl.h*TS-2);
  }
  // dots
  ctx.fillStyle='#ffd76a';
  for(const d of dots){ctx.beginPath();ctx.arc(OX+d.c*TS+TS/2,OY+d.r*TS+TS/2,4+Math.sin(t*4+d.c)*1,0,7);ctx.fill();}
  for(const d of power){const g2=ctx.createRadialGradient(OX+d.c*TS+TS/2,OY+d.r*TS+TS/2,1,OX+d.c*TS+TS/2,OY+d.r*TS+TS/2,14);
    g2.addColorStop(0,'#fff');g2.addColorStop(0.5,'#ffb300');g2.addColorStop(1,'rgba(255,140,0,0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(OX+d.c*TS+TS/2,OY+d.r*TS+TS/2,14,0,7);ctx.fill();}
  // monsters
  for(const m of monsters)smokeMonster(m.x,m.y,15,m.c,m.ph,fright>0);
  // player with chomp
  const chomp=Math.abs(Math.sin(t*14))*0.5;
  ctx.save();ctx.translate(px,py);ctx.rotate(pdir.x===0?(pdir.y>0?Math.PI/2:-Math.PI/2):(pdir.x<0?Math.PI:0));
  baby(0,0,16);
  ctx.fillStyle='#40200a';ctx.beginPath();ctx.moveTo(8,0);
  ctx.arc(8,0,10,-chomp,chomp);ctx.closePath();ctx.fill();
  ctx.restore();
  if(fright>0)T('POWER! '+Math.ceil(fright)+'s',W/2,OY-40,22,'#4fc3ff');
  // HUD
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,46);
  T('🔥 '+score,70,25,24,'#ffd76a','left');
  let hearts='';for(let i=0;i<3;i++)hearts+=i<lives?'❤️':'🤍';
  T(hearts,W/2,25,22,'#fff');
  T('LV '+level,W-60,25,22,'#8ef4ff','left');
  T('Swipe / arrows to steer • eat all dots!',W/2,H-24,18,'#9fa8da');
}
// fix update to use realStep: patch by wrapping
const _update=update;
update=function(dt){
  // temporarily replace stepPlayer behavior: use realStep
  t+=dt;
  if(fright>0)fright-=dt;
  realStep(dt);
  for(const m of monsters)monsterAI(m,dt);
  const t0=curTile(px,py);
  for(let i=dots.length-1;i>=0;i--){const d=dots[i];
    if(d.c===t0.c&&d.r===t0.r&&Math.hypot(px-(OX+d.c*TS+TS/2),py-(OY+d.r*TS+TS/2))<14){
      dots.splice(i,1);score+=10;eaten++;dotsLeft--;}}
  for(let i=power.length-1;i>=0;i--){const d=power[i];
    if(d.c===t0.c&&d.r===t0.r&&Math.hypot(px-(OX+d.c*TS+TS/2),py-(OY+d.r*TS+TS/2))<16){
      power.splice(i,1);score+=50;dotsLeft--;fright=7;}}
  if(dotsLeft<=0){level++;reset(false);const s=tileXY(5,7);pxx=s.x;pyy=s.y;px=s.x;py=s.y;return;}
  for(const m of monsters){
    if(Math.hypot(px-m.x,py-m.y)<24){
      if(fright>0){score+=200;const s2=tileXY(5,1);m.x=s2.x;m.y=s2.y;m.dir={x:1,y:0};}
      else{lives--;if(lives<=0){state='over';
          if(score>best){best=score;try{localStorage.setItem('fb_g30_best',best);}catch(e){}}return;}
        reset(false);const s3=tileXY(5,7);pxx=s3.x;pyy=s3.y;px=s3.x;py=s3.y;return;}
    }
  }
};

function drawTitle(){
  draw();ctx.fillStyle='rgba(8,8,20,.82)';ctx.fillRect(0,0,W,H);
  baby(W/2-90,150,40);smokeMonster(W/2+90,150,36,'#b39ddb',t*6,false);
  T('EMBER EATER',W/2,245,44,'#ffd76a');
  T('👻 Fire Babys Fire World 👻',W/2,283,20,'#ffd76a');
  wrap('Swipe or use arrow keys to steer Blaze! Gobble every dot. Grab a glowing power ember to chase the grumpy smoke monsters! 3 hearts.',W/2,345,400,30,21,'#fff');
  ctx.fillStyle='#1a1440';ctx.fillRect(40,480,W-80,110);
  T('🔥 FIRE SAFETY 🔥',W/2,505,22,'#ffb300');
  wrap(LESSON,W/2,542,380,26,19,'#ffe6b0');
  T('Tap to start gobbling!',W/2,640,26,'#7dff9a');
  T('Made by Jman350Z & the Fire Team',W/2,690,15,'#7a8aa0');
}
function drawOver(){
  draw();ctx.fillStyle='rgba(8,8,20,.84)';ctx.fillRect(0,0,W,H);
  baby(W/2,160,50,'sad');
  T('GAME OVER',W/2,265,44,'#ffd76a');
  T('Score: '+score+'  •  Level '+level,W/2,325,30,'#fff');
  T('Best: '+best,W/2,363,24,'#ffd76a');
  ctx.fillStyle='#1a1440';ctx.fillRect(40,405,W-80,140);
  T('🔥 FIRE SAFETY 🔥',W/2,432,22,'#ffb300');
  wrap(LESSON,W/2,468,380,26,19,'#ffe6b0');
  T('Tap to play again!',W/2,600,26,'#7dff9a');
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);else t+=dt;
  if(state==='title')drawTitle();else if(state==='over')drawOver();else draw();
  requestAnimationFrame(loop);}
// input: swipe
let sx=0,sy=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'||state==='over'){reset(true);const s=tileXY(5,7);pxx=s.x;pyy=s.y;px=s.x;py=s.y;state='play';return;}
  sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointermove',e=>{if(state!=='play')return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))want={x:dx>0?1:-1,y:0};else want={x:0,y:dy>0?1:-1};
  sx=e.clientX;sy=e.clientY;});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')want={x:-1,y:0};
  else if(e.key==='ArrowRight')want={x:1,y:0};
  else if(e.key==='ArrowUp')want={x:0,y:-1};
  else if(e.key==='ArrowDown')want={x:0,y:1};
  else if((e.key===' '||e.key==='Enter')&&(state==='title'||state==='over')){reset(true);const s=tileXY(5,7);pxx=s.x;pyy=s.y;px=s.x;py=s.y;state='play';}});
reset(true);{const s=tileXY(5,7);pxx=s.x;pyy=s.y;px=s.x;py=s.y;}
requestAnimationFrame(loop);
</script>
</body>
</html>
