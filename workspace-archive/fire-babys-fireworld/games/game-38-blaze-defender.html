<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blaze Defender — Fire Babys</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#1a0f2e;overflow:hidden;font-family:'Comic Sans MS','Chalkboard SE',cursive,sans-serif;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#2d1a4d;max-width:100vw;max-height:100vh;box-shadow:0 0 40px #ff7b00aa}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
// ============ BLAZE DEFENDER ============
// A kid-safe tower defense. Water towers vs wild flames. Fire babies are PRECIOUS: never harmed.
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;
function fit(){const r=window.devicePixelRatio||1;const s=Math.min(window.innerWidth/W,window.innerHeight/H);
cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';cvs.width=W*r;cvs.height=H*r;ctx.setTransform(r,0,0,r,0,0);}
window.addEventListener('resize',fit);fit();

const LESSON="Water puts out most fires. Know where your home's fire extinguisher is — remember PASS: Pull, Aim, Squeeze, Sweep!";
let state='title',score=0,coins=60,lives=10,wave=0,waveActive=false,spawnQ=[],spawnT=0,waveT=0,victory=false;
let enemies=[],towers=[],drops=[],bursts=[],floaters=[],placements=[];

const PATH=[[0,300],[140,300],[140,130],[320,130],[320,470],[500,470],[500,180],[680,180],[680,360],[780,360],[900,360]];
const SPOTS=[[60,200],[200,380],[260,80],[380,260],[420,530],[560,290],[590,80],[620,430],[740,110],[740,470],[200,520],[40,470]];
const TOWER_COST=30,SPLASH_RANGE=95;

function pathPos(d){
  let acc=0;
  for(let i=0;i<PATH.length-1;i++){
    const ax=PATH[i][0],ay=PATH[i][1],bx=PATH[i+1][0],by=PATH[i+1][1];
    const len=Math.hypot(bx-ax,by-ay);
    if(d<=acc+len){const t=(d-acc)/len;return{x:ax+(bx-ax)*t,y:ay+(by-ay)*t};}
    acc+=len;
  }
  const p=PATH[PATH.length-1];return{x:p[0],y:p[1]};
}
const PATH_LEN=(()=>{let l=0;for(let i=0;i<PATH.length-1;i++)l+=Math.hypot(PATH[i+1][0]-PATH[i][0],PATH[i+1][1]-PATH[i][1]);return l;})();

function distToPath(x,y){
  let m=1e9;
  for(let i=0;i<PATH.length-1;i++){
    const ax=PATH[i][0],ay=PATH[i][1],bx=PATH[i+1][0],by=PATH[i+1][1];
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=((x-ax)*dx+(y-ay)*dy)/L2;t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t,py=ay+dy*t;m=Math.min(m,Math.hypot(x-px,y-py));
  }
  return m;
}
placements=SPOTS.filter(s=>distToPath(s[0],s[1])>52);

function startWave(){
  wave++;
  const n=4+wave*2;
  spawnQ=[];
  for(let i=0;i<n;i++)spawnQ.push({hp:20+wave*9,speed:34+wave*3+Math.random()*10,size:16+Math.min(10,wave)});
  waveActive=true;spawnT=0;
}
function reset(){
  score=0;coins=60;lives=10;wave=0;waveActive=false;
  enemies=[];towers=[];drops=[];bursts=[];floaters=[];spawnQ=[];victory=false;
}

// --- draw helpers ---
function drawFireBaby(x,y,s,face){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const g=ctx.createLinearGradient(0,-34,0,24);
  g.addColorStop(0,'#ffea00');g.addColorStop(.45,'#ffb700');g.addColorStop(1,'#ff6a00');
  ctx.fillStyle=g;ctx.strokeStyle='#7a2d00';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,-38);
  ctx.bezierCurveTo(16,-22,22,-8,22,8);
  ctx.bezierCurveTo(22,24,10,32,0,32);
  ctx.bezierCurveTo(-10,32,-22,24,-22,8);
  ctx.bezierCurveTo(-22,-8,-14,-20,0,-38);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff2cc';
  ctx.beginPath();ctx.arc(0,14,9,0,7);ctx.fill();
  if(face!==false){
    ctx.fillStyle='#5b2400';
    ctx.beginPath();ctx.arc(-7,8,2.6,0,7);ctx.arc(7,8,2.6,0,7);ctx.fill();
    ctx.strokeStyle='#5b2400';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,13,5,.15*Math.PI,.85*Math.PI);ctx.stroke();
  }
  ctx.restore();
}
function drawFlame(x,y,s,flick){
  ctx.save();ctx.translate(x,y);ctx.scale(s/22,s/22);
  const w=Math.sin(flick)*2;
  const g=ctx.createLinearGradient(0,-30,0,22);
  g.addColorStop(0,'#ffff66');g.addColorStop(.5,'#ff9500');g.addColorStop(1,'#e83c00');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(w,-32);
  ctx.bezierCurveTo(12,-18+w,14,-4,14,8);
  ctx.bezierCurveTo(14,20,6,26,0,26);
  ctx.bezierCurveTo(-6,26,-14,20,-14,8);
  ctx.bezierCurveTo(-14,-6,-8,-16,w,-32);
  ctx.closePath();ctx.fill();
  // angry eyes
  ctx.fillStyle='#3d0000';
  ctx.beginPath();ctx.arc(-5,6,2.4,0,7);ctx.arc(5,6,2.4,0,7);ctx.fill();
  ctx.strokeStyle='#3d0000';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-8,1);ctx.lineTo(-2,4);ctx.moveTo(8,1);ctx.lineTo(2,4);ctx.stroke();
  ctx.restore();
}
function drawTower(t){
  ctx.save();ctx.translate(t.x,t.y);
  ctx.fillStyle='#1b4fa0';ctx.strokeStyle='#0b2a5e';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#4da6ff';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();
  ctx.fillStyle='#bfe3ff';ctx.beginPath();ctx.arc(0,-2,7,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💧',0,1);
  ctx.restore();
}
function drawVillage(){
  // houses
  const houses=[[812,250],[846,470],[856,300]];
  houses.forEach(h=>{
    const x=h[0],y=h[1];
    ctx.fillStyle='#ffd9a0';ctx.strokeStyle='#8a4b00';ctx.lineWidth=3;
    ctx.fillRect(x-28,y-20,56,44);ctx.strokeRect(x-28,y-20,56,44);
    ctx.fillStyle='#ff7043';
    ctx.beginPath();ctx.moveTo(x-34,y-20);ctx.lineTo(x,y-48);ctx.lineTo(x+34,y-20);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#7a4a00';ctx.fillRect(x-8,y-2,16,26);
    ctx.fillStyle='#bfe3ff';ctx.fillRect(x-22,y-12,12,12);ctx.fillRect(x+10,y-12,12,12);
  });
  // cheering fire babies
  drawFireBaby(792,150,0.75,true);
  drawFireBaby(832,150,0.6,true);
}
function drawPath(){
  ctx.strokeStyle='#8a5a2a';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=44;
  ctx.beginPath();ctx.moveTo(PATH[0][0],PATH[0][1]);
  for(let i=1;i<PATH.length;i++)ctx.lineTo(PATH[i][0],PATH[i][1]);
  ctx.stroke();
  ctx.strokeStyle='#a06a33';ctx.lineWidth=36;
  ctx.beginPath();ctx.moveTo(PATH[0][0],PATH[0][1]);
  for(let i=1;i<PATH.length;i++)ctx.lineTo(PATH[i][0],PATH[i][1]);
  ctx.stroke();
}
function drawGrass(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3f7a34');g.addColorStop(1,'#2c5a26');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4c8a40';
  for(let i=0;i<70;i++){
    const x=(i*137)%W,y=(i*211)%H;
    if(distToPath(x,y)<40)continue;
    ctx.fillRect(x,y,3,7);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawHUD(){
  ctx.fillStyle='#141024ee';roundRect(8,8,260,52,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 19px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('💰 '+coins+'    ❤️ '+lives+'    🌊 '+(wave===0?'—':wave+'/10'),20,35);
  ctx.fillStyle='#141024ee';roundRect(W-208,8,200,52,10);ctx.fill();
  ctx.fillText('⭐ '+score,W-196,35);
  if(!waveActive&&wave<10&&state==='play'){
    ctx.fillStyle='#ff7b00';roundRect(W/2-110,H-66,220,50,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText(wave===0?'START WAVE 1':'NEXT WAVE '+ (wave+1),W/2,H-40);
  }
  if(coins>=TOWER_COST&&state==='play'){
    ctx.fillStyle='#ffffff22';ctx.font='15px sans-serif';ctx.textAlign='center';
    ctx.fillText('Tap a glowing spot to build a water tower (💧30)',W/2,30);
  }
}

// --- update ---
let tick=0;
function update(dt){
  tick+=dt;
  if(waveActive){
    spawnT-=dt;
    if(spawnQ.length&&spawnT<=0){const s=spawnQ.shift();enemies.push({d:-40,hp:s.hp,maxhp:s.hp,speed:s.speed,size:s.size,flick:Math.random()*7});spawnT=0.8;}
    if(!spawnQ.length&&!enemies.length){
      waveActive=false;
      coins+=25;
      floaters.push({x:W/2,y:200,txt:'+25 💰 Wave bonus!',t:2,color:'#ffe066'});
      if(wave>=10){victory=true;state='gameover';}
    }
  }
  for(const e of enemies){
    e.d+=e.speed*dt;e.flick+=dt*10;
    if(e.d>=PATH_LEN){
      e.dead=true;lives--;
      floaters.push({x:W-120,y:330,txt:'-1 ❤️',t:1.4,color:'#ff5252'});
    }
  }
  enemies=enemies.filter(e=>!e.dead&&!e.splashed);
  for(const t of towers){
    t.cd-=dt;
    if(t.cd<=0){
      let best=null,bd=1e9;
      for(const e of enemies){const p=pathPos(e.d);const dd=Math.hypot(p.x-t.x,p.y-t.y);if(dd<SPLASH_RANGE&&dd<bd){bd=dd;best=e;}}
      if(best){const p=pathPos(best.d);drops.push({x:t.x,y:t.y,tx:p.x,ty:p.y,target:best,t:0});t.cd=0.55;}
    }
  }
  for(const dr of drops){
    dr.t+=dt*3.2;
    if(dr.t>=1||!dr.target||dr.target.splashed||dr.target.dead){
      dr.done=true;
      if(dr.target&&!dr.target.splashed&&!dr.target.dead){
        dr.target.hp-=12;
        bursts.push({x:dr.tx,y:dr.ty,r:6,t:0.3});
        if(dr.target.hp<=0){
          dr.target.splashed=true;coins+=8;score+=10+wave*2;
          floaters.push({x:dr.tx,y:dr.ty-14,txt:'+8 💰',t:1,color:'#9ff'});
          for(let i=0;i<8;i++)bursts.push({x:dr.tx,y:dr.ty,r:10,t:0.4,steam:true});
        }
      }
    }
  }
  drops=drops.filter(d=>!d.done);
  for(const b of bursts)b.t-=dt;
  bursts=bursts.filter(b=>b.t>0);
  for(const f of floaters){f.t-=dt;f.y-=28*dt;}
  floaters=floaters.filter(f=>f.t>0);
  if(lives<=0&&state==='play'){lives=0;state='gameover';victory=false;}
}

// --- render play ---
function render(){
  drawGrass();drawPath();drawVillage();
  for(const s of placements){
    if(towers.some(t=>t.x===s[0]&&t.y===s[1]))continue;
    const pulse=1+Math.sin(tick*4+s[0])*0.08;
    ctx.save();ctx.translate(s[0],s[1]);ctx.scale(pulse,pulse);
    ctx.fillStyle=coins>=TOWER_COST?'#9fd6ff66':'#ffffff22';
    ctx.strokeStyle=coins>=TOWER_COST?'#bfe3ff':'#ffffff55';ctx.lineWidth=2;
    ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }
  for(const t of towers)drawTower(t);
  for(const e of enemies){
    const p=pathPos(e.d);
    drawFlame(p.x,p.y,e.size,e.flick);
    ctx.fillStyle='#0008';ctx.fillRect(p.x-16,p.y-e.size-14,32,5);
    ctx.fillStyle='#4caf50';ctx.fillRect(p.x-16,p.y-e.size-14,32*Math.max(0,e.hp/e.maxhp),5);
  }
  for(const dr of drops){
    const x=dr.x+(dr.tx-dr.x)*dr.t,y=dr.y+(dr.ty-dr.y)*dr.t-30*Math.sin(dr.t*Math.PI);
    ctx.fillStyle='#4da6ff';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
    ctx.fillStyle='#bfe3ff';ctx.beginPath();ctx.arc(x-2,y-2,2.5,0,7);ctx.fill();
  }
  for(const b of bursts){
    ctx.fillStyle=b.steam?'#ffffff88':'#4da6ffcc';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1.4-b.t),0,7);ctx.fill();
  }
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle=f.color;ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;
  }
  drawHUD();
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(' ');let line='',yy=y;
  ctx.textAlign='center';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}
    else line=test;
  }
  ctx.fillText(line,x,yy);return yy+lh;
}
function panel(){
  ctx.fillStyle='#141024f2';roundRect(60,40,W-120,H-80,24);ctx.fill();
  ctx.strokeStyle='#ff7b00';ctx.lineWidth=5;roundRect(60,40,W-120,H-80,24);ctx.stroke();
}
function bigButton(x,y,w,h,label,fill){
  ctx.fillStyle=fill;roundRect(x,y,w,h,16);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;roundRect(x,y,w,h,16);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
  return{x,y,w,h};
}
let btnStart=null,btnRestart=null,btnWave=null;

function drawTitle(){
  drawGrass();
  for(let i=0;i<3;i++)drawFlame(140+i*70,500,24,tick*8+i);
  drawVillage();
  drawFireBaby(450,430,1.3,true);
  panel();
  ctx.fillStyle='#ffb700';ctx.font='bold 52px sans-serif';ctx.textAlign='center';
  ctx.fillText('🔥 BLAZE DEFENDER 💧',W/2,120);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  wrapText('Wild flames are marching on the Fire Baby village! Tap glowing spots to build water towers (💧30 coins). Splash every flame before it reaches the village. Survive all 10 waves!',W/2,170,W-220,28);
  ctx.fillStyle='#ffe066';ctx.font='bold 19px sans-serif';
  const ly=wrapText('🔥 Fire-Safety Lesson 🔥',W/2,350,W-220,26);
  ctx.fillStyle='#fff';ctx.font='18px sans-serif';
  wrapText(LESSON,W/2,ly+8,W-240,26);
  btnStart=bigButton(W/2-140,478,280,64,'▶ START','#e65100');
}
function drawGameOver(){
  render();
  ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
  panel();
  ctx.fillStyle=victory?'#ffe066':'#ff5252';ctx.font='bold 50px sans-serif';ctx.textAlign='center';
  ctx.fillText(victory?'🏆 VICTORY! 🏆':'💧 GAME OVER 💧',W/2,130);
  ctx.fillStyle='#fff';ctx.font='24px sans-serif';
  ctx.fillText(victory?'You saved the Fire Baby village from all 10 waves!':'The village needs more water towers. Try again!',W/2,185);
  ctx.fillStyle='#ffe066';ctx.font='bold 30px sans-serif';
  ctx.fillText('⭐ Score: '+score+' ⭐',W/2,235);
  ctx.fillText('🌊 Waves cleared: '+(victory?10:Math.max(0,wave-(waveActive?1:0)))+' / 10',W/2,275);
  ctx.fillStyle='#ffb700';ctx.font='bold 19px sans-serif';
  const ly=wrapText('🔥 Fire-Safety Lesson 🔥',W/2,330,W-220,26);
  ctx.fillStyle='#fff';ctx.font='18px sans-serif';
  wrapText(LESSON,W/2,ly+8,W-240,26);
  btnRestart=bigButton(W/2-140,478,280,64,'↻ RESTART','#e65100');
}

// --- input ---
function pos(e){
  const r=cvs.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};
}
function hit(b,p){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
function onTap(e){
  e.preventDefault();
  const p=pos(e);
  if(state==='title'&&btnStart&&hit(btnStart,p)){reset();state='play';return;}
  if(state==='gameover'&&btnRestart&&hit(btnRestart,p)){reset();state='play';return;}
  if(state==='play'){
    if(!waveActive&&wave<10){
      btnWave={x:W/2-110,y:H-66,w:220,h:50};
      if(hit(btnWave,p)){startWave();return;}
    }
    for(const s of placements){
      if(towers.some(t=>t.x===s[0]&&t.y===s[1]))continue;
      if(Math.hypot(p.x-s[0],p.y-s[1])<30&&coins>=TOWER_COST){
        towers.push({x:s[0],y:s[1],cd:0});coins-=TOWER_COST;
        bursts.push({x:s[0],y:s[1],r:22,t:0.35});
        return;
      }
    }
  }
}
cvs.addEventListener('pointerdown',onTap);
cvs.addEventListener('touchstart',onTap,{passive:false});

// --- loop ---
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  ctx.clearRect(0,0,W,H);
  if(state==='title'){tick+=dt;drawTitle();}
  else if(state==='play'){update(dt);render();}
  else{update(dt);drawGameOver();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
