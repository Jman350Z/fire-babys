<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Firefly Follow — Fire Babys Fire World</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0c1a12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Trebuchet MS',Verdana,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 50px rgba(120,255,170,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* GAME 15: FIREFLY FOLLOW — watch the pattern, repeat it! */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=400,H=600;cv.width=W;cv.height=H;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
function P(e){var r=cv.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e;return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};}
var LESSON="FIRE SAFETY: Memorize your family's fire escape plan — know TWO ways out of every room!";
var state='title',seq=[],round=0,phase='idle',showI=0,showT=0,inputI=0,lit=-1,litT=0,msg='';
var AC=null;function beep(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.26);}catch(e){}}
var pads=[
 {x:W/2-85,y:230,c:'#ff6b6b',f:262},
 {x:W/2+85,y:230,c:'#4dabf7',f:330},
 {x:W/2-85,y:400,c:'#69db7c',f:392},
 {x:W/2+85,y:400,c:'#b197fc',f:494}
];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(t,x,y,mw,lh){var ws=t.split(' '),ln='',yy=y;for(var i=0;i<ws.length;i++){var s=ln+ws[i]+' ';if(ctx.measureText(s).width>mw&&i>0){ctx.fillText(ln,x,yy);ln=ws[i]+' ';yy+=lh;}else ln=s;}ctx.fillText(ln,x,yy);}
function baby(x,y,r,tint,glow){
  if(glow){var gg=ctx.createRadialGradient(x,y,r*.5,x,y,r*2.1);gg.addColorStop(0,tint);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,r*2.1,0,7);ctx.fill();}
  var g=ctx.createRadialGradient(x-r*.2,y-r*.3,r*.1,x,y,r*1.1);
  g.addColorStop(0,'#ffe680');g.addColorStop(.55,'#ff9f1c');g.addColorStop(1,'#e8590c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-r*.75,y-r*.35);
  ctx.quadraticCurveTo(x-r*.25,y-r*1.7,x+r*.05,y-r*1.05);
  ctx.quadraticCurveTo(x+r*.35,y-r*1.7,x+r*.75,y-r*.35);ctx.closePath();ctx.fill();
  ctx.strokeStyle=tint;ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#40260f';
  ctx.beginPath();ctx.arc(x-r*.32,y-r*.05,r*.12,0,7);ctx.arc(x+r*.32,y-r*.05,r*.12,0,7);ctx.fill();
  ctx.strokeStyle='#40260f';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x,y+r*.28,r*.32,.35,Math.PI-.35);ctx.stroke();
}
function newRound(){seq.push((Math.random()*4)|0);round=seq.length;phase='show';showI=0;showT=40;inputI=0;msg='Watch... 👀';}
function update(){
  if(litT>0)litT--;
  if(phase==='show'){
    showT--;
    if(showT<=0){
      if(showI<seq.length){var p=seq[showI];lit=p;litT=28;beep(pads[p].f);showI++;showT=42;}
      else{phase='input';lit=-1;msg='Your turn! 👆';}
    }
  }
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c1a12');g.addColorStop(1,'#1a3a24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,180,.7)';
  for(var s=0;s<20;s++){var tw=.4+.6*Math.abs(Math.sin(Date.now()/700+s));ctx.globalAlpha=tw*.6;ctx.fillRect((s*53)%W,(s*97)%H,2,2);}
  ctx.globalAlpha=1;
  pads.forEach(function(p,i){
    baby(p.x,p.y,52,p.c,lit===i||litT>0&&lit===i);
    if(lit===i&&litT>0){ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(p.x,p.y,52,0,7);ctx.fill();}
  });
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 26px Trebuchet MS';ctx.fillText('FIREFLY FOLLOW',W/2,60);
  ctx.font='bold 18px Trebuchet MS';ctx.fillStyle='#ffd166';
  ctx.fillText('Round: '+round,W/2,95);
  ctx.font='bold 17px Trebuchet MS';ctx.fillStyle='#fff';
  ctx.fillText(msg,W/2,125);
  ctx.font='14px Trebuchet MS';ctx.fillStyle='#a7f3d0';
  ctx.fillText('Best: '+best,W/2,150);
  if(state==='title'){
    ctx.fillStyle='rgba(5,12,8,.9)';rr(20,170,W-40,H-300,18);ctx.fill();
    ctx.strokeStyle='#69db7c';ctx.lineWidth=3;rr(20,170,W-40,H-300,18);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 26px Trebuchet MS';
    ctx.fillText('FIREFLY FOLLOW',W/2,220);
    ctx.font='16px Trebuchet MS';
    ctx.fillText('Watch the Fire Babys light up,',W/2,260);
    ctx.fillText('then tap them in the SAME order!',W/2,286);
    ctx.fillText('How long a pattern can you remember?',W/2,312);
    ctx.fillStyle='#ffd166';ctx.font='bold 14px Trebuchet MS';
    wrap(LESSON,W/2,340,W-90,20);
    ctx.fillStyle='#7CFC00';ctx.font='bold 20px Trebuchet MS';
    ctx.fillText('👆 TAP TO START 👆',W/2,H-190);
  }else if(state==='over'){
    ctx.fillStyle='rgba(5,12,8,.9)';rr(20,170,W-40,H-300,18);ctx.fill();
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;rr(20,170,W-40,H-300,18);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 26px Trebuchet MS';
    ctx.fillText('GOOD TRY!',W/2,220);
    ctx.font='18px Trebuchet MS';
    ctx.fillText('You remembered '+round+' in a row!',W/2,260);
    ctx.fillText('Best: '+best,W/2,288);
    ctx.fillStyle='#ffd166';ctx.font='bold 14px Trebuchet MS';
    wrap(LESSON,W/2,320,W-90,20);
    ctx.fillStyle='#7CFC00';ctx.font='bold 20px Trebuchet MS';
    ctx.fillText('👆 TAP TO PLAY AGAIN 👆',W/2,H-190);
  }
}
var best=0;
cv.addEventListener('pointerdown',function(e){e.preventDefault();
  if(state==='title'){state='play';seq=[];round=0;newRound();return;}
  if(state==='over'){state='play';seq=[];round=0;newRound();return;}
  if(phase!=='input')return;
  var p=P(e);
  for(var i=0;i<4;i++){var dx=p.x-pads[i].x,dy=p.y-pads[i].y;
    if(dx*dx+dy*dy<60*60){
      lit=i;litT=20;beep(pads[i].f);
      if(i===seq[inputI]){inputI++;
        if(inputI>=seq.length){if(round>best)best=round;setTimeout(newRound,600);phase='wait';msg='Nice! ⭐';}
      }else{
        if(round>best)best=round;
        state='over';phase='idle';beep(140);
      }
      return;
    }
  }
});
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
