<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fire Chief Says - Fire Babys</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#141021;height:100%;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* FIRE CHIEF SAYS — Simon-says with a friendly fire chief fire baby.
   Watch the buttons flash, then tap them back in the same order.
   Fire-safety lesson: Listen to firefighters — they know how to keep you safe! */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){
  const DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutButtons();
}
window.addEventListener('resize',resize);

let state='title';       // title | show | input | over
let seq=[],playerIdx=0,round=1,score=0,runId=0;
let accepting=false,flashBtn=-1,flashUntil=0,flashQueue=[];
let buttons=[],menuButtons=[],t=0,msg='';

const BTN_DEFS=[
  {name:'HYDRANT',col:'#e63946',dark:'#a11d28',icon:'hydrant'},
  {name:'BELL',   col:'#ffbf1f',dark:'#b97f00',icon:'bell'},
  {name:'HOSE',   col:'#3a86ff',dark:'#1f4fb0',icon:'hose'},
  {name:'EXIT',   col:'#38b000',dark:'#1f6600',icon:'exit'},
];
function layoutButtons(){
  const top=H*0.40,gap=14;
  const bw2=Math.min((W-3*gap)/2,230),bh2=Math.min((H-top-90-gap)/2,190);
  const tw=bw2*2+gap,x0=(W-tw)/2;
  buttons=BTN_DEFS.map((d,i)=>({
    def:d,
    x:x0+(i%2)*(bw2+gap),y:top+(((i/2)|0))*(bh2+gap),
    w:bw2,h:bh2
  }));
}

/* ---------- drawing helpers ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawBaby(x,y,s,helmet){
  ctx.save();ctx.translate(x,y);
  const grad=ctx.createRadialGradient(0,s*0.28,s*0.08,0,0,s*0.72);
  grad.addColorStop(0,'#ffe97a');grad.addColorStop(0.55,'#ff9f1c');grad.addColorStop(1,'#f25c05');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,-s*0.78);
  ctx.bezierCurveTo(s*0.58,-s*0.28,s*0.52,s*0.34,0,s*0.46);
  ctx.bezierCurveTo(-s*0.52,s*0.34,-s*0.58,-s*0.28,0,-s*0.78);
  ctx.fill();
  if(helmet){
    // firefighter helmet: red dome + wide brim + front shield
    ctx.fillStyle='#d62828';
    ctx.beginPath();ctx.ellipse(0,-s*0.52,s*0.62,s*0.34,0,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,-s*0.44,s*0.86,s*0.20,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd93b';
    roundRect(-s*0.16,-s*0.72,s*0.32,s*0.30,6);ctx.fill();
    ctx.fillStyle='#d62828';ctx.font='bold '+Math.round(s*0.22)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('★',0,-s*0.57);
  }
  ctx.fillStyle='#5b2d0e';
  ctx.beginPath();ctx.arc(-s*0.16,s*0.02,s*0.075,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.16,s*0.02,s*0.075,0,7);ctx.fill();
  ctx.strokeStyle='#5b2d0e';ctx.lineWidth=s*0.05;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,s*0.06,s*0.19,0.4,Math.PI-0.4);ctx.stroke();
  ctx.fillStyle='rgba(255,130,130,0.55)';
  ctx.beginPath();ctx.arc(-s*0.30,s*0.12,s*0.075,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.30,s*0.12,s*0.075,0,7);ctx.fill();
  ctx.restore();
}
function drawIcon(kind,cx,cy,s){
  ctx.save();ctx.translate(cx,cy);ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineCap='round';
  const u=s/50;
  if(kind==='hydrant'){
    ctx.fillRect(-8*u,-14*u,16*u,30*u);
    ctx.beginPath();ctx.arc(0,-16*u,9*u,Math.PI,0);ctx.fill();
    ctx.fillRect(-16*u,-6*u,8*u,10*u);ctx.fillRect(8*u,-6*u,8*u,10*u);
    ctx.fillRect(-12*u,16*u,24*u,6*u);
  }else if(kind==='bell'){
    ctx.beginPath();ctx.arc(0,4*u,16*u,Math.PI,0);ctx.fill();
    ctx.fillRect(-16*u,2*u,32*u,6*u);
    ctx.beginPath();ctx.arc(0,12*u,5*u,0,7);ctx.fill();
    ctx.fillRect(-3*u,-24*u,6*u,8*u);
  }else if(kind==='hose'){
    ctx.lineWidth=6*u;
    ctx.beginPath();ctx.arc(0,0,14*u,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,7*u,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(14*u,0);ctx.lineTo(24*u,-10*u);ctx.stroke();
  }else{ // exit sign
    ctx.fillStyle='#fff';roundRect(-20*u,-12*u,40*u,24*u,5*u);ctx.fill();
    ctx.fillStyle='#1f6600';ctx.font='bold '+Math.round(13*u)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('EXIT',0,1*u);
  }
  ctx.restore();
}
function wrap(text,x,y,maxW,lh,size,color){
  ctx.fillStyle=color;ctx.font='bold '+size+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){
    const tt=line?line+' '+w:w;
    if(ctx.measureText(tt).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}
    else line=tt;
  }
  ctx.fillText(line,x,yy);return yy+lh;
}
function drawMenuButton(b){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.25)';roundRect(b.x,b.y+5,b.w,b.h,18);ctx.fill();
  const g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);
  g.addColorStop(0,'#ffb703');g.addColorStop(1,'#fb8500');
  ctx.fillStyle=g;roundRect(b.x,b.y,b.w,b.h,18);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;roundRect(b.x,b.y,b.w,b.h,18);ctx.stroke();
  ctx.fillStyle='#4a2400';ctx.font='bold 24px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+1);ctx.restore();
}

/* ---------- game flow ---------- */
function startGame(){
  runId++;
  seq=[(Math.random()*4)|0];playerIdx=0;round=1;score=0;
  playSequence(runId);
}
function playSequence(id){
  state='show';accepting=false;playerIdx=0;
  msg='👀 Watch carefully...';
  flashQueue=seq.slice();
  setTimeout(()=>{if(id===runId)nextFlash(id);},700);
}
function nextFlash(id){
  if(state!=='show'||id!==runId)return;
  if(flashQueue.length===0){
    state='input';accepting=true;msg='👉 Your turn! Tap the buttons!';
    return;
  }
  const b=flashQueue.shift();
  flashBtn=b;flashUntil=performance.now()+480;
  setTimeout(()=>{if(id===runId)nextFlash(id);},760);
}
function playerTap(i){
  if(state!=='input'||!accepting)return;
  flashBtn=i;flashUntil=performance.now()+260;
  if(i===seq[playerIdx]){
    playerIdx++;
    if(playerIdx>=seq.length){
      accepting=false;score=round;round++;
      msg='🎉 Round '+score+'! One more step...';
      seq.push((Math.random()*4)|0);
      const id=runId;
      setTimeout(()=>{if(state==='input'&&id===runId)playSequence(id);},1100);
    }
  }else{
    accepting=false;state='over';
  }
}

/* ---------- screens ---------- */
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b1a5e');g.addColorStop(1,'#141021');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawTitle(){
  drawBG();
  wrap('🚒 FIRE CHIEF SAYS 🚒',W/2,50,W-60,48,38,'#ffd93b');
  drawBaby(W/2,215,58,true);
  wrap('The Fire Chief flashes the buttons — copy the pattern!',W/2,300,W-60,30,20,'#fff');
  wrap('HOW TO PLAY: Watch the buttons light up, then tap them in the SAME order. Each round adds one more step. One wrong tap ends the game!',W/2,362,W-60,28,17,'#cfe8ff');
  wrap('🔥 Fire-safety lesson: Listen to firefighters — they know how to keep you safe!',W/2,H-268,W-70,28,17,'#ffd93b');
  const bw=Math.min(300,W-80);
  menuButtons=[{x:W/2-bw/2,y:H-150,w:bw,h:64,label:'▶ START',action:startGame}];
  drawMenuButton(menuButtons[0]);
}
function drawPlay(){
  drawBG();
  // chief header
  drawBaby(W/2,86,34,true);
  ctx.fillStyle='#ffd93b';ctx.font='bold 24px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('FIRE CHIEF SAYS',W/2,150);
  ctx.fillStyle='#9be7ff';ctx.font='bold 18px system-ui,sans-serif';
  ctx.fillText('Round '+round+'   •   Score: '+score,W/2,178);
  ctx.fillStyle='#fff';ctx.font='19px system-ui,sans-serif';
  ctx.fillText(msg,W/2,210);
  // buttons
  const now=performance.now();
  for(let i=0;i<buttons.length;i++){
    const b=buttons[i];
    const lit=(flashBtn===i&&now<flashUntil);
    const scale=lit?1.06:1;
    const bw=b.w*scale,bh=b.h*scale;
    const bx=b.x+(b.w-bw)/2,by=b.y+(b.h-bh)/2;
    ctx.save();
    if(lit){ctx.shadowColor='#fff';ctx.shadowBlur=30;}
    ctx.fillStyle='rgba(0,0,0,0.3)';roundRect(bx+4,by+6,bw,bh,20);ctx.fill();
    const g=ctx.createLinearGradient(0,by,0,by+bh);
    if(lit){g.addColorStop(0,'#ffffff');g.addColorStop(1,b.def.col);}
    else{g.addColorStop(0,b.def.col);g.addColorStop(1,b.def.dark);}
    ctx.fillStyle=g;roundRect(bx,by,bw,bh,20);ctx.fill();
    ctx.strokeStyle=lit?'#fff':'rgba(255,255,255,0.5)';ctx.lineWidth=lit?5:3;
    roundRect(bx,by,bw,bh,20);ctx.stroke();
    ctx.restore();
    drawIcon(b.def.icon,b.x+b.w/2,b.y+b.h/2-8,Math.min(b.w,b.h)*0.42);
    ctx.fillStyle=lit?'#4a2400':'rgba(255,255,255,0.85)';
    ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.def.name,b.x+b.w/2,b.y+b.h-20);
  }
}
function drawOver(){
  drawBG();
  drawBaby(W/2,150,52,true);
  wrap('GAME OVER',W/2,230,W-60,48,38,'#ffd93b');
  wrap('You completed '+score+' round'+(score===1?'':'s')+'! The Fire Chief is proud of you! 🚒',W/2,296,W-60,30,19,'#fff');
  ctx.fillStyle='#9be7ff';ctx.font='bold 22px system-ui,sans-serif';
  ctx.textAlign='center';ctx.fillText('Final score: '+score,W/2,372);
  wrap('🔥 Fire-safety lesson: Listen to firefighters — they know how to keep you safe! If a firefighter tells you to leave a building, go right away.',W/2,H-280,W-70,28,18,'#ffd93b');
  const bw=Math.min(300,W-80);
  menuButtons=[{x:W/2-bw/2,y:H-150,w:bw,h:64,label:'↻ PLAY AGAIN',action:startGame}];
  drawMenuButton(menuButtons[0]);
}

/* ---------- loop & input ---------- */
function frame(){
  t++;
  if(state==='title')drawTitle();
  else if(state==='over')drawOver();
  else drawPlay();
  requestAnimationFrame(frame);
}
function tap(x,y){
  for(const b of menuButtons){
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.action();return;}
  }
  if(state!=='input')return;
  for(let i=0;i<buttons.length;i++){
    const b=buttons[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){playerTap(i);return;}
  }
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY);});
resize();
layoutButtons();
requestAnimationFrame(frame);
</script>
</body>
</html>
