<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smoke Signal Simon — Fire Babys Fire World</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#14161f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Trebuchet MS',Verdana,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 50px rgba(160,170,200,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* GAME 21: SMOKE SIGNAL SIMON — watch the smoke puffs, repeat the pattern! */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=400,H=600;cv.width=W;cv.height=H;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
function P(e){var r=cv.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e;return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};}
var LESSON="FIRE SAFETY: If a fire starts, get OUT fast and call 911 from outside. NEVER go back inside!";
var state='title',seq=[],round=0,phase='idle',showI=0,showT=0,inputI=0,lit=-1,litT=0,msg='',best=0;
var AC=null;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.14,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.3));o.start();o.stop(AC.currentTime+(d||.3));}catch(e){}}
var clouds=[
 {x:70,y:330,f:220},
 {x:157,y:330,f:277},
 {x:243,y:330,f:330},
 {x:330,y:330,f:392}
];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(t,x,y,mw,lh){var ws=t.split(' '),ln='',yy=y;for(var i=0;i<ws.length;i++){var s=ln+ws[i]+' ';if(ctx.measureText(s).width>mw&&i>0){ctx.fillText(ln,x,yy);ln=ws[i]+' ';yy+=lh;}else ln=s;}ctx.fillText(ln,x,yy);}
function newRound(){seq.push((Math.random()*4)|0);round=seq.length;phase='show';showI=0;showT=50;inputI=0;msg='Watch the smoke... 🌫';}
function drawCloud(x,y,r,litUp){
  var puffs=[[-r*.55,0,r*.62],[0,-r*.28,r*.7],[r*.55,0,r*.62],[0,r*.25,r*.55]];
  ctx.save();
  if(litUp){var g=ctx.createRadialGradient(x,y,r*.4,x,y,r*2.4);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.4,0,7);ctx.fill();}
  puffs.forEach(function(p){
    var gg=ctx.createRadialGradient(x+p[0]-r*.15,y+p[1]-r*.15,r*.1,x+p[0],y+p[1],p[2]);
    gg.addColorStop(0,litUp?'#ffffff':'#cbd5e1');gg.addColorStop(1,litUp?'#e2e8f0':'#64748b');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x+p[0],y+p[1],p[2],0,7);ctx.fill();
  });
  ctx.restore();
  if(litUp){ctx.fillStyle='#fff';ctx.font='bold 20px Trebuchet MS';ctx.textAlign='center';ctx.fillText('POOF!',x,y-r*1.5);}
}
function update(){
  if(litT>0)litT--;
  if(phase==='show'){
    showT--;
    if(showT<=0){
      if(showI<seq.length){var c=seq[showI];lit=c;litT=34;beep(clouds[c].f,.35);showI++;showT=48;}
      else{phase='input';lit=-1;msg='Your turn! Tap the clouds 👆';}
    }
  }
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#14161f');g.addColorStop(1,'#232838');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f59e0b';
  for(var f=0;f<6;f++){var fx=(f*97+40)%W,fy=H-40-((f*53)%60);
    ctx.beginPath();ctx.moveTo(fx,fy-14);ctx.lineTo(fx-8,fy+10);ctx.lineTo(fx+8,fy+10);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#7c2d12';ctx.fillRect(0,H-36,W,36);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px Trebuchet MS';
  ctx.fillText('SMOKE SIGNAL SIMON',W/2,60);
  ctx.font='bold 18px Trebuchet MS';ctx.fillStyle='#ffd166';
  ctx.fillText('Round: '+round+'   Best: '+best,W/2,95);
  ctx.font='bold 16px Trebuchet MS';ctx.fillStyle='#fff';
  ctx.fillText(msg,W/2,130);
  clouds.forEach(function(c,i){drawCloud(c.x,c.y,34,lit===i&&litT>0);});
  ctx.fillStyle='#94a3b8';ctx.font='15px Trebuchet MS';
  ctx.fillText('The campfire sends smoke signals...',W/2,470);
  ctx.fillText('can you repeat the pattern?',W/2,492);
  if(state==='title'){
    ctx.fillStyle='rgba(10,12,20,.93)';rr(20,150,W-40,H-290,18);ctx.fill();
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;rr(20,150,W-40,H-290,18);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 24px Trebuchet MS';
    ctx.fillText('SMOKE SIGNAL SIMON',W/2,200);
    ctx.font='16px Trebuchet MS';
    ctx.fillText('Watch which smoke clouds PUFF,',W/2,240);
    ctx.fillText('then tap them in the SAME order!',W/2,266);
    ctx.fillText('One mistake and the trail goes cold...',W/2,292);
    ctx.fillStyle='#ffd166';ctx.font='bold 14px Trebuchet MS';
    wrap(LESSON,W/2,322,W-90,20);
    ctx.fillStyle='#7CFC00';ctx.font='bold 20px Trebuchet MS';
    ctx.fillText('👆 TAP TO START 👆',W/2,H-195);
  }else if(state==='over'){
    ctx.fillStyle='rgba(10,12,20,.93)';rr(20,150,W-40,H-290,18);ctx.fill();
    ctx.strokeStyle='#64748b';ctx.lineWidth=3;rr(20,150,W-40,H-290,18);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 24px Trebuchet MS';
    ctx.fillText('SIGNAL LOST!',W/2,200);
    ctx.font='18px Trebuchet MS';
    ctx.fillText('You repeated '+round+' puffs in a row!',W/2,242);
    ctx.fillText('Best: '+best,W/2,270);
    ctx.fillStyle='#ffd166';ctx.font='bold 14px Trebuchet MS';
    wrap(LESSON,W/2,300,W-90,20);
    ctx.fillStyle='#7CFC00';ctx.font='bold 20px Trebuchet MS';
    ctx.fillText('👆 TAP TO TRY AGAIN 👆',W/2,H-195);
  }
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
  if(state==='title'){state='play';seq=[];round=0;newRound();return;}
  if(state==='over'){state='play';seq=[];round=0;newRound();return;}
  if(phase!=='input')return;
  var p=P(e);
  for(var i=0;i<4;i++){var dx=p.x-clouds[i].x,dy=p.y-clouds[i].y;
    if(dx*dx+dy*dy<48*48){
      lit=i;litT=22;beep(clouds[i].f,.25);
      if(i===seq[inputI]){inputI++;
        if(inputI>=seq.length){if(round>best)best=round;phase='wait';msg='Perfect! ⭐';setTimeout(newRound,700);}
      }else{
        if(round>best)best=round;
        state='over';phase='idle';beep(120,.5);
      }
      return;
    }
  }
});
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
