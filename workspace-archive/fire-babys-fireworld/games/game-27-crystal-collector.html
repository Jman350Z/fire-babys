<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Crystal Collector — Fire Babys Fire World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#140800;display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{width:min(100vw,480px)}
canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720;
const LESSON="If your clothes catch fire: STOP, DROP, and ROLL! Cover your face and roll until the flames are out.";
let state='title',score=0,best=0,lives=3,timeLeft=60,last=0,t=0,invuln=0;
let px=W/2,py=H/2;
let crystals=[],lavas=[],parts=[];
try{best=parseInt(localStorage.getItem('fb_g27_best')||'0');}catch(e){}

function T(txt,x,y,size,color,align){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);}
function wrap(txt,x,y,maxW,lh,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';let words=txt.split(' '),line='',yy=y;for(const w of words){const t2=line?line+' '+w:w;if(ctx.measureText(t2).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t2;}ctx.fillText(line,x,yy);return yy;}
function baby(x,y,r,mood){ctx.save();ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.9);
  g.addColorStop(0,'rgba(255,180,60,.55)');g.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.9,0,7);ctx.fill();
  ctx.fillStyle='#ff8c1a';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#ffc63f';ctx.beginPath();
  ctx.moveTo(-r*0.62,-r*0.35);ctx.quadraticCurveTo(0,-r*2.1,r*0.62,-r*0.35);
  ctx.quadraticCurveTo(0,-r*0.75,-r*0.62,-r*0.35);ctx.fill();
  ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(-r*0.25,r*0.15,r*0.45,0,7);ctx.fill();
  ctx.fillStyle='#40200a';
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.32,-r*0.05,r*0.11,0,7);ctx.fill();
  if(mood==='sad'){ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.6,r*0.3,1.15*Math.PI,1.85*Math.PI);ctx.stroke();}
  else{ctx.fillStyle='rgba(255,120,120,.55)';ctx.beginPath();ctx.arc(-r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.52,r*0.18,r*0.13,0,7);ctx.fill();ctx.strokeStyle='#40200a';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.arc(0,r*0.1,r*0.32,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  ctx.restore();}
function crystal(x,y,s,ph){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(ph)*0.2);
  const g=ctx.createLinearGradient(0,-s,0,s);
  g.addColorStop(0,'#b3ffff');g.addColorStop(0.5,'#4fd8ff');g.addColorStop(1,'#1a7fd4');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(0,-s);ctx.lineTo(s*0.7,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.7,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#e8feff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
  ctx.moveTo(0,-s);ctx.lineTo(s*0.28,-s*0.2);ctx.lineTo(0,s*0.35);ctx.lineTo(-s*0.28,-s*0.2);ctx.closePath();ctx.fill();
  ctx.restore();}

function reset(){score=0;lives=3;timeLeft=60;px=W/2;py=H/2;invuln=0;crystals=[];lavas=[];parts=[];
  for(let i=0;i<5;i++)crystals.push(newCrystal());
  for(let i=0;i<2;i++)lavas.push(newLava());}
function newCrystal(){return{x:40+Math.random()*(W-80),y:90+Math.random()*(H-160),s:16+Math.random()*8,ph:Math.random()*7};}
function newLava(){return{x:60+Math.random()*(W-120),y:120+Math.random()*(H-220),r:26,gr:4,ph:Math.random()*7};}
function update(dt){
  t+=dt;timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame();return;}
  if(invuln>0)invuln-=dt;
  for(const c of crystals)c.ph+=dt*3;
  for(const l of lavas){l.ph+=dt*4;l.r+=l.gr*dt;if(l.r>64)l.gr=-4;if(l.r<24)l.gr=4;}
  if(Math.random()<dt*1.2&&crystals.length<7)crystals.push(newCrystal());
  if(Math.random()<dt*0.5&&lavas.length<5)lavas.push(newLava());
  // collect
  for(let i=crystals.length-1;i>=0;i--){const c=crystals[i];
    if(Math.hypot(px-c.x,py-c.y)<34+c.s*0.4){score+=10;crystals.splice(i,1);
      for(let k=0;k<10;k++)parts.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*240,vy:(Math.random()-0.5)*240,life:0.6,c:'#8ef4ff'});
      crystals.push(newCrystal());}}
  // lava hit
  if(invuln<=0)for(const l of lavas){
    if(Math.hypot(px-l.x,py-l.y)<l.r+14){lives--;invuln=1.6;
      for(let k=0;k<14;k++)parts.push({x:px,y:py,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:0.7,c:'#ff7043'});
      if(lives<=0){endGame();return;}break;}}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
}
function endGame(){state='over';if(score>best){best=score;try{localStorage.setItem('fb_g27_best',best);}catch(e){}}}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#241031');bg.addColorStop(1,'#101826');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // cave sparkles
  ctx.fillStyle='rgba(180,220,255,.35)';
  for(let i=0;i<40;i++){const sx=(i*113)%W,sy=(i*71)%H;ctx.fillRect(sx,sy,2,2);}
  // lava pools
  for(const l of lavas){const bob=Math.sin(l.ph)*3;
    const g=ctx.createRadialGradient(l.x,l.y+bob,4,l.x,l.y+bob,l.r);
    g.addColorStop(0,'#ffd23f');g.addColorStop(0.5,'#ff5a00');g.addColorStop(1,'rgba(160,30,0,.15)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(l.x,l.y+bob,l.r,0,7);ctx.fill();
    ctx.strokeStyle='#ff8c1a';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.lineDashOffset=t*30;
    ctx.beginPath();ctx.arc(l.x,l.y+bob,l.r+8,0,7);ctx.stroke();ctx.setLineDash([]);}
  // crystals
  for(const c of crystals)crystal(c.x,c.y,c.s,c.ph);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.globalAlpha=1;}
  // player (blink while invulnerable)
  if(!(invuln>0&&Math.floor(t*10)%2===0))baby(px,py,26);
  // HUD
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,46);
  T('💎 '+score,70,25,24,'#8ef4ff','left');
  T('⏱️ '+Math.ceil(timeLeft)+'s',W-90,25,22,'#fff','left');
  let hearts='';for(let i=0;i<3;i++)hearts+=i<lives?'❤️':'🤍';
  T(hearts,W/2,25,22,'#fff');
}
function drawTitle(){
  draw();ctx.fillStyle='rgba(8,4,16,.8)';ctx.fillRect(0,0,W,H);
  crystal(W/2-70,150,26,t*2);crystal(W/2+70,150,26,-t*2);baby(W/2,150,40);
  T('CRYSTAL COLLECTOR',W/2,245,40,'#8ef4ff');
  T('💎 Fire Babys Fire World 💎',W/2,283,20,'#ffd76a');
  wrap('Drag to move Blaze around the cave. Grab the shiny crystals (+10)! Stay OUT of the bubbling lava pools — you have 3 hearts. 60 seconds!',W/2,340,400,30,21,'#fff');
  ctx.fillStyle='#0e2a3a';ctx.fillRect(40,475,W-80,120);
  T('🔥 FIRE SAFETY 🔥',W/2,500,22,'#8ef4ff');
  wrap(LESSON,W/2,535,380,26,19,'#cfeaff');
  T('Tap to start!',W/2,645,26,'#7dff9a');
  T('Made by Jman350Z & the Fire Team',W/2,692,15,'#7a8aa0');
}
function drawOver(){
  draw();ctx.fillStyle='rgba(8,4,16,.82)';ctx.fillRect(0,0,W,H);
  baby(W/2,160,50,score>=60?'happy':'sad');
  T(lives<=0?'OUCH! LAVA!':"TIME'S UP!",W/2,265,42,'#8ef4ff');
  T('Crystals: '+score,W/2,325,32,'#fff');
  T('Best: '+best,W/2,363,24,'#ffd76a');
  ctx.fillStyle='#0e2a3a';ctx.fillRect(40,405,W-80,140);
  T('🔥 FIRE SAFETY 🔥',W/2,432,22,'#8ef4ff');
  wrap(LESSON,W/2,468,380,26,19,'#cfeaff');
  T('Tap to play again!',W/2,600,26,'#7dff9a');
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);else t+=dt;
  if(state==='title')drawTitle();else if(state==='over')drawOver();else draw();
  requestAnimationFrame(loop);}
function toX(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width;}
function toY(e){const r=cv.getBoundingClientRect();return(e.clientY-r.top)*H/r.height;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'||state==='over'){reset();state='play';}
  px=Math.max(24,Math.min(W-24,toX(e)));py=Math.max(70,Math.min(H-24,toY(e)));});
cv.addEventListener('pointermove',e=>{if(state!=='play')return;
  px=Math.max(24,Math.min(W-24,toX(e)));py=Math.max(70,Math.min(H-24,toY(e)));});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
