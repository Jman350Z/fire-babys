*{box-sizing:border-box;margin:0;padding:0}
:root{--flame:#ff6a00;--ember:#e63900;--gold:#ffc93c;--cream:#fff7ec;--ink:#2b1a0e}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink)}
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:100}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:1200px;margin:0 auto}
.brand{color:#fff;font-weight:900;font-size:22px;text-decoration:none}
.navlinks a{color:#fff;text-decoration:none;font-weight:700;margin-left:18px;font-size:15px}
.hero{background:radial-gradient(1200px 400px at 50% -60px,#ffd9a0 0%,#ffab5e 38%,#ff7a1a 70%,#f2540a 100%);text-align:center;padding:50px 20px 40px}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:900;margin-bottom:10px}
.hero p{font-size:18px;font-weight:600;max-width:600px;margin:0 auto 20px}
.searchbar{max-width:500px;margin:0 auto;display:flex;gap:8px}
.searchbar input{flex:1;padding:14px 18px;border:3px solid var(--ink);border-radius:999px;font-size:16px}
.searchbar button{padding:14px 24px;background:var(--ink);color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:800;cursor:pointer}
.filters{max-width:1200px;margin:24px auto;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.filter{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:14px}
.filter.active{background:var(--ink);color:#fff}
#randomBtn{background:var(--flame);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:14px 32px;font-size:18px;font-weight:900;cursor:pointer;margin:10px auto;display:block}
#randomBtn:active{transform:translateY(3px)}
.grid{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;overflow:hidden;transition:transform .15s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.card .thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#fff3e0,#ffe0b2)}
.card .body{padding:16px}
.card .num{font-size:12px;font-weight:800;color:var(--ember);letter-spacing:1px}
.card h3{font-size:18px;margin:6px 0}
.card .mechanic{font-size:13px;color:#8a6a4a;font-style:italic;margin-bottom:6px}
.card .stars{font-size:13px;color:#5b4632;margin-bottom:10px}
.card .play{display:inline-block;background:var(--flame);color:#fff;font-weight:800;padding:12px 28px;border-radius:999px;text-decoration:none;font-size:16px}
#gameFrame{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
#gameFrame.active{display:flex}
#frameBar{background:var(--ink);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
#frameBar button{background:var(--flame);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:800;cursor:pointer;font-size:15px}
#gameIframe{flex:1;border:none;width:100%}
footer{background:var(--ink);color:#fff;text-align:center;padding:24px;margin-top:30px}
.hidden{display:none!important}
#noResults{text-align:center;padding:40px;font-size:18px;color:#8a6a4a}
#count{text-align:center;font-weight:800;font-size:16px;margin-top:16px}

const CATS={all:"🌟 All 56",action:"💥 Action",puzzle:"🧩 Puzzle",strategy:"♟️ Strategy",music:"🎵 Music"};
let activeCat='all';
function renderFilters(){document.getElementById('filters').innerHTML=Object.entries(CATS).map(([k,v])=>`<div class="filter${k===activeCat?' active':''}" onclick="setCat('${k}')">${v}</div>`).join('');}
function setCat(c){activeCat=c;renderFilters();filterGames();}
function filterGames(){
const q=document.getElementById('search').value.toLowerCase();
const f=GAMES.filter(g=>(activeCat==='all'||g.c===activeCat)&&(g.t.toLowerCase().includes(q)||g.m.toLowerCase().includes(q)));
document.getElementById('noResults').classList.toggle('hidden',f.length>0);
document.getElementById('count').textContent=`Showing ${f.length} of 56 games`;
document.getElementById('grid').innerHTML=f.map(g=>`<div class="card" onclick="playGame('${g.u}','${g.t.replace(/'/g,"\\'")}')"><div class="thumb">${g.e}</div><div class="body"><span class="num">GAME #${g.n}</span><h3>${g.t}</h3><div class="mechanic">${g.m}</div><div class="stars">⭐ ${g.s}</div><a class="play" href="${g.u}">▶ Play</a></div></div>`).join('');
}
function playGame(url,title){document.getElementById('frameTitle').textContent='🎮 '+title;document.getElementById('gameIframe').src=url;document.getElementById('gameFrame').classList.add('active');document.body.style.overflow='hidden';}
function closeGame(){document.getElementById('gameIframe').src='';document.getElementById('gameFrame').classList.remove('active');document.body.style.overflow='';}
function randomGame(){const g=GAMES[Math.floor(Math.random()*GAMES.length)];playGame(g.u,g.t);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame();});
renderFilters();filterGames();
