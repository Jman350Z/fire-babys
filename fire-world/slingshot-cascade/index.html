<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fire Babys Slingshot Cascade — by Jman350Z & fire team</title>
<meta name="description" content="Launch Blaze from the slingshot! Smash crystal towers in this polished physics puzzler. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0d08;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:6px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;text-shadow:0 1px 0 #000;white-space:nowrap}
.pill.gold{color:#ffd23f}
#combo{position:fixed;top:70px;left:50%;transform:translateX(-50%) scale(0);z-index:6;pointer-events:none;font-size:32px;font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #000,0 0 20px #ff6a00;transition:transform .15s}
#combo.pop{transform:translateX(-50%) scale(1.2)}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,5,0,.88);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(28px,7vw,48px);font-weight:900;margin-bottom:12px;background:linear-gradient(180deg,#ffd76a,#ff6a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px;color:#fff}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#2a1a0e;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#levelSel{display:flex;gap:10px;margin:12px 0}
.lvlBtn{width:56px;height:56px;border-radius:14px;border:3px solid #ff6a1a;background:#2a1a0e;color:#ffd23f;font-size:20px;font-weight:900;cursor:pointer}
.lvlBtn.locked{opacity:.35;border-color:#555;color:#888}
.lvlBtn.done{border-color:#4caf50}
.stars{color:#ffd23f;font-size:20px;letter-spacing:2px}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="hud-left"><div class="pill gold" id="score">⭐ 0</div><div class="pill" id="level">LEVEL 1</div></div>
<div class="hud-right"><div class="pill" id="shots">🎯 3</div><div class="pill" id="best">🏆 0</div></div>
</div>
<div id="combo"></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🎯 SLINGSHOT CASCADE</h1>
<div id="obody"><p>Drag <b>Blaze</b> back on the slingshot and <b>release</b> to launch! Smash every crystal tower. Fewer shots = more stars!</p>
<div id="levelSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Never play with matches or lighters — tell a grown-up right away!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
/* ============================================================
   SLINGSHOT CASCADE v2 — AAA Rebuild
   - Custom physics (no external deps)
   - Trauma-based screen shake, hit-stop, squash & stretch
   - Layered Web Audio, combo system, 5 levels, star ratings
   - Parental gate, zero PII/trackers, COPPA compliant
   ============================================================ */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),
      olesson=document.getElementById('olesson'),mathgate=document.getElementById('mathgate'),
      comboEl=document.getElementById('combo');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ---------------- Audio: layered synth ---------------- */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){
  const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,delay=0,lowpass=1000){
  const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const len=ac.sampleRate*dur,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource();s.buffer=buf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lowpass;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);
}
const sfx={
  stretch(){tone(200,600,0.15,'sine',0.12);},
  launch(){noise(0.25,0.3,0,2000);tone(300,900,0.2,'sawtooth',0.15);},
  hit(){noise(0.12,0.35,0,800);tone(180,60,0.12,'square',0.2);},
  shatter(){noise(0.3,0.4,0,4000);tone(1200,300,0.25,'triangle',0.2);tone(1800,500,0.2,'sine',0.12,0.03);},
  combo(n){[523,659,784,1047,1319].slice(0,Math.min(n,5)).forEach((f,i)=>tone(f,f,0.15,'sine',0.15,i*0.06));},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.3,'triangle',0.2,i*0.12));},
  star(i){tone(880+i*220,880+i*220,0.2,'sine',0.2);tone(1320+i*220,1320+i*220,0.15,'sine',0.1,0.05);},
  click(){tone(600,600,0.06,'square',0.1);}
};

/* ---------------- Object pools ---------------- */
const particles=[],floaters=[],shards=[];
for(let i=0;i<300;i++)particles.push({a:false});
for(let i=0;i<30;i++)floaters.push({a:false});
for(let i=0;i<80;i++)shards.push({a:false});
function spawnP(x,y,vx,vy,life,color,size,grav=900){const p=particles.find(p=>!p.a);if(!p)return;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.color=color;p.size=size;p.grav=grav;}
function spawnShard(x,y,vx,vy,color){const s=shards.find(s=>!s.a);if(!s)return;
  s.a=true;s.x=x;s.y=y;s.vx=vx;s.vy=vy;s.rot=Math.random()*6;s.vr=(Math.random()-0.5)*12;s.life=1.2;s.color=color;s.size=4+Math.random()*8;}
function spawnText(x,y,txt,color='#ffd23f',size=22){const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.size=size;f.life=1.1;}

/* ---------------- Trauma shake & hit-stop ---------------- */
let trauma=0,hitStop=0,shakeX=0,shakeY=0;
function addTrauma(t){trauma=Math.min(1,trauma+t);}
function addHitStop(t){hitStop=Math.max(hitStop,t);}

/* ---------------- Game state ---------------- */
const G={state:'title',level:1,score:0,shots:0,shotsUsed:0,combo:0,comboT:0,best:0,time:0,
  blocks:[],pig:null,sling:null,dragging:false,projectiles:[],stars:0};
try{G.best=parseInt(localStorage.getItem('sling_best')||'0',10)||0;}catch(e){}
const GRAV=1600;
const groundY=()=>H-70;

/* ---------------- Level definitions ---------------- */
function buildLevel(n){
  G.blocks=[];G.projectiles=[];
  const gy=groundY();
  const B=(x,y,w,h,type,hp)=>G.blocks.push({x,y,w,h,type,hp,maxHp:hp,vx:0,vy:0,rot:0,vr:0,dead:false,settled:true});
  if(n===1){
    B(W*0.62,gy-40,26,80,'crystal',1);B(W*0.72,gy-40,26,80,'crystal',1);
    B(W*0.62,gy-100,140,24,'rock',2);
    B(W*0.67,gy-140,26,60,'crystal',1);
    G.shots=3;
  }else if(n===2){
    B(W*0.58,gy-35,26,70,'rock',2);B(W*0.70,gy-35,26,70,'rock',2);B(W*0.82,gy-35,26,70,'rock',2);
    B(W*0.58,gy-85,200,22,'crystal',1);
    B(W*0.63,gy-125,26,60,'crystal',1);B(W*0.75,gy-125,26,60,'crystal',1);
    B(W*0.63,gy-165,120,20,'rock',2);
    G.shots=4;
  }else if(n===3){
    // pyramid
    for(let r=0;r<4;r++)for(let i=0;i<4-r;i++)
      B(W*0.60+i*34+r*17,gy-25-r*48,30,44,r%2?'crystal':'rock',r%2?1:2);
    G.shots=4;
  }else if(n===4){
    // twin towers
    [0.55,0.78].forEach(bx=>{
      B(W*bx,gy-50,30,100,'rock',2);B(W*bx+44,gy-50,30,100,'rock',2);
      B(W*bx,gy-115,104,22,'crystal',1);
      B(W*bx+22,gy-155,30,60,'crystal',1);
    });
    B(W*0.665,gy-30,40,60,'crystal',1);
    G.shots=5;
  }else{
    // fortress
    for(let i=0;i<5;i++)B(W*0.55+i*52,gy-60,34,120,'rock',3);
    B(W*0.55,gy-135,290,24,'crystal',1);
    for(let i=0;i<3;i++)B(W*0.60+i*80,gy-175,30,60,'crystal',1);
    B(W*0.60,gy-215,240,22,'rock',2);
    B(W*0.70,gy-255,30,60,'crystal',1);
    G.shots=6;
  }
  G.sling={x:Math.max(90,W*0.14),y:gy-110};
  G.shotsUsed=0;G.combo=0;
  document.getElementById('level').textContent='LEVEL '+n+'/5';
  document.getElementById('shots').textContent='🎯 '+G.shots;
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateScoreUI(){document.getElementById('score').textContent='⭐ '+G.score;}

/* ---------------- Physics ---------------- */
function rectHit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function updatePhysics(dt){
  // projectiles
  for(const pr of G.projectiles){
    if(!pr.live)continue;
    pr.vy+=GRAV*dt;
    pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.rot+=pr.vr*dt;
    // squash on fast movement
    pr.squash=Math.min(0.3,Math.hypot(pr.vx,pr.vy)/4000);
    // ground bounce
    if(pr.y>groundY()-16){
      pr.y=groundY()-16;
      if(Math.abs(pr.vy)>250){pr.vy*=-0.4;pr.vx*=0.7;sfx.hit();addTrauma(0.15);
        for(let i=0;i<6;i++)spawnP(pr.x,groundY(),(Math.random()-0.5)*200,-Math.random()*150,0.4,'#8a6a4a',3);}
      else{pr.vy=0;pr.vx*=0.92;}
      if(Math.abs(pr.vx)<20&&Math.abs(pr.vy)<20)pr.restT=(pr.restT||0)+dt;
    }
    // block collisions
    for(const b of G.blocks){
      if(b.dead)continue;
      if(rectHit(pr.x-18,pr.y-18,36,36,b.x-b.w/2,b.y-b.h/2,b.w,b.h)){
        const impact=Math.hypot(pr.vx,pr.vy);
        if(impact>180){
          b.hp-=impact>700?2:1;b.vx+=pr.vx*0.12;b.vy+=pr.vy*0.12-60;b.settled=false;
          b.hitT=0.12;
          pr.vx*=-0.25;pr.vy*=-0.25;
          sfx.hit();addTrauma(Math.min(0.4,impact/2500));addHitStop(0.03);
          for(let i=0;i<8;i++)spawnP(b.x,b.y,(Math.random()-0.5)*300,(Math.random()-0.5)*300,0.5,b.type==='crystal'?'#7fd4ff':'#a08a6a',4);
          if(b.hp<=0)destroyBlock(b,pr);
          else{G.combo++;G.comboT=1.2;showCombo();}
        }
      }
    }
    // out of bounds / rest
    if(pr.x>W+100||pr.x<-100||pr.y>H+100||(pr.restT||0)>1.2)pr.live=false;
  }
  G.projectiles=G.projectiles.filter(p=>p.live);
  // blocks physics (knocked)
  for(const b of G.blocks){
    if(b.dead)continue;
    b.hitT=Math.max(0,(b.hitT||0)-dt);
    if(!b.settled){
      b.vy+=GRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vr*dt;
      b.vx*=0.99;b.vr*=0.98;
      if(b.y>groundY()-b.h/2){b.y=groundY()-b.h/2;
        if(Math.abs(b.vy)>120){sfx.hit();for(let i=0;i<4;i++)spawnP(b.x,groundY(),(Math.random()-0.5)*150,-Math.random()*100,0.3,'#8a6a4a',3);}
        b.vy*=-0.3;b.vx*=0.8;b.vr*=0.7;
        if(Math.abs(b.vy)<40&&Math.abs(b.vx)<30){b.settled=true;b.vx=0;b.vy=0;b.vr=0;}
      }
      // block-block collision (simple)
      for(const o of G.blocks){
        if(o===b||o.dead)continue;
        if(rectHit(b.x-b.w/2,b.y-b.h/2,b.w,b.h,o.x-o.w/2,o.y-o.h/2,o.w,o.h)){
          if(!o.settled||Math.hypot(b.vx,b.vy)>150){
            o.hp-=1;o.settled=false;o.vx+=b.vx*0.3;o.vy-=40;o.hitT=0.12;
            if(o.hp<=0)destroyBlock(o,b);
            else{sfx.hit();for(let i=0;i<5;i++)spawnP(o.x,o.y,(Math.random()-0.5)*200,(Math.random()-0.5)*200,0.4,'#a08a6a',3);}
          }
        }
      }
    }
  }
  // check win
  if(G.state==='play'&&G.blocks.every(b=>b.dead))levelComplete();
  // check out of shots
  if(G.state==='play'&&G.projectiles.length===0&&!G.dragging&&G.shots-G.shotsUsed<=0&&G.pig===null){
    // small delay before fail
    G.failT=(G.failT||0)+dt;
    if(G.failT>1.5&&!G.blocks.every(b=>b.dead))levelFailed();
  }else G.failT=0;
}
function destroyBlock(b,by){
  b.dead=true;
  const pts=(b.type==='crystal'?150:100)*(1+G.combo*0.25);
  G.score+=Math.round(pts);updateScoreUI();
  G.combo++;G.comboT=1.5;showCombo();
  sfx.shatter();addTrauma(0.3);
  spawnText(b.x,b.y-20,'+'+Math.round(pts));
  for(let i=0;i<6;i++)spawnShard(b.x+(Math.random()-0.5)*b.w,b.y+(Math.random()-0.5)*b.h,(Math.random()-0.5)*400,-Math.random()*400,b.type==='crystal'?'#7fd4ff':'#8a6a5a');
  for(let i=0;i<10;i++)spawnP(b.x,b.y,(Math.random()-0.5)*400,(Math.random()-0.5)*400,0.6,b.type==='crystal'?'#aee8ff':'#c8a87a',5);
}
function showCombo(){
  if(G.combo>=2){
    comboEl.textContent='🔥 COMBO x'+G.combo+'!';
    comboEl.classList.remove('pop');void comboEl.offsetWidth;comboEl.classList.add('pop');
    sfx.combo(G.combo);
    setTimeout(()=>comboEl.classList.remove('pop'),400);
  }
}

/* ---------------- Input: drag slingshot ---------------- */
let dragX=0,dragY=0;
function getPos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function slingReady(){return G.state==='play'&&!G.dragging&&G.projectiles.length===0&&(G.shots-G.shotsUsed)>0;}
canvas.addEventListener('pointerdown',e=>{
  if(!slingReady())return;
  const p=getPos(e),s=G.sling;
  if(Math.hypot(p.x-s.x,p.y-s.y)<70){G.dragging=true;dragX=p.x;dragY=p.y;sfx.stretch();canvas.setPointerCapture(e.pointerId);}
});
canvas.addEventListener('pointermove',e=>{
  if(!G.dragging)return;const p=getPos(e);
  const s=G.sling;let dx=p.x-s.x,dy=p.y-s.y;
  const max=130,d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  // only allow pulling back/down
  if(dx>20)dx=20;
  dragX=s.x+dx;dragY=s.y+dy;
});
canvas.addEventListener('pointerup',e=>{
  if(!G.dragging)return;G.dragging=false;
  const s=G.sling,dx=s.x-dragX,dy=s.y-dragY;
  const power=Math.hypot(dx,dy);
  if(power<25)return; // too weak
  // launch!
  const pr={x:s.x,y:s.y,vx:dx*7.5,vy:dy*7.5-150,rot:0,vr:8,live:true,restT:0,squash:0,trail:[]};
  G.projectiles.push(pr);
  G.shotsUsed++;G.combo=0;
  document.getElementById('shots').textContent='🎯 '+(G.shots-G.shotsUsed);
  sfx.launch();addTrauma(0.35);
  for(let i=0;i<12;i++)spawnP(s.x,s.y,(Math.random()-0.5)*300,(Math.random()-0.5)*200,0.4,'#ffb347',4);
});

/* ---------------- Level flow ---------------- */
function levelComplete(){
  G.state='clear';sfx.win();
  const shotsLeft=G.shots-G.shotsUsed;
  G.stars=shotsLeft>=2?3:shotsLeft>=1?2:1;
  const bonus=G.stars*500;G.score+=bonus;updateScoreUI();
  if(G.score>G.best){G.best=G.score;try{localStorage.setItem('sling_best',String(G.best));}catch(e){}}
  for(let i=0;i<30;i++)spawnP(W/2,H/2,(Math.random()-0.5)*600,(Math.random()-0.5)*600,1,'#ffd23f',6);
  setTimeout(()=>sfx.star(0),300);setTimeout(()=>sfx.star(1),600);setTimeout(()=>sfx.star(2),900);
  setTimeout(()=>{
    if(G.level>=5){gameComplete();}
    else showOverlay('⭐ LEVEL '+G.level+' CLEAR!',
      `<div class="stars">${'★'.repeat(G.stars)}${'☆'.repeat(3-G.stars)}</div><p>Score: ${G.score}</p><p>Bonus: +${bonus}</p>`,
      '🔥 Fire Safety: Know two ways out of every room in case of fire!',
      '▶ NEXT LEVEL',()=>{G.level++;buildLevel(G.level);G.state='play';});
  },1200);
}
function levelFailed(){
  G.state='fail';
  showOverlay('💥 OUT OF SHOTS',
    `<p>So close! The towers still stand.</p><p>Score: ${G.score}</p>`,
    '🔥 Fire Safety: Never give up on safety — try again!',
    '↻ TRY AGAIN',()=>{G.score=Math.max(0,G.score-200);updateScoreUI();buildLevel(G.level);G.state='play';});
}
function gameComplete(){
  G.state='done';sfx.win();
  showOverlay('🏆 YOU DID IT!',
    `<p>All 5 levels cleared!</p><p style="font-size:28px;font-weight:900;color:#ffd23f">Final Score: ${G.score}</p><p>Best: ${G.best}</p>`,
    '🔥 Fire Safety: You\'re a fire safety champion! Share what you learned!',
    '↻ PLAY AGAIN',()=>{G.level=1;G.score=0;updateScoreUI();buildLevel(1);G.state='play';});
}

/* ---------------- Overlay & gates ---------------- */
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  mathgate.classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){mathgate.classList.add('hidden');startGame();}
  else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){
  audio();G.level=1;G.score=0;updateScoreUI();
  buildLevel(1);G.state='play';overlay.classList.add('hidden');
}
function showTitle(){
  const lv=document.getElementById('levelSel');
  // level select (all unlocked for kids)
  let h='';
  for(let i=1;i<=5;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();selLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Drag <b>Blaze</b> back on the slingshot and <b>release</b> to launch! Smash every crystal tower. Fewer shots = more stars!</p><div id="levelSel">${h}</div>`;
  obtn.textContent='▶ PLAY';
  obtn.onclick=()=>{showMathGate();};
  overlay.classList.remove('hidden');
}
function selLevel(n){sfx.click();G.level=n;G.score=0;updateScoreUI();mathgate.classList.add('hidden');buildLevel(n);G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};

/* ---------------- Rendering ---------------- */
function drawBlaze(x,y,r,squash,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.scale(1+squash,1-squash);
  // glow
  const gl=ctx.createRadialGradient(0,0,r*0.5,0,0,r*2);
  gl.addColorStop(0,'rgba(255,140,0,0.35)');gl.addColorStop(1,'rgba(255,140,0,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,r*2,0,Math.PI*2);ctx.fill();
  // body
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2,0,0,r);
  g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff8a2a');g.addColorStop(1,'#e8352c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  // flame tip
  const w=Math.sin(G.time*10)*3;
  ctx.fillStyle='#ff6a1a';
  ctx.beginPath();ctx.moveTo(-r*0.5,-r*0.7);
  ctx.quadraticCurveTo(w,-r*1.7,r*0.5,-r*0.7);
  ctx.quadraticCurveTo(0,-r*1.1,-r*0.5,-r*0.7);ctx.fill();
  // face
  ctx.fillStyle='#2b1a0e';
  const blink=(Math.sin(G.time*0.7)>0.97)?0.15:1;
  ctx.save();ctx.scale(1,blink);
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.1,r*0.14,0,Math.PI*2);ctx.arc(r*0.32,-r*0.1,r*0.14,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.strokeStyle='#2b1a0e';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*0.15,r*0.35,0.3,Math.PI-0.3);ctx.stroke();
  // cheeks
  ctx.fillStyle='rgba(255,100,100,0.5)';
  ctx.beginPath();ctx.arc(-r*0.55,r*0.15,r*0.12,0,Math.PI*2);ctx.arc(r*0.55,r*0.15,r*0.12,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawBlock(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot||0);
  if(b.hitT>0)ctx.globalAlpha=0.7;
  const hw=b.w/2,hh=b.h/2;
  if(b.type==='crystal'){
    const g=ctx.createLinearGradient(-hw,-hh,hw,hh);
    g.addColorStop(0,'#b8e8ff');g.addColorStop(0.5,'#5ab8e8');g.addColorStop(1,'#2a78b8');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(-hw,hh);ctx.lineTo(-hw,-hh*0.3);ctx.lineTo(0,-hh);ctx.lineTo(hw,-hh*0.3);ctx.lineTo(hw,hh);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.stroke();
    // sparkle
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.fillRect(-hw*0.3,-hh*0.4,6,6);
  }else{
    const g=ctx.createLinearGradient(-hw,-hh,hw,hh);
    g.addColorStop(0,'#9a8a7a');g.addColorStop(1,'#5a4a3a');
    ctx.fillStyle=g;ctx.fillRect(-hw,-hh,b.w,b.h);
    ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2;ctx.strokeRect(-hw,-hh,b.w,b.h);
    // cracks by damage
    if(b.hp<b.maxHp){ctx.strokeStyle='#2a1a0a';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-hw*0.5,-hh);ctx.lineTo(0,0);ctx.lineTo(hw*0.3,hh);ctx.stroke();}
  }
  ctx.restore();
}
function render(){
  // sky: volcano sunset
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a0d2a');sky.addColorStop(0.45,'#5a1a3a');sky.addColorStop(0.75,'#c84818');sky.addColorStop(1,'#2a1008');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='#ffb347';ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(W*0.72,H*0.32,46,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // volcano silhouette
  ctx.fillStyle='#1a0d14';
  ctx.beginPath();ctx.moveTo(W*0.45,groundY());ctx.lineTo(W*0.62,H*0.25);ctx.lineTo(W*0.79,groundY());ctx.closePath();ctx.fill();
  // lava glow in crater
  ctx.fillStyle='#ff4a00';
  ctx.beginPath();ctx.ellipse(W*0.62,H*0.27,26,8,0,0,Math.PI*2);ctx.fill();
  // smoke
  for(let i=0;i<4;i++){
    const sy=H*0.22-((G.time*30+i*60)%240);
    ctx.fillStyle=`rgba(120,100,100,${0.25*(1-(H*0.22-sy)/240)})`;
    ctx.beginPath();ctx.arc(W*0.62+Math.sin(G.time+i)*20,sy,18+i*4,0,Math.PI*2);ctx.fill();
  }
  // distant mountains
  ctx.fillStyle='#241018';
  for(let i=0;i<5;i++){const mx=i*W/4.2-W*0.1;
    ctx.beginPath();ctx.moveTo(mx,groundY());ctx.lineTo(mx+W*0.14,groundY()-H*0.16);ctx.lineTo(mx+W*0.28,groundY());ctx.closePath();ctx.fill();}
  ctx.save();
  if(trauma>0)ctx.translate(shakeX,shakeY);
  const gy=groundY();
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#4a2a1a');gg.addColorStop(1,'#1a0d08');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#5a3a24';ctx.fillRect(0,gy,W,6);
  // grass tufts / rocks detail
  ctx.fillStyle='#3a2418';
  for(let i=0;i<20;i++){const rx=(i*197)%W;ctx.fillRect(rx,gy+14+(i*37)%30,8,4);}
  // slingshot
  const s=G.sling;
  if(s){
    ctx.strokeStyle='#5a3a1a';ctx.lineWidth=14;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y+50);ctx.lineTo(s.x,s.y-10);ctx.stroke();
    ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(s.x,s.y-10);ctx.lineTo(s.x-34,s.y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s.x,s.y-10);ctx.lineTo(s.x+34,s.y-52);ctx.stroke();
    // band
    const bx=G.dragging?dragX:s.x,by=G.dragging?dragY:s.y;
    ctx.strokeStyle='#c8352c';ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(s.x-34,s.y-52);ctx.lineTo(bx,by);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s.x+34,s.y-52);ctx.lineTo(bx,by);ctx.stroke();
    // Blaze in sling or dragging
    if(slingReady()||G.dragging)drawBlaze(bx,by-6,20,G.dragging?0.15:Math.sin(G.time*3)*0.05,0);
    // trajectory dots
    if(G.dragging){
      const dx=s.x-dragX,dy=s.y-dragY;
      let tx=s.x,ty=s.y,tvx=dx*7.5,tvy=dy*7.5-150;
      ctx.fillStyle='rgba(255,255,255,0.65)';
      for(let i=0;i<14;i++){
        tvy+=GRAV*0.045;tx+=tvx*0.045;ty+=tvy*0.045;
        ctx.globalAlpha=1-i/14;
        ctx.beginPath();ctx.arc(tx,ty,5-i*0.25,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
  // blocks
  for(const b of G.blocks)if(!b.dead)drawBlock(b);
  // shards
  for(const sh of shards){
    if(!sh.a)continue;
    ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(sh.rot);
    ctx.globalAlpha=Math.min(1,sh.life);ctx.fillStyle=sh.color;
    ctx.fillRect(-sh.size/2,-sh.size/2,sh.size,sh.size*0.7);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // projectiles
  for(const pr of G.projectiles){
    if(!pr.live)continue;
    // trail
    pr.trail.push({x:pr.x,y:pr.y});if(pr.trail.length>10)pr.trail.shift();
    pr.trail.forEach((t,i)=>{ctx.globalAlpha=i/10*0.4;ctx.fillStyle='#ff8a2a';
      ctx.beginPath();ctx.arc(t.x,t.y,10*i/10,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;
    drawBlaze(pr.x,pr.y,19,pr.squash,pr.rot);
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.max),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // floating text
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life*1.5);
    ctx.font=`900 ${f.size}px system-ui`;ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
}

/* ---------------- Main loop ---------------- */
let lastT=0;
function loop(t){
  const rawDt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  let dt=rawDt;
  if(hitStop>0){hitStop-=rawDt;dt=rawDt*0.08;}
  G.time+=dt;
  // trauma decay
  trauma=Math.max(0,trauma-dt*1.6);
  const sh=trauma*trauma*22;
  shakeX=(Math.random()-0.5)*sh*2;shakeY=(Math.random()-0.5)*sh*2;
  // combo decay
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;
  if(G.state==='play')updatePhysics(dt);
  // particles
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const sh2 of shards){if(!sh2.a)continue;
    sh2.x+=sh2.vx*dt;sh2.y+=sh2.vy*dt;sh2.vy+=1400*dt;sh2.rot+=sh2.vr*dt;sh2.life-=dt;
    if(sh2.y>groundY()){sh2.y=groundY();sh2.vy*=-0.4;sh2.vx*=0.7;}
    if(sh2.life<=0)sh2.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=70*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  render();
  requestAnimationFrame(loop);
}
updateScoreUI();
showTitle();
requestAnimationFrame(loop);
</script>
</body>
