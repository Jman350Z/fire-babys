<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Volcanic Target — by Jman350Z & fire team</title>
<meta name="description" content="Hit the bullseye! Tap targets fast. A Fire Babys aim game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#timebar{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(300px,70vw);height:12px;background:rgba(0,0,0,.5);border-radius:6px;z-index:5;pointer-events:none;overflow:hidden}
#timefill{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);border-radius:6px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="combo">🔥 x1</div>
<div class="pill" id="best">🏆 0</div>
</div>
<div id="timebar"><div id="timefill"></div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🎯 VOLCANIC TARGET</h1>
<div id="obody"><p>Hit every target!</p><p><b>TAP</b> targets before they vanish! Bullseyes = big points, golden = jackpot. Watch out — decoys cost you! 60 seconds, targets get faster!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Aim for safety — hit the right target!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  hit(){tone(600,900,0.08,'triangle',0.11);},
  gold(){tone(1000,1800,0.14,'sine',0.13);},
  bad(){tone(300,150,0.18,'sawtooth',0.12);},
  tick(){tone(800,800,0.05,'square',0.07);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,combo:1,comboT:0,
  time:60,targets:[],spawnT:0.4,elapsed:0,shake:0,hits:0,shots:0};
try{G.best=parseInt(localStorage.getItem('voltarget_best')||'0',10)||0;}catch(e){}
const DUR=60;
function reset(){
  G.score=0;G.combo=1;G.comboT=0;G.time=DUR;G.targets=[];G.spawnT=0.4;
  G.elapsed=0;G.shake=0;G.hits=0;G.shots=0;
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('combo').textContent='🔥 x'+G.combo;
  document.getElementById('timefill').style.width=(G.time/DUR*100)+'%';
}
function spawnTarget(){
  const r=Math.random();
  let type='normal';
  if(r<0.08)type='gold';else if(r<0.2)type='decoy';else if(r<0.32)type='small';
  const margin=70;
  G.targets.push({
    x:margin+Math.random()*(W-margin*2),
    y:120+Math.random()*(H-320),
    r:type==='small'?24:type==='gold'?34:44,
    type,life:type==='decoy'?1.4:Math.max(0.9,2-G.elapsed*0.012),
    maxLife:1,t:Math.random()*6,scale:0
  });
  const tg=G.targets[G.targets.length-1];
  tg.maxLife=tg.life;
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  G.shots++;
  let hitAny=false;
  for(let i=G.targets.length-1;i>=0;i--){
    const t=G.targets[i];
    if(Math.hypot(x-t.x,y-t.y)<t.r*Math.max(0.6,t.scale)){
      hitAny=true;
      G.targets.splice(i,1);
      if(t.type==='decoy'){
        G.score=Math.max(0,G.score-20);G.combo=1;sfx.bad();
        spawnText(t.x,t.y,'DECOY! -20','#ff4a5a');G.shake=0.25;
      }else{
        G.hits++;G.combo=Math.min(10,G.combo+1);G.comboT=2.5;
        const pts=(t.type==='gold'?100:t.type==='small'?30:15)*G.combo;
        G.score+=pts;
        if(t.type==='gold'){sfx.gold();spawnText(t.x,t.y,'JACKPOT +'+pts,'#ffd23f');burst(t.x,t.y,'#ffd23f',14);}
        else{sfx.hit();spawnText(t.x,t.y,'+'+pts,'#fff');burst(t.x,t.y,'#ff8a3a',8);}
      }
      updateHUD();
      break;
    }
  }
  if(!hitAny){G.combo=1;updateHUD();}
});
const particles=[],floaters=[];
for(let i=0;i<100;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*200;p.vy=Math.sin(a)*200;
    p.life=0.4;p.max=0.4;p.color=color;p.size=3;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function update(dt){
  G.elapsed+=dt;G.time-=dt;G.shake=Math.max(0,G.shake-dt*3);
  G.comboT-=dt;if(G.comboT<=0)G.combo=1;
  if(G.time<=10&&Math.floor(G.time)!==Math.floor(G.time+dt))sfx.tick();
  if(G.time<=0){gameOver();return;}
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.targets.length<7){
    spawnTarget();
    G.spawnT=Math.max(0.3,0.9-G.elapsed*0.008);
  }
  for(let i=G.targets.length-1;i>=0;i--){
    const t=G.targets[i];
    t.t+=dt*5;t.life-=dt;t.scale=Math.min(1,t.scale+dt*5);
    if(t.life<=0){G.targets.splice(i,1);if(t.type!=='decoy')G.combo=1;}
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  if(Math.random()<0.1)updateHUD();
}
function gameOver(){
  G.state='over';
  const acc=G.shots>0?Math.round(G.hits/G.shots*100):0;
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('voltarget_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('⏰ TIME UP!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Accuracy: ${acc}%</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: You\'re a champion!',
      '↻ PLAY AGAIN',()=>{reset();G.state='play';});
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createRadialGradient(W/2,H*0.4,50,W/2,H*0.5,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#1a0f24');bg.addColorStop(1,'#0d0a14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  // targets
  for(const t of G.targets){
    const s=t.scale,ease=1-Math.pow(1-s,3);
    const r=t.r*ease;
    if(r<2)continue;
    const fade=Math.min(1,t.life/(t.maxLife*0.35));
    ctx.globalAlpha=fade;
    ctx.save();ctx.translate(t.x,t.y);
    if(t.type==='decoy'){
      // gray decoy with X
      ctx.fillStyle='#5a5a6a';
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#2a2a32';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(-r*0.5,-r*0.5);ctx.lineTo(r*0.5,r*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r*0.5,-r*0.5);ctx.lineTo(-r*0.5,r*0.5);ctx.stroke();
    }else{
      const cols=t.type==='gold'?['#fff2c8','#ffd23f','#a37a00']:['#fff','#ff8a3a','#a33c10'];
      const pulse=1+Math.sin(t.t)*0.06;
      ctx.scale(pulse,pulse);
      ctx.fillStyle=cols[2];ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=cols[1];ctx.beginPath();ctx.arc(0,0,r*0.66,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=cols[0];ctx.beginPath();ctx.arc(0,0,r*0.33,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=1;
    // shrinking life ring
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(t.x,t.y,r+8,-Math.PI/2,-Math.PI/2+Math.PI*2*(t.life/t.maxLife));ctx.stroke();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 22px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
