<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Volcanic Pinball — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0a06;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(14,10,6,.94);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(28px,6vw,46px);font-weight:900;margin-bottom:12px;color:#ffd23f}
#overlay p{font-size:16px;margin-bottom:10px;max-width:460px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:#a07818;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:14px 38px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#241c0e;border-radius:12px;padding:16px;margin:12px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:8px;border-radius:8px;border:2px solid #555;margin:0 8px}
.hidden{display:none!important}
#back{position:fixed;top:56px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
#flippers{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:0 20px 24px;pointer-events:none}
.fbtn{pointer-events:auto;width:110px;height:70px;border-radius:16px;border:3px solid rgba(255,255,255,.5);background:rgba(255,210,63,.3);color:#fff;font-size:18px;font-weight:800}
.fbtn:active{background:rgba(255,210,63,.6)}
</style>
</head>
<body>
<div id="hud"><div id="score">SCORE 0</div><div id="balls">●●●</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="flippers"><button class="fbtn" id="fl">◀ LEFT</button><button class="fbtn" id="fr">RIGHT ▶</button></div>
<div id="overlay">
<h1>🎱 VOLCANIC<br>PINBALL</h1>
<div id="obody"><p><b style="color:#ffd23f">Boulder</b> & <b style="color:#ffd23f">Cinder</b> hit the arcade!</p><p>🖱️ <b>Tap LEFT / RIGHT</b> buttons (or screen halves) to flip! Keep the fireball alive, smash bumpers for combos. 3 balls!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()" style="font-size:16px;padding:8px 20px">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Balls bounce — but never bounce near a hot stove or fireplace!</div>
<button id="obtn">▶ PLAY</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
let W,H,TW,TH,TX;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;TW=Math.min(W*0.9,420);TH=H*0.72;TX=(W-TW)/2;}addEventListener('resize',resize);resize();
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type,vol){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);g.gain.setValueAtTime(vol||0.18,t);g.gain.exponentialRampToValueAtTime(0.01,t+dur);o.start(t);o.stop(t+dur+0.05);}
let mathA=0;function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathA=a+b;document.getElementById('mq').textContent=a+' + '+b;document.getElementById('mathgate').classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathA){document.getElementById('mathgate').classList.add('hidden');startGame();}else document.getElementById('ma').value='';}
const G={state:'title',score:0,balls:3,combo:0,bx:0,by:0,bvx:0,bvy:0,fl:0,fr:0,parts:[],shake:0,bumpers:[],launched:false};
function startGame(){audio();G.score=0;G.balls=3;G.combo=0;G.bumpers=[];
  for(let i=0;i<5;i++)G.bumpers.push({x:TX+TW*(0.2+Math.random()*0.6),y:TH*0.25+Math.random()*TH*0.3,r:24,lit:0});
  launchBall();G.state='play';overlay.classList.add('hidden');
  document.getElementById('score').textContent='SCORE 0';updBalls();}
function updBalls(){document.getElementById('balls').textContent='●'.repeat(G.balls)+'○'.repeat(Math.max(3-G.balls,0));}
function launchBall(){G.bx=TX+TW-30;G.by=TH-60;G.bvx=0;G.bvy=-700-Math.random()*200;G.launched=true;sfx(300,900,0.3,'sine',0.2);}
function boom(x,y,n,c){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*350,vy:(Math.random()-0.5)*350,life:0.5,max:0.5,c});}
function flip(side){
  if(side<0)G.fl=0.15;else G.fr=0.15;
  sfx(500,300,0.08,'square',0.12);
  // flipper hit zones
  const fy=TH-70;
  if(side<0&&G.bx>TX+20&&G.bx<TX+TW*0.45&&G.by>fy-40&&G.by<fy+30&&G.bvy>0){
    G.bvy=-750-Math.random()*150;G.bvx=-200-Math.random()*200;hit();}
  if(side>0&&G.bx>TX+TW*0.55&&G.bx<TX+TW-20&&G.by>fy-40&&G.by<fy+30&&G.bvy>0){
    G.bvy=-750-Math.random()*150;G.bvx=200+Math.random()*200;hit();}
}
function hit(){G.combo++;const pts=100*G.combo;G.score+=pts;G.shake=5;boom(G.bx,G.by,12,'#ffd23f');sfx(600,1200,0.12,'sine',0.18);document.getElementById('score').textContent='SCORE '+G.score;}
function update(dt){
  if(G.shake>0)G.shake-=dt*30;
  G.fl-=dt;G.fr-=dt;
  G.bvy+=1400*dt;G.bx+=G.bvx*dt;G.by+=G.bvy*dt;
  G.bvx*=0.999;
  // walls
  if(G.bx<TX+14){G.bx=TX+14;G.bvx*=-0.85;sfx(300,200,0.06,'square',0.1);}
  if(G.bx>TX+TW-14){G.bx=TX+TW-14;G.bvx*=-0.85;sfx(300,200,0.06,'square',0.1);}
  if(G.by<14){G.by=14;G.bvy*=-0.85;}
  // bumpers
  for(const b of G.bumpers){b.lit-=dt;
    if(Math.hypot(G.bx-b.x,G.by-b.y)<b.r+12){
      const a=Math.atan2(G.by-b.y,G.bx-b.x);
      G.bvx=Math.cos(a)*650;G.bvy=Math.sin(a)*650-100;
      b.lit=0.3;hit();}}
  // center divider
  const fy=TH-70;
  if(G.by>fy-10&&G.by<fy+40&&Math.abs(G.bx-(TX+TW/2))<14&&G.bvy>0){G.bvy*=-0.5;G.bvx+=(Math.random()-0.5)*200;}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1);}
  // drain
  if(G.by>TH+40){
    G.balls--;G.combo=0;updBalls();sfx(400,80,0.4,'sawtooth',0.2);
    if(G.balls<=0){gameOver();}else launchBall();
  }
}
function gameOver(){G.state='over';
  obody.innerHTML='<p>Out of balls! Final score: <b>'+G.score+'</b></p>';
  document.querySelector('#overlay h1').textContent='🎱 GAME OVER';
  obtn.textContent='↻ PLAY AGAIN';obtn.onclick=()=>{startGame();};overlay.classList.remove('hidden');}
function render(){
  ctx.fillStyle='#0e0a06';ctx.fillRect(0,0,W,H);
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  // table
  const g=ctx.createLinearGradient(TX,0,TX+TW,0);g.addColorStop(0,'#1e1408');g.addColorStop(0.5,'#2e2010');g.addColorStop(1,'#1e1408');
  ctx.fillStyle=g;ctx.fillRect(TX,0,TW,TH);
  ctx.strokeStyle='#ff6a00';ctx.lineWidth=5;ctx.strokeRect(TX,0,TW,TH);
  // lava glow bottom
  ctx.fillStyle='#ff3b2e';ctx.fillRect(TX,TH-6,TW,6);
  for(const b of G.bumpers){
    ctx.fillStyle=b.lit>0?'#ffd23f':'#7a5a2a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.lit>0?'#fff':'#a08040';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.5,0,Math.PI*2);ctx.fill();}
  // flippers
  const fy=TH-70;
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=12;ctx.lineCap='round';
  const flA=G.fl>0?-0.5:0.35,frA=G.fr>0?0.5:-0.35;
  ctx.beginPath();ctx.moveTo(TX+30,fy);ctx.lineTo(TX+30+Math.cos(flA)*80,fy+Math.sin(flA)*80);ctx.stroke();
  ctx.beginPath();ctx.moveTo(TX+TW-30,fy);ctx.lineTo(TX+TW-30+Math.cos(Math.PI-frA)*80,fy+Math.sin(Math.PI-frA)*80);ctx.stroke();
  // divider
  ctx.fillStyle='#5a4a2a';ctx.fillRect(TX+TW/2-7,fy-10,14,50);
  // ball (fire baby!)
  if(G.state==='play'){
    const bg2=ctx.createRadialGradient(G.bx-4,G.by-5,3,G.bx,G.by,13);
    bg2.addColorStop(0,'#fff3b0');bg2.addColorStop(0.5,'#ff8a2e');bg2.addColorStop(1,'#e63900');
    ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(G.bx,G.by,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2b1a0e';ctx.beginPath();ctx.arc(G.bx-4,G.by-2,2.5,0,Math.PI*2);ctx.arc(G.bx+4,G.by-2,2.5,0,Math.PI*2);ctx.fill();}
  for(const p of G.parts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  if(G.combo>1){ctx.fillStyle='#ffd23f';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('COMBO x'+G.combo,TX+TW/2,80);ctx.textAlign='left';}
  ctx.restore();
}
function bindBtn(el,side){
  el.addEventListener('touchstart',e=>{e.preventDefault();flip(side);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();flip(side);});
}
bindBtn(document.getElementById('fl'),-1);bindBtn(document.getElementById('fr'),1);
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];flip(t.clientX<W/2?-1:1);},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='z')flip(-1);if(e.key==='ArrowRight'||e.key==='/')flip(1);});
let lastT=0;function loop(t){const dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;if(G.state==='play')update(dt);render();requestAnimationFrame(loop);}
obtn.onclick=()=>{showGate();};
requestAnimationFrame(loop);
</script>
</body>
</html>
