<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blaze's Inferno Roll — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#140805;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,5,0,.92);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#ffb300;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #ffb300;padding:6px;background:#2a1208;color:#fff}
#gate button,#startBtn{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">0m</div>
<canvas id="c"></canvas>
<div id="ov">
<h1>🌋 BLAZE'S INFERNO ROLL</h1>
<p>Blaze auto-rolls upward! Tap LEFT / RIGHT side of screen (or arrow keys) to dodge lava geysers. Grab embers for points!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Lava is always pretend in games — real hot liquids cause serious burns. Never touch!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=2+Math.floor(Math.random()*6),n2=2+Math.floor(Math.random()*6);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',px=0,obs=[],embers=[],parts=[],dist=0,speed=0,shake=0,time=0,inv=0;
function start(){state='play';px=W/2;obs=[];embers=[];parts=[];dist=0;speed=380;time=0;inv=0;ov.classList.add('hidden');}
function end(){state='over';ov.innerHTML=`<h1>🔥 ROLL OVER!</h1><p>You rolled <b>${Math.floor(dist)}m</b>!</p><div class="lesson">🔥 Fire Safety: Lava is always pretend in games — real hot liquids cause serious burns. Never touch!</div><button onclick="location.reload()" style="background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c});}}
function update(dt){
  if(state!=='play')return;time+=dt;dist+=speed*dt/45;speed=Math.min(800,380+time*10);
  hud.textContent=Math.floor(dist)+'m';shake*=.9;inv-=dt;
  if(Math.random()<dt*2.2)obs.push({x:Math.random()*W,y:-40,r:22+Math.random()*18});
  if(Math.random()<dt*1.2)embers.push({x:Math.random()*W,y:-30,r:14});
  obs.forEach(o=>o.y+=speed*dt*.7);embers.forEach(e=>e.y+=speed*dt*.6);
  obs=obs.filter(o=>o.y<H+60);embers=embers.filter(e=>e.y<H+40);
  const py=H*.7;
  obs.forEach(o=>{if(inv<=0&&Math.hypot(o.x-px,o.y-py)<o.r+22){shake=16;boom(px,py,'#ff3b2e',24);beep(100,.4,'sawtooth');end();}});
  embers.forEach((e,i)=>{if(Math.hypot(e.x-px,e.y-py)<e.r+24){embers.splice(i,1);dist+=25;boom(e.x,e.y,'#ffd23f',10);beep(700,.12,'sine');}});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function baby(x,y,r){ctx.save();ctx.translate(x,y);const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,'#ffd23f');g.addColorStop(.6,'#ff8a00');g.addColorStop(1,'#e63900');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(-r*.4,-r*.75);ctx.quadraticCurveTo(0,-r*1.5,r*.4,-r*.75);ctx.quadraticCurveTo(0,-r*1.05,-r*.4,-r*.75);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.3,-r*.1,r*.22,0,7);ctx.arc(r*.3,-r*.1,r*.22,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.3,-r*.08,r*.1,0,7);ctx.arc(r*.3,-r*.08,r*.1,0,7);ctx.fill();ctx.strokeStyle='#5a2000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.25,r*.3,.3,Math.PI-.3);ctx.stroke();ctx.restore();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d0505');g.addColorStop(1,'#3a1408');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  // scrolling lava cracks
  ctx.strokeStyle='rgba(255,106,0,.35)';ctx.lineWidth=4;
  const off=(time*speed*.3)%120;
  for(let y=-120+off;y<H+120;y+=120){ctx.beginPath();ctx.moveTo(W*.15,y);ctx.lineTo(W*.3,y+40);ctx.lineTo(W*.2,y+80);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.8,y+60);ctx.lineTo(W*.65,y+100);ctx.stroke();}
  obs.forEach(o=>{const gg=ctx.createRadialGradient(o.x-8,o.y-8,4,o.x,o.y,o.r);gg.addColorStop(0,'#ff8a3d');gg.addColorStop(1,'#a33000');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();});
  embers.forEach(e=>{ctx.fillStyle='#ffd23f';ctx.shadowColor='#ffb300';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0;});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  if(state==='play')baby(px+Math.sin(time*8)*3,H*.7+Math.cos(time*10)*2,30);
}
let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px=Math.max(30,px-70);if(e.key==='ArrowRight')px=Math.min(W-30,px+70);});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();(e.clientX-r.left)<W/2?px=Math.max(30,px-70):px=Math.min(W-30,px+70);});
</script>
</body>
</html>
