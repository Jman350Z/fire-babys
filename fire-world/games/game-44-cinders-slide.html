<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cinder's Slide — by Jman350Z & fire team</title>
<meta name="description" content="Slide the tiles! Classic 15-puzzle with fire baby art. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#160d08;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,6,3,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#1a0e08;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#lvlSel{display:flex;gap:8px;margin:12px 0}
.lvlBtn{width:auto;padding:0 16px;height:48px;border-radius:12px;border:3px solid #ff6a1a;background:#1a0e08;color:#ffd23f;font-size:14px;font-weight:900;cursor:pointer}
#shuffleBtn{position:fixed;bottom:14px;right:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:2px solid #ff6a1a;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="moves">👆 0</div>
<div class="pill" id="level">3×3</div>
<div class="pill" id="timer">⏱️ 0s</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<button id="shuffleBtn">🔀 Shuffle</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🧩 CINDER'S SLIDE</h1>
<div id="obody"><p>Slide the picture back together!</p><p><b>TAP</b> a tile next to the empty space to slide it! Rebuild the fire baby picture. Bigger grids = bigger challenge!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Piece together your escape plan!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR,TS,OX,OY;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
function layout(){
  TS=Math.min(W*0.9/G.n,H*0.62/G.n,120);
  OX=(W-TS*G.n)/2;OY=(H-TS*G.n)/2+30;
}
addEventListener('resize',resize);
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  slide(){tone(400+Math.random()*100,600,0.07,'sine',0.08);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',n:3,grid:[],empty:{r:0,c:0},moves:0,startT:0,solved:false,time:0,anim:null};
function initPuzzle(n){
  G.n=n;layout();
  G.grid=[];G.moves=0;G.solved=false;G.anim=null;
  G.startT=performance.now();
  let v=1;
  for(let r=0;r<n;r++){G.grid[r]=[];
    for(let c=0;c<n;c++){
      G.grid[r][c]=v<=n*n-1?v:0;v++;
    }
  }
  G.empty={r:n-1,c:n-1};
  // shuffle (valid moves)
  const shuffles=n*n*20;
  for(let i=0;i<shuffles;i++){
    const moves=[];
    const{r,c}=G.empty;
    if(r>0)moves.push({r:r-1,c});
    if(r<n-1)moves.push({r:r+1,c});
    if(c>0)moves.push({r,c:c-1});
    if(c<n-1)moves.push({r,c:c+1});
    const m=moves[Math.floor(Math.random()*moves.length)];
    G.grid[G.empty.r][G.empty.c]=G.grid[m.r][m.c];
    G.grid[m.r][m.c]=0;
    G.empty=m;
  }
  document.getElementById('level').textContent=`${n}×${n}`;
  document.getElementById('moves').textContent='👆 0';
  updateHUD();
}
function updateHUD(){}
function tileHome(v){
  return{r:Math.floor((v-1)/G.n),c:(v-1)%G.n};
}
function drawTileArt(hr,hc,px,py,ts){
  // draw portion of fire baby volcano scene
  ctx.save();
  ctx.beginPath();ctx.rect(px,py,ts,ts);ctx.clip();
  ctx.translate(px-hc*ts,py-hr*ts);
  const S=ts*G.n;
  // sky
  const g=ctx.createLinearGradient(0,0,0,S);
  g.addColorStop(0,'#1a2a4a');g.addColorStop(0.5,'#ff6a1a');g.addColorStop(1,'#3a1a0a');
  ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  // volcano
  ctx.fillStyle='#1a0d08';
  ctx.beginPath();
  ctx.moveTo(S*0.2,S*0.85);ctx.lineTo(S*0.5,S*0.25);ctx.lineTo(S*0.8,S*0.85);ctx.closePath();ctx.fill();
  // lava top
  ctx.fillStyle='#ff4a00';
  ctx.beginPath();ctx.ellipse(S*0.5,S*0.27,S*0.06,S*0.02,0,0,Math.PI*2);ctx.fill();
  // fire baby
  const bg=ctx.createRadialGradient(S*0.5-8,S*0.6-10,4,S*0.5,S*0.6,26);
  bg.addColorStop(0,'#ffe9a0');bg.addColorStop(0.5,'#ff7a2a');bg.addColorStop(1,'#d42a1a');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(S*0.5,S*0.6,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2b1a0e';
  ctx.beginPath();ctx.arc(S*0.5-8,S*0.6-4,4,0,Math.PI*2);ctx.arc(S*0.5+8,S*0.6-4,4,0,Math.PI*2);ctx.fill();
  // tile number (subtle)
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font=`900 ${ts*0.18}px system-ui`;ctx.textAlign='left';
  const home=tileHome(G._drawV||1);
  ctx.fillText(G._drawV||'',px+6,py+ts*0.22);
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.solved||G.anim)return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const c=Math.floor((x-OX)/TS),r=Math.floor((y-OY)/TS);
  if(r<0||r>=G.n||c<0||c>=G.n)return;
  const er=G.empty.r,ec=G.empty.c;
  if(Math.abs(r-er)+Math.abs(c-ec)===1){
    // animate slide
    G.anim={fr:r,fc:c,tr:er,tc:ec,t:0,v:G.grid[r][c]};
    G.grid[er][ec]=G.grid[r][c];
    G.grid[r][c]=0;
    G.empty={r,c};
    sfx.slide();
  }
});
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  if(G.state==='play'){initPuzzle(G.n);sfx.click();}
});
function checkWin(){
  for(let r=0;r<G.n;r++)for(let c=0;c<G.n;c++){
    const v=G.grid[r][c];
    if(r===G.n-1&&c===G.n-1){if(v!==0)return false;}
    else if(v!==r*G.n+c+1)return false;
  }
  return true;
}
function onSolve(){
  G.solved=true;sfx.win();
  const elapsed=(performance.now()-G.startT)/1000;
  const score=Math.max(100,Math.round(5000/(G.moves+10)/(elapsed/60+1)));
  setTimeout(()=>{
    showOverlay('🏆 SOLVED!',
      `<p style="font-size:24px;font-weight:900">Score: ${score}</p><p>${G.moves} moves in ${elapsed.toFixed(1)}s</p><p>Grid: ${G.n}×${G.n}</p>`,
      '🔥 Fire Safety: You\'re a champion!',
      G.n<5?'▶ BIGGER PUZZLE':'↻ PLAY AGAIN',
      ()=>{
        if(G.n<5)initPuzzle(G.n+1);
        else initPuzzle(G.n);
        G.state='play';
      });
  },600);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='🧩 PICK SIZE';
  const sizes=[3,4,5];
  let h='';
  sizes.forEach(n=>{h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${n})">${n}×${n}</button>`;});
  obody.innerHTML=`<p>Slide tiles to rebuild the picture!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();initPuzzle(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;
  obtn.textContent=btn;obtn.style.display='';
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  ctx.fillStyle='#160d08';ctx.fillRect(0,0,W,H);
  if(!G.grid.length)return;
  // board bg
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.beginPath();ctx.roundRect(OX-8,OY-8,TS*G.n+16,TS*G.n+16,14);ctx.fill();
  for(let r=0;r<G.n;r++)for(let c=0;c<G.n;c++){
    const v=G.grid[r][c];
    const px=OX+c*TS,py=OY+r*TS;
    if(v===0){
      // empty
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath();ctx.roundRect(px+3,py+3,TS-6,TS-6,10);ctx.fill();
      continue;
    }
    let dx=px,dy=py;
    // animation
    if(G.anim&&G.anim.v===v){
      const t=Math.min(1,G.anim.t);
      const fx=OX+G.anim.fc*TS,fy=OY+G.anim.fr*TS;
      const tx=OX+G.anim.tc*TS,ty=OY+G.anim.tr*TS;
      dx=fx+(tx-fx)*t;dy=fy+(ty-fy)*t;
    }
    const home=tileHome(v);
    const correct=home.r===r&&home.c===c;
    G._drawV=v;
    drawTileArt(home.r,home.c,dx+3,dy+3,TS-6);
    ctx.strokeStyle=correct?'rgba(76,175,80,0.7)':'rgba(255,255,255,0.25)';
    ctx.lineWidth=correct?3:2;
    ctx.beginPath();ctx.roundRect(dx+3,dy+3,TS-6,TS-6,10);ctx.stroke();
  }
  G._drawV=null;
  // timer
  if(G.state==='play'&&!G.solved){
    const el=(performance.now()-G.startT)/1000;
    document.getElementById('timer').textContent='⏱️ '+el.toFixed(0)+'s';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;G.time+=dt;
  if(G.anim){
    G.anim.t+=dt*8;
    if(G.anim.t>=1){
      G.anim=null;G.moves++;
      document.getElementById('moves').textContent='👆 '+G.moves;
      if(checkWin())onSolve();
    }
  }
  render();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
