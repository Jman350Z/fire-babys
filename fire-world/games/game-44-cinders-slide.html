<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cinder's Slide — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f0a18;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,6,20,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#c9a0ff;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #c9a0ff;padding:6px;background:#1a102a;color:#fff}
#gate button,#startBtn{background:#7a4dc4;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">SCORE 0</div>
<canvas id="c"></canvas>
<div id="ov">
<h1>💜 CINDER'S SLIDE</h1>
<p>Endless hopper! TAP to make Cinder hop between sliding ice platforms. Don't fall into the void — chain perfect landings for combos!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Slippery floors are dangerous — walk, don't run, on wet surfaces!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=2+Math.floor(Math.random()*6),n2=2+Math.floor(Math.random()*5);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',plats=[],py=0,vy=0,px=0,score=0,combo=0,shake=0,parts=[],camY=0,dir=1;
function mkPlat(y,first){const w=90+Math.random()*70;return{x:Math.random()*(W-w),y,w,first:!!first};}
function start(){state='play';score=0;combo=0;parts=[];camY=0;plats=[mkPlat(H-120,true)];for(let i=1;i<8;i++)plats.push(mkPlat(H-120-i*130));const f=plats[0];px=f.x+f.w/2;py=f.y;vy=0;ov.classList.add('hidden');}
function end(){state='over';ov.innerHTML=`<h1>💜 SPLASH DOWN!</h1><p>Score: <b>${score}</b></p><div class="lesson">🔥 Fire Safety: Slippery floors are dangerous — walk, don't run, on wet surfaces!</div><button onclick="location.reload()" style="background:#7a4dc4;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*7,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c});}}
function hop(){
  if(state!=='play')return;
  if(vy===0){vy=-11;dir*=-1;beep(400,.1,'sine');}
}
function update(dt){
  if(state!=='play')return;shake*=.9;
  vy+=.5;py+=vy;px+=dir*2.2;
  if(px<20){px=20;dir=1;}if(px>W-20){px=W-20;dir=-1;}
  if(vy>0){
    plats.forEach(p=>{if(!p.gone&&px>p.x-14&&px<p.x+p.w+14&&py>p.y-8&&py<p.y+14){
      const center=Math.abs(px-(p.x+p.w/2))/(p.w/2);
      const pts=center<.3?50:20;const mult=1+Math.floor(combo/5);
      score+=pts*mult;combo++;py=p.y;vy=0;
      boom(px,py,'#c9a0ff');beep(500+combo*20,.1,'sine');shake=Math.max(shake,4);
      hud.textContent='SCORE '+score+(combo>2?' · x'+mult+' COMBO!':'');
    }});
  }
  // camera follow upward
  const target=Math.min(camY,H*0.55-py);camY+=(target-camY)*.1;
  // recycle platforms
  plats.forEach(p=>{if(p.y+camY>H+60){Object.assign(p,mkPlat(p.y-8*130));}});
  // find highest
  let top=1e9;plats.forEach(p=>top=Math.min(top,p.y));
  if(top+camY>H+200){const np=mkPlat(top-130);plats.push(np);}
  if(py+camY>H+80){shake=14;boom(px,H,'#888',20);beep(120,.4,'sawtooth');end();}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function baby(x,y,r){ctx.save();ctx.translate(x,y);const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,'#e0c0ff');g.addColorStop(.6,'#a06ae0');g.addColorStop(1,'#5a2a9a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.3,-r*.1,r*.22,0,7);ctx.arc(r*.3,-r*.1,r*.22,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.3,-r*.08,r*.1,0,7);ctx.arc(r*.3,-r*.08,r*.1,0,7);ctx.fill();ctx.strokeStyle='#3a1a5a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.25,r*.3,.3,Math.PI-.3);ctx.stroke();ctx.restore();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f0a18');g.addColorStop(1,'#1e1230');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.save();ctx.translate(0,camY);
  plats.forEach(p=>{ctx.fillStyle='#8fb4dd';ctx.fillRect(p.x,p.y,p.w,18);ctx.fillStyle='#c9e4ff';ctx.fillRect(p.x,p.y,p.w,6);ctx.strokeStyle='#4a6a8a';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,18);});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  if(state==='play')baby(px,py-24,24);
  ctx.restore();
}
let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
cv.addEventListener('pointerdown',hop);
addEventListener('keydown',e=>{if(e.key===' ')hop();});
</script>
</body>
</html>
