<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sizzle's Target Pop — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#160a04;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#ff8a3d;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:34px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">SCORE 0</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🏹 SIZZLE'S TARGET POP</h1>
<p>Aim the ballista! Drag to pull back, release to launch water balloons at the crystal targets. Moving targets = bonus! 60 seconds!</p>
<div class="lesson">🔥 Fire Safety: Water puts out small fires! But firefighters handle big ones — always get help from a grown-up!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;BX=W/2;BY=H-110;}let BX,BY;addEventListener('resize',rs);rs();
const a=6+Math.floor(Math.random()*3),b=2+Math.floor(Math.random()*4);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else alert('Try again!');}
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let running=false,targets=[],shots=[],parts=[],score=0,combo=0,comboT=0,time=60,pull=null,shake=0,spawnT=0;
function startGame(){running=true;score=0;combo=0;time=60;targets=[];shots=[];parts=[];pull=null;shake=0;spawnT=0;overlay.classList.add('hidden');upd();}
function upd(){scoreEl.textContent='SCORE '+score+' · ⏱️ '+Math.ceil(time)+'s';}
function burst(x,y,c,n){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s-2,life:1,c,sz:3+Math.random()*6});}}
function endGame(){
  running=false;
  overlay.querySelector('h1').textContent='⏱️ TIME UP!';
  overlay.querySelector('p').textContent='Final score: '+score;
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ PLAY AGAIN';
  overlay.classList.remove('hidden');
}
function spawnTarget(){
  const moving=Math.random()<0.5;
  targets.push({x:60+Math.random()*(W-120),y:80+Math.random()*H*0.35,r:24+Math.random()*10,moving,mvx:moving?(Math.random()<0.5?-1:1)*(60+Math.random()*80):0,life:6});
}
function toXY(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{if(!running)return;const p=toXY(e);if(Math.hypot(p.x-BX,p.y-BY)<120)pull={x:p.x,y:p.y};});
cv.addEventListener('pointermove',e=>{if(pull){const p=toXY(e);pull={x:p.x,y:p.y};}});
cv.addEventListener('pointerup',()=>{
  if(!pull||!running){pull=null;return;}
  const dx=BX-pull.x,dy=BY-pull.y,d=Math.hypot(dx,dy);
  if(d>30){
    const sp=Math.min(d*4,1400);
    shots.push({x:BX,y:BY,vx:dx/d*sp,vy:dy/d*sp-200,r:12});
    beep(250,0.2,'square');burst(BX,BY,'#7ae2ff',8);
  }
  pull=null;
});
function update(dt){
  if(!running)return;
  time-=dt;if(time<=0){endGame();return;}
  spawnT+=dt;if(spawnT>1.1){spawnT=0;if(targets.length<6)spawnTarget();}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;comboEl.textContent='';}
  targets.forEach(t=>{
    if(t.moving){t.x+=t.mvx*dt;if(t.x<50||t.x>W-50)t.mvx*=-1;}
    t.life-=dt;
  });
  targets=targets.filter(t=>t.life>0);
  shots.forEach(s=>{
    s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    targets.forEach(t=>{
      if(!t.dead&&Math.hypot(s.x-t.x,s.y-t.y)<s.r+t.r){
        t.dead=true;s.dead=true;
        combo++;comboT=2;
        const pts=(t.moving?200:100)*combo;score+=pts;
        comboEl.textContent=combo>1?'💥 COMBO x'+combo+' +'+pts:'+'+pts;
        burst(t.x,t.y,'#7ae2ff',20);burst(t.x,t.y,'#ffd23f',10);
        shake=Math.max(shake,10);beep(500+combo*80,0.25,'triangle');upd();
      }
    });
    if(s.y>H+40||s.x<-40||s.x>W+40)s.dead=true;
  });
  shots=shots.filter(s=>!s.dead);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;p.life-=dt*1.4;});
  parts=parts.filter(p=>p.life>0);
  shake*=0.88;upd();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0505');g.addColorStop(1,'#2a1408');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // castle wall
  ctx.fillStyle='#4a2c1a';ctx.fillRect(0,H-60,W,60);
  targets.forEach(t=>{
    ctx.save();ctx.translate(t.x,t.y);
    ctx.globalAlpha=Math.min(1,t.life);
    ctx.fillStyle='#4de';ctx.shadowColor='#7ff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(0,0,t.r,0,6.29);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#0a3a44';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t.moving?'★':'●',0,5);ctx.textAlign='left';
    ctx.restore();
  });
  // ballista
  ctx.save();ctx.translate(BX,BY);
  ctx.fillStyle='#6a4a2a';ctx.fillRect(-14,-50,28,50);
  ctx.strokeStyle='#3a2410';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-50,-30);ctx.lineTo(50,-30);ctx.stroke();
  if(pull){
    const dx=BX-pull.x,dy=BY-pull.y;
    ctx.strokeStyle='#7ae2ff';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-50,-30);ctx.lineTo(-dx*0.3,-30-dy*0.3);ctx.lineTo(50,-30);ctx.stroke();
    ctx.fillStyle='#7ae2ff';ctx.beginPath();ctx.arc(-dx*0.3,-30-dy*0.3,12,0,6.29);ctx.fill();
  }else{
    ctx.fillStyle='#7ae2ff';ctx.beginPath();ctx.arc(0,-30,12,0,6.29);ctx.fill();
  }
  ctx.restore();
  shots.forEach(s=>{ctx.fillStyle='#7ae2ff';ctx.shadowColor='#7ae2ff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.29);ctx.fill();ctx.shadowBlur=0;});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</body>
</html>
