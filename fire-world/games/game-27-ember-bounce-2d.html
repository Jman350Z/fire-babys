<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ember Bounce 2D — Fire Babys</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#140a26;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;touch-action:none}
#fw{position:fixed;top:8px;left:8px;z-index:20;background:#ff9f1c;color:#3a1c00;font:bold 14px system-ui,sans-serif;padding:9px 13px;border-radius:12px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#gate{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(10,4,22,.82);padding:16px;box-sizing:border-box}
#gate .card{background:#2b1548;border:3px solid #ff9f1c;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;color:#fff}
#gate .ttl{font-size:26px;font-weight:900;color:#ffcf5c;margin-bottom:2px}
#gate .stars{font-size:14px;color:#ffd9a0;margin-bottom:12px}
#gate .lesson{background:#3a1c5c;border-radius:12px;padding:10px;font-size:14px;margin-bottom:14px;line-height:1.35}
#gate .q{font-size:19px;font-weight:700;margin-bottom:10px}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:10px;border:2px solid #ff9f1c;padding:8px;margin-bottom:12px;background:#140a26;color:#fff}
#gate button{font-size:18px;font-weight:800;background:#ff9f1c;color:#3a1c00;border:none;border-radius:12px;padding:12px 30px;cursor:pointer}
</style>
</head>
<body>
<a id="fw" href="/fire-world.html">&#8592; Fire World</a>
<canvas id="c"></canvas>
<div id="gate">
  <div class="card">
    <div class="ttl">&#128293; Ember Bounce 2D</div>
    <div class="stars">Starring Lord Inferno &amp; Ruko</div>
    <div class="lesson">&#128293; Fire Safety: Keep candles far away from anything that can burn!</div>
    <div class="q">Grown-up check: <span id="qa">?</span> + <span id="qb">?</span> = ?</div>
    <input id="ans" type="number" inputmode="numeric" pattern="[0-9]*" aria-label="Answer">
    <br><button id="unlock">UNLOCK</button>
  </div>
</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,groundY=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H-46;}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,slide,delay){const a=ac();if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.2,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.05);}
function sfx(n){
  if(n==='pop')tone(620,0.12,'square',0.16,1400);
  else if(n==='click')tone(820,0.06,'square',0.1);
  else if(n==='shoot')tone(280,0.22,'square',0.16,950);
  else if(n==='bounce')tone(360,0.07,'sine',0.1,220);
  else if(n==='smash'){tone(500,0.15,'triangle',0.2,1500);tone(250,0.2,'sawtooth',0.12,90,0.02);}
  else if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,0.25,'triangle',0.2,null,i*0.12));
  else if(n==='lose')[380,300,210,150].forEach((f,i)=>tone(f,0.3,'sawtooth',0.14,null,i*0.16));
}

/* ---------- particles + shake ---------- */
let parts=[],shakeT=0;
function burst(x,y,c,n){n=n||22;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*260;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:0.5+Math.random()*0.5,t:0,color:c});}}
function shake(){shakeT=0.2;}

/* ---------- fire baby drawing (brand-safe: flame teardrop, no wings/beaks) ---------- */
function fireBaby(x,y,s,mood){
  const g=ctx.createRadialGradient(x-s*0.3,y-s*0.25,s*0.1,x,y,s*1.15);
  g.addColorStop(0,'#fff6b0');g.addColorStop(0.45,'#ffb703');g.addColorStop(1,'#f4511e');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(x,y-s);
  ctx.bezierCurveTo(x+s*0.95,y-s*0.25,x+s*0.8,y+s*0.6,x,y+s*0.6);
  ctx.bezierCurveTo(x-s*0.8,y+s*0.6,x-s*0.95,y-s*0.25,x,y-s);
  ctx.fill();
  ctx.fillStyle='#4a2400';
  const ey=y+s*0.02,ex=s*0.28;
  ctx.beginPath();ctx.arc(x-ex,ey,Math.max(1.5,s*0.09),0,7);ctx.arc(x+ex,ey,Math.max(1.5,s*0.09),0,7);ctx.fill();
  ctx.strokeStyle='#4a2400';ctx.lineWidth=Math.max(2,s*0.07);ctx.lineCap='round';ctx.beginPath();
  if(mood==='sad')ctx.arc(x,y+s*0.45,s*0.2,Math.PI*1.15,Math.PI*1.85);
  else if(mood==='wow'){ctx.arc(x,y+s*0.28,s*0.12,0,7);}
  else ctx.arc(x,y+s*0.08,s*0.24,Math.PI*0.15,Math.PI*0.85);
  ctx.stroke();
  ctx.fillStyle='rgba(255,130,130,0.5)';
  ctx.beginPath();ctx.arc(x-ex-s*0.14,ey+s*0.12,s*0.08,0,7);ctx.arc(x+ex+s*0.14,ey+s*0.12,s*0.08,0,7);ctx.fill();
}

/* ---------- game state ---------- */
const LESSON="Keep candles far away from anything that can burn!";
let screen='title',unlocked=false;
let level=0,score=0,shots=8,ball=null,restT=0;
let targets=[];
let aiming=false,aimAngle=Math.PI/4,aimPower=150,aimPt=null,lastAngle=Math.PI/4;
const cannon={x:64,y:0};
const BALL_R=13,GRAV=1100;
const LEVELS=[
  {t:[[0.74,0.32],[0.86,0.55],[0.62,0.66]]},
  {t:[[0.78,0.24],[0.90,0.50],[0.70,0.68],[0.55,0.38]]},
  {t:[[0.85,0.18],[0.93,0.52],[0.72,0.70],[0.58,0.42],[0.82,0.85]]}
];
function setupLevel(){
  cannon.y=groundY-34;
  shots=8;ball=null;aiming=false;aimPt=null;restT=0;
  targets=LEVELS[level].t.map(p=>({fx:p[0],fy:p[1],r:20,smashed:false,spin:Math.random()*6}));
}
function tPos(t){return {x:t.fx*W,y:t.fy*H};}
function allSmashed(){return targets.every(t=>t.smashed);}
function startGame(){level=0;score=0;setupLevel();screen='play';}
function fireBall(){
  if(ball||screen!=='play')return;
  const vx=Math.cos(aimAngle)*aimPower*3.4, vy=-Math.sin(aimAngle)*aimPower*3.4;
  ball={x:cannon.x,y:cannon.y-14,vx:vx,vy:vy};
  lastAngle=aimAngle;shots--;restT=0;sfx('shoot');
  burst(cannon.x+Math.cos(aimAngle)*30,cannon.y-14-Math.sin(aimAngle)*30,'#ffb703',10);
}
function updateBall(dt){
  if(!ball)return;
  ball.vy+=GRAV*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x>W-8){ball.x=W-8;ball.vx*=-0.6;sfx('bounce');}
  if(ball.y<8){ball.y=8;ball.vy*=-0.6;sfx('bounce');}
  if(ball.y>groundY-BALL_R){
    ball.y=groundY-BALL_R;
    if(Math.abs(ball.vy)>120){sfx('bounce');burst(ball.x,ball.y+BALL_R,'#888',6);}
    ball.vy*=-0.62;ball.vx*=0.985;
    if(Math.abs(ball.vy)<60)ball.vy=0;
  }
  ball.vx*=0.999;
  // hit targets
  for(const t of targets){
    if(t.smashed)continue;
    const p=tPos(t),dx=ball.x-p.x,dy=ball.y-p.y;
    if(dx*dx+dy*dy < (t.r+BALL_R)*(t.r+BALL_R)){
      t.smashed=true;score+=100;sfx('smash');shake();
      burst(p.x,p.y,'#7ee8fa',26);burst(p.x,p.y,'#c084fc',14);
      ball.vx*=0.85;ball.vy*=0.85;
    }
  }
  const sp=Math.hypot(ball.vx,ball.vy);
  const onGround=ball.y>=groundY-BALL_R-1;
  if((onGround&&sp<55)||ball.x<-120||ball.x>W+120||ball.y<-140)restT+=dt;else restT=0;
  if(restT>0.45){
    ball=null;
    if(allSmashed()){
      sfx('win');
      if(level<2){level++;setupLevel();}
      else{screen='win';}
    }else if(shots<=0){screen='over';sfx('lose');}
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  if(shakeT>0)shakeT-=dt;
}

/* ---------- drawing ---------- */
let btns=[];
function button(x,y,w,h,label,act,bg){
  btns.push({x:x,y:y,w:w,h:h,act:act});
  ctx.fillStyle=bg||'#ff9f1c';
  ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();
  ctx.fillStyle='#3a1c00';ctx.font='800 19px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
}
function crystal(x,y,r,spin){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(spin)*0.25);
  const g=ctx.createLinearGradient(-r,-r,r,r);
  g.addColorStop(0,'#d9fbff');g.addColorStop(0.5,'#7ee8fa');g.addColorStop(1,'#7c3aed');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(0,-r);ctx.lineTo(r*0.7,0);ctx.lineTo(0,r);ctx.lineTo(-r*0.7,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(-r*0.2,-r*0.35,r*0.12,0,7);ctx.fill();
  ctx.restore();
}
function drawCannon(){
  ctx.save();ctx.translate(cannon.x,cannon.y);
  ctx.fillStyle='#6b6f7a';ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();
  ctx.strokeStyle='#3d4048';ctx.lineWidth=4;ctx.stroke();
  ctx.rotate(-aimAngle);
  const bg=ctx.createLinearGradient(0,0,44,0);bg.addColorStop(0,'#8a8f9b');bg.addColorStop(1,'#4c5058');
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(0,-13,46,26,8);ctx.fill();
  ctx.restore();
}
function drawTrajectory(){
  if(!aiming||ball)return;
  let x=cannon.x,y=cannon.y-14;
  let vx=Math.cos(aimAngle)*aimPower*3.4,vy=-Math.sin(aimAngle)*aimPower*3.4;
  ctx.fillStyle='rgba(255,255,255,0.75)';
  const dt=1/30;
  for(let i=0;i<60;i++){
    vy+=GRAV*dt;x+=vx*dt;y+=vy*dt;
    if(y>groundY-4)break;
    if(i%3===0){ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();}
  }
}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b0f33');g.addColorStop(0.6,'#3a1548');g.addColorStop(1,'#5c1f2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<40;i++){const sx=(i*97)%W,sy=(i*53)%(H*0.6);ctx.fillRect(sx,sy,2,2);}
  ctx.fillStyle='#2c2c38';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#3a3a48';
  for(let i=0;i<W;i+=36)ctx.fillRect(i,groundY+8,20,8);
}
function draw(){
  btns=[];
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*14,(Math.random()-0.5)*14);
  drawBG();
  // crystals
  for(const t of targets){
    if(t.smashed)continue;
    const p=tPos(t);crystal(p.x,p.y,t.r,performance.now()/700+t.spin);
  }
  drawCannon();
  drawTrajectory();
  if(ball){fireBaby(ball.x,ball.y,BALL_R*1.25,'wow');}
  // HUD
  ctx.fillStyle='#fff';ctx.font='800 17px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('Score: '+score,10,44);
  ctx.textAlign='center';
  ctx.fillText('Level '+(level+1)+'/3',W/2,44);
  ctx.textAlign='right';
  ctx.fillText('Shots: '+shots+'  \uD83D\uDCA0 '+targets.filter(t=>!t.smashed).length,W-10,44);
  if(aiming&&!ball){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 15px system-ui,sans-serif';
    ctx.fillText('Drag to aim — release to FIRE!',W/2,80);
  }
  if(screen==='title'){
    ctx.fillStyle='rgba(10,4,22,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='900 40px system-ui,sans-serif';ctx.fillStyle='#ffcf5c';
    ctx.fillText('Ember Bounce 2D',W/2,H*0.18);
    ctx.font='700 16px system-ui,sans-serif';ctx.fillStyle='#ffd9a0';
    ctx.fillText('Starring Lord Inferno & Ruko',W/2,H*0.18+34);
    fireBaby(W/2-46,H*0.34,34,'happy');fireBaby(W/2+46,H*0.34,34,'happy');
    ctx.font='700 15px system-ui,sans-serif';ctx.fillStyle='#fff';
    const lw=Math.min(W-60,360);
    ctx.fillText('\uD83D\uDD25 Fire Safety:',W/2,H*0.52);
    wrapText(LESSON,W/2,H*0.52+24,lw,17);
    if(unlocked)button(W/2-110,H*0.72,220,58,'TAP TO START',startGame);
    else{ctx.font='700 16px system-ui,sans-serif';ctx.fillStyle='#ffcf5c';ctx.fillText('Finish the grown-up check above \u261D\uFE0F',W/2,H*0.72);}
  }else if(screen==='over'){
    ctx.fillStyle='rgba(10,4,22,0.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='900 38px system-ui,sans-serif';
    ctx.fillText('Out of shots!',W/2,H*0.3);
    fireBaby(W/2,H*0.44,36,'sad');
    ctx.fillStyle='#fff';ctx.font='800 22px system-ui,sans-serif';
    ctx.fillText('Score: '+score,W/2,H*0.58);
    ctx.font='700 15px system-ui,sans-serif';
    ctx.fillText('\uD83D\uDD25 Fire Safety:',W/2,H*0.66);
    wrapText(LESSON,W/2,H*0.66+24,Math.min(W-60,360),17);
    button(W/2-120,H*0.8,240,58,'TAP TO RESTART',startGame);
  }else if(screen==='win'){
    ctx.fillStyle='rgba(10,4,22,0.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffcf5c';ctx.font='900 38px system-ui,sans-serif';
    ctx.fillText('\uD83C\uDFC6 YOU WIN!',W/2,H*0.26);
    fireBaby(W/2-46,H*0.42,36,'happy');fireBaby(W/2+46,H*0.42,36,'happy');
    ctx.fillStyle='#fff';ctx.font='800 24px system-ui,sans-serif';
    ctx.fillText('Total Score: '+score,W/2,H*0.56);
    ctx.font='700 15px system-ui,sans-serif';
    ctx.fillText('\uD83D\uDD25 Fire Safety:',W/2,H*0.64);
    wrapText(LESSON,W/2,H*0.64+24,Math.min(W-60,360),17);
    button(W/2-120,H*0.8,240,58,'PLAY AGAIN',startGame);
  }
  // particles
  for(const p of parts){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
}
function wrapText(text,x,y,maxW,lh){
  ctx.font='700 15px system-ui,sans-serif';
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}
  ctx.fillText(line,x,yy);
}

/* ---------- input ---------- */
function pos(e){const t=e.touches?e.touches[0]:e;return {x:t.clientX,y:t.clientY};}
function setAim(p){
  const dx=p.x-cannon.x,dy=cannon.y-p.y;
  const d=Math.hypot(dx,dy);
  if(d<8)return;
  aimAngle=Math.max(0.08,Math.min(Math.PI-0.08,Math.atan2(dy,dx)));
  aimPower=Math.max(40,Math.min(280,d));
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();ac();
  const p=pos(e);
  if(screen==='play'&&!ball){aiming=true;aimPt=p;setAim(p);}
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(aiming&&screen==='play'){setAim(pos(e));}
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  const p=pos(e.changedTouches?{touches:e.changedTouches}:e);
  if(aiming&&screen==='play'){aiming=false;if(!ball)fireBall();}
  else{
    for(const b of btns){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx('click');b.act();break;}}
  }
},{passive:false});
// mouse fallback
cv.addEventListener('mousedown',function(e){ac();if(screen==='play'&&!ball){aiming=true;setAim({x:e.clientX,y:e.clientY});}});
cv.addEventListener('mousemove',function(e){if(aiming&&screen==='play')setAim({x:e.clientX,y:e.clientY});});
cv.addEventListener('mouseup',function(e){
  if(aiming&&screen==='play'){aiming=false;if(!ball)fireBall();}
  else{for(const b of btns){if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){sfx('click');b.act();break;}}}
});
document.addEventListener('keydown',function(e){
  if(screen!=='play')return;
  if(e.key==='ArrowUp')aimAngle=Math.min(Math.PI-0.08,aimAngle+0.06);
  else if(e.key==='ArrowDown')aimAngle=Math.max(0.08,aimAngle-0.06);
  else if(e.key==='ArrowRight')aimPower=Math.min(280,aimPower+8);
  else if(e.key==='ArrowLeft')aimPower=Math.max(40,aimPower-8);
  else if(e.key===' '){e.preventDefault();fireBall();}
});

/* ---------- parental gate ---------- */
const GA=1+Math.floor(Math.random()*9),GB=1+Math.floor(Math.random()*9);
document.getElementById('qa').textContent=GA;
document.getElementById('qb').textContent=GB;
document.getElementById('unlock').addEventListener('click',function(){
  ac();
  const v=parseInt(document.getElementById('ans').value,10);
  if(v===GA+GB){unlocked=true;document.getElementById('gate').style.display='none';sfx('win');}
  else{sfx('lose');document.getElementById('ans').value='';document.getElementById('ans').placeholder='Try again!';shake();}
});

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.05)dt=0.05;
  if(screen==='play')updateBall(dt);
  updateParts(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
