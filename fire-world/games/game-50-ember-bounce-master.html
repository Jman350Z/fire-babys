<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ember Bounce Master — by Jman350Z & fire team</title>
<meta name="description" content="Bounce to the top! Angle shots and smash bricks. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#lvlSel{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.lvlBtn{width:48px;height:48px;border-radius:12px;border:3px solid #ff6a1a;background:#141024;color:#ffd23f;font-size:16px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="level">LV 1/5</div>
<div class="pill" id="lives">❤️❤️❤️</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🔥 EMBER BOUNCE MASTER</h1>
<div id="obody"><p>Bounce to the top!</p><p><b>DRAG</b> or use <b>◀ ▶</b> to move the paddle! Bounce the ember up, smash every brick, and grab the ⭐ bonus stars. Angle your shots — steeper angles climb faster!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Bounce back from mistakes!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  bounce(){tone(400,600,0.07,'square',0.08);},
  brick(){tone(500,800,0.09,'triangle',0.1);},
  star(){tone(900,1400,0.12,'sine',0.11);},
  lose(){tone(300,100,0.3,'sawtooth',0.13);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
// level layouts: strings, # = brick, 2 = 2hp, s = star brick, . = empty
const LEVELS=[
  ["..........","..##..##..",".########.",".##ss##..",".########.","..######.."],
  ["..........",".##22##...","..######..",".#s####s#.",".########.","22######22"],
  ["..........","..##22##..",".###ss###.","##222222##",".#s####s#.",".########."],
  ["..........",".22#ss#22.","..######..","##2####2##",".#ss##ss#.","222####222"],
  ["..........","22##ss##22",".###22###.","##s####s##","222####222",".#ss##ss#."],
];
const G={state:'title',level:1,score:0,lives:3,
  px:0,ball:{x:0,y:0,vx:0,vy:0,stuck:true},bricks:[],time:0,shake:0,
  brickW:0,brickH:0,ox:0,oy:0};
function initLevel(n){
  G.level=n;G.time=0;G.shake=0;G.bricks=[];
  const lay=LEVELS[n-1];
  const rows=lay.length,cols=lay[0].length;
  G.brickW=W*0.94/cols;G.brickH=Math.min(34,H*0.05);
  G.ox=(W-G.brickW*cols)/2;G.oy=H*0.14;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const ch=lay[r][c];
    if(ch==='#'||ch==='2'||ch==='s')
      G.bricks.push({r,c,hp:ch==='2'?2:1,star:ch==='s',t:Math.random()*6});
  }
  G.px=W/2;
  G.ball.stuck=true;
  G.ball.x=W/2;G.ball.y=H*0.82-24;
  document.getElementById('level').textContent=`LV ${n}/5`;
  updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,G.lives))||'💔';
}
const PW=()=>Math.min(130,W*0.24);
const PY=()=>H*0.82;
// paddle control
let dragX=null;
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  dragX=e.clientX;canvas.setPointerCapture(e.pointerId);
  if(G.ball.stuck){launchBall();}
});
canvas.addEventListener('pointermove',e=>{
  if(dragX===null||G.state!=='play')return;
  G.px+=(e.clientX-dragX)*1.8;dragX=e.clientX;
  G.px=Math.max(PW()/2,Math.min(W-PW()/2,G.px));
});
canvas.addEventListener('pointerup',()=>dragX=null);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&G.state==='play'&&G.ball.stuck)launchBall();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function launchBall(){
  if(!G.ball.stuck)return;
  G.ball.stuck=false;
  const a=-Math.PI/2+(Math.random()-0.5)*0.6;
  const sp=520;
  G.ball.vx=Math.cos(a)*sp;G.ball.vy=Math.sin(a)*sp;
  G.ball.x=G.px;G.ball.y=PY()-20;
}
const particles=[],floaters=[];
for(let i=0;i<100;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*200;p.vy=Math.sin(a)*200;
    p.life=0.4;p.max=0.4;p.color=color;p.size=3;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  if(keys['arrowleft']||keys['a'])G.px=Math.max(PW()/2,G.px-520*dt);
  if(keys['arrowright']||keys['d'])G.px=Math.min(W-PW()/2,G.px+520*dt);
  const b=G.ball;
  if(b.stuck){b.x=G.px;updateParts(dt);return;}
  // speed cap
  const sp=Math.hypot(b.vx,b.vy),maxSp=760;
  if(sp>maxSp){b.vx*=maxSp/sp;b.vy*=maxSp/sp;}
  // min vertical to avoid flat loops
  if(Math.abs(b.vy)<120){b.vy+=b.vy>=0?60*dt:-60*dt;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  const R=12;
  // walls
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);sfx.bounce();}
  if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);sfx.bounce();}
  if(b.y<R){b.y=R;b.vy=Math.abs(b.vy);sfx.bounce();}
  // paddle
  const pw=PW(),py=PY();
  if(b.vy>0&&b.y+R>py-10&&b.y-R<py+10&&Math.abs(b.x-G.px)<pw/2+R){
    b.y=py-10-R;
    const rel=(b.x-G.px)/(pw/2);
    const ang=rel*1.05; // angle from vertical
    const spd=Math.min(720,Math.hypot(b.vx,b.vy)*1.03+14);
    b.vx=Math.sin(ang)*spd;b.vy=-Math.cos(ang)*spd;
    sfx.bounce();
  }
  // bricks
  for(let i=G.bricks.length-1;i>=0;i--){
    const br=G.bricks[i];
    const bx=G.ox+br.c*G.brickW,by=G.oy+br.r*G.brickH;
    if(b.x+R>bx&&b.x-R<bx+G.brickW&&b.y+R>by&&b.y-R<by+G.brickH){
      // side of hit
      const ox=(G.brickW/2+R)-Math.abs(b.x-(bx+G.brickW/2));
      const oy=(G.brickH/2+R)-Math.abs(b.y-(by+G.brickH/2));
      if(ox<oy)b.vx*=-1;else b.vy*=-1;
      br.hp--;sfx.brick();G.shake=0.15;
      burst(b.x,b.y,br.star?'#ffd23f':'#ff8a3a',6);
      if(br.hp<=0){
        G.bricks.splice(i,1);
        const pts=br.star?50:10;
        G.score+=pts;
        if(br.star){sfx.star();spawnText(bx+G.brickW/2,by,'+'+pts,'#ffd23f');}
        updateHUD();
      }
      break;
    }
  }
  // fell
  if(b.y>H+30){
    G.lives--;updateHUD();sfx.lose();G.shake=0.4;
    if(G.lives<=0){
      setTimeout(()=>gameOver(false),400);
      G.state='dying';
    }else{
      b.stuck=true;b.x=G.px;b.y=py-24;
    }
    return;
  }
  // win level
  if(G.bricks.length===0){
    G.score+=100*G.level;updateHUD();sfx.win();
    setTimeout(()=>levelDone(),500);
    G.state='clear';
    return;
  }
  updateParts(dt);
}
function updateParts(dt){
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
}
function levelDone(){
  if(G.level>=5){
    showOverlay('🏆 BOUNCE MASTER!',
      `<p style="font-size:24px;font-weight:900">Final Score: ${G.score}</p><p>All 5 levels smashed!</p>`,
      '🔥 Fire Safety: You\'re a champion!',
      '↻ PLAY AGAIN',()=>{G.score=0;G.lives=3;initLevel(1);G.state='play';});
  }else{
    showOverlay(`⭐ LEVEL ${G.level} CLEAR!`,
      `<p>Score: ${G.score}</p><p>Lives: ${'❤️'.repeat(G.lives)}</p>`,
      '🔥 Fire Safety: Bounce back!',
      '▶ NEXT LEVEL',()=>{initLevel(G.level+1);G.state='play';});
  }
}
function gameOver(won){
  G.state='over';
  setTimeout(()=>{
    showOverlay('💥 OUT OF LIVES',
      `<p>Score: ${G.score}</p>`,
      '🔥 Fire Safety: Keep practicing!',
      '↻ TRY AGAIN',()=>{G.score=0;G.lives=3;initLevel(G.level);G.state='play';});
  },400);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='🔥 PICK LEVEL';
  let h='';
  for(let i=1;i<=5;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Smash every brick to win!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();G.score=0;G.lives=3;initLevel(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;
  obtn.textContent=btn;obtn.style.display='';
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0a1a');bg.addColorStop(1,'#1a0f14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  // bricks
  for(const br of G.bricks){
    const bx=G.ox+br.c*G.brickW,by=G.oy+br.r*G.brickH;
    const g=ctx.createLinearGradient(0,by,0,by+G.brickH);
    if(br.star){g.addColorStop(0,'#ffd76a');g.addColorStop(1,'#a3701a');}
    else if(br.hp>1){g.addColorStop(0,'#b0b0c8');g.addColorStop(1,'#5a5a72');}
    else{g.addColorStop(0,'#ff8a3a');g.addColorStop(1,'#a33c10');}
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(bx+2,by+2,G.brickW-4,G.brickH-4,6);ctx.fill();
    if(br.star){
      ctx.fillStyle='#2a1206';ctx.font=`900 ${G.brickH*0.55}px system-ui`;ctx.textAlign='center';
      ctx.fillText('⭐',bx+G.brickW/2,by+G.brickH*0.78);ctx.textAlign='left';
    }else if(br.hp>1){
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=`900 ${G.brickH*0.5}px system-ui`;ctx.textAlign='center';
      ctx.fillText('2',bx+G.brickW/2,by+G.brickH*0.75);ctx.textAlign='left';
    }
  }
  // paddle
  const pw=PW(),py=PY();
  const pg=ctx.createLinearGradient(0,py-10,0,py+10);
  pg.addColorStop(0,'#ffd76a');pg.addColorStop(1,'#a35a10');
  ctx.fillStyle=pg;
  ctx.beginPath();ctx.roundRect(G.px-pw/2,py-10,pw,20,10);ctx.fill();
  // ball
  if(G.state==='play'||G.state==='clear'){
    const b=G.ball;
    const g=ctx.createRadialGradient(b.x-4,b.y-4,2,b.x,b.y,13);
    g.addColorStop(0,'#fff2c8');g.addColorStop(0.5,'#ff8a3a');g.addColorStop(1,'#a32a10');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,12,0,Math.PI*2);ctx.fill();
    ctx.shadowColor='#ff8a3a';ctx.shadowBlur=14;
    ctx.fill();ctx.shadowBlur=0;
    // trail
    ctx.fillStyle='rgba(255,138,58,0.35)';
    ctx.beginPath();ctx.arc(b.x-b.vx*0.02,b.y-b.vy*0.02,8,0,Math.PI*2);ctx.fill();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.ball.stuck&&G.time<3){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 17px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP TO LAUNCH!',W/2,H*0.6);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
