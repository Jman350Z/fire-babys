<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blaze's Thermal Run — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#120604;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:24px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#ff8a3d;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:34px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">BUMPED 0/5</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>💥 BLAZE'S THERMAL RUN</h1>
<p>Top-down bumper arena! Ram into rival fire babies to knock them out of the ring. Drag or use arrow keys to move. Last one in wins!</p>
<div class="lesson">🔥 Fire Safety: Pushing and shoving is never safe play — in games AND in real life, keep your hands to yourself!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H,CX,CY,AR;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;CX=W/2;CY=H/2;AR=Math.min(W,H)*0.36;}addEventListener('resize',rs);rs();
const a=4+Math.floor(Math.random()*5),b=3+Math.floor(Math.random()*6);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else alert('Try again!');}
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let running=false,player,rivals=[],parts=[],shake=0,bumped=0,combo=0,comboT=0,roundT=0;
const COLORS=[['#ff9a1f','#e63900'],['#ff8a7a','#c41e12'],['#ffe27a','#ff9a1f'],['#7ae2ff','#1e7ac4'],['#b48aff','#6a3ec4']];
function mk(x,y,ci,ai){return{x,y,vx:0,vy:0,r:26,ci,ai,dead:false,spd:ai?140:0,ang:Math.random()*6.28};}
function startGame(){
  running=true;bumped=0;combo=0;shake=0;parts=[];roundT=60;
  player=mk(CX,CY,0,false);
  rivals=[];
  for(let i=0;i<5;i++){const an=i/5*6.28;rivals.push(mk(CX+Math.cos(an)*AR*0.6,CY+Math.sin(an)*AR*0.6,(i%4)+1,true));}
  overlay.classList.add('hidden');upd();
}
function upd(){scoreEl.textContent='BUMPED '+bumped+'/5 · ⏱️ '+Math.ceil(roundT)+'s';}
function burst(x,y,c,n){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s,life:1,c,sz:3+Math.random()*5});}}
function endRound(win){
  running=false;
  overlay.querySelector('h1').textContent=win?'🏆 ARENA CHAMPION!':'⏱️ TIME UP!';
  overlay.querySelector('p').textContent='You bumped '+bumped+' rivals out!';
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ PLAY AGAIN';
  overlay.classList.remove('hidden');
}
let keys={},drag=null;
function update(dt){
  if(!running)return;
  roundT-=dt;if(roundT<=0){endRound(bumped>=5);return;}
  // player input
  let ax=0,ay=0;
  if(keys.ArrowLeft||keys.a)ax-=1;if(keys.ArrowRight||keys.d)ax+=1;
  if(keys.ArrowUp||keys.w)ay-=1;if(keys.ArrowDown||keys.s)ay+=1;
  if(drag){const dx=drag.x-player.x,dy=drag.y-player.y,d=Math.hypot(dx,dy);if(d>10){ax=dx/d;ay=dy/d;}}
  const sp=340;
  player.vx+=(ax*sp-player.vx)*Math.min(1,dt*8);
  player.vy+=(ay*sp-player.vy)*Math.min(1,dt*8);
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  // rivals AI: wander + flee center slightly + chase player weakly
  rivals.forEach(r=>{
    if(r.dead)return;
    r.ang+=(Math.random()-0.5)*dt*4;
    const dx=player.x-r.x,dy=player.y-r.y,d=Math.hypot(dx,dy)||1;
    const chase=d<AR*1.2?0.4:-0.3;
    r.vx+=((Math.cos(r.ang)*r.spd+dx/d*chase*200)-r.vx)*Math.min(1,dt*3);
    r.vy+=((Math.sin(r.ang)*r.spd+dy/d*chase*200)-r.vy)*Math.min(1,dt*3);
    r.x+=r.vx*dt;r.y+=r.vy*dt;
  });
  // collisions player<->rival: elastic bump
  const all=[player,...rivals.filter(r=>!r.dead)];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const A=all[i],B=all[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),min=A.r+B.r;
    if(d<min&&d>0){
      const nx=dx/d,ny=dy/d,ov=(min-d)/2;
      A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
      const rel=(A.vx-B.vx)*nx+(A.vy-B.vy)*ny;
      if(rel>60){
        const imp=rel*0.9;
        A.vx-=nx*imp*0.5;A.vy-=ny*imp*0.5;B.vx+=nx*imp*0.5;B.vy+=ny*imp*0.5;
        shake=Math.max(shake,10);burst((A.x+B.x)/2,(A.y+B.y)/2,'#ffd23f',14);
        beep(200+imp*0.3,0.2,'square');
        if((A===player||B===player)){combo++;comboT=2;comboEl.textContent=combo>1?'💥 BUMP COMBO x'+combo:'';}
      }
    }
  }
  // out of arena?
  rivals.forEach(r=>{
    if(r.dead)return;
    const d=Math.hypot(r.x-CX,r.y-CY);
    if(d>AR+r.r){r.dead=true;bumped++;burst(r.x,r.y,COLORS[r.ci][0],24);shake=Math.max(shake,16);beep(500,0.3,'sawtooth');upd();
      if(bumped>=5){endRound(true);return;}}
  });
  const pd=Math.hypot(player.x-CX,player.y-CY);
  if(pd>AR+80){endRound(false);return;}
  // lava pull: gentle pull toward edge when near rim
  if(pd>AR*0.8){const f=(pd-AR*0.8)*2;player.vx+=(player.x-CX)/pd*f*dt*60;player.vy+=(player.y-CY)/pd*f*dt*60;}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;comboEl.textContent='';}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life-=dt*1.5;});
  parts=parts.filter(p=>p.life>0);
  shake*=0.88;upd();
}
function drawBaby(e){
  ctx.save();ctx.translate(e.x,e.y);
  const c=COLORS[e.ci];
  const g=ctx.createRadialGradient(-6,-8,4,0,0,e.r);
  g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,e.r,0,6.29);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-3,5,0,6.29);ctx.arc(8,-3,5,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-8,-2,2.5,0,6.29);ctx.arc(8,-2,2.5,0,6.29);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,6,7,0.3,2.8);ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#120604';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // arena
  const g=ctx.createRadialGradient(CX,CY,AR*0.2,CX,CY,AR);
  g.addColorStop(0,'#3a1c0e');g.addColorStop(0.85,'#5a2a12');g.addColorStop(1,'#ff6a00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,AR,0,6.29);ctx.fill();
  ctx.strokeStyle='#ff6a00';ctx.lineWidth=6;ctx.setLineDash([14,10]);
  ctx.beginPath();ctx.arc(CX,CY,AR,0,6.29);ctx.stroke();ctx.setLineDash([]);
  // lava outside
  ctx.fillStyle='rgba(255,80,0,0.25)';
  ctx.fillRect(0,0,W,CY-AR-40);ctx.fillRect(0,CY+AR+40,W,H);
  rivals.forEach(r=>{if(!r.dead)drawBaby(r);});
  drawBaby(player);
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;});
addEventListener('keyup',e=>{keys[e.key]=false;});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};});
addEventListener('pointermove',e=>{if(drag){const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};}});
addEventListener('pointerup',()=>{drag=null;});
</script>
</body>
</html>
