<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inferno Drop — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0803;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#ff8a3d;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:38px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">SCORE 0</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🔥 INFERNO DROP</h1>
<p>Tap to drop heavy blocks from the sky! Crush the crystal targets below. Chain drops for COMBO points!</p>
<div class="lesson">🔥 Fire Safety: Heavy things fall fast — never stand under anything that could drop on you!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
// math gate
const a=2+Math.floor(Math.random()*7),b=2+Math.floor(Math.random()*7);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else{alert('Try again!');}}
// audio
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,type){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.2,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
// state
let running=false,blocks=[],targets=[],particles=[],shake=0,score=0,combo=0,comboT=0,dropX=0,dropDir=1,level=1;
function buildTargets(){
  targets=[];const n=3+level;
  for(let i=0;i<n;i++){
    targets.push({x:W*(0.15+0.7*i/n),y:H*0.72+Math.random()*H*0.1,w:46,h:46,dead:false,wob:Math.random()*6});
  }
}
function startGame(){running=true;blocks=[];particles=[];score=0;combo=0;level=1;shake=0;buildTargets();overlay.classList.add('hidden');upd();}
function upd(){scoreEl.textContent='SCORE '+score;}
function drop(){
  if(!running)return;
  blocks.push({x:dropX,y:-30,vy:0,w:54,h:54,rot:0,vr:(Math.random()-0.5)*0.1});
  beep(300,0.15,'square');
}
function boom(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,color,sz:3+Math.random()*6});}}
function gameOver(win){
  running=false;
  overlay.querySelector('h1').textContent=win?'🏆 ALL TARGETS CRUSHED!':'💥 OUT OF DROPS!';
  overlay.querySelector('p').textContent='Score: '+score;
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ PLAY AGAIN';
  overlay.classList.remove('hidden');
}
let drops=8;
function update(dt){
  if(!running)return;
  dropX+=dropDir*dt*W*0.4;if(dropX>W*0.9)dropDir=-1;if(dropX<W*0.1)dropDir=1;
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;comboEl.textContent='';}
  blocks.forEach(bl=>{bl.vy+=dt*1400;bl.y+=bl.vy*dt;bl.rot+=bl.vr;
    targets.forEach(t=>{
      if(!t.dead&&Math.abs(bl.x-t.x)<(bl.w+t.w)/2&&Math.abs(bl.y-t.y)<(bl.h+t.h)/2){
        t.dead=true;bl.dead=true;
        combo++;comboT=2;
        const pts=100*combo;score+=pts;
        comboEl.textContent=combo>1?'🔥 COMBO x'+combo+' +'+pts:'+'+pts;
        boom(t.x,t.y,'#6ff',22);boom(t.x,t.y,'#ffb300',14);
        shake=Math.max(shake,14);beep(150+combo*60,0.3,'sawtooth');upd();
      }
    });
    if(bl.y>H+60)bl.dead=true;
  });
  blocks=blocks.filter(b=>!b.dead);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;p.life-=dt*1.4;});
  particles=particles.filter(p=>p.life>0);
  shake*=0.88;
  const alive=targets.filter(t=>!t.dead).length;
  if(alive===0){level++;if(level>3){gameOver(true);}else{drops=8;buildTargets();}}
}
function drawBlaze(x,y,r){
  const g=ctx.createRadialGradient(x-6,y-8,4,x,y,r);
  g.addColorStop(0,'#ffe27a');g.addColorStop(0.5,'#ff9a1f');g.addColorStop(1,'#e63900');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.29);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-8,y-4,5,0,6.29);ctx.arc(x+8,y-4,5,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(x-8,y-3,2.5,0,6.29);ctx.arc(x+8,y-3,2.5,0,6.29);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+6,8,0.3,2.8);ctx.stroke();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a0c04');g.addColorStop(1,'#0d0505');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // dropper
  ctx.fillStyle='#444';ctx.fillRect(dropX-60,0,120,26);
  ctx.strokeStyle='#ff6a00';ctx.lineWidth=4;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(dropX,26);ctx.lineTo(dropX,H*0.7);ctx.stroke();ctx.setLineDash([]);
  // ground
  ctx.fillStyle='#3a1a0c';ctx.fillRect(0,H*0.78,W,H*0.22);
  ctx.fillStyle='#ff6a00';ctx.fillRect(0,H*0.78,W,5);
  // targets
  targets.forEach(t=>{if(t.dead)return;
    ctx.save();ctx.translate(t.x,t.y+Math.sin(Date.now()/300+t.wob)*3);
    ctx.fillStyle='#4de';ctx.shadowColor='#7ff';ctx.shadowBlur=16;
    ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h);ctx.shadowBlur=0;
    ctx.strokeStyle='#0a3a44';ctx.lineWidth=3;ctx.strokeRect(-t.w/2,-t.h/2,t.w,t.h);
    ctx.restore();});
  // blocks
  blocks.forEach(bl=>{ctx.save();ctx.translate(bl.x,bl.y);ctx.rotate(bl.rot);
    ctx.fillStyle='#6a6a6a';ctx.fillRect(-bl.w/2,-bl.h/2,bl.w,bl.h);
    ctx.fillStyle='#ff6a00';ctx.fillRect(-bl.w/2,-bl.h/2,bl.w,8);
    ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.strokeRect(-bl.w/2,-bl.h/2,bl.w,bl.h);ctx.restore();});
  // particles
  particles.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  // Blaze mascot
  drawBlaze(50,H-70,28);
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{if(running)drop();});
addEventListener('keydown',e=>{if(e.key===' '&&running)drop();});
</script>
</body>
</html>
