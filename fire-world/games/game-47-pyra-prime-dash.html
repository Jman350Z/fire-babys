<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pyra Prime Dash — by Jman350Z & fire team</title>
<meta name="description" content="Dash through the gates! Speed and precision. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="gates">🚪 0/20</div>
<div class="pill" id="best">🏆 0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">💨 PYRA PRIME DASH</h1>
<div id="obody"><p>Thread every gate!</p><p><b>DRAG</b> left/right (or <b>◀ ▶</b>) to steer! Fly through the glowing gates — miss one and you lose a life. 3 lives, 20 gates. Golden gates are worth 3x!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Dash to safety — know your exits!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  gate(){tone(700,1100,0.1,'triangle',0.11);},
  golden(){tone(1000,1800,0.16,'sine',0.13);},
  miss(){tone(350,150,0.2,'sawtooth',0.13);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,lives:3,gates:0,
  px:0,gatesList:[],speed:420,time:0,shake:0,dead:false,streak:0};
try{G.best=parseInt(localStorage.getItem('gatedash_best')||'0',10)||0;}catch(e){}
const TOTAL=20,PY=()=>H*0.72;
function reset(){
  G.score=0;G.lives=3;G.gates=0;G.streak=0;
  G.px=W/2;G.gatesList=[];G.speed=420;G.time=0;G.shake=0;G.dead=false;
  for(let i=0;i<6;i++)spawnGate(-i*340);
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function spawnGate(y){
  const w=Math.max(110,190-G.gates*4);
  const x=w/2+Math.random()*(W-w);
  const golden=Math.random()<0.18;
  G.gatesList.push({x,y,w,golden,passed:false,t:Math.random()*6});
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('gates').textContent=`🚪 ${G.gates}/${TOTAL}`;
}
// steering
let dragX=null;
canvas.addEventListener('pointerdown',e=>{dragX=e.clientX;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(dragX===null||G.state!=='play')return;
  G.px+=(e.clientX-dragX)*1.6;dragX=e.clientX;
  G.px=Math.max(24,Math.min(W-24,G.px));
});
canvas.addEventListener('pointerup',()=>dragX=null);
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const particles=[],floaters=[];
for(let i=0;i<80;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  G.speed=Math.min(800,420+G.gates*16);
  if(keys['arrowleft']||keys['a'])G.px=Math.max(24,G.px-460*dt);
  if(keys['arrowright']||keys['d'])G.px=Math.min(W-24,G.px+460*dt);
  const py=PY();
  for(const g of G.gatesList){
    g.y+=G.speed*dt;g.t+=dt*4;
    if(g.passed||g.y<-80)continue;
    // check pass
    if(g.y>py-20&&g.y<py+20){
      g.passed=true;
      if(G.px>g.x-g.w/2&&G.px<g.x+g.w/2){
        // hit!
        G.gates++;
        const pts=(g.golden?30:10)*(1+Math.floor(G.streak/5));
        G.score+=pts;G.streak++;
        if(g.golden)sfx.golden();else sfx.gate();
        spawnText(g.x,py-60,'+'+pts,g.golden?'#ffd23f':'#fff');
        for(let i=0;i<8;i++){const p=particles.find(p=>!p.a);if(!p)break;
          p.a=true;p.x=g.x+(Math.random()-0.5)*g.w;p.y=g.y;
          p.vx=(Math.random()-0.5)*160;p.vy=(Math.random()-0.5)*160;
          p.life=0.4;p.max=0.4;p.color=g.golden?'#ffd23f':'#7fd4ff';p.size=3;}
        updateHUD();
        if(G.gates>=TOTAL){victory();return;}
      }else{
        // miss
        G.lives--;G.streak=0;sfx.miss();G.shake=0.35;
        spawnText(G.px,py-60,'MISS!','#ff4a5a');
        updateHUD();
        if(G.lives<=0){defeat();return;}
      }
    }
  }
  G.gatesList=G.gatesList.filter(g=>g.y<H+120);
  while(G.gatesList.length<6){
    const topY=Math.min(...G.gatesList.map(g=>g.y));
    spawnGate(topY-340);
  }
  // speed trail
  if(Math.random()<0.5){
    const p=particles.find(p=>!p.a);
    if(p){p.a=true;p.x=G.px+(Math.random()-0.5)*20;p.y=py+20;
      p.vx=0;p.vy=200;p.life=0.3;p.max=0.3;p.color='#ff8a3a';p.size=3;}
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
}
function victory(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('gatedash_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('🏆 ALL GATES CLEARED!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Lives left: ${G.lives}</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: You\'re a champion!',
      '↻ DASH AGAIN',()=>{reset();G.state='play';});
  },600);
}
function defeat(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('gatedash_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('💥 OUT OF LIVES',
      `<p>Gates cleared: ${G.gates}/${TOTAL}</p><p>Score: ${G.score}</p>`,
      '🔥 Fire Safety: Keep practicing!',
      '↻ TRY AGAIN',()=>{reset();G.state='play';});
  },600);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0a1a');bg.addColorStop(1,'#1a0f24');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  // speed lines
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const lx=(i*173)%W,ly=(i*271+G.time*G.speed*1.5)%H;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40);ctx.stroke();
  }
  const py=PY();
  // gates
  for(const g of G.gatesList){
    if(g.y<-80||g.y>H+80)continue;
    const pulse=1+Math.sin(g.t)*0.05;
    ctx.save();ctx.translate(g.x,g.y);ctx.scale(pulse,1);
    const col=g.golden?'#ffd23f':'#7fd4ff';
    ctx.strokeStyle=g.passed?'rgba(255,255,255,0.2)':col;
    ctx.lineWidth=8;ctx.lineCap='round';
    const hw=g.w/2,gh=64;
    // left post
    ctx.beginPath();ctx.moveTo(-hw,-gh/2);ctx.lineTo(-hw,gh/2);ctx.stroke();
    // right post
    ctx.beginPath();ctx.moveTo(hw,-gh/2);ctx.lineTo(hw,gh/2);ctx.stroke();
    // top bar
    ctx.beginPath();ctx.moveTo(-hw,-gh/2);ctx.lineTo(hw,-gh/2);ctx.stroke();
    // glow
    if(!g.passed){
      ctx.fillStyle=g.golden?'rgba(255,210,63,0.12)':'rgba(127,212,255,0.1)';
      ctx.fillRect(-hw,-gh/2,g.w,gh);
    }
    ctx.restore();
    if(g.golden&&!g.passed){
      ctx.fillStyle='#ffd23f';ctx.font='900 14px system-ui';ctx.textAlign='center';
      ctx.fillText('3x',g.x,g.y-gh/2-10);ctx.textAlign='left';
    }
  }
  // player
  if(G.state!=='over'){
    const lean=Math.sin(G.time*8)*0.06;
    ctx.save();ctx.translate(G.px,py);ctx.rotate(lean);
    // dash trail
    const tg=ctx.createLinearGradient(0,0,0,60);
    tg.addColorStop(0,'rgba(255,138,58,0.6)');tg.addColorStop(1,'rgba(255,138,58,0)');
    ctx.fillStyle=tg;
    ctx.beginPath();ctx.ellipse(0,30,14,26,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(-7,-7,3,0,0,20);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(-6,-3,3.5,0,Math.PI*2);ctx.arc(6,-3,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // lives
  ctx.font='20px system-ui';ctx.textAlign='left';
  let lx=16;
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i<G.lives?1:0.25;
    ctx.fillText('❤️',lx,H-24);lx+=28;
  }
  ctx.globalAlpha=1;
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
