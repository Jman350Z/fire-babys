<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pyra Prime Dash — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0e0a16;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,18,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#ff9a3d;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #ff9a3d;padding:6px;background:#1c1028;color:#fff}
#gate button,#startBtn{background:#b45a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">0m · ⭐0</div>
<canvas id="c"></canvas>
<div id="ov">
<h1>🔥 PYRA PRIME DASH</h1>
<p>Endless dodge & collect! Steer Pyra with touch or arrows — dodge smoke clouds, grab stars. Speed keeps rising!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Smoke is dangerous — if you see smoke, get LOW under it and get OUT!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=2+Math.floor(Math.random()*6),n2=3+Math.floor(Math.random()*5);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',px=0,py=0,foes=[],stars=[],parts=[],dist=0,starN=0,speed=0,time=0,shake=0,inv=0;
function start(){state='play';px=W/2;py=H*.7;foes=[];stars=[];parts=[];dist=0;starN=0;speed=360;time=0;inv=0;ov.classList.add('hidden');}
function end(){state='over';ov.innerHTML=`<h1>💨 SMOKED OUT!</h1><p>Distance: <b>${Math.floor(dist)}m</b> · Stars: <b>${starN}</b></p><div class="lesson">🔥 Fire Safety: Smoke is dangerous — if you see smoke, get LOW under it and get OUT!</div><button onclick="location.reload()" style="background:#b45a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*7,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c});}}
function update(dt){
  if(state!=='play')return;time+=dt;dist+=speed*dt/45;speed=Math.min(850,360+time*12);shake*=.9;inv-=dt;
  hud.textContent=Math.floor(dist)+'m · ⭐'+starN;
  if(Math.random()<dt*(1.4+time*.02))foes.push({x:Math.random()*W,y:-40,r:20+Math.random()*16,vy:speed*(.5+Math.random()*.3)});
  if(Math.random()<dt*1.4)stars.push({x:Math.random()*W,y:-30,r:13,vy:speed*.55});
  foes.forEach(f=>f.y+=f.vy*dt);stars.forEach(s=>s.y+=s.vy*dt);
  foes=foes.filter(f=>f.y<H+50);stars=stars.filter(s=>s.y<H+40);
  if(inv<=0)foes.forEach(f=>{if(Math.hypot(f.x-px,f.y-py)<f.r+20){shake=16;boom(px,py,'#888',24);beep(110,.4,'sawtooth');end();}});
  stars.forEach((s,i)=>{if(Math.hypot(s.x-px,s.y-py)<s.r+22){stars.splice(i,1);starN++;dist+=15;boom(s.x,s.y,'#ffd23f',10);beep(750,.1,'sine');}});
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e0a16');g.addColorStop(1,'#1e1430');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  // speed lines
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;
  const off=(time*speed)%100;
  for(let y=-100+off;y<H+100;y+=100){ctx.beginPath();ctx.moveTo(W*.1,y);ctx.lineTo(W*.1,y+40);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.9,y+50);ctx.lineTo(W*.9,y+90);ctx.stroke();}
  foes.forEach(f=>{ctx.fillStyle='rgba(90,90,90,.92)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();ctx.fillStyle='rgba(60,60,60,.9)';ctx.beginPath();ctx.arc(f.x-8,f.y-6,f.r*.5,0,7);ctx.fill();});
  stars.forEach(s=>{ctx.fillStyle='#ffd23f';ctx.shadowColor='#ffb300';ctx.shadowBlur=14;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(time*3);ctx.fillRect(-s.r*.6,-s.r*.6,s.r*1.2,s.r*1.2);ctx.restore();ctx.shadowBlur=0;});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  if(state==='play'){ctx.save();ctx.translate(px+Math.sin(time*7)*4,py);const bg=ctx.createRadialGradient(-9,-9,4,0,0,28);bg.addColorStop(0,'#ffd23f');bg.addColorStop(.6,'#ff8a00');bg.addColorStop(1,'#e63900');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-3,6,0,7);ctx.arc(8,-3,6,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-8,-2,3,0,7);ctx.arc(8,-2,3,0,7);ctx.fill();ctx.strokeStyle='#5a2000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,8,8,.3,Math.PI-.3);ctx.stroke();ctx.restore();}
}
let keys={l:0,r:0,u:0,d:0},last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(state==='play'){const sp=520*dt;if(keys.l)px-=sp;if(keys.r)px+=sp;if(keys.u)py-=sp;if(keys.d)py+=sp;px=Math.max(26,Math.min(W-26,px));py=Math.max(H*.25,Math.min(H-40,py));}
  update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key==='ArrowUp')keys.u=1;if(e.key==='ArrowDown')keys.d=1;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0;if(e.key==='ArrowUp')keys.u=0;if(e.key==='ArrowDown')keys.d=0;});
let td=null;cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();td={x:e.clientX-r.left,y:e.clientY-r.top};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!td)return;const r=cv.getBoundingClientRect();px+=(e.clientX-r.left-td.x)*1.4;py+=(e.clientY-r.top-td.y)*1.4;td={x:e.clientX-r.left,y:e.clientY-r.top};px=Math.max(26,Math.min(W-26,px));py=Math.max(H*.25,Math.min(H-40,py));});
cv.addEventListener('pointerup',()=>td=null);
</script>
</body>
</html>
