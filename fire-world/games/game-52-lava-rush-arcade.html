<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lava Rush Arcade — by Jman350Z & fire team</title>
<meta name="description" content="Dodge the lava! Endless rush. A Fire Babys arcade game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="dist">🏃 0m</div>
<div class="pill" id="best">🏆 0m</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🌋 LAVA RUSH ARCADE</h1>
<div id="obody"><p>Outrun the lava!</p><p><b>TAP / SPACE</b> to jump! <b>SWIPE DOWN</b> to slide! Dodge lava geysers and rock walls. Grab ⭐ for points. How far can you rush?</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Run from danger — never toward it!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  jump(){tone(400,700,0.1,'square',0.09);},
  slide(){tone(500,250,0.12,'sine',0.08);},
  star(){tone(900,1400,0.1,'sine',0.1);},
  die(){tone(350,80,0.45,'sawtooth',0.15);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,dist:0,
  py:0,vy:0,jumping:false,sliding:false,slideT:0,
  obstacles:[],stars:[],speed:420,spawnT:0.8,time:0,shake:0,dead:false,gy:0};
try{G.best=parseInt(localStorage.getItem('lavarush_best')||'0',10)||0;}catch(e){}
const GY=()=>H*0.78;
function reset(){
  G.score=0;G.dist=0;G.py=GY();G.vy=0;G.jumping=false;
  G.sliding=false;G.slideT=0;G.obstacles=[];G.stars=[];
  G.speed=420;G.spawnT=1;G.time=0;G.shake=0;G.dead=false;G.gy=GY();
  updateHUD();
  document.getElementById('best').textContent='🏆 '+Math.floor(G.best)+'m';
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('dist').textContent='🏃 '+Math.floor(G.dist)+'m';
}
function spawnObstacle(){
  const r=Math.random();
  const y=GY();
  if(r<0.35)G.obstacles.push({type:'geyser',x:W+40,y,t:0,warn:0.9,w:56,h:120});
  else if(r<0.6)G.obstacles.push({type:'rock',x:W+40,y:y-50,w:50,h:50});
  else if(r<0.8)G.obstacles.push({type:'lowbar',x:W+40,y:y-96,w:44,h:44});
  else G.stars.push({x:W+40,y:y-60-Math.random()*120,t:Math.random()*6,taken:false});
}
function doJump(){
  if(G.state!=='play'||G.dead||G.jumping)return;
  G.jumping=true;G.vy=-780;sfx.jump();
}
function doSlide(){
  if(G.state!=='play'||G.dead||G.jumping)return;
  G.sliding=true;G.slideT=0.55;sfx.slide();
}
canvas.addEventListener('pointerdown',e=>{G._sy=e.clientY;G._st=performance.now();});
canvas.addEventListener('pointerup',e=>{
  if(G.state!=='play')return;
  const dy=e.clientY-G._sy,dt=performance.now()-G._st;
  if(dy>50&&dt<400)doSlide();else doJump();
});
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'){doJump();e.preventDefault();}
  if(e.key==='ArrowDown')doSlide();
});
const particles=[],floaters=[];
for(let i=0;i<80;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function die(){
  if(G.dead)return;
  G.dead=true;sfx.die();G.shake=0.5;
  const d=Math.floor(G.dist);
  const isBest=d>G.best;
  if(isBest){G.best=d;try{localStorage.setItem('lavarush_best',String(d));}catch(e){}}
  for(let i=0;i<16;i++){const p=particles.find(p=>!p.a);if(!p)break;
    p.a=true;p.x=W*0.3;p.y=G.py;const a=Math.random()*Math.PI*2;
    p.vx=Math.cos(a)*250;p.vy=Math.sin(a)*250;
    p.life=0.6;p.max=0.6;p.color='#ff6a00';p.size=4;}
  setTimeout(()=>{
    showOverlay('🔥 CAUGHT BY LAVA!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">${d}m</p><p>Score: ${G.score}</p><p>Best: ${G.best}m</p>`,
      '🔥 Fire Safety: Run from danger!',
      '↻ RUN AGAIN',()=>{reset();G.state='play';});
  },700);
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  G.speed=Math.min(800,420+G.dist*1.1);
  G.dist+=G.speed*dt/50;
  // physics
  if(G.jumping){
    G.vy+=2100*dt;G.py+=G.vy*dt;
    if(G.py>=GY()){G.py=GY();G.vy=0;G.jumping=false;}
  }
  if(G.sliding){G.slideT-=dt;if(G.slideT<=0)G.sliding=false;}
  G.spawnT-=dt*G.speed/420;
  if(G.spawnT<=0){spawnObstacle();G.spawnT=Math.max(0.42,0.95-G.dist*0.004)+Math.random()*0.35;}
  const px=W*0.3;
  const pTop=G.sliding?G.py-16:G.py-44,pBot=G.py;
  // obstacles
  for(let i=G.obstacles.length-1;i>=0;i--){
    const o=G.obstacles[i];
    o.x-=G.speed*dt;
    if(o.type==='geyser'){
      o.t+=dt;
      const erupting=o.t>o.warn;
      // hitbox when erupting
      if(erupting){
        const gTop=o.y-130;
        if(px+18>o.x-o.w/2&&px-18<o.x+o.w/2&&pBot>gTop&&pTop<o.y)die();
      }else{
        if(px+18>o.x-o.w/2&&px-18<o.x+o.w/2&&pBot>o.y-30)die();
      }
    }else if(o.type==='rock'){
      if(px+18>o.x-o.w/2&&px-18<o.x+o.w/2&&pBot>o.y-o.h/2&&pTop<o.y+o.h/2)die();
    }else{
      // lowbar: must slide under (or jump over? no—slide)
      if(px+18>o.x-o.w/2&&px-18<o.x+o.w/2&&pTop<o.y+o.h/2&&!G.sliding){
        // if jumping high enough, clear it
        if(pBot>o.y+o.h/2+10)die();
      }
    }
    if(o.x<-80)G.obstacles.splice(i,1);
  }
  if(G.dead)return;
  // stars
  for(let i=G.stars.length-1;i>=0;i--){
    const s=G.stars[i];
    s.x-=G.speed*dt;s.t+=dt*4;
    if(!s.taken&&Math.hypot(s.x-px,s.y-(G.py-24))<36){
      s.taken=true;sfx.star();G.score+=10;
      spawnText(s.x,s.y,'+10','#ffd23f');updateHUD();
    }
    if(s.x<-40||s.taken)G.stars.splice(i,1);
  }
  // run dust
  if(!G.jumping&&Math.random()<0.3){
    const p=particles.find(p=>!p.a);
    if(p){p.a=true;p.x=px-14;p.y=G.py-4;p.vx=-80-Math.random()*60;p.vy=-40;
      p.life=0.35;p.max=0.35;p.color='#8a7a6a';p.size=3;}
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  if(Math.random()<0.06)updateHUD();
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0a1a');bg.addColorStop(0.7,'#2a0f08');bg.addColorStop(1,'#1a0803');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*14,(Math.random()-0.5)*G.shake*14);
  const gy=GY();
  // distant volcanoes
  ctx.fillStyle='#140a08';
  for(let i=0;i<3;i++){
    const vx=((i*400-G.dist*30)%(W+300))-150;
    ctx.beginPath();ctx.moveTo(vx-90,gy);ctx.lineTo(vx,gy-160);ctx.lineTo(vx+90,gy);ctx.closePath();ctx.fill();
  }
  // lava ground
  const lg=ctx.createLinearGradient(0,gy,0,H);
  lg.addColorStop(0,'#ff6a00');lg.addColorStop(0.3,'#c23a00');lg.addColorStop(1,'#5a1000');
  ctx.fillStyle=lg;ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,221,68,0.7)';
  for(let i=0;i<20;i++){
    const bx=(i*173+G.time*80)%W;
    ctx.beginPath();ctx.arc(bx,gy+14+(i*37)%(H-gy-28),4+((i*7)%3),0,Math.PI*2);ctx.fill();
  }
  // safe path strip
  ctx.fillStyle='#2a1e16';
  ctx.fillRect(0,gy-6,W,12);
  // obstacles
  for(const o of G.obstacles){
    if(o.type==='geyser'){
      const erupting=o.t>o.warn;
      // vent
      ctx.fillStyle='#3a2a1a';
      ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,16,0,0,Math.PI*2);ctx.fill();
      if(!erupting){
        // warning bubbles
        const wt=o.warn-o.t;
        ctx.fillStyle=`rgba(255,210,63,${0.5+Math.sin(G.time*14)*0.4})`;
        ctx.font='26px system-ui';ctx.textAlign='center';
        ctx.fillText('❗',o.x,o.y-40);
        ctx.fillText(Math.ceil(wt*2)/2+'',o.x,o.y-8);
        ctx.textAlign='left';
      }else{
        // eruption
        const eg=ctx.createLinearGradient(0,o.y-130,0,o.y);
        eg.addColorStop(0,'rgba(255,210,63,0.95)');eg.addColorStop(0.5,'rgba(255,106,0,0.95)');eg.addColorStop(1,'rgba(200,40,0,0.9)');
        ctx.fillStyle=eg;
        const wob=Math.sin(o.t*24)*10;
        ctx.beginPath();
        ctx.moveTo(o.x-o.w/2,o.y);
        ctx.quadraticCurveTo(o.x-o.w/2+wob,o.y-65,o.x-8,o.y-130);
        ctx.quadraticCurveTo(o.x,o.y-145,o.x+8,o.y-130);
        ctx.quadraticCurveTo(o.x+o.w/2+wob,o.y-65,o.x+o.w/2,o.y);
        ctx.closePath();ctx.fill();
      }
    }else if(o.type==='rock'){
      ctx.fillStyle='#4a3a32';
      ctx.beginPath();
      ctx.moveTo(o.x-o.w/2,o.y+o.h/2);ctx.lineTo(o.x,o.y-o.h/2);ctx.lineTo(o.x+o.w/2,o.y+o.h/2);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#6a5a4a';
      ctx.beginPath();
      ctx.moveTo(o.x-12,o.y+o.h/2);ctx.lineTo(o.x,o.y-20);ctx.lineTo(o.x+6,o.y+o.h/2);
      ctx.closePath();ctx.fill();
    }else{
      // lowbar (overhead branch)
      ctx.fillStyle='#3a2a1a';
      ctx.fillRect(o.x-o.w/2,o.y-10,o.w,20);
      ctx.fillStyle='#5a4a3a';
      for(let b=0;b<4;b++)ctx.fillRect(o.x-o.w/2+6+b*10,o.y-14,4,28);
      ctx.font='20px system-ui';ctx.textAlign='center';
      ctx.fillText('⬇️ SLIDE',o.x,o.y-24);ctx.textAlign='left';
    }
  }
  // stars
  for(const s of G.stars){
    const bob=Math.sin(s.t)*5;
    ctx.save();ctx.translate(s.x,s.y+bob);
    ctx.scale(Math.abs(Math.cos(s.t*0.5))*0.4+0.6,1);
    const g=ctx.createRadialGradient(-4,-4,2,0,0,12);
    g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ffd23f');g.addColorStop(1,'#a37a00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // player
  if(!G.dead){
    const px=W*0.3,py=G.py;
    ctx.save();ctx.translate(px,py);
    if(G.sliding)ctx.scale(1.3,0.6);
    else if(G.jumping)ctx.rotate(-0.15);
    const lean=G.jumping?-0.1:Math.sin(G.time*14)*0.04;
    ctx.rotate(G.sliding?0:lean);
    const g=ctx.createRadialGradient(-7,-14,3,0,-22,20);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-22,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(-6,-26,3.2,0,Math.PI*2);ctx.arc(6,-26,3.2,0,Math.PI*2);ctx.fill();
    // run legs
    if(!G.jumping&&!G.sliding){
      ctx.strokeStyle='#a33c10';ctx.lineWidth=5;ctx.lineCap='round';
      const l1=Math.sin(G.time*18)*8,l2=-Math.sin(G.time*18)*8;
      ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(-6+l1,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(6,-6);ctx.lineTo(6+l2,0);ctx.stroke();
    }
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.dist<8){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 17px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP = JUMP • SWIPE DOWN = SLIDE',W/2,H*0.4);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+Math.floor(G.best)+'m';
requestAnimationFrame(loop);
</script>
</body>
</html>
