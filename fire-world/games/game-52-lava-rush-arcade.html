<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lava Rush Arcade — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#160a06;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(16,8,4,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#ff8a3d;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #ff8a3d;padding:6px;background:#2a1408;color:#fff}
#gate button,#startBtn{background:#d44a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">SCORE 0 · 💥 <span id="shots">5</span></div>
<canvas id="c"></canvas>
<div id="ov">
<h1>🌋 LAVA RUSH ARCADE</h1>
<p>Physics destroyer! Drag & release to launch Blaze at the wobbling rock towers. Topple them all with 5 shots!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Throwing is for safe targets only — never aim at people or animals!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.14,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=3+Math.floor(Math.random()*5),n2=2+Math.floor(Math.random()*5);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',towers=[],proj=null,sling=null,score=0,shots=5,parts=[],shake=0,combo=0;
const SLX=()=>W*.16,SLY=()=>H*.6,GY=()=>H*.84;
function build(){
  towers=[];const n=2+Math.floor(Math.random()*2);
  for(let t=0;t<n;t++){
    const bx=W*(0.55+0.22*t),tw=[];
    const lv=3+Math.floor(Math.random()*2);
    for(let l=0;l<lv;l++)tw.push({y:GY()-(l+.5)*46,w:34+Math.random()*20,h:44,tilt:0,tiltV:0,dead:false});
    towers.push({x:bx,blocks:tw});
  }
  shots=5;
}
function start(){state='play';build();score=0;combo=0;parts=[];ov.classList.add('hidden');}
function end(win){state='over';ov.innerHTML=`<h1>${win?'🏆 TOWERS TOPPLED!':'💥 OUT OF SHOTS'}</h1><p>Score: <b>${score}</b></p><div class="lesson">🔥 Fire Safety: Throwing is for safe targets only — never aim at people or animals!</div><button onclick="location.reload()" style="background:#d44a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c,n){for(let i=0;i<(n||12);i++){const a=Math.random()*7,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c});}}
function update(dt){
  if(state!=='play')return;shake*=.88;
  // tower wobble physics (simplified)
  towers.forEach(t=>t.blocks.forEach(b=>{if(b.dead)return;b.tilt+=b.tiltV*dt;b.tiltV+=-b.tilt*8*dt;b.tiltV*=.96;
    if(Math.abs(b.tilt)>.5){b.dead=true;combo++;score+=100*combo;boom(t.x,b.y,'#8a7a6a',14);beep(180,.2,'sawtooth');shake=Math.max(shake,10);hud.childNodes[0].textContent=`SCORE ${score} · `;}}));
  if(proj){
    proj.vy+=.5;proj.x+=proj.vx;proj.y+=proj.vy;proj.rot+=.1;
    towers.forEach(t=>t.blocks.forEach(b=>{if(b.dead)return;
      if(Math.abs(proj.x-t.x)<b.w/2+16&&Math.abs(proj.y-b.y)<b.h/2+16){
        b.tiltV+=(proj.vx>0?1:-1)*(Math.abs(proj.vx)*.004+.15);
        boom(proj.x,proj.y,'#ffb300',10);beep(250,.12,'square');shake=Math.max(shake,7);proj=null;}}));
    if(proj&&(proj.x>W+40||proj.y>H+40||proj.x<-40)){proj=null;shots--;document.getElementById('shots').textContent=shots;
      if(shots<=0){setTimeout(()=>{towers.some(t=>t.blocks.some(b=>!b.dead))?end(false):end(true);},800);}}
  }
  if(!towers.some(t=>t.blocks.some(b=>!b.dead))){setTimeout(()=>{if(state==='play')end(true);},600);state='ending';}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function baby(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,'#ffd23f');g.addColorStop(.6,'#ff8a00');g.addColorStop(1,'#e63900');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.3,-r*.1,r*.22,0,7);ctx.arc(r*.3,-r*.1,r*.22,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.3,-r*.08,r*.1,0,7);ctx.arc(r*.3,-r*.08,r*.1,0,7);ctx.fill();ctx.restore();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160a06');g.addColorStop(1,'#3a1c0a');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#2e1c10';ctx.fillRect(-20,GY(),W+40,H-GY());
  towers.forEach(t=>t.blocks.forEach(b=>{if(b.dead)return;ctx.save();ctx.translate(t.x,b.y);ctx.rotate(b.tilt);
    ctx.fillStyle='#8a7a6a';ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.strokeStyle='#3a322a';ctx.lineWidth=3;ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();}));
  // slingshot
  ctx.strokeStyle='#4a2a10';ctx.lineWidth=12;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(SLX(),GY());ctx.lineTo(SLX(),SLY()+24);ctx.stroke();
  if(state==='play'&&!proj){
    const px=sling?sling.x:SLX(),py=sling?sling.y:SLY();
    ctx.strokeStyle='#ff3d2e';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(SLX()-12,SLY());ctx.lineTo(px,py);ctx.moveTo(SLX()+12,SLY());ctx.lineTo(px,py);ctx.stroke();
    baby(px,py,24);
    if(sling){ctx.fillStyle='rgba(255,255,255,.65)';let tx=px,ty=py,vx=(SLX()-px)*.13,vy=(SLY()-py)*.13;
      for(let i=0;i<18;i++){vy+=.5;tx+=vx*2.4;ty+=vy*2.4;if(i%2===0){ctx.globalAlpha=.7-i*.04;ctx.beginPath();ctx.arc(tx,ty,4,0,7);ctx.fill();}}ctx.globalAlpha=1;}
  }
  if(proj)baby(proj.x,proj.y,20,proj.rot);
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
}
let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
let pid=null;
cv.addEventListener('pointerdown',e=>{if(state!=='play'||proj)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-SLX(),y-SLY())<90){sling={x,y};pid=e.pointerId;cv.setPointerCapture(pid);}});
cv.addEventListener('pointermove',e=>{if(!sling||e.pointerId!==pid)return;const r=cv.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;const dx=x-SLX(),dy=y-SLY(),d=Math.hypot(dx,dy),m=110;if(d>m){x=SLX()+dx/d*m;y=SLY()+dy/d*m;}sling={x,y};});
cv.addEventListener('pointerup',e=>{if(!sling||e.pointerId!==pid)return;const dx=SLX()-sling.x,dy=SLY()-sling.y;if(Math.hypot(dx,dy)>25){proj={x:sling.x,y:sling.y,vx:dx*.13,vy:dy*.13,rot:0};beep(320,.15,'sawtooth');}sling=null;pid=null;});
</script>
</body>
</html>
