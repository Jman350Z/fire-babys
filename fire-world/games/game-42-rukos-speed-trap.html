<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruko's Speed Trap — by Jman350Z & fire team</title>
<meta name="description" content="Lightning reactions! Tap at the perfect moment. A Fire Babys timing game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#aee2ff}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="round">ROUND 1/10</div>
<div class="pill" id="best">🏆 0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">⚡ RUKO'S SPEED TRAP</h1>
<div id="obody"><p>Lightning-fast reactions!</p><p><b>TAP</b> when the sweeping needle hits the <b style="color:#4caf50">green zone</b>! Perfect center = JACKPOT. 10 rounds — the needle gets faster every round. Miss and you lose points!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: React fast — but always think first!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  good(){tone(700,1000,0.12,'triangle',0.12);},
  perfect(){tone(900,1800,0.2,'sine',0.14);tone(1400,2200,0.14,'triangle',0.1,0.06);},
  miss(){tone(350,150,0.2,'sawtooth',0.12);},
  tick(){tone(500,500,0.04,'square',0.05);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,round:0,
  angle:0,speed:2,target:0,targetW:0.5,
  result:null,resultT:0,time:0,shake:0,combo:0};
try{G.best=parseInt(localStorage.getItem('speedtrap_best')||'0',10)||0;}catch(e){}
const ROUNDS=10;
function reset(){
  G.score=0;G.round=0;G.combo=0;G.time=0;G.shake=0;
  nextRound();
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function nextRound(){
  G.round++;
  if(G.round>ROUNDS){gameOver();return;}
  G.angle=Math.random()*Math.PI*2;
  G.speed=2+G.round*0.55;
  G.target=Math.random()*Math.PI*2;
  G.targetW=Math.max(0.22,0.55-G.round*0.03);
  G.result=null;
  document.getElementById('round').textContent=`ROUND ${G.round}/${ROUNDS}`;
}
function updateHUD(){document.getElementById('score').textContent='⭐ '+G.score;}
function angDiff(a,b){
  let d=Math.abs(a-b)%(Math.PI*2);
  return d>Math.PI?Math.PI*2-d:d;
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.result)return;
  e.preventDefault();
  const d=angDiff(G.angle,G.target);
  const perfectW=G.targetW*0.3;
  if(d<perfectW){
    G.result='PERFECT!';G.resultT=1.2;
    const pts=100+G.combo*20;
    G.score+=pts;G.combo++;
    sfx.perfect();G.shake=0.2;
    spawnText(W/2,H*0.3,'PERFECT +'+pts,'#ffd23f');
    burst(W/2,H*0.42,'#ffd23f',16);
  }else if(d<G.targetW){
    G.result='GOOD';G.resultT=1;
    const pts=50+G.combo*10;
    G.score+=pts;G.combo++;
    sfx.good();
    spawnText(W/2,H*0.3,'+'+pts,'#4caf50');
    burst(W/2,H*0.42,'#4caf50',8);
  }else{
    G.result='MISS';G.resultT=1;
    G.score=Math.max(0,G.score-25);G.combo=0;
    sfx.miss();G.shake=0.3;
    spawnText(W/2,H*0.3,'MISS -25','#ff4a5a');
  }
  updateHUD();
  setTimeout(()=>{if(G.state==='play')nextRound();},900);
});
const particles=[],floaters=[];
for(let i=0;i<80;i++)particles.push({a:false});
for(let i=0;i<8;i++)floaters.push({a:false});
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*240;p.vy=Math.sin(a)*240;
    p.life=0.5;p.max=0.5;p.color=color;p.size=4;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1.2;
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  if(!G.result)G.angle+=G.speed*dt;
  G.resultT-=dt;
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
}
function gameOver(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('speedtrap_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    const grade=G.score>=800?'🏆 LIGHTNING!':G.score>=500?'🥇 SHARP!':G.score>=250?'🥈 STEADY':'🥉 WARMING UP';
    showOverlay('⚡ GAME OVER',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:22px">${grade}</p><p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: React fast — but think first!',
      '↻ PLAY AGAIN',()=>{reset();G.state='play';});
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createRadialGradient(W/2,H*0.42,50,W/2,H*0.42,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#141a30');bg.addColorStop(1,'#0d1420');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  const cx=W/2,cy=H*0.42,R=Math.min(W,H)*0.32;
  // dial
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.beginPath();ctx.arc(cx,cy,R+24,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,R+24,0,Math.PI*2);ctx.stroke();
  // ticks
  for(let i=0;i<24;i++){
    const a=i/24*Math.PI*2;
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(R+14),cy+Math.sin(a)*(R+14));
    ctx.lineTo(cx+Math.cos(a)*(R+24),cy+Math.sin(a)*(R+24));
    ctx.stroke();
  }
  // target zone
  ctx.strokeStyle='rgba(76,175,80,0.85)';ctx.lineWidth=22;ctx.lineCap='butt';
  ctx.beginPath();ctx.arc(cx,cy,R,G.target-G.targetW,G.target+G.targetW);ctx.stroke();
  // perfect zone
  ctx.strokeStyle='rgba(255,210,63,0.95)';ctx.lineWidth=22;
  ctx.beginPath();ctx.arc(cx,cy,R,G.target-G.targetW*0.3,G.target+G.targetW*0.3);ctx.stroke();
  // needle
  if(!G.result||G.resultT>0.6){
    const na=G.angle;
    ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(na)*R,cy+Math.sin(na)*R);ctx.stroke();
    // tip
    ctx.fillStyle='#ff4a5a';
    ctx.beginPath();ctx.arc(cx+Math.cos(na)*R,cy+Math.sin(na)*R,9,0,Math.PI*2);ctx.fill();
  }
  // center
  const cg=ctx.createRadialGradient(cx-6,cy-6,3,cx,cy,26);
  cg.addColorStop(0,'#aee2ff');cg.addColorStop(1,'#2a5a89');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0d1420';ctx.font='900 20px system-ui';ctx.textAlign='center';
  ctx.fillText('⚡',cx,cy+7);ctx.textAlign='left';
  // result text
  if(G.result&&G.resultT>0){
    ctx.globalAlpha=Math.min(1,G.resultT*2);
    ctx.font='900 44px system-ui';ctx.textAlign='center';
    const col=G.result==='PERFECT!'?'#ffd23f':G.result==='GOOD'?'#4caf50':'#ff4a5a';
    ctx.fillStyle='#000';ctx.fillText(G.result,cx+3,cy+R+72);
    ctx.fillStyle=col;ctx.fillText(G.result,cx,cy+R+70);
    ctx.textAlign='left';ctx.globalAlpha=1;
  }
  // combo
  if(G.combo>1){
    ctx.fillStyle='#ffd23f';ctx.font='900 20px system-ui';ctx.textAlign='center';
    ctx.fillText(`🔥 COMBO x${G.combo}`,cx,cy-R-40);
    ctx.textAlign='left';
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 24px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.round===1&&!G.result&&G.time<3){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP WHEN THE NEEDLE HITS GREEN!',W/2,H*0.85);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
