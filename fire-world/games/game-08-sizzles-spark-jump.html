<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sizzle's Spark Jump — by Jman350Z & fire team</title>
<meta name="description" content="Bounce to the stars! Sizzle's Spark Jump — a Fire Babys doodle jumper.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1a2a;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,25,.92);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;background:linear-gradient(180deg,#c4a0ff,#6a4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#e0d6ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#c4a0ff,#6a4dff);color:#fff;border:3px solid #c4a0ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #4a2a9d}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #4a2a9d}
#mathgate{background:#1a1030;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #6a4dff}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="height">📏 0m</div>
<div class="pill" id="best">🏆 0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🦘 SIZZLE'S SPARK JUMP</h1>
<div id="obody"><p><b>Cinder</b> & <b>Blaze</b> bounce to the stars!</p><p><b>Tilt your phone</b> or <b>tap left/right sides</b> to steer — Sizzle auto-bounces! Climb as high as you can. Watch for crumbling platforms!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Always have a grown-up nearby when you climb high!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
/* ============================================================
   SIZZLE'S SPARK JUMP v2 — AAA Rebuild
   - Doodle jump: auto-bounce, tilt/tap steering
   - Platform types: normal, moving, crumbling, spring, rocket
   - Camera follow, parallax, particles
   ============================================================ */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* audio */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  bounce(){tone(400,700,0.1,'sine',0.12);},
  spring(){tone(300,1200,0.2,'sine',0.15);},
  rocket(){tone(200,2000,0.8,'sawtooth',0.12);},
  crumble(){tone(300,100,0.2,'square',0.1);},
  star(){tone(1200,1800,0.12,'sine',0.12);},
  fall(){tone(600,100,0.5,'sawtooth',0.15);},
  click(){tone(600,600,0.06,'square',0.1);}
};

/* state */
const G={state:'title',score:0,height:0,best:0,camY:0,
  px:0,py:0,vx:0,vy:0,platforms:[],stars:[],time:0,tilt:0,dead:false};
try{G.best=parseInt(localStorage.getItem('sizzle_best')||'0',10)||0;}catch(e){}
const GRAV=2200,BOUNCE_V=-950;

function reset(){
  G.score=0;G.height=0;G.camY=0;G.dead=false;G.time=0;
  G.px=W/2;G.py=H*0.7;G.vx=0;G.vy=BOUNCE_V;
  G.platforms=[];G.stars=[];
  // starting platform
  G.platforms.push({x:W/2-50,y:H*0.75,w:100,type:'normal',vx:0,crumble:0});
  let y=H*0.75;
  while(y>-H*2){
    y-=60+Math.random()*80;
    spawnPlatform(y);
  }
  document.getElementById('best').textContent='🏆 '+G.best;
}
function spawnPlatform(y){
  const w=70+Math.random()*50;
  const x=Math.random()*(W-w);
  const h=G.height;
  const r=Math.random();
  let type='normal';
  if(h>500&&r<0.15)type='moving';
  else if(h>800&&r<0.28)type='crumble';
  else if(h>300&&r<0.36)type='spring';
  else if(h>1500&&r<0.40)type='rocket';
  G.platforms.push({x,y,w,type,vx:type==='moving'?(Math.random()<0.5?-1:1)*(60+Math.random()*80):0,crumble:0});
  if(Math.random()<0.25)G.stars.push({x:x+w/2,y:y-30,r:14,taken:false});
}

/* input: tilt + tap sides */
addEventListener('deviceorientation',e=>{
  if(e.gamma!=null)G.tilt=Math.max(-1,Math.min(1,e.gamma/30));
});
let touchSide=0;
canvas.addEventListener('pointerdown',e=>{touchSide=e.clientX<W/2?-1:1;});
canvas.addEventListener('pointerup',()=>touchSide=0);
canvas.addEventListener('pointercancel',()=>touchSide=0);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')G.keyL=true;
  if(e.key==='ArrowRight')G.keyR=true;
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')G.keyL=false;
  if(e.key==='ArrowRight')G.keyR=false;
});

/* update */
function update(dt){
  G.time+=dt;
  // horizontal: tilt + touch + keys
  let ax=G.tilt*1200+touchSide*900;
  if(G.keyL)ax-=900;if(G.keyR)ax+=900;
  G.vx+=ax*dt;G.vx*=0.98;
  G.vx=Math.max(-500,Math.min(500,G.vx));
  G.px+=G.vx*dt;
  // wrap around sides
  if(G.px<-20)G.px=W+20;if(G.px>W+20)G.px=-20;
  // vertical
  G.vy+=GRAV*dt;G.py+=G.vy*dt;
  // camera follows up
  const targetCam=Math.min(G.camY,G.py-H*0.4);
  if(targetCam<G.camY){
    G.camY=targetCam;
    const gained=(G.camY-targetCam);
  }
  const newHeight=Math.max(G.height,-G.camY/10);
  if(newHeight>G.height){
    G.score+=Math.round((newHeight-G.height)*2);G.height=newHeight;
    updateHUD();
  }
  // platform collisions (only falling)
  if(G.vy>0){
    for(const p of G.platforms){
      const py=p.y-G.camY;
      if(G.px+18>p.x&&G.px-18<p.x+p.w&&G.py+20>py&&G.py+20<py+24){
        if(p.type==='crumble'){
          p.crumble=0.4;sfx.crumble();
          // still bounce once
          G.vy=BOUNCE_V*0.8;sfx.bounce();
        }else if(p.type==='spring'){
          G.vy=BOUNCE_V*1.8;sfx.spring();
          for(let i=0;i<10;i++)spawnP(G.px,py,(Math.random()-0.5)*200,-Math.random()*200,0.4,'#4caf50',4);
        }else if(p.type==='rocket'){
          G.vy=BOUNCE_V*3;sfx.rocket();
          G.rocketT=1.2;
          for(let i=0;i<15;i++)spawnP(G.px,py,(Math.random()-0.5)*300,Math.random()*200,0.6,'#ff6a00',5);
        }else{
          G.vy=BOUNCE_V;sfx.bounce();
          // squash effect via vy
        }
        // small bounce particles
        for(let i=0;i<4;i++)spawnP(G.px,py+20,(Math.random()-0.5)*150,-Math.random()*80,0.3,'#fff',3);
        break;
      }
    }
  }
  // rocket boost
  if(G.rocketT>0){G.rocketT-=dt;G.vy=Math.min(G.vy,-1200);
    if(Math.random()<0.5)spawnP(G.px+(Math.random()-0.5)*20,G.py+25,(Math.random()-0.5)*100,Math.random()*200,0.4,'#ff6a00',5);}
  // moving platforms
  for(const p of G.platforms){
    if(p.type==='moving'){p.x+=p.vx*dt;if(p.x<0||p.x+p.w>W)p.vx*=-1;}
    if(p.type==='crumble'&&p.crumble>0){p.crumble-=dt;}
  }
  G.platforms=G.platforms.filter(p=>p.crumble<=0||p.type!=='crumble'||p.crumble>0);
  // actually remove fully crumbled
  for(let i=G.platforms.length-1;i>=0;i--){
    const p=G.platforms[i];
    if(p.type==='crumble'&&p.crumble<=0&&p.crumble!==0&&p.touched)p.gone=true;
  }
  G.platforms=G.platforms.filter(p=>!p.gone);
  // stars
  for(const s of G.stars){
    if(s.taken)continue;
    const sy=s.y-G.camY;
    if(Math.hypot(G.px-s.x,G.py-sy)<32){
      s.taken=true;G.score+=100;sfx.star();updateHUD();
      spawnText(s.x,sy,'+100');
      for(let i=0;i<8;i++)spawnP(s.x,sy,(Math.random()-0.5)*200,(Math.random()-0.5)*200,0.5,'#ffd23f',4);
    }
  }
  // spawn more platforms above
  let topY=Math.min(...G.platforms.map(p=>p.y));
  while(topY>G.camY-100){
    topY-=60+Math.random()*80+Math.min(G.height/20,60);
    spawnPlatform(topY);
  }
  // remove far below
  G.platforms=G.platforms.filter(p=>p.y-G.camY<H+100);
  G.stars=G.stars.filter(s=>!s.taken&&s.y-G.camY<H+100);
  // death: fell below screen
  if(G.py-G.camY>H+50&&!G.dead){
    G.dead=true;sfx.fall();gameOver();
  }
  updateHUD2();
}
const particles=[],floaters=[];
for(let i=0;i<120;i++)particles.push({a:false});
for(let i=0;i<15;i++)floaters.push({a:false});
function spawnP(x,y,vx,vy,life,color,size){const p=particles.find(p=>!p.a);if(!p)return;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.color=color;p.size=size;}
function spawnText(x,y,txt){const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.life=1;}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
}
function updateHUD2(){
  document.getElementById('height').textContent='📏 '+Math.floor(G.height)+'m';
}
function gameOver(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('sizzle_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('💥 GAME OVER',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:24px;font-weight:900">Score: ${G.score}</p><p>Height: ${Math.floor(G.height)}m</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Always have a grown-up nearby when you climb high!',
      '↻ JUMP AGAIN',()=>{reset();G.state='play';});
  },600);
}

/* overlay */
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};

/* render */
function render(){
  // sky gradient shifts with height
  const t=Math.min(1,G.height/3000);
  const top=[13+t*40,26+t*10,42-t*10],bot=[26+t*60,42-t*10,74-t*30];
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,`rgb(${top[0]|0},${top[1]|0},${top[2]|0})`);
  bg.addColorStop(1,`rgb(${bot[0]|0},${bot[1]|0},${bot[2]|0})`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // parallax stars/clouds
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<30;i++){
    const sx=(i*211)%W,sy=((i*137-G.camY*0.3)%(H+40)+(H+40))%(H+40)-20;
    const sz=1+(i%3);
    ctx.globalAlpha=0.2+((i*37)%40)/100;
    ctx.fillRect(sx,sy,sz,sz);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<8;i++){
    const cx=(i*311)%W,cy=((i*197-G.camY*0.5)%(H+120)+(H+120))%(H+120)-60;
    ctx.beginPath();ctx.ellipse(cx,cy,60,18,0,0,Math.PI*2);ctx.fill();
  }
  // platforms
  for(const p of G.platforms){
    const py=p.y-G.camY;
    if(py<-30||py>H+30)continue;
    ctx.save();
    if(p.type==='crumble'&&p.crumble>0)ctx.globalAlpha=p.crumble/0.4;
    const cols={normal:['#4a90d9','#2a5a89'],moving:['#9a7fd4','#5a3a9d'],crumble:['#c4a070','#8a5a2a'],spring:['#4caf50','#2a6a2a'],rocket:['#ff6a00','#a33c10']};
    const [c1,c2]=cols[p.type];
    const g=ctx.createLinearGradient(0,py,0,py+18);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(p.x,py,p.w,18,9);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();
    if(p.type==='spring'){
      ctx.fillStyle='#fff';
      ctx.fillRect(p.x+p.w/2-12,py-14,24,14);
      ctx.strokeStyle='#2a6a2a';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x+p.w/2-12,py-7);ctx.lineTo(p.x+p.w/2+12,py-7);ctx.stroke();
    }
    if(p.type==='rocket'){
      ctx.fillStyle='#ffd23f';ctx.font='16px system-ui';ctx.textAlign='center';
      ctx.fillText('🚀',p.x+p.w/2,py+15);ctx.textAlign='left';
    }
    ctx.restore();
  }
  // stars
  for(const s of G.stars){
    if(s.taken)continue;
    const sy=s.y-G.camY;
    if(sy<-30||sy>H+30)continue;
    ctx.save();ctx.translate(s.x,sy);ctx.rotate(Math.sin(G.time*3)*0.2);
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#a37a00';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,a2=a+Math.PI/5;
      ctx.lineTo(Math.cos(a)*s.r,Math.sin(a)*s.r);ctx.lineTo(Math.cos(a2)*s.r*0.45,Math.sin(a2)*s.r*0.45);}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }
  // player: Sizzle fire baby
  if(!G.dead||G.state==='play'){
    const py=G.py-G.camY;
    const squash=G.vy>0?Math.min(0.2,G.vy/5000):Math.max(-0.15,G.vy/8000);
    ctx.save();ctx.translate(G.px,py);ctx.scale(1+squash,1-squash);
    // rocket flame
    if(G.rocketT>0){
      const fl=20+Math.random()*20;
      const fg=ctx.createLinearGradient(0,20,0,20+fl);
      fg.addColorStop(0,'#ffd23f');fg.addColorStop(1,'rgba(255,106,0,0)');
      ctx.fillStyle=fg;
      ctx.beginPath();ctx.moveTo(-10,20);ctx.lineTo(10,20);ctx.lineTo(0,20+fl);ctx.closePath();ctx.fill();
    }
    const g=ctx.createRadialGradient(-7,-8,4,0,0,24);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff9a3a');g.addColorStop(1,'#e8352c');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
    // spark trail
    ctx.fillStyle='#ffd23f';
    ctx.beginPath();ctx.arc(-4,-24-Math.random()*6,4,0,Math.PI*2);ctx.fill();
    // face
    const blink=Math.sin(G.time*2.3)>0.96?0.2:1;
    ctx.fillStyle='#2b1a0e';
    ctx.save();ctx.scale(1,blink);
    ctx.beginPath();ctx.arc(-7,-4,3.5,0,Math.PI*2);ctx.arc(7,-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#2b1a0e';ctx.lineWidth=2.5;ctx.lineCap='round';
    const smile=G.vy<0?0.2:Math.PI-0.5;
    ctx.beginPath();ctx.arc(0,4,7,smile,smile+1.2);ctx.stroke();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    const py=p.y-G.camY*0; // world-locked approx
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 18px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle='#ffd23f';ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}

/* loop */
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);else G.time+=dt;
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=40*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
