<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blaze's Magma Bounce — by Jman350Z & fire team</title>
<meta name="description" content="Sumo showdown! Bump rock golems out of the magma ring. A Fire Babys physics battler.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0d08;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,5,0,.9);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;background:linear-gradient(180deg,#ffd76a,#ff6a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#2a1a0e;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#round{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="level">ROUND 1/5</div>
<div class="pill" id="foes">🪨 3 left</div>
</div>
<div id="round" class="pill hidden"></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">💥 BLAZE'S MAGMA BOUNCE</h1>
<div id="obody"><p><b>Boulder</b> & <b>Cinder</b> enter the sumo ring!</p><p><b>Fling</b> Blaze to BUMP rock golems out of the arena! Drag back and release. Last one in the ring wins!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Hot lava is like a real fire — never touch, always stay back!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
/* ============================================================
   BLAZE'S MAGMA BOUNCE v2 — AAA Rebuild
   - Sumo arena: fling to bump golems out of the ring
   - Smart AI, 5 rounds, lava hazard, particles, shake
   ============================================================ */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR,CX,CY,RING_R;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H*0.52;RING_R=Math.min(W,H)*0.36;}
addEventListener('resize',resize);resize();

/* audio */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
function noise(dur,vol,delay=0,lp=1000){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const len=ac.sampleRate*dur,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource();s.buffer=buf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);}
const sfx={
  fling(){noise(0.15,0.25,0,1500);tone(300,700,0.12,'sine',0.12);},
  bump(){noise(0.15,0.35,0,600);tone(150,60,0.12,'square',0.2);},
  splash(){noise(0.4,0.4,0,400);tone(300,80,0.3,'sawtooth',0.2);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.25,'triangle',0.18,i*0.1));},
  click(){tone(600,600,0.06,'square',0.1);}
};

/* pools */
const particles=[],floaters=[];
for(let i=0;i<250;i++)particles.push({a:false});
for(let i=0;i<20;i++)floaters.push({a:false});
function spawnP(x,y,vx,vy,life,color,size){const p=particles.find(p=>!p.a);if(!p)return;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.color=color;p.size=size;}
function spawnText(x,y,txt,color='#ffd23f'){const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1.2;}
let trauma=0,shakeX=0,shakeY=0;
function addTrauma(t){trauma=Math.min(1,trauma+t);}

/* state */
const G={state:'title',round:1,score:0,player:null,foes:[],time:0,dragging:false,dragX:0,dragY:0,roundT:0};
function makeFighter(x,y,isPlayer,round){
  const hp=isPlayer?1:1;
  return{x,y,vx:0,vy:0,r:isPlayer?26:24+round*2,isPlayer,
    aiT:Math.random()*2,target:null,dead:false,outT:0,
    squash:0,flash:0,
    speed:isPlayer?0:60+round*18+Math.random()*30,
    aggro:0.5+round*0.12};
}
function startRound(n){
  G.round=n;G.foes=[];G.roundT=0;
  G.player=makeFighter(CX,CY-60,true,n);
  const count=2+Math.min(n,3);
  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2-Math.PI/2;
    G.foes.push(makeFighter(CX+Math.cos(a)*RING_R*0.55,CY+Math.sin(a)*RING_R*0.55,false,n));
  }
  document.getElementById('level').textContent=`ROUND ${n}/5`;
  updateFoesUI();
  const rd=document.getElementById('round');
  rd.textContent=`🥋 ROUND ${n} — ${count} GOLEMS!`;rd.classList.remove('hidden');
  setTimeout(()=>rd.classList.add('hidden'),2000);
}
function updateFoesUI(){
  const left=G.foes.filter(f=>!f.dead).length;
  document.getElementById('foes').textContent=`🪨 ${left} left`;
}
function updateScoreUI(){document.getElementById('score').textContent='⭐ '+G.score;}

/* physics + AI */
function distToRingEdge(f){return Math.hypot(f.x-CX,f.y-CY);}
function update(dt){
  G.time+=dt;G.roundT+=dt;
  const all=[G.player,...G.foes].filter(f=>!f.dead);
  // player drag handled by input; apply friction
  for(const f of all){
    if(f.isPlayer&&f.held)continue;
    // AI
    if(!f.isPlayer&&G.state==='play'){
      f.aiT-=dt;
      // target: nearest opponent (player or other foe)
      let best=null,bd=1e9;
      for(const o of all){
        if(o===f||o.dead)continue;
        // prefer player slightly
        const d=Math.hypot(o.x-f.x,o.y-f.y)-(o.isPlayer?30:0);
        if(d<bd){bd=d;best=o;}
      }
      if(best){
        const dx=best.x-f.x,dy=best.y-f.y,d=Math.hypot(dx,dy)||1;
        // charge, but avoid running out of ring
        const edgeD=distToRingEdge(f);
        let mx=dx/d,my=dy/d;
        if(edgeD>RING_R*0.85){
          // steer back toward center
          mx=mx*0.3+(CX-f.x)/edgeD*0.9;my=my*0.3+(CY-f.y)/edgeD*0.9;
          const m=Math.hypot(mx,my)||1;mx/=m;my/=m;
        }
        // dash occasionally
        if(f.aiT<=0&&bd<200&&Math.random()<f.aggro){
          f.vx+=mx*f.speed*4;f.vy+=my*f.speed*4;f.aiT=1.5+Math.random()*2;
          for(let i=0;i<6;i++)spawnP(f.x,f.y,(Math.random()-0.5)*150,(Math.random()-0.5)*150,0.3,'#8a6a4a',3);
        }else{
          f.vx+=mx*f.speed*dt*3;f.vy+=my*f.speed*dt*3;
        }
      }
    }
    // friction (stone on stone)
    f.vx*=0.985;f.vy*=0.985;
    // cap speed
    const sp=Math.hypot(f.vx,f.vy),max=f.isPlayer?900:500;
    if(sp>max){f.vx=f.vx/sp*max;f.vy=f.vy/sp*max;}
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.squash*=0.9;f.flash=Math.max(0,f.flash-dt*4);
    // ring edge = lava!
    const ed=distToRingEdge(f);
    if(ed>RING_R+f.r){
      f.outT+=dt;
      if(f.outT>0.25&&!f.dead){
        f.dead=true;
        sfx.splash();addTrauma(f.isPlayer?0.6:0.35);
        for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;
          spawnP(f.x,f.y,Math.cos(a)*250,Math.sin(a)*250-100,0.8,'#ff4a00',4+Math.random()*4);}
        spawnText(f.x,f.y-30,f.isPlayer?'💥 OUT!':'💥 SPLASH! +'+(200*G.round),f.isPlayer?'#ff4a00':'#7fd4ff');
        if(!f.isPlayer){G.score+=200*G.round;updateScoreUI();}
        updateFoesUI();
        if(f.isPlayer)roundLost();
        else if(G.foes.every(x=>x.dead))roundWon();
      }
    }else f.outT=Math.max(0,f.outT-dt*2);
  }
  // collisions: bump!
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
    if(d<min&&d>0){
      const nx=dx/d,ny=dy/d,overlap=(min-d)/2;
      const total=a.r+b.r;
      a.x-=nx*overlap*(b.r/total)*2;a.y-=ny*overlap*(b.r/total)*2;
      b.x+=nx*overlap*(a.r/total)*2;b.y+=ny*overlap*(a.r/total)*2;
      // momentum transfer
      const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rel<0){
        const imp=-rel*1.4;
        a.vx-=nx*imp*(b.r/total);a.vy-=ny*imp*(b.r/total);
        b.vx+=nx*imp*(a.r/total);b.vy+=ny*imp*(a.r/total);
        a.squash=0.3;b.squash=0.3;a.flash=1;b.flash=1;
        if(imp>150){sfx.bump();addTrauma(Math.min(0.35,imp/2000));
          const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
          for(let k=0;k<8;k++)spawnP(mx,my,(Math.random()-0.5)*300,(Math.random()-0.5)*300,0.4,'#ffb347',4);
          spawnText(mx,my-20,imp>400?'POW!':'BUMP!','#fff',18);
        }
      }
    }
  }
}
function roundWon(){
  if(G.state!=='play')return;
  G.state='clear';sfx.win();
  const bonus=G.round*300;G.score+=bonus;updateScoreUI();
  setTimeout(()=>{
    if(G.round>=5){
      showOverlay('🏆 SUMO CHAMPION!',
        `<p style="font-size:26px;font-weight:900">Final Score: ${G.score}</p><p>Undefeated through 5 rounds!</p>`,
        '🔥 Fire Safety: You\'re a fire safety champion!',
        '↻ PLAY AGAIN',()=>{G.score=0;updateScoreUI();startRound(1);G.state='play';});
    }else{
      showOverlay(`⭐ ROUND ${G.round} WON!`,
        `<p>All golems splashed! +${bonus} bonus</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Hot lava is like a real fire — never touch, always stay back!',
        '▶ NEXT ROUND',()=>{startRound(G.round+1);G.state='play';});
    }
  },1000);
}
function roundLost(){
  if(G.state!=='play')return;
  G.state='over';
  setTimeout(()=>{
    showOverlay('💥 KNOCKED OUT!',
      `<p>You got bumped into the lava!</p><p>Score: ${G.score}</p>`,
      '🔥 Fire Safety: Hot lava is like a real fire — never touch, always stay back!',
      '↻ TRY AGAIN',()=>{startRound(G.round);G.state='play';});
  },800);
}

/* input: drag player to fling */
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||!G.player||G.player.dead)return;
  const p=G.player;
  if(Math.hypot(p.x-e.clientX,p.y-e.clientY)<p.r+30){
    p.held=true;G.dragging=true;G.dragX=e.clientX;G.dragY=e.clientY;
    canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!G.dragging)return;
  const p=G.player;
  let dx=e.clientX-p.x,dy=e.clientY-p.y;
  const max=120,d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  G.dragX=p.x+dx;G.dragY=p.y+dy;
});
canvas.addEventListener('pointerup',()=>{
  const p=G.player;if(!p||!G.dragging)return;
  p.held=false;G.dragging=false;
  const dx=p.x-G.dragX,dy=p.y-G.dragY,pow=Math.hypot(dx,dy);
  if(pow<20)return;
  p.vx=dx/pow*Math.min(pow,120)*8;
  p.vy=dy/pow*Math.min(pow,120)*8;
  p.squash=0.35;
  sfx.fling();addTrauma(0.2);
});

/* overlay */
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();G.score=0;updateScoreUI();startRound(1);G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};

/* render */
function drawFighter(f){
  ctx.save();ctx.translate(f.x,f.y);
  ctx.scale(1+f.squash,1-f.squash);
  if(f.isPlayer){
    // Blaze
    const g=ctx.createRadialGradient(-8,-10,5,0,0,f.r);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
    // flame
    ctx.fillStyle='#ff4a00';
    const w=Math.sin(G.time*10)*4;
    ctx.beginPath();ctx.moveTo(-10,-f.r+4);ctx.quadraticCurveTo(w,-f.r-16,10,-f.r+4);
    ctx.quadraticCurveTo(0,-f.r-6,-10,-f.r+4);ctx.fill();
    // face
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(-8,-4,4,0,Math.PI*2);ctx.arc(8,-4,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2b1a0e';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,6,8,0.3,Math.PI-0.3);ctx.stroke();
  }else{
    // rock golem
    const g=ctx.createRadialGradient(-8,-8,5,0,0,f.r);
    g.addColorStop(0,'#8a7a6a');g.addColorStop(1,'#3a2a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2a1a0a';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,f.r-2,0,Math.PI*2);ctx.stroke();
    // angry eyes
    ctx.fillStyle=f.flash>0?'#ff4a00':'#ffb347';
    ctx.beginPath();ctx.arc(-9,-6,5,0,Math.PI*2);ctx.arc(9,-6,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a0a0a';
    ctx.beginPath();ctx.arc(-9,-6,2.5,0,Math.PI*2);ctx.arc(9,-6,2.5,0,Math.PI*2);ctx.fill();
    // mouth
    ctx.strokeStyle='#1a0a0a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-10,10);ctx.lineTo(10,10);ctx.stroke();
    // cracks
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-f.r*0.5,-f.r*0.7);ctx.lineTo(0,-f.r*0.2);ctx.lineTo(f.r*0.4,-f.r*0.6);ctx.stroke();
  }
  if(f.flash>0){ctx.globalAlpha=f.flash*0.5;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  ctx.restore();
}
function render(){
  // arena background: dark volcano
  const bg=ctx.createRadialGradient(CX,CY,50,CX,CY,Math.max(W,H));
  bg.addColorStop(0,'#3a1a0a');bg.addColorStop(0.6,'#1a0d08');bg.addColorStop(1,'#0a0505');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(trauma>0)ctx.translate(shakeX,shakeY);
  // lava around ring
  const lava=ctx.createRadialGradient(CX,CY,RING_R*0.9,CX,CY,RING_R*2.2);
  lava.addColorStop(0,'rgba(255,74,0,0)');lava.addColorStop(0.55,'#ff4a00');lava.addColorStop(0.75,'#ff8a00');lava.addColorStop(1,'#5a1a00');
  ctx.fillStyle=lava;
  ctx.beginPath();ctx.arc(CX,CY,RING_R*2.2,0,Math.PI*2);ctx.fill();
  // lava bubbles
  for(let i=0;i<12;i++){
    const a=i*0.7+G.time*0.3,r2=RING_R*1.4+Math.sin(G.time+i)*20;
    const bx=CX+Math.cos(a)*r2,by=CY+Math.sin(a)*r2;
    ctx.fillStyle='#ffdd44';ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.arc(bx,by,4+Math.sin(G.time*5+i)*2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // stone ring platform
  const rg=ctx.createRadialGradient(CX-RING_R*0.3,CY-RING_R*0.3,RING_R*0.2,CX,CY,RING_R);
  rg.addColorStop(0,'#6a5a4a');rg.addColorStop(0.85,'#4a3a2a');rg.addColorStop(1,'#2a1a0a');
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.arc(CX,CY,RING_R,0,Math.PI*2);ctx.fill();
  // ring edge glow (danger!)
  ctx.strokeStyle='#ff4a00';ctx.lineWidth=6;
  ctx.globalAlpha=0.6+Math.sin(G.time*4)*0.3;
  ctx.beginPath();ctx.arc(CX,CY,RING_R,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;
  // center emblem
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,RING_R*0.35,0,Math.PI*2);ctx.stroke();
  // drag indicator
  if(G.dragging&&G.player&&!G.player.dead){
    const p=G.player;
    ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=4;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(G.dragX,G.dragY);ctx.stroke();
    ctx.setLineDash([]);
    const pow=Math.hypot(p.x-G.dragX,p.y-G.dragY);
    ctx.fillStyle='#fff';ctx.font='900 16px system-ui';ctx.textAlign='center';
    ctx.fillText('FLING!',p.x,p.y-40);
    ctx.textAlign='left';
  }
  // fighters (foes first, player on top)
  for(const f of G.foes)if(!f.dead)drawFighter(f);
  if(G.player&&!G.player.dead)drawFighter(G.player);
  // out-of-ring warning for player
  if(G.player&&!G.player.dead&&G.state==='play'){
    const ed=distToRingEdge(G.player);
    if(ed>RING_R*0.8){
      ctx.fillStyle=`rgba(255,74,0,${0.3+Math.sin(G.time*10)*0.2})`;
      ctx.font='900 22px system-ui';ctx.textAlign='center';
      ctx.fillText('⚠️ DANGER!',CX,CY-RING_R-20);
      ctx.textAlign='left';
    }
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.max),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
}

/* loop */
let lastT=0;
function loop(t){
  const rawDt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  const dt=rawDt;
  trauma=Math.max(0,trauma-dt*1.8);
  const sh=trauma*trauma*18;
  shakeX=(Math.random()-0.5)*sh*2;shakeY=(Math.random()-0.5)*sh*2;
  if(G.state==='play')update(dt);else G.time+=dt;
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=50*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  render();
  requestAnimationFrame(loop);
}
updateScoreUI();
requestAnimationFrame(loop);
</script>
