<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pyra Prime Defense — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0a14;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,8,20,.94);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(28px,6vw,46px);font-weight:900;margin-bottom:12px;color:#ff8a2e}
#overlay p{font-size:16px;margin-bottom:10px;max-width:460px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:#b44a1a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:14px 38px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#241a14;border-radius:12px;padding:16px;margin:12px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:8px;border-radius:8px;border:2px solid #555;margin:0 8px}
.hidden{display:none!important}
#back{position:fixed;top:56px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div id="score">SCORE 0</div><div id="lives">●●●</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🧱 PYRA PRIME<br>DEFENSE</h1>
<div id="obody"><p><b style="color:#ff8a2e">Sizzle</b> & <b style="color:#ff8a2e">Lord Inferno</b> smash the rock wall!</p><p>🖱️ <b>Drag</b> the paddle to bounce the fireball! Break every rock brick. Don't let the ball fall!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()" style="font-size:16px;padding:8px 20px">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Walls protect us from fire — never block your escape routes with furniture!</div>
<button id="obtn">▶ PLAY</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}addEventListener('resize',resize);resize();
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type,vol){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);g.gain.setValueAtTime(vol||0.16,t);g.gain.exponentialRampToValueAtTime(0.01,t+dur);o.start(t);o.stop(t+dur+0.05);}
let mathA=0;function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathA=a+b;document.getElementById('mq').textContent=a+' + '+b;document.getElementById('mathgate').classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathA){document.getElementById('mathgate').classList.add('hidden');startGame();}else document.getElementById('ma').value='';}
const G={state:'title',score:0,lives:3,level:1,px:0,bx:0,by:0,bvx:0,bvy:0,bricks:[],parts:[],shake:0,stuck:true,pw:0};
function buildBricks(n){
  G.bricks=[];const rows=4+Math.min(n,3),cols=Math.max(5,Math.floor(W/90));
  const bw=W*0.92/cols;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(Math.random()<0.08)continue;
    G.bricks.push({x:W*0.04+c*bw,y:90+r*34,w:bw-6,h:28,hp:r===0?2:1,alive:true});
  }
}
function startGame(){audio();G.score=0;G.lives=3;G.level=1;G.px=W/2;G.pw=Math.max(90,W*0.16);buildBricks(1);resetBall();G.state='play';overlay.classList.add('hidden');updHud();}
function resetBall(){G.bx=G.px;G.by=H-90;G.bvx=0;G.bvy=0;G.stuck=true;}
function updHud(){document.getElementById('score').textContent='SCORE '+G.score+' • LV'+G.level;document.getElementById('lives').textContent='●'.repeat(G.lives)+'○'.repeat(Math.max(3-G.lives,0));}
function boom(x,y,n,c){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*350,vy:(Math.random()-0.5)*350,life:0.5,max:0.5,c});}
function update(dt){
  if(G.shake>0)G.shake-=dt*30;
  if(G.stuck){G.bx=G.px;G.by=H-90;return;}
  G.bx+=G.bvx*dt;G.by+=G.bvy*dt;
  const spd=Math.hypot(G.bvx,G.bvy),maxS=620+G.level*40;
  if(spd>maxS){G.bvx*=maxS/spd;G.bvy*=maxS/spd;}
  if(G.bx<12){G.bx=12;G.bvx*=-1;sfx(300,300,0.05,'square',0.08);}
  if(G.bx>W-12){G.bx=W-12;G.bvx*=-1;sfx(300,300,0.05,'square',0.08);}
  if(G.by<12){G.by=12;G.bvy*=-1;sfx(300,300,0.05,'square',0.08);}
  // paddle
  if(G.by>H-100&&G.by<H-60&&Math.abs(G.bx-G.px)<G.pw/2+12&&G.bvy>0){
    const rel=(G.bx-G.px)/(G.pw/2);
    const ang=-Math.PI/2+rel*1.1;
    const s=Math.min(Math.hypot(G.bvx,G.bvy)*1.03,620+G.level*40);
    G.bvx=Math.cos(ang)*s;G.bvy=Math.sin(ang)*s;
    sfx(400,700,0.08,'sine',0.15);boom(G.bx,H-80,6,'#ffd23f');}
  // bricks
  for(const b of G.bricks){
    if(!b.alive)continue;
    if(G.bx+12>b.x&&G.bx-12<b.x+b.w&&G.by+12>b.y&&G.by-12<b.y+b.h){
      b.hp--;G.shake=4;
      if(b.hp<=0){b.alive=false;G.score+=100;boom(b.x+b.w/2,b.y+b.h/2,14,'#888');sfx(500,900,0.12,'sine',0.18);}
      else{sfx(400,300,0.08,'square',0.12);}
      // bounce
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      if(Math.abs(G.bx-cx)>b.w/2-8)G.bvx*=-1;else G.bvy*=-1;
      updHud();break;}}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1);}
  if(G.by>H+40){
    G.lives--;updHud();sfx(400,80,0.35,'sawtooth',0.2);
    if(G.lives<=0){gameOver(false);return;}
    resetBall();}
  if(G.bricks.every(b=>!b.alive)){G.level++;G.score+=500;buildBricks(G.level);resetBall();updHud();sfx(523,1047,0.4,'sine',0.2);}
}
function gameOver(win){G.state='over';
  obody.innerHTML='<p>Final score: <b>'+G.score+'</b> — reached level '+G.level+'</p>';
  document.querySelector('#overlay h1').textContent='🧱 GAME OVER';
  obtn.textContent='↻ PLAY AGAIN';obtn.onclick=()=>{startGame();};overlay.classList.remove('hidden');}
function render(){
  ctx.fillStyle='#0f0a14';ctx.fillRect(0,0,W,H);
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  for(const b of G.bricks){if(!b.alive)continue;
    ctx.fillStyle=b.hp>1?'#8a5a3a':'#5a5a6a';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=b.hp>1?'#a06a4a':'#7a7a8a';ctx.fillRect(b.x,b.y,b.w,6);
    if(b.hp>1){ctx.fillStyle='#ffd23f';ctx.fillRect(b.x+b.w/2-8,b.y+b.h/2-3,16,6);}}
  // paddle (fire baby!)
  const px=G.px;
  const g=ctx.createLinearGradient(px-G.pw/2,0,px+G.pw/2,0);
  g.addColorStop(0,'#ff8a2e');g.addColorStop(0.5,'#ffd23f');g.addColorStop(1,'#ff8a2e');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(px-G.pw/2,H-80,G.pw,20,10);ctx.fill();
  ctx.fillStyle='#2b1a0e';ctx.beginPath();ctx.arc(px-12,H-70,4,0,Math.PI*2);ctx.arc(px+12,H-70,4,0,Math.PI*2);ctx.fill();
  // ball
  const bg2=ctx.createRadialGradient(G.bx-3,G.by-4,2,G.bx,G.by,12);
  bg2.addColorStop(0,'#fff3b0');bg2.addColorStop(0.6,'#ff8a2e');bg2.addColorStop(1,'#e63900');
  ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(G.bx,G.by,12,0,Math.PI*2);ctx.fill();
  for(const p of G.parts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  if(G.stuck&&G.state==='play'){ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('TAP TO LAUNCH!',W/2,H-130);ctx.textAlign='left';}
  ctx.restore();
}
function movePaddle(x){G.px=Math.max(G.pw/2,Math.min(W-G.pw/2,x));}
function tapLaunch(){if(G.state==='play'&&G.stuck){G.stuck=false;const a=-Math.PI/2+(Math.random()-0.5)*0.6;G.bvx=Math.cos(a)*420;G.bvy=Math.sin(a)*420;sfx(400,800,0.15,'sine',0.18);}}
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];movePaddle(t.clientX);tapLaunch();},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();movePaddle(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('mousedown',e=>{movePaddle(e.clientX);tapLaunch();});
canvas.addEventListener('mousemove',e=>{if(e.buttons)movePaddle(e.clientX);});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')G.px=Math.max(G.pw/2,G.px-30);if(e.key==='ArrowRight')G.px=Math.min(W-G.pw/2,G.px+30);if(e.key===' ')tapLaunch();});
let lastT=0;function loop(t){const dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;if(G.state==='play')update(dt);render();requestAnimationFrame(loop);}
obtn.onclick=()=>{showGate();};
requestAnimationFrame(loop);
</script>
</body>
</html>
