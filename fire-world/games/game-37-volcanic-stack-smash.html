<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Volcanic Stack Smash — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#101408;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:18px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(16,20,8,.94);color:#fff;text-align:center;padding:24px;cursor:default}
#overlay h1{font-size:clamp(26px,6vw,40px);font-weight:900;margin-bottom:10px;color:#aef28a}
#overlay p{font-size:15px;margin-bottom:8px;max-width:440px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:440px}
#overlay button{background:#4a8a2a;color:#fff;border:3px solid #fff;font-size:19px;font-weight:800;padding:12px 34px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#2a2a2a;border-radius:12px;padding:14px;margin:10px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:6px;border-radius:8px;border:2px solid #666;margin:0 6px}
.hidden{display:none!important}
#back{position:fixed;bottom:12px;left:10px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div id="score">SCORE 0</div><div id="combo"></div><div id="time">45</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🎯 VOLCANIC STACK SMASH</h1>
<div id="obody"><p>Shooting gallery! Tap the <b style="color:#ff6a00">rock targets</b> to smash them!</p><p>⚠️ NEVER shoot a <b style="color:#ffd23f">Fire Baby</b> — minus 100 points! 45 seconds!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq"></span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Know where the fire extinguisher is in your home — and never touch one without a grown-up!</div>
<button id="obtn">▶ START</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
const mathgate=document.getElementById('mathgate');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}addEventListener('resize',resize);resize();
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=type||'sine';o.frequency.setValueAtTime(f0,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),a.currentTime+dur);g.gain.setValueAtTime(0.22,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+dur);o.start();o.stop(a.currentTime+dur);}
let mathAns=0;
function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathAns=a+b;document.getElementById('mq').textContent=a+' + '+b;mathgate.classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathAns){mathgate.classList.add('hidden');start();}else document.getElementById('ma').value='';}
const G={state:'title',score:0,combo:0,comboT:0,time:45,targets:[],parts:[],shake:0,spawnT:0,mx:0,my:0};
function spawnTarget(){
  const baby=Math.random()<0.25;
  const row=Math.floor(Math.random()*3);
  const y=H*0.3+row*H*0.18;
  G.targets.push({x:-60,y:y,vx:120+Math.random()*160+G.score*0.05,r:30,baby:baby,life:6,ph:Math.random()*6});
}
function start(){ac();G.state='play';G.score=0;G.combo=0;G.time=45;G.targets=[];G.parts=[];overlay.classList.add('hidden');}
function gameOver(){G.state='over';
  overlay.classList.remove('hidden');
  document.querySelector('#overlay h1').textContent="⏰ TIME'S UP!";
  obody.innerHTML='<p>Final score: <b>'+G.score+'</b>!</p><p>Fire Babys protected: thank you! 💛</p>';
  obtn.textContent='↻ PLAY AGAIN';obtn.onclick=()=>{start();};}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();G.mx=e.clientX-r.left;G.my=e.clientY-r.top;
  if(G.state!=='play')return;
  sfx(900,300,0.08,'square');
  for(let i=G.targets.length-1;i>=0;i--){const t=G.targets[i];
    if(Math.hypot(t.x-G.mx,t.y-G.my)<t.r+10){
      G.targets.splice(i,1);
      if(t.baby){
        G.score=Math.max(0,G.score-100);G.combo=0;G.shake=8;sfx(300,80,0.3,'sawtooth');
        for(let k=0;k<10;k++)G.parts.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*250,vy:(Math.random()-0.5)*250,life:0.6,color:'#ff3b2e',s:5});
      }else{
        G.combo++;G.comboT=2;const pts=25*G.combo;G.score+=pts;sfx(500+G.combo*30,900,0.12,'triangle');G.shake=4;
        for(let k=0;k<14;k++)G.parts.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:0.5,color:Math.random()<0.5?'#a08a6a':'#ff6a00',s:5});
      }
      return;
    }}
  G.combo=0;
});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();G.mx=e.clientX-r.left;G.my=e.clientY-r.top;});
function update(dt){
  if(G.state!=='play')return;
  G.time-=dt;
  if(G.time<=0){G.time=0;gameOver();return;}
  document.getElementById('time').textContent=Math.ceil(G.time);
  G.spawnT-=dt;
  if(G.spawnT<=0){G.spawnT=Math.max(0.3,0.9-G.score*0.0006);spawnTarget();}
  for(let i=G.targets.length-1;i>=0;i--){const t=G.targets[i];t.x+=t.vx*dt;t.ph+=dt*5;t.life-=dt;
    if(t.x>W+80||t.life<=0)G.targets.splice(i,1);}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1);}
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;
  if(G.shake>0)G.shake-=dt*30;
  document.getElementById('score').textContent='SCORE '+G.score;
  document.getElementById('combo').textContent=G.combo>1?('COMBO x'+G.combo):'';
}
function render(){
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c2410');g.addColorStop(1,'#0a0d05');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  for(let row=0;row<3;row++){const y=H*0.3+row*H*0.18;
    ctx.fillStyle='#4a3a24';ctx.fillRect(0,y+44,W,14);}
  for(const t of G.targets){
    const bob=Math.sin(t.ph)*6;
    if(t.baby){
      const bg=ctx.createRadialGradient(t.x-5,t.y+bob-7,3,t.x,t.y+bob,26);
      bg.addColorStop(0,'#fff3b0');bg.addColorStop(0.6,'#ffb300');bg.addColorStop(1,'#e8640c');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(t.x,t.y+bob,24,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(t.x-10,t.y+bob-16);ctx.quadraticCurveTo(t.x,t.y+bob-38,t.x+10,t.y+bob-16);ctx.fill();
      ctx.fillStyle='#2b1a0e';ctx.beginPath();ctx.arc(t.x-7,t.y+bob-2,3,0,Math.PI*2);ctx.arc(t.x+7,t.y+bob-2,3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#6a6a7a';ctx.beginPath();ctx.arc(t.x,t.y+bob,t.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.arc(t.x,t.y+bob,t.r*0.65,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(t.x,t.y+bob,t.r*0.35,0,Math.PI*2);ctx.fill();
    }
  }
  for(const p of G.parts){ctx.globalAlpha=Math.max(p.life*2,0);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  if(G.state==='play'&&G.mx){
    ctx.strokeStyle='#ff3b2e';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(G.mx,G.my,16,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(G.mx-24,G.my);ctx.lineTo(G.mx+24,G.my);ctx.moveTo(G.mx,G.my-24);ctx.lineTo(G.mx,G.my+24);ctx.stroke();
  }
  ctx.restore();
}
obtn.onclick=()=>{showGate();};
let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,0.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</body>
</html>
