<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blaze's Zenith — by Jman350Z & fire team</title>
<meta name="description" content="Reach the zenith! Climb the volcano. A Fire Babys climber.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#lvlSel{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.lvlBtn{width:48px;height:48px;border-radius:12px;border:3px solid #ff6a1a;background:#141024;color:#ffd23f;font-size:16px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⛰️ 0m</div>
<div class="pill" id="level">PEAK 1/4</div>
<div class="pill" id="best">🏆 0m</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">⛰️ BLAZE'S ZENITH</h1>
<div id="obody"><p>Climb the volcano!</p><p><b>TAP LEFT/RIGHT</b> side of screen (or <b>◀ ▶</b>) to hop between platforms! Grab ⭐, avoid 🪨 crumbling rocks. Reach the peak flag 4 times!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Climb high — smoke rises, stay low!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  hop(){tone(500,700,0.08,'square',0.09);},
  star(){tone(900,1400,0.1,'sine',0.1);},
  crumble(){tone(250,120,0.2,'sawtooth',0.1);},
  fall(){tone(400,80,0.5,'sawtooth',0.14);},
  peak(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
const PEAKS=4;
const G={state:'title',peak:1,score:0,best:0,
  plats:[],px:0,py:0,vx:0,vy:0,platIdx:0,
  camY:0,height:0,time:0,dead:false,flagY:0};
try{G.best=parseInt(localStorage.getItem('zenith_best')||'0',10)||0;}catch(e){}
function genPeak(n){
  G.plats=[];G.camY=0;G.height=0;G.dead=false;G.time=0;
  G.vx=0;G.vy=0;
  const gap=Math.max(120,170-n*12);
  let y=H*0.85;
  // start platform
  G.plats.push({x:W/2,y,w:110,type:'solid',t:0});
  let x=W/2;
  const total=14+n*3;
  for(let i=1;i<total;i++){
    x+=(Math.random()-0.5)*W*0.5;
    x=Math.max(70,Math.min(W-70,x));
    y-=gap*(0.85+Math.random()*0.3);
    const r=Math.random();
    const type=r<0.12?'crumble':r<0.24?'move':'solid';
    G.plats.push({x,y,w:type==='move'?100:80+Math.random()*50,type,t:Math.random()*6,phase:Math.random()*6,dir:Math.random()<0.5?-1:1});
    if(Math.random()<0.4)G.plats[G.plats.length-1].star={x:x+(Math.random()-0.5)*60,y:y-50,t:Math.random()*6};
  }
  G.flagY=y-80;
  G.platIdx=0;
  G.px=W/2;G.py=H*0.85-20;
  document.getElementById('level').textContent=`PEAK ${n}/${PEAKS}`;
  updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent='⛰️ '+Math.floor(G.height)+'m';
  document.getElementById('best').textContent='🏆 '+Math.floor(G.best)+'m';
}
function hop(dir){
  if(G.state!=='play'||G.dead)return;
  G.vx=dir*330;
  G.vy=-640;
  sfx.hop();
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  hop(e.clientX-rect.left<W/2?-1:1);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')hop(-1);
  if(e.key==='ArrowRight'||e.key==='d')hop(1);
});
const particles=[];
for(let i=0;i<80;i++)particles.push({a:false});
function update(dt){
  G.time+=dt;
  // move platforms
  for(const p of G.plats){
    p.t+=dt;
    if(p.type==='move')p.x+=p.dir*90*dt;
    if(p.x<60||p.x>W-60)p.dir*=-1;
    if(p.star)p.star.t+=dt*3;
  }
  // physics
  G.vy+=1700*dt;
  G.px+=G.vx*dt;G.py+=G.vy*dt;
  G.vx*=Math.pow(0.3,dt);
  // wrap x
  if(G.px<-20)G.px=W+20;
  if(G.px>W+20)G.px=-20;
  // land on platforms (falling only)
  if(G.vy>0){
    for(let i=0;i<G.plats.length;i++){
      const p=G.plats[i];
      const pw=p.w/2;
      if(G.px>p.x-pw&&G.px<p.x+pw&&G.py>p.y-6&&G.py<p.y+16){
        G.py=p.y-6;G.vy=0;
        if(p.type==='crumble'&&!p.crumbling){
          p.crumbling=true;p.crT=0.35;sfx.crumble();
        }
        break;
      }
    }
  }
  // crumble
  for(let i=G.plats.length-1;i>=0;i--){
    const p=G.plats[i];
    if(p.crumbling){
      p.crT-=dt;
      if(p.crT<=0)G.plats.splice(i,1);
    }
  }
  // stars
  for(const p of G.plats){
    if(p.star&&!p.star.taken&&Math.hypot(G.px-p.star.x,G.py-p.star.y)<32){
      p.star.taken=true;sfx.star();G.score+=25;
      for(let j=0;j<6;j++){const pt=particles.find(pt=>!pt.a);if(!pt)break;
        pt.a=true;pt.x=p.star.x;pt.y=p.star.y;const a=Math.random()*Math.PI*2;
        pt.vx=Math.cos(a)*160;pt.vy=Math.sin(a)*160;
        pt.life=0.4;pt.max=0.4;pt.color='#ffd23f';pt.size=3;}
    }
  }
  // camera + height
  const screenY=G.py-G.camY;
  if(screenY<H*0.4){
    G.camY-=(H*0.4-screenY);
    const h=Math.floor(-G.camY/10);
    if(h>G.height){G.height=h;updateHUD();}
  }
  // peak reached
  if(G.py-G.camY<G.flagY-G.camY-(-G.camY)+0){/*noop*/}
  const flagScreenY=G.flagY+G.camY;
  if(G.py< G.flagY){
    peakDone();return;
  }
  // fell
  if(G.py-G.camY>H+80){
    G.dead=true;sfx.fall();
    const isBest=G.height>G.best;
    if(isBest){G.best=G.height;try{localStorage.setItem('zenith_best',String(Math.floor(G.best)));}catch(e){}}
    setTimeout(()=>{
      showOverlay('💥 YOU FELL!',
        `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">${Math.floor(G.height)}m</p><p>Best: ${Math.floor(G.best)}m</p>`,
        '🔥 Fire Safety: Climb carefully!',
        '↻ CLIMB AGAIN',()=>{genPeak(G.peak);G.state='play';});
    },600);
    return;
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
}
function peakDone(){
  G.score+=150;updateHUD();sfx.peak();
  setTimeout(()=>{
    if(G.peak>=PEAKS){
      const isBest=G.height>G.best;
      if(isBest){G.best=G.height;try{localStorage.setItem('zenith_best',String(Math.floor(G.best)));}catch(e){}}
      showOverlay('🏆 ZENITH REACHED!',
        `<p style="font-size:24px;font-weight:900">Height: ${Math.floor(G.height)}m</p><p>Score: ${G.score}</p><p>All 4 peaks conquered!</p>`,
        '🔥 Fire Safety: You\'re a champion!',
        '↻ CLIMB AGAIN',()=>{G.score=0;G.peak=1;genPeak(1);G.state='play';});
    }else{
      showOverlay(`⛰️ PEAK ${G.peak} CONQUERED!`,
        `<p>+150 pts!</p><p>Height: ${Math.floor(G.height)}m</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Keep climbing!',
        '▶ NEXT PEAK',()=>{G.peak++;genPeak(G.peak);G.state='play';});
    }
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='⛰️ PICK PEAK';
  let h='';
  for(let i=1;i<=PEAKS;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Hop to the flag at the top!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();G.score=0;G.peak=n;G.height=0;genPeak(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;
  obtn.textContent=btn;obtn.style.display='';
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  // sky changes with altitude
  const alt=Math.min(1,-G.camY/4000);
  bg.addColorStop(0,alt>0.6?'#0d1a3a':'#1a0f24');
  bg.addColorStop(1,'#0d0a14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const offY=-G.camY;
  // volcano sides
  ctx.fillStyle='#1a0f0a';
  ctx.beginPath();ctx.moveTo(0,H);
  for(let y=0;y<H+100;y+=50){
    const t=(y-offY)/800;
    ctx.lineTo(Math.max(0,60-t*40),y);
  }
  ctx.lineTo(0,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,H);
  for(let y=0;y<H+100;y+=50){
    const t=(y-offY)/800;
    ctx.lineTo(Math.min(W,W-60+t*40),y);
  }
  ctx.lineTo(W,0);ctx.closePath();ctx.fill();
  // stars in sky
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<30;i++){
    const sy=((i*173)%2000+offY*0.3)%(H+100)-50;
    ctx.fillRect((i*271)%W,sy,2,2);
  }
  // platforms
  for(const p of G.plats){
    const sy=p.y+offY;
    if(sy<-60||sy>H+60)continue;
    const pw=p.w/2;
    let col1='#5a4a3a',col2='#2a1e12';
    if(p.type==='crumble'){col1='#8a6a4a';col2='#4a3a22';}
    if(p.type==='move'){col1='#4a6a8a';col2='#2a3a52';}
    const alpha=p.crumbling?Math.max(0.2,p.crT/0.35):1;
    ctx.globalAlpha=alpha;
    const g=ctx.createLinearGradient(0,sy-12,0,sy+12);
    g.addColorStop(0,col1);g.addColorStop(1,col2);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(p.x-pw,sy-12,pw*2,24,8);ctx.fill();
    if(p.type==='crumble'){
      ctx.fillStyle='rgba(0,0,0,0.3)';
      for(let c=0;c<3;c++)ctx.fillRect(p.x-pw+10+c*24,sy-6,3,12);
    }
    ctx.globalAlpha=1;
    if(p.star&&!p.star.taken){
      const bob=Math.sin(p.star.t)*4;
      ctx.save();ctx.translate(p.star.x,p.star.y+bob+offY);
      ctx.scale(Math.abs(Math.cos(p.star.t*0.5))*0.4+0.6,1);
      const sg=ctx.createRadialGradient(-4,-4,2,0,0,12);
      sg.addColorStop(0,'#fff');sg.addColorStop(0.5,'#ffd23f');sg.addColorStop(1,'#a37a00');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  // flag
  const fsy=G.flagY+offY;
  if(fsy>-60&&fsy<H+60){
    ctx.strokeStyle='#fff';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(W/2,fsy);ctx.lineTo(W/2,fsy-70);ctx.stroke();
    const wave=Math.sin(G.time*6)*6;
    ctx.fillStyle='#4caf50';
    ctx.beginPath();ctx.moveTo(W/2,fsy-70);ctx.lineTo(W/2+44+wave,fsy-58);ctx.lineTo(W/2,fsy-46);ctx.closePath();ctx.fill();
  }
  // player
  if(!G.dead){
    const py=G.py+offY;
    if(py>-40&&py<H+40){
      ctx.save();ctx.translate(G.px,py);
      const squash=G.vy>0?1.08:0.95;
      ctx.scale(1/squash,squash);
      const g=ctx.createRadialGradient(-7,-7,3,0,0,19);
      g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-8,17,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2b1a0e';
      ctx.beginPath();ctx.arc(-6,-12,3.2,0,Math.PI*2);ctx.arc(6,-12,3.2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y+offY,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(G.state==='play'&&G.time<3){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 17px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP LEFT / RIGHT TO HOP!',W/2,H*0.5);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+Math.floor(G.best)+'m';
requestAnimationFrame(loop);
</script>
</body>
</html>
