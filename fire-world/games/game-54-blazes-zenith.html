<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blaze's Zenith — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0c0a14;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,16,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#ffd23f;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #ffd23f;padding:6px;background:#1c1410;color:#fff}
#gate button,#startBtn{background:#8a6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:center;gap:20px;color:#ffd23f;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud"><span id="s1">🟠 0</span><span id="s2">⚫ 0</span><span>⏱ <span id="tm">60</span></span></div>
<canvas id="c"></canvas>
<div id="ov">
<h1>⚡ BLAZE'S ZENITH</h1>
<p>Arena bumper! Ram the smoke puff rivals out of the ring. You vs 2 AI — most knockouts in 60 seconds takes the crown!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Bumping is for games — in real life, keep your hands to yourself!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=3+Math.floor(Math.random()*4),n2=3+Math.floor(Math.random()*4);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',me,foes=[],parts=[],time=60,shake=0,s1=0,s2=0;
const R=()=>Math.min(W,H)*.36,CX=()=>W/2,CY=()=>H/2;
function start(){state='play';time=60;s1=0;s2=0;parts=[];
  me={x:CX()-70,y:CY(),vx:0,vy:0,r:28,me:true};
  foes=[{x:CX()+70,y:CY()-50,vx:0,vy:0,r:28,t:0},{x:CX()+30,y:CY()+80,vx:0,vy:0,r:28,t:3}];
  ov.classList.add('hidden');}
function end(){state='over';const w=s1>s2?'🟠 YOU WIN THE CROWN!':s1<s2?'⚫ RIVALS WIN!':'🤝 TIE!';
  ov.innerHTML=`<h1>${w}</h1><p>Knockouts — You: <b>${s1}</b> · Rivals: <b>${s2}</b></p><div class="lesson">🔥 Fire Safety: Bumping is for games — in real life, keep your hands to yourself!</div><button onclick="location.reload()" style="background:#8a6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c){for(let i=0;i<16;i++){const a=Math.random()*7,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c});}}
function ko(b){
  boom(b.x,b.y,'#ffd23f');beep(220,.3,'sawtooth');shake=14;
  if(b.me){s2++;document.getElementById('s2').textContent='⚫ '+s2;b.x=CX()-70;b.y=CY();}
  else{s1++;document.getElementById('s1').textContent='🟠 '+s1;b.x=CX()+60;b.y=CY();}
  b.vx=b.vy=0;
}
function update(dt){
  if(state!=='play')return;time-=dt;shake*=.9;
  document.getElementById('tm').textContent=Math.ceil(time);
  if(time<=0){end();return;}
  const sp=950*dt;
  if(k.l)me.vx-=sp;if(k.r)me.vx+=sp;if(k.u)me.vy-=sp;if(k.d)me.vy+=sp;
  if(tc.x!==null){me.vx+=(tc.x-me.x)*7*dt;me.vy+=(tc.y-me.y)*7*dt;}
  [me,...foes].forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.986;b.vy*=.986;
    if(Math.hypot(b.x-CX(),b.y-CY())>R())ko(b);});
  foes.forEach(f=>{f.t+=dt;const dx=me.x-f.x,dy=me.y-f.y,d=Math.hypot(dx,dy)||1;
    f.vx+=dx/d*520*dt;f.vy+=dy/d*520*dt;
    if(Math.hypot(f.x-CX(),f.y-CY())>R()*.82){f.vx+=(CX()-f.x)*4*dt;f.vy+=(CY()-f.y)*4*dt;}});
  const all=[me,...foes];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=a.r+b.r;
    if(d<mn&&d>0){const nx=dx/d,ny=dy/d,p=300;a.vx-=nx*p*dt*8;a.vy-=ny*p*dt*8;b.vx+=nx*p*dt*8;b.vy+=ny*p*dt*8;beep(320,.07,'square');boom((a.x+b.x)/2,(a.y+b.y)/2,'#fff');}
  }
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.4;});parts=parts.filter(p=>p.life>0);
}
function drawB(x,y,r,smoke){ctx.save();ctx.translate(x,y);
  if(smoke){ctx.fillStyle='rgba(100,100,100,.92)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ff3b2e';ctx.beginPath();ctx.arc(-8,-4,5,0,7);ctx.arc(8,-4,5,0,7);ctx.fill();}
  else{const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,'#ffd23f');g.addColorStop(1,'#e63900');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-3,6,0,7);ctx.arc(8,-3,6,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-8,-2,3,0,7);ctx.arc(8,-2,3,0,7);ctx.fill();}
  ctx.restore();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle='#0c0a14';ctx.fillRect(-20,-20,W+40,H+40);
  const g=ctx.createRadialGradient(CX(),CY(),R()*.3,CX(),CY(),R());
  g.addColorStop(0,'#241a30');g.addColorStop(1,'#120c1c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX(),CY(),R(),0,7);ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=6;ctx.setLineDash([16,10]);ctx.beginPath();ctx.arc(CX(),CY(),R(),0,7);ctx.stroke();ctx.setLineDash([]);
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,6*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  foes.forEach(f=>drawB(f.x,f.y,f.r,true));drawB(me.x,me.y,me.r,false);
}
let k={l:0,r:0,u:0,d:0},tc={x:null,y:null},last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')k.l=1;if(e.key==='ArrowRight')k.r=1;if(e.key==='ArrowUp')k.u=1;if(e.key==='ArrowDown')k.d=1;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')k.l=0;if(e.key==='ArrowRight')k.r=0;if(e.key==='ArrowUp')k.u=0;if(e.key==='ArrowDown')k.d=0;});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tc.x=e.clientX-r.left;tc.y=e.clientY-r.top;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(tc.x===null)return;const r=cv.getBoundingClientRect();tc.x=e.clientX-r.left;tc.y=e.clientY-r.top;});
cv.addEventListener('pointerup',()=>tc.x=null);
</script>
</body>
</html>
