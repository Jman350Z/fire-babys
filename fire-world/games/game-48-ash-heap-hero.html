<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ash Heap Hero — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#14100a;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(14,10,5,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#b0a090;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #b0a090;padding:6px;background:#221a10;color:#fff}
#gate button,#startBtn{background:#6a5a4a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
#tapzone{position:fixed;bottom:0;left:0;right:0;height:34%;z-index:6;display:flex;align-items:center;justify-content:center}
#tapbtn{background:rgba(255,106,0,.25);border:4px dashed #ff6a00;color:#ffd23f;font-size:26px;font-weight:900;border-radius:24px;padding:26px 50px;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">TUG! <span id="rope">————🪢————</span></div>
<canvas id="c"></canvas>
<div id="tapzone" class="hidden"><div id="tapbtn">👆 TAP TAP TAP!</div></div>
<div id="ov">
<h1>🪢 ASH HEAP HERO</h1>
<p>Tug-of-war! RAPIDLY TAP to pull the rope and drag the boulder over YOUR line before the rival team does. Fastest fingers win!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Teamwork saves lives! In an emergency, help each other get to safety!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),tapzone=document.getElementById('tapzone'),ropeEl=document.getElementById('rope');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=2+Math.floor(Math.random()*6),n2=2+Math.floor(Math.random()*6);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',pos=0,parts=[],shake=0,time=30,lastTap=0,tapPow=0;
function start(){state='play';pos=0;parts=[];time=30;tapPow=0;ov.classList.add('hidden');tapzone.classList.remove('hidden');}
function end(win){state='over';tapzone.classList.add('hidden');
  ov.innerHTML=`<h1>${win?'🏆 YOU PULLED IT!':'💪 RIVALS WIN!'}</h1><p>${win?'Your team dragged the boulder home!':'The rival team was stronger this time.'}</p><div class="lesson">🔥 Fire Safety: Teamwork saves lives! In an emergency, help each other get to safety!</div><button onclick="location.reload()" style="background:#6a5a4a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ PLAY AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c){for(let i=0;i<10;i++){const a=Math.random()*7,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,c});}}
function tap(){
  if(state!=='play')return;
  const now=performance.now(),dt=(now-lastTap)/1000;lastTap=now;
  tapPow=Math.min(14,8+Math.max(0,(0.35-dt))*20);
  pos-=tapPow;shake=Math.max(shake,7);boom(W/2+pos,H*.45,'#ffd23f');
  beep(300+Math.random()*200,.08,'square');
}
function update(dt){
  if(state!=='play')return;time-=dt;shake*=.9;
  pos+=dt*(26+Math.sin(time*2)*8); // rival pull
  tapPow*=.94;
  const L=W*.32;
  if(pos<=-L){end(true);return;}
  if(pos>=L){end(false);return;}
  if(time<=0){end(pos<0);return;}
  ropeEl.textContent='—'.repeat(Math.max(1,8-Math.round(pos/20)))+'🪨'+'—'.repeat(Math.max(1,8+Math.round(pos/20)));
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function baby(x,y,r,c1,c2){ctx.save();ctx.translate(x,y);const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.3,-r*.1,r*.2,0,7);ctx.arc(r*.3,-r*.1,r*.2,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.3,-r*.08,r*.09,0,7);ctx.arc(r*.3,-r*.08,r*.09,0,7);ctx.fill();ctx.restore();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14100a');g.addColorStop(1,'#2a2015');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  const cy=H*.45,L=W*.32;
  // ground lines
  ctx.strokeStyle='#ff3b2e';ctx.lineWidth=5;ctx.setLineDash([12,8]);
  ctx.beginPath();ctx.moveTo(W/2-L,cy-70);ctx.lineTo(W/2-L,cy+70);ctx.stroke();
  ctx.strokeStyle='#7dff9a';ctx.beginPath();ctx.moveTo(W/2+L,cy-70);ctx.lineTo(W/2+L,cy+70);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('RIVALS',W/2-L,cy-84);ctx.fillText('YOU',W/2+L,cy-84);
  // rope
  ctx.strokeStyle='#c9a06a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(W*.08,cy);ctx.lineTo(W*.92,cy);ctx.stroke();
  // boulder
  const bx=W/2+pos;
  const bg2=ctx.createRadialGradient(bx-10,cy-10,5,bx,cy,34);bg2.addColorStop(0,'#a09a8a');bg2.addColorStop(1,'#4a443a');
  ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(bx,cy,32,0,7);ctx.fill();ctx.strokeStyle='#2a2520';ctx.lineWidth=3;ctx.stroke();
  // teams pulling
  for(let i=0;i<3;i++){baby(W*.12+i*44,cy+(i%2?26:-26),20,'#7db4ff','#1e5ac4');baby(W*.88-i*44,cy+(i%2?-26:26),20,'#ffd23f','#e63900');}
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  ctx.fillStyle='#ffd23f';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('⏱ '+Math.ceil(time)+'s',W/2,40);
}
let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
tapzone.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{if(e.key===' ')tap();});
</script>
</body>
</html>
