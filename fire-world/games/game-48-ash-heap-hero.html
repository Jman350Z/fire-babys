<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ash Heap Hero — by Jman350Z & fire team</title>
<meta name="description" content="Sort the ash heap! Be a cleanup hero. A Fire Babys sorting game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#timebar{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(300px,70vw);height:12px;background:rgba(0,0,0,.5);border-radius:6px;z-index:5;pointer-events:none;overflow:hidden}
#timefill{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);border-radius:6px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#aee2ff}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="streak">🔥 0 streak</div>
<div class="pill" id="best">🏆 0</div>
</div>
<div id="timebar"><div id="timefill"></div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🦸 ASH HEAP HERO</h1>
<div id="obody"><p>Clean up the ash heap!</p><p><b>DRAG</b> each falling item into the correct bin! 🔥 Burnables, ♻️ Recyclables, 🗑️ Trash. Sort fast — wrong bin loses points! 90 seconds on the clock!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Be a hero — keep your home clean and safe!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  good(){tone(600,900,0.1,'triangle',0.11);},
  bad(){tone(350,150,0.18,'sawtooth',0.12);},
  tick(){tone(800,800,0.05,'square',0.07);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const ITEMS=[
  {e:'📰',bin:1,name:'Newspaper'},{e:'🍌',bin:2,name:'Banana peel'},
  {e:'🪵',bin:0,name:'Wood'},{e:'🥤',bin:1,name:'Cup'},
  {e:'📦',bin:1,name:'Box'},{e:'🧦',bin:2,name:'Sock'},
  {e:'🕯️',bin:0,name:'Candle'},{e:'🔋',bin:2,name:'Battery'},
  {e:'🍎',bin:2,name:'Apple core'},{e:'📄',bin:1,name:'Paper'},
  {e:'🪨',bin:2,name:'Rock'},{e:'🧻',bin:0,name:'Tissue'},
];
const BINS=[
  {e:'🔥',label:'BURN',color:'#ff6a1a'},
  {e:'♻️',label:'RECYCLE',color:'#4caf50'},
  {e:'🗑️',label:'TRASH',color:'#7a7a8a'},
];
const G={state:'title',score:0,best:0,streak:0,bestStreak:0,
  time:90,items:[],spawnT:0.8,drag:null,time:0};
try{G.best=parseInt(localStorage.getItem('sort_best')||'0',10)||0;}catch(e){}
const DUR=90;
function binRect(i){
  const bw=W*0.28,bh=110,gap=W*0.04;
  const totalW=bw*3+gap*2;
  const x=(W-totalW)/2+i*(bw+gap);
  return{x,y:H-bh-70,w:bw,h:bh};
}
function reset(){
  G.score=0;G.streak=0;G.bestStreak=0;G.time=DUR;
  G.items=[];G.spawnT=0.5;G.drag=null;
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('streak').textContent=`🔥 ${G.streak} streak`;
  document.getElementById('timefill').style.width=(G.time/DUR*100)+'%';
}
function spawnItem(){
  const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  G.items.push({...it,x:60+Math.random()*(W-120),y:-40,vy:90+Math.random()*60+G.time*0.5,t:Math.random()*6});
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    if(Math.hypot(x-it.x,y-it.y)<40){
      G.drag={it,ox:x-it.x,oy:y-it.y};
      G.items.splice(i,1);G.items.push(it); // to front
      canvas.setPointerCapture(e.pointerId);
      return;
    }
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!G.drag)return;
  const rect=canvas.getBoundingClientRect();
  G.drag.it.x=e.clientX-rect.left-G.drag.ox;
  G.drag.it.y=e.clientY-rect.top-G.drag.oy;
  G.drag.it.held=true;
});
canvas.addEventListener('pointerup',e=>{
  const d=G.drag;if(!d)return;
  G.drag=null;
  const it=d.it;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  let binned=-1;
  for(let i=0;i<3;i++){
    const b=binRect(i);
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)binned=i;
  }
  if(binned>=0){
    if(binned===it.bin){
      G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);
      const pts=10+G.streak*2;
      G.score+=pts;sfx.good();
      spawnText(it.x,it.y,'+'+pts,'#4caf50');
      burst(it.x,it.y,BINS[binned].color,8);
    }else{
      G.streak=0;G.score=Math.max(0,G.score-15);sfx.bad();
      spawnText(it.x,it.y,'WRONG! -15','#ff4a5a');
    }
    it.gone=true;
    updateHUD();
  }else{
    it.held=false;
  }
});
const particles=[],floaters=[];
for(let i=0;i<80;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*180;p.vy=Math.sin(a)*180;
    p.life=0.4;p.max=0.4;p.color=color;p.size=3;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function update(dt){
  G.time-=dt;
  if(G.time<=10&&Math.floor(G.time)!==Math.floor(G.time+dt))sfx.tick();
  if(G.time<=0){gameOver();return;}
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.items.length<6){
    spawnItem();
    const elapsed=DUR-G.time;
    G.spawnT=Math.max(0.5,1.1-elapsed*0.006);
  }
  for(const it of G.items){
    if(it===G.drag?.it)continue;
    if(!it.held){
      it.y+=it.vy*dt;it.t+=dt*3;
      // fell to bottom = miss
      if(it.y>H-60){
        it.gone=true;G.streak=0;
        spawnText(it.x,H-100,'MISSED!','#ff4a5a');
        updateHUD();
      }
    }
  }
  G.items=G.items.filter(it=>!it.gone);
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  if(Math.random()<0.1)updateHUD();
}
function gameOver(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('sort_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('⏰ TIME UP!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Best streak: ${G.bestStreak}</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Be a cleanup hero!',
      '↻ PLAY AGAIN',()=>{reset();G.state='play';});
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1420');bg.addColorStop(1,'#141a24');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // bins
  for(let i=0;i<3;i++){
    const b=binRect(i),B=BINS[i];
    const isHover=G.drag&&(()=>{const it=G.drag.it;return it.x>b.x&&it.x<b.x+b.w&&it.y>b.y&&it.y<b.y+b.h;})();
    ctx.fillStyle=isHover?B.color:'rgba(255,255,255,0.06)';
    ctx.globalAlpha=isHover?0.35:1;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,14);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=B.color;ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,14);ctx.stroke();
    ctx.font='34px system-ui';ctx.textAlign='center';
    ctx.fillText(B.e,b.x+b.w/2,b.y+48);
    ctx.fillStyle=B.color;ctx.font='900 14px system-ui';
    ctx.fillText(B.label,b.x+b.w/2,b.y+74);
    ctx.textAlign='left';
  }
  // items
  for(const it of G.items){
    const bob=it.held?0:Math.sin(it.t)*4;
    const isDrag=it===G.drag?.it;
    ctx.save();
    if(isDrag){ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=16;ctx.scale(1.25,1.25);}
    ctx.translate(it.x,it.y+bob);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath();ctx.arc(0,0,32,0,Math.PI*2);ctx.fill();
    ctx.font='36px system-ui';ctx.textAlign='center';
    ctx.fillText(it.e,0,13);ctx.textAlign='left';
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  if(G.state==='play'&&G.time>DUR-5){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 16px system-ui';ctx.textAlign='center';
    ctx.fillText('DRAG ITEMS INTO THE RIGHT BIN!',W/2,H*0.4);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play')update(dt);
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
