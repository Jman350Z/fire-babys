<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://firebabys.io/auth-gate.js"></script>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruko's Dash Blitz — by Jman350Z & fire team</title>
<meta name="description" content="Dash through obstacles! Fast endless runner. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#ctl{position:fixed;top:56px;right:12px;z-index:15;display:flex;gap:8px}
#ctl button{width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;border:2px solid rgba(255,255,255,.35);font-size:20px;cursor:pointer}
</style>
<style data-fbvis-cycle1>
/* fbvis-cycle1: premium chrome pass — accent #4a90d9 / glow #aee2ff, presentation only */
:root{--fbacc:#4a90d9;--fbglow:#aee2ff}
body{background:radial-gradient(120% 90% at 50% 0%,rgba(74,144,217,0.13),transparent 55%),radial-gradient(110% 100% at 50% 115%,rgba(74,144,217,0.09),transparent 60%),#140a06}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #aee2ff;outline-offset:2px;border-radius:6px}
.pill{background:linear-gradient(180deg,rgba(34,18,9,.85),rgba(14,7,3,.85));border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);text-shadow:0 1px 2px rgba(0,0,0,.65)}
#overlay{background:radial-gradient(90% 62% at 50% 28%,rgba(74,144,217,0.2),transparent 65%),radial-gradient(120% 100% at 50% 118%,rgba(0,0,0,.5),transparent 60%),linear-gradient(180deg,rgba(26,12,5,.96),rgba(13,6,3,.97))}
#overlay h1{filter:drop-shadow(0 3px 16px rgba(74,144,217,0.45))}
#overlay button{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
#overlay button:hover:not(:active){filter:brightness(1.08);transform:translateY(-1px)}
#overlay .lesson{border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#mathgate{border:1px solid rgba(74,144,217,0.55);box-shadow:0 8px 22px rgba(0,0,0,.4)}
#mathgate input{transition:border-color .12s ease,box-shadow .12s ease}
#mathgate input:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,0.35);outline:none}
#back{background:linear-gradient(180deg,rgba(34,18,9,.88),rgba(14,7,3,.88));border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);transition:filter .12s ease,transform .12s ease}
#back:hover{filter:brightness(1.35)}
@media (prefers-reduced-motion:reduce){#overlay button,.lvlBtn,#back,#sysbtns button,#ctlBtns button,.btn,.dbtn,.abtn{transition:none}}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="dist">📏 0m</div>
<div class="pill" id="best">🏆 0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="ctl"><button id="pauseBtn" aria-label="Pause">⏸</button><button id="muteBtn" aria-label="Mute sound">🔊</button></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">⚡ RUKO'S DASH BLITZ</h1>
<div id="obody"><p>Run as fast as you can!</p><p><b>TAP</b> or press <b>SPACE</b> to jump! <b>SWIPE DOWN / S</b> to slide! Dodge rocks, jump gaps, slide under barriers. Grab ⚡ for a dash boost!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: When escaping fire, stay low and move fast!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){if(window.__muted)return;const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  jump(){tone(400,750,0.1,'square',0.09);},
  slide(){tone(600,300,0.12,'sine',0.08);},
  dash(){tone(300,1200,0.25,'sawtooth',0.1);},
  coin(){tone(900,1400,0.08,'sine',0.09);},
  die(){tone(400,80,0.4,'sawtooth',0.15);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,dist:0,speed:420,
  py:0,vy:0,sliding:0,dashing:0,dashCD:0,
  obs:[],coins:[],spawnT:1,time:0,shake:0,dead:false,bonus:0,slideQ:0,flash:0};
try{G.best=parseInt(localStorage.getItem('dash_best')||'0',10)||0;}catch(e){}
const GY=()=>H*0.78;
function reset(){
  G.score=0;G.dist=0;G.speed=420;G.py=GY();G.vy=0;
  G.sliding=0;G.dashing=0;G.dashCD=0;G.obs=[];G.coins=[];G.bonus=0;G.slideQ=0;
  G.spawnT=0.8;G.time=0;G.shake=0;G.dead=false;G.flash=0;
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('dist').textContent='📏 '+Math.floor(G.dist)+'m';
}
function spawnObs(){
  const r=Math.random();
  let type='rock';
  if(r<0.25)type='barrier';
  else if(r<0.35)type='gap';
  else if(r<0.42)type='boost';
  const x=W+60;
  if(type==='gap'){
    G.obs.push({type,x,w:120});
  }else if(type==='boost'){
    G.coins.push({x,y:GY()-60,t:0,boost:true});
  }else{
    const h=type==='barrier'?70:54;
    G.obs.push({type,x,w:type==='barrier'?90:54,h});
  }
  // coin arc
  if(Math.random()<0.6){
    const cx=x+Math.random()*200;
    for(let i=0;i<3;i++)G.coins.push({x:cx+i*34,y:GY()-70-Math.sin(i/2*Math.PI)*40,t:i,boost:false});
  }
}
function doJump(){
  if(G.state!=='play'||G.dead)return;
  if(G.py>=GY()-2){G.vy=-820;sfx.jump();}
}
function doSlide(){
  if(G.state!=='play'||G.dead)return;
  if(G.sliding<=0&&G.py>=GY()-2){G.sliding=0.55;sfx.slide();}
  else if(G.py<GY()-2)G.slideQ=0.35; // pressed mid-air: slide on landing
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();swY=e.clientY;doJump();});
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'){doJump();e.preventDefault();}
  if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')doSlide();
});
// swipe detection
let swY=null;
canvas.addEventListener('pointermove',e=>{
  if(swY===null)swY=e.clientY;
  if(e.clientY-swY>50){G.vy=Math.max(G.vy,1000);G.slideQ=0.35;swY=e.clientY;}
});
canvas.addEventListener('pointerup',e=>{
  if(swY!==null&&e.clientY-swY>50)doSlide();
  swY=null;
});
const particles=[];
for(let i=0;i<80;i++)particles.push({a:false});
const embers=[];for(let i=0;i<24;i++)embers.push({x:Math.random()*2200,y:Math.random()*1200,s:1+Math.random()*2.5,v:14+Math.random()*26,ph:Math.random()*6.28});
/* [w5c perf] Pre-baked glow sprites — the W5b-proven pattern copied from game-04:
   the ember loop's 24 per-frame shadowBlur=8 fills collapsed FPS under software
   rendering (10.0 FPS); blit a one-time radial-glow sprite instead. Colours,
   falloff and alpha unchanged; no gameplay/balance changes. */
function makeGlowSprite(hex){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const gr=x.createRadialGradient(48,48,0,48,48,48);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.35,`rgba(${r},${g},${b},0.38)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,96,96);return c;}
const EMBER_SPRITE=makeGlowSprite('#ff9a3a');
function drawEmbers(){ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of embers){e.y-=e.v*0.016;e.x+=Math.sin(G.time*0.9+e.ph)*0.3;
    if(e.y<-6){e.y=H+6;e.x=Math.random()*W;}
    const tw=0.5+0.5*Math.sin(G.time*2+e.ph);
    ctx.globalAlpha=0.13+0.22*tw;const r=e.s*7;ctx.drawImage(EMBER_SPRITE,(e.x%(W+12))-r,e.y-r,r*2,r*2);}
  ctx.restore();ctx.globalAlpha=1;}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  G.speed=Math.min(900,420+G.dist*0.35);
  const spd=G.dashing>0?G.speed*1.8:G.speed;
  G.dist+=spd*dt/50;G.score=Math.floor(G.dist)+G.bonus;
  G.dashing=Math.max(0,G.dashing-dt);G.dashCD=Math.max(0,G.dashCD-dt);
  G.sliding=Math.max(0,G.sliding-dt);
  // player physics
  G.vy+=2400*dt;
  G.py+=G.vy*dt;
  if(G.py>=GY()){G.py=GY();G.vy=0;
    if(G.slideQ>0&&G.sliding<=0){G.sliding=0.55;G.slideQ=0;sfx.slide();}}
  G.slideQ=Math.max(0,G.slideQ-dt);
  // spawn
  G.spawnT-=dt*spd/420;
  if(G.spawnT<=0){spawnObs();G.spawnT=Math.max(0.8,1.35-G.dist*0.003)+Math.random()*0.45;}
  const px=W*0.3;
  const phit=G.sliding>0?22:44;
  // obstacles
  for(let i=G.obs.length-1;i>=0;i--){
    const o=G.obs[i];
    o.x-=spd*dt;
    if(o.x<-150){G.obs.splice(i,1);continue;}
    // collision
    if(G.dashing<=0){
      if(o.type==='gap'){
        if(px>o.x&&px<o.x+o.w&&G.py>=GY()-4){
          die();return;
        }
      }else{
        const oh=o.type==='barrier'?54:o.h,oy=o.type==='barrier'?GY()-92:GY()-oh;
        const ix=o.type==='rock'?9:0;
        const pyTop=G.py-phit;
        if(px+18>o.x+ix&&px-18<o.x+o.w-ix&&pyTop<oy+oh&&G.py>oy){
          die();return;
        }
      }
    }
  }
  // coins
  for(let i=G.coins.length-1;i>=0;i--){
    const c=G.coins[i];
    c.x-=spd*dt;c.t+=dt*5;
    if(c.x<-30){G.coins.splice(i,1);continue;}
    if(Math.hypot(px-c.x,G.py-22-c.y)<36){
      G.coins.splice(i,1);
      if(c.boost){G.dashing=1.6;G.dashCD=3;sfx.dash();}
      else{G.bonus+=10;G.score=Math.floor(G.dist)+G.bonus;sfx.coin();}
      updateHUD();
      for(let j=0;j<6;j++){const p=particles.find(p=>!p.a);if(!p)break;
        p.a=true;p.x=c.x;p.y=c.y;p.vx=(Math.random()-0.5)*200;p.vy=(Math.random()-0.5)*200;
        p.life=0.35;p.max=0.35;p.color=c.boost?'#7fd4ff':'#ffd23f';p.size=3;}
    }
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  if(Math.floor(G.dist)!==Math.floor(G.dist-spd*dt/50))updateHUD();
}
function die(){
  if(G.dead)return;
  G.dead=true;sfx.die();G.shake=0.5;G.flash=0.9;
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('dash_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('💥 WIPED OUT!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Distance: ${Math.floor(G.dist)}m</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Stay low and move fast!',
      '↻ RUN AGAIN',()=>{reset();G.state='play';});
  },700);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  window.__paused=false;pauseBtn.textContent='⏸';
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1420');bg.addColorStop(0.7,'#1a2a3a');bg.addColorStop(1,'#0d1420');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawEmbers();
  // parallax
  ctx.fillStyle='rgba(255,255,255,0.06)';
  for(let i=0;i<5;i++){
    const mx=((i*500-G.dist*30)%(W+400)+(W+400))%(W+400)-200;
    ctx.beginPath();ctx.arc(mx,H*0.6,120,Math.PI,0);ctx.fill();
  }
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*14,(Math.random()-0.5)*G.shake*14);
  const gy=GY();
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#3a4a5a');gg.addColorStop(1,'#1a222e');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  for(let x=0;x<W;x+=60){
    const gx=((x-G.dist*60)%(W+60)+(W+60))%(W+60)-30;
    ctx.fillRect(gx,gy+14,34,5);
  }
  // dash speed lines
  if(G.dashing>0){
    ctx.strokeStyle='rgba(127,212,255,0.4)';ctx.lineWidth=3;
    for(let i=0;i<8;i++){
      const ly=Math.random()*H*0.7;
      const lx=Math.random()*W;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+80,ly);ctx.stroke();
    }
  }
  // obstacles
  for(const o of G.obs){
    if(o.type==='gap'){
      ctx.fillStyle='#0d1420';
      ctx.fillRect(o.x,gy,o.w,H-gy);
      ctx.strokeStyle='#ff4a5a';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(o.x,gy);ctx.lineTo(o.x,gy+12);ctx.stroke();
      ctx.beginPath();ctx.moveTo(o.x+o.w,gy);ctx.lineTo(o.x+o.w,gy+12);ctx.stroke();
    }else if(o.type==='barrier'){
      // overhead bar: slide under it (bottom edge at gy-38)
      ctx.fillStyle='#5a3a1a';
      ctx.fillRect(o.x+6,gy-118,6,26);ctx.fillRect(o.x+o.w-12,gy-118,6,26);
      ctx.fillRect(o.x,gy-92,o.w,54);
      ctx.fillStyle='#ff6a1a';
      for(let y=gy-84;y<gy-38;y+=18)ctx.fillRect(o.x+4,y,o.w-8,4);
      ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;
      ctx.strokeRect(o.x,gy-92,o.w,54);
    }else{
      // rock
      ctx.fillStyle='#4a4a5a';
      ctx.beginPath();
      ctx.moveTo(o.x,gy);ctx.lineTo(o.x+o.w/2,gy-o.h);ctx.lineTo(o.x+o.w,gy);ctx.closePath();ctx.fill();
      ctx.fillStyle='#6a6a7a';
      ctx.beginPath();
      ctx.moveTo(o.x+8,gy);ctx.lineTo(o.x+o.w/2,gy-o.h+10);ctx.lineTo(o.x+o.w/2+8,gy);ctx.closePath();ctx.fill();
    }
  }
  // coins
  for(const c of G.coins){
    const bob=Math.sin(c.t)*5;
    if(c.boost){
      ctx.save();ctx.translate(c.x,c.y+bob);
      const pulse=1+Math.sin(c.t*2)*0.15;ctx.scale(pulse,pulse);
      ctx.fillStyle='#7fd4ff';ctx.font='30px system-ui';ctx.textAlign='center';
      ctx.fillText('⚡',0,10);ctx.textAlign='left';
      ctx.restore();
    }else{
      ctx.save();ctx.translate(c.x,c.y+bob);
      ctx.scale(Math.abs(Math.cos(c.t*0.6))*0.5+0.5,1);
      const g=ctx.createRadialGradient(-4,-4,2,0,0,13);
      g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ffd23f');g.addColorStop(1,'#a37a00');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  // player
  const px=W*0.3;
  if(!G.dead){
    ctx.save();ctx.translate(px,G.py);
    if(G.sliding>0)ctx.scale(1.4,0.6);
    if(G.dashing>0){
      ctx.fillStyle='rgba(127,212,255,0.3)';
      ctx.beginPath();ctx.ellipse(-30,0,30,16,0,0,Math.PI*2);ctx.fill();
    }
    const g=ctx.createRadialGradient(-7,-8,4,0,0,22);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.shadowColor='#ff7a2a';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(0,-22,20,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // legs (running)
    const rt=Math.sin(G.time*20)*6;
    ctx.fillStyle='#a33c10';
    if(G.sliding<=0){
      ctx.fillRect(-11,-4+rt,7,10-rt);ctx.fillRect(4,-4-rt,7,10+rt);
    }
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(6,-26,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(G.flash>0){ctx.fillStyle='rgba(255,60,60,'+(0.22*Math.max(0,G.flash)).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

window.__paused=false;window.__muted=false;
const pauseBtn=document.getElementById('pauseBtn'),muteBtn=document.getElementById('muteBtn');
function setPaused(v){if(!['play','countdown'].includes(G.state))return;window.__paused=v;pauseBtn.textContent=v?'▶':'⏸';}
pauseBtn.addEventListener('click',e=>{e.stopPropagation();setPaused(!window.__paused);});
function toggleMute(){window.__muted=!window.__muted;muteBtn.textContent=window.__muted?'🔇':'🔊';}
muteBtn.addEventListener('click',e=>{e.stopPropagation();toggleMute();});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='p'||k==='escape')setPaused(!window.__paused);if(k==='m')toggleMute();});
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(!window.__paused&&G.state==='play'&&!G.dead)update(dt);else if(!window.__paused){G.time+=dt;if(G.flash>0)G.flash-=dt;}
  render();
  if(window.__paused){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.textAlign='center';ctx.fillText('⏸ PAUSED',W/2,H/2);ctx.font='700 17px system-ui';ctx.fillText('Tap ▶ or press P to resume',W/2,H/2+38);ctx.textAlign='left';}
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>

<script id='fbCtlScript'>(function(){function kev(type,key,code){var ev=new KeyboardEvent(type,{key:key,code:code||'',bubbles:true,cancelable:true});(document.body||window).dispatchEvent(ev);}function bind(el){var key=el.getAttribute('data-k'),code=el.getAttribute('data-c');var dn=function(e){e.preventDefault();e.stopPropagation();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){} kev('keydown',key,code);};var up=function(e){if(!el.classList.contains('on'))return;el.classList.remove('on');kev('keyup',key,code);};el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});el.addEventListener('contextmenu',function(e){e.preventDefault();});}document.querySelectorAll('#fbCtl .fbtn').forEach(bind);})();</script>
