<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thermal Track — by Jman350Z & fire team</title>
<meta name="description" content="Trace the track! Stay on the path. A Fire Babys precision game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#lvlSel{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.lvlBtn{width:48px;height:48px;border-radius:12px;border:3px solid #ff6a1a;background:#141024;color:#ffd23f;font-size:16px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="level">LV 1/6</div>
<div class="pill" id="prog">📏 0%</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🛤️ THERMAL TRACK</h1>
<div id="obody"><p>Stay on the track!</p><p><b>DRAG</b> your finger along the glowing track from 🟢 START to 🏁 FINISH! Go off the track 3 times and it's over. Faster = more points!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Stay on track — follow your escape plan!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  tick(){tone(500+G.progress*400,700,0.04,'sine',0.05);},
  off(){tone(300,150,0.2,'sawtooth',0.12);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
// generate winding track
function genTrack(n){
  const pts=[];
  const turns=4+n;
  let x=W*0.5,y=H*0.14;
  pts.push({x,y});
  for(let i=0;i<turns;i++){
    const segH=(H*0.72)/turns;
    const dir=i%2===0?1:-1;
    const nx=W*(0.15+Math.random()*0.7);
    // curve to next
    const steps=24;
    for(let s=1;s<=steps;s++){
      const t=s/steps;
      const cx=x+(nx-x)*t;
      const cy=y+segH*t+Math.sin(t*Math.PI)*20*dir;
      // add wobble
      const wob=Math.sin(t*Math.PI*3+i)*14;
      pts.push({x:cx+wob*0.4,y:cy});
    }
    x=nx;y+=segH;
  }
  return pts;
}
const G={state:'title',level:1,score:0,
  track:[],progress:0,tracing:false,offCount:0,
  startT:0,time:0,shake:0,trail:[]};
function initLevel(n){
  G.level=n;G.track=genTrack(n);
  G.progress=0;G.tracing=false;G.offCount=0;G.trail=[];
  G.time=0;G.shake=0;
  document.getElementById('level').textContent=`LV ${n}/6`;
  document.getElementById('prog').textContent='📏 0%';
  updateHUD();
}
function updateHUD(){document.getElementById('score').textContent='⭐ '+G.score;}
function distToTrack(x,y){
  let best=1e9,bi=0;
  // only check near progress
  const start=Math.max(0,Math.floor(G.progress*G.track.length)-10);
  for(let i=start;i<G.track.length;i++){
    const p=G.track[i];
    const d=Math.hypot(x-p.x,y-p.y);
    if(d<best){best=d;bi=i;}
  }
  return{d:best,idx:bi};
}
const TRACK_W=()=>Math.max(36,64-G.level*4);
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const p0=G.track[0];
  if(Math.hypot(x-p0.x,y-p0.y)<70){
    G.tracing=true;G.startT=performance.now();
    G.trail=[{x,y}];
    canvas.setPointerCapture(e.pointerId);
    sfx.click();
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!G.tracing||G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  G.trail.push({x,y});
  if(G.trail.length>40)G.trail.shift();
  const{d,idx}=distToTrack(x,y);
  const tw=TRACK_W();
  if(d>tw/2+24){
    // off track!
    G.offCount++;G.tracing=false;sfx.off();G.shake=0.4;
    if(G.offCount>=3){
      gameOver(false);return;
    }
    // reset to last good
    const gp=G.track[Math.floor(G.progress*G.track.length)];
    spawnText(W/2,H*0.5,`OFF TRACK! (${3-G.offCount} left)`,'#ff4a5a');
  }else{
    const prog=idx/(G.track.length-1);
    if(prog>G.progress){
      G.progress=prog;
      if(Math.random()<0.3)sfx.tick();
      document.getElementById('prog').textContent='📏 '+Math.floor(prog*100)+'%';
      if(prog>=0.985){
        levelComplete();return;
      }
    }
  }
});
canvas.addEventListener('pointerup',()=>{G.tracing=false;});
canvas.addEventListener('pointercancel',()=>{G.tracing=false;});
const floaters=[];
for(let i=0;i<8;i++)floaters.push({a:false});
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1.4;
}
function levelComplete(){
  G.tracing=false;
  const elapsed=(performance.now()-G.startT)/1000;
  const timeBonus=Math.max(0,Math.round((30-elapsed)*10));
  const pts=200+timeBonus-G.offCount*50;
  G.score+=Math.max(50,pts);updateHUD();sfx.win();
  setTimeout(()=>{
    if(G.level>=6){
      showOverlay('🏆 TRACK MASTER!',
        `<p style="font-size:24px;font-weight:900">Final Score: ${G.score}</p><p>All 6 tracks traced!</p>`,
        '🔥 Fire Safety: You\'re a champion!',
        '↻ PLAY AGAIN',()=>{G.score=0;initLevel(1);G.state='play';});
    }else{
      showOverlay(`⭐ LEVEL ${G.level} COMPLETE!`,
        `<p>Time: ${elapsed.toFixed(1)}s (+${timeBonus} speed bonus)</p><p>Off-track: ${G.offCount}</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Stay on track!',
        '▶ NEXT TRACK',()=>{initLevel(G.level+1);G.state='play';});
    }
  },500);
}
function gameOver(won){
  G.state='over';
  setTimeout(()=>{
    showOverlay('💥 OFF TRACK!',
      `<p>Too many mistakes! Score: ${G.score}</p>`,
      '🔥 Fire Safety: Stay focused!',
      '↻ TRY AGAIN',()=>{initLevel(G.level);G.state='play';});
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='🛤️ PICK TRACK';
  let h='';
  for(let i=1;i<=6;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Trace from start to finish without going off!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();G.score=0;initLevel(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;
  obtn.textContent=btn;obtn.style.display='';
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  ctx.fillStyle='#0d0a14';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  if(!G.track.length){ctx.restore();return;}
  const tw=TRACK_W();
  // track (wide)
  ctx.strokeStyle='rgba(255,210,63,0.18)';ctx.lineWidth=tw+16;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  G.track.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  // track center
  ctx.strokeStyle='rgba(255,210,63,0.5)';ctx.lineWidth=tw;
  ctx.stroke();
  // progress fill
  const pi=Math.floor(G.progress*G.track.length);
  if(pi>1){
    ctx.strokeStyle='#4caf50';ctx.lineWidth=tw*0.7;
    ctx.beginPath();
    for(let i=0;i<=pi;i++){const p=G.track[i];i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
    ctx.stroke();
  }
  // start
  const p0=G.track[0];
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.arc(p0.x,p0.y,26,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';
  ctx.fillText('START',p0.x,p0.y+5);ctx.textAlign='left';
  // finish
  const p1=G.track[G.track.length-1];
  const pulse=1+Math.sin(G.time*4)*0.1;
  ctx.save();ctx.translate(p1.x,p1.y);ctx.scale(pulse,pulse);
  ctx.font='40px system-ui';ctx.textAlign='center';
  ctx.fillText('🏁',0,14);ctx.textAlign='left';
  ctx.restore();
  // finger trail
  if(G.trail.length>1){
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();
    G.trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
  }
  // off count
  ctx.font='20px system-ui';ctx.textAlign='left';
  let ox=16;
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i<3-G.offCount?1:0.25;
    ctx.fillText('❤️',ox,H-24);ox+=28;
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 22px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
    f.y-=30*0.016;f.life-=0.016;
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.progress===0&&!G.tracing){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText('TOUCH 🟢 START AND TRACE!',W/2,H*0.5);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
