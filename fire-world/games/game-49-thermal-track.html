<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}

#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}

<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="level">LV 1/11</div>
<div class="pill" id="prog">📏 0%</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="ctl"><button id="btnPause" title="Pause (P)">⏸</button><button id="btnMute" title="Sound on/off (M)">🔊</button><button id="btnRestart" title="Restart">↻</button></div>
<div id="pausedTxt" class="hidden">⏸ PAUSED</div>

<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🛤️ THERMAL TRACK</h1>
<div id="obody"><p>Stay on the track!</p><p><b>DRAG</b> your finger along the glowing track from 🟢 START to 🏁 FINISH! Go off the track 3 times and it's over. Faster = more points!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Stay on track — follow your escape plan!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
addEventListener('resize',()=>{if(G.track.length&&(Math.abs(W-G._lw)>40||Math.abs(H-G._lh)>160)&&(G.state==='play'||G.state==='title'||G.state==='paused'))initLevel(G.level);});
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){if(window.__mute)return;const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  tick(){tone(500+G.progress*400,700,0.04,'sine',0.05);},
  off(){tone(300,150,0.2,'sawtooth',0.12);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
// generate winding track
function genTrack(n){
  const pts=[];
  const turns=4+n;
  let x=W*0.5,y=H*0.14;
  pts.push({x,y});
  for(let i=0;i<turns;i++){
    const segH=(H*0.72)/turns;
    const dir=i%2===0?1:-1;
    const nx=W*(0.15+Math.random()*0.7);
    // curve to next
    const steps=24;
    for(let s=1;s<=steps;s++){
      const t=s/steps;
      const cx=x+(nx-x)*t;
      const cy=y+segH*t+Math.sin(t*Math.PI)*20*dir;
      // add wobble
      const wob=Math.sin(t*Math.PI*3+i)*14;
      pts.push({x:cx+wob*0.4,y:cy});
    }
    x=nx;y+=segH;
  }
  return pts;
}
const G={state:'title',level:1,score:0,
  track:[],progress:0,tracing:false,offCount:0,
  startT:0,time:0,shake:0,trail:[]};
function initLevel(n){
  G.level=n;G._lw=W;G._lh=H;G.track=genTrack(n);
  G.progress=0;G.tracing=false;G.offCount=0;G.trail=[];
  G.time=0;G.shake=0;
  document.getElementById('level').textContent=`LV ${n}/11`;
  document.getElementById('prog').textContent='📏 0%';
  updateHUD();
}
function updateHUD(){document.getElementById('score').textContent='⭐ '+G.score;}
function distToTrack(x,y){
  let best=1e9,bi=0;
  // only check near progress
  const start=Math.max(0,Math.floor(G.progress*G.track.length)-10);
  for(let i=start;i<G.track.length;i++){
    const p=G.track[i];
    const d=Math.hypot(x-p.x,y-p.y);
    if(d<best){best=d;bi=i;}
  }
  return{d:best,idx:bi};
}
const TRACK_W=()=>Math.max(36,64-G.level*4);
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const p0=G.track[0];
  const pProg=G.track[Math.min(G.track.length-1,Math.floor(G.progress*G.track.length))];
  if(Math.hypot(x-p0.x,y-p0.y)<70||(G.progress>0.02&&Math.hypot(x-pProg.x,y-pProg.y)<80)){
    G.tracing=true;G.startT=performance.now();
    G.trail=[{x,y}];
    canvas.setPointerCapture(e.pointerId);
    sfx.click();
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!G.tracing||G.state!=='play')return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  G.trail.push({x,y});
  if(G.trail.length>40)G.trail.shift();
  const{d,idx}=distToTrack(x,y);
  const tw=TRACK_W();
  if(d>tw/2+24){
    // off track!
    G.offCount++;G.tracing=false;sfx.off();G.shake=0.4;
    if(G.offCount>=3){
      gameOver(false);return;
    }
    // reset to last good
    const gp=G.track[Math.floor(G.progress*G.track.length)];
    spawnText(W/2,H*0.5,`OFF TRACK! (${3-G.offCount} left)`,'#ff4a5a');
  }else{
    const prog=idx/(G.track.length-1);
    if(prog>G.progress){
      G.progress=prog;
      if(Math.random()<0.3)sfx.tick();
      document.getElementById('prog').textContent='📏 '+Math.floor(prog*100)+'%';
      if(prog>=0.985){
        levelComplete();return;
      }
    }
  }
});
canvas.addEventListener('pointerup',()=>{G.tracing=false;});
canvas.addEventListener('pointercancel',()=>{G.tracing=false;});
const floaters=[];
for(let i=0;i<8;i++)floaters.push({a:false});
// [overhaul] ambient living embers — cheap additive-glow particles behind gameplay
const amb=[];
for(let i=0;i<24;i++)amb.push({x:Math.random()*2000,y:Math.random()*2000,s:1+Math.random()*2.2,v:14+Math.random()*26,ph:Math.random()*6.28,on:false});
/* [w5c perf] Pre-baked glow sprites — the W5b-proven pattern copied from game-04:
   the ember loop's 24 per-frame shadowBlur=8 fills collapsed FPS under software
   rendering (10.0 FPS); blit a one-time radial-glow sprite instead. Colours,
   falloff and alpha unchanged; no gameplay/balance changes. */
function makeGlowSprite(hex){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const gr=x.createRadialGradient(48,48,0,48,48,48);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.35,`rgba(${r},${g},${b},0.38)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,96,96);return c;}
const EMBER_SPRITE=makeGlowSprite('#ff9a3a');
function drawEmbers(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of amb){
    if(!e.on){e.on=true;e.x=Math.random()*W;e.y=Math.random()*H;}
    e.y-=e.v/60;e.x+=Math.sin(G.time*1.3+e.ph)*0.18;
    if(e.y<-6){e.y=H+6;e.x=Math.random()*W;}
    const tw=0.55+0.45*Math.sin(G.time*3+e.ph);
    ctx.globalAlpha=0.10+0.14*tw;
    const r=e.s*7;ctx.drawImage(EMBER_SPRITE,e.x-r,e.y-r,r*2,r*2); // [w5c perf] pre-baked glow (was shadowBlur=8 per ember per frame)
  }
  ctx.restore();ctx.globalAlpha=1;
}

function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1.4;
}
function levelComplete(){
  G.tracing=false;G.state='clear';
  const elapsed=(performance.now()-G.startT)/1000;
  const timeBonus=Math.max(0,Math.round((30-elapsed)*10));
  const pts=200+timeBonus-G.offCount*50;
  G.score+=Math.max(50,pts);updateHUD();sfx.win();
  setTimeout(()=>{
    if(G.level>=11){
      showOverlay('🏆 TRACK MASTER!',
        `<p style="font-size:24px;font-weight:900">Final Score: ${G.score}</p><p>All 11 tracks traced!</p>`,
        '🔥 Fire Safety: You\'re a champion!',
        '↻ PLAY AGAIN',()=>{G.score=0;initLevel(1);G.state='play';});
    }else{
      showOverlay(`⭐ LEVEL ${G.level} COMPLETE!`,
        `<p>Time: ${elapsed.toFixed(1)}s (+${timeBonus} speed bonus)</p><p>Off-track: ${G.offCount}</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Stay on track!',
        '▶ NEXT TRACK',()=>{initLevel(G.level+1);G.state='play';});
    }
  },500);
}
function gameOver(won){
  G.state='over';
  setTimeout(()=>{
    showOverlay('💥 OFF TRACK!',
      `<p>Too many mistakes! Score: ${G.score}</p>`,
      '🔥 Fire Safety: Stay focused!',
      '↻ TRY AGAIN',()=>{initLevel(G.level);G.state='play';});
  },500);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='🛤️ PICK TRACK';
  let h='';
  for(let i=1;i<=11;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Trace from start to finish without going off!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();G.score=0;initLevel(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;
  obtn.textContent=btn;obtn.style.display='';
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg49=ctx.createLinearGradient(0,0,0,H);
  bg49.addColorStop(0,'#0d0a1a');bg49.addColorStop(0.55,'#170d26');bg49.addColorStop(1,'#1a0f1a');
  ctx.fillStyle=bg49;ctx.fillRect(0,0,W,H);
  drawEmbers();
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  if(!G.track.length){ctx.restore();return;}
  const tw=TRACK_W();
  // track (wide)
  ctx.strokeStyle='rgba(255,210,63,0.18)';ctx.lineWidth=tw+16;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  G.track.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  // track center
  ctx.strokeStyle='rgba(255,210,63,0.5)';ctx.lineWidth=tw;
  ctx.stroke();
  // progress fill
  const pi=Math.floor(G.progress*G.track.length);
  if(pi>1){
    ctx.shadowColor='#4caf50';ctx.shadowBlur=12;
    ctx.strokeStyle='#4caf50';ctx.lineWidth=tw*0.7;
    ctx.beginPath();
    for(let i=0;i<=pi;i++){const p=G.track[i];i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  // start
  const p0=G.track[0];
  ctx.shadowColor='#4caf50';ctx.shadowBlur=16;
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.arc(p0.x,p0.y,26,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';
  ctx.fillText('START',p0.x,p0.y+5);ctx.textAlign='left';
  // finish
  const p1=G.track[G.track.length-1];
  const pulse=1+Math.sin(G.time*4)*0.1;
  ctx.save();ctx.translate(p1.x,p1.y);ctx.scale(pulse,pulse);
  ctx.font='40px system-ui';ctx.textAlign='center';
  ctx.fillText('🏁',0,14);ctx.textAlign='left';
  ctx.restore();
  // finger trail
  if(G.trail.length>1){
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();
    G.trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
  }
  // off count
  ctx.font='20px system-ui';ctx.textAlign='left';
  let ox=16;
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i<3-G.offCount?1:0.25;
    ctx.fillText('❤️',ox,H-24);ox+=28;
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 22px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
    f.y-=30*(G._dt||0.016);f.life-=(G._dt||0.016);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.progress===0&&!G.tracing){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText('TOUCH 🟢 START AND TRACE!',W/2,H*0.5);
    ctx.textAlign='left';
  }
  if(G.state==='play'&&G.tracing&&G.progress<0.3){ // [gauntlet clarity] goal stays visible into the first stretch of the trace
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 '+(W<520?14:17)+'px system-ui';ctx.textAlign='center'; // [gauntlet fix] sized to fit phone widths
    ctx.fillText('STAY ON THE GLOWING TRACK — REACH THE 🏁!',W/2,H*0.14);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;G.time+=dt;G._dt=dt;
  render();
  requestAnimationFrame(loop);
}

// [gamer-check batch-09] pause / mute / restart controls (P = pause, M = mute)
window.__mute=false;
let __prePause=null;
const __pTxt=document.getElementById('pausedTxt');
function __togglePause(){
  if(G.state==='play'){__prePause='play';G.state='paused';__pTxt.classList.remove('hidden');G.tracing=false;}
  else if(G.state==='paused'){G.state=__prePause||'play';__prePause=null;__pTxt.classList.add('hidden');}
}
document.getElementById('btnPause').onclick=e=>{e.stopPropagation();__togglePause();};
document.getElementById('btnMute').onclick=e=>{e.stopPropagation();window.__mute=!window.__mute;e.currentTarget.textContent=window.__mute?'\u{1F507}':'\u{1F50A}';};
document.getElementById('btnRestart').onclick=e=>{e.stopPropagation();if(G.state==='play'||G.state==='paused'){__pTxt.classList.add('hidden');__prePause=null;initLevel(G.level);G.state='play';}};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='p')__togglePause();if(k==='m')document.getElementById('btnMute').click();});

requestAnimationFrame(loop);
/* ===== MUSIC (Jeff 2026-10-15): 'Track Temperature' — Thermal Track's own
   track. Synthesized Web Audio only. 143 BPM, A major: a racing sawtooth
   lead over a steady four-beat kick — the temperature gauge is pinned.
   This shell has no noise() helper, so the drums are tone-only (the game-02
   Blaze Runner precedent).
   Freeze gate CONFIRMED at insertion (2026-10-15): window.__mute mutes, pause sets G.state='paused', and music
   only plays while G.state==='play' — all read from this shell's own code.
   Starts on first interaction; 🔊 mute + pause freeze it. =====
   INSERT: paste at the end of game-49-thermal-track.html's main
   <script> block (same scope as audio()/tone()/noise()). No extra tags. */
const _mf=m=>440*Math.pow(2,(m-69)/12);
// Freeze gate (insertion-confirmed 2026-10-15): hard-wired to this shell's
// own confirmed globals — window.__mute / G.state. try/catch kept so it can never throw.
const _mGate=()=>{try{return !!(window.__mute||G.state!=='play');}catch(e){return false;}};
const MUS={on:false,step:0,nextT:0,BPM:143,
 BASS:[45,45,0,45,45,0,45,45, 42,42,0,42,42,0,42,42, 38,38,0,38,38,0,38,38, 40,40,0,40,40,0,47,0],
 LEAD:[81,0,85,0,88,0,85,0, 85,0,83,0,81,0,78,0, 81,0,83,0,85,0,83,0, 88,0,85,0,83,0,81,0],
 start(){if(this.on)return;const ac=audio();if(!ac)return;this.on=true;this.nextT=ac.currentTime+0.08;
  setInterval(()=>this.tick(),42);},
 tick(){const ac=audio();if(!ac)return;
  if(_mGate()){this.nextT=ac.currentTime+0.06;return;}
  while(this.nextT<ac.currentTime+0.14){this.play(this.step,this.nextT);this.nextT+=60/this.BPM/2;this.step=(this.step+1)%32;}},
 play(s,t){const d=Math.max(0,t-audio().currentTime);
  const b=this.BASS[s];if(b)tone(_mf(b),_mf(b),0.11,'sawtooth',0.05,d);
  const l=this.LEAD[s];if(l)tone(_mf(l),_mf(l),0.12,'sawtooth',0.045,d);
  if(s%2===0)tone(122,45,0.1,'sine',0.14,d); // steady four-beat kick
  if(s%8===2||s%8===6)tone(190,120,0.07,'triangle',0.07,d); // tone-only snare
  if(s%2===1)tone(6900,6900,0.015,'square',0.007,d); // hat click
 }};
addEventListener('pointerdown',()=>MUS.start());
addEventListener('keydown',()=>MUS.start());
