<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thermal Track — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#100a08;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(14,8,4,.93);color:#fff;text-align:center;padding:20px;z-index:10}
#ov h1{font-size:clamp(26px,7vw,44px);color:#7dff9a;margin-bottom:10px}
#ov p{font-size:15px;max-width:420px;margin-bottom:8px;color:#ffe9c9}
#ov .lesson{background:#1e6b26;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;margin:10px 0}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #7dff9a;padding:6px;background:#0e1a0e;color:#fff}
#gate button,#startBtn{background:#2a8a3a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ffd23f;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000;z-index:5;pointer-events:none}
#back{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">←</button>
<div id="hud">⏱ 0.0s · ⭐0/8</div>
<canvas id="c"></canvas>
<div id="ov">
<h1>🏁 THERMAL TRACK</h1>
<p>Speedrun platformer! Race RIGHT through the volcanic track, grab all 8 stars, and hit the finish flag. Fastest time wins!</p>
<div id="gate"><div style="margin-bottom:6px">🔒 Grown-up check: what is <b id="q"></b>?</div><input id="a" type="number" inputmode="numeric"><button onclick="checkGate()">GO</button></div>
<button id="startBtn" class="hidden" onclick="start()">▶ START</button>
<div class="lesson">🔥 Fire Safety: Running fast is fun in games — but in a real fire, WALK quickly and never push!</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;build();}addEventListener('resize',rs);
let AC=null;function beep(f,d,t){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const a=AC,o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const n1=3+Math.floor(Math.random()*5),n2=2+Math.floor(Math.random()*5);
document.getElementById('q').textContent=n1+' + '+n2;
function checkGate(){if(parseInt(document.getElementById('a').value)===n1+n2){document.getElementById('gate').classList.add('hidden');document.getElementById('startBtn').classList.remove('hidden');}else alert('Try again!');}
let state='menu',plats=[],stars=[],px=0,py=0,vx=0,vy=0,time=0,got=0,parts=[],shake=0,camX=0,LVL=2600;
function build(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;plats=[];stars=[];
  const gy=H*.78;
  plats.push({x:-100,y:gy,w:600,h:40});
  let x=560;
  const gaps=[180,220,160,260,200,180,240,200];
  gaps.forEach((gp,i)=>{const w=200+Math.random()*160;plats.push({x,y:gy-(i%3)*70-((i*37)%60),w,h:30});x+=w+gp;stars.push({x:x-gp/2,y:gy-160-((i*53)%120),got:false});});
  plats.push({x:x+100,y:gy,w:400,h:40,fin:true});
  LVL=x+300;
}
function start(){build();state='play';px=60;py=H*.5;vx=0;vy=0;time=0;got=0;parts=[];camX=0;ov.classList.add('hidden');}
function end(){state='over';const best=localStorage.getItem('tt_best');const nb=!best||time<parseFloat(best);if(nb)localStorage.setItem('tt_best',time.toFixed(1));
  ov.innerHTML=`<h1>🏁 FINISH!</h1><p>Time: <b>${time.toFixed(1)}s</b> · Stars: <b>${got}/8</b>${nb?' 🏆 NEW BEST!':''}</p><div class="lesson">🔥 Fire Safety: Running fast is fun in games — but in a real fire, WALK quickly and never push!</div><button onclick="location.reload()" style="background:#2a8a3a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer">↻ RACE AGAIN</button>`;ov.classList.remove('hidden');}
function boom(x,y,c){for(let i=0;i<10;i++){const a=Math.random()*7,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c});}}
function update(dt){
  if(state!=='play')return;time+=dt;shake*=.9;
  hud.textContent=`⏱ ${time.toFixed(1)}s · ⭐${got}/8`;
  const sp=520*dt;
  if(keys.l)vx-=sp*3;if(keys.r)vx+=sp*3;
  vx*=.92;vx=Math.max(-420,Math.min(420,vx));
  vy+=1500*dt;vy=Math.min(vy,900);
  px+=vx*dt;
  let onG=false;
  plats.forEach(p=>{if(px+18>p.x&&px-18<p.x+p.w&&py+22>p.y&&py+22<p.y+p.h+20&&vy>=0){py=p.y-22;vy=0;onG=true;if(p.fin){end();}}});
  py+=vy*dt;
  if(keys.u&&onG){vy=-620;beep(450,.1,'sine');}
  if(py>H+100){px=60;py=H*.4;vx=vy=0;shake=10;beep(140,.3,'sawtooth');}
  stars.forEach(s=>{if(!s.got&&Math.hypot(s.x-px,s.y-py)<40){s.got=true;got++;boom(s.x,s.y,'#ffd23f');beep(800,.12,'sine');}});
  camX+=(px-W*.35-camX)*.08;
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;});parts=parts.filter(p=>p.life>0);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.translate((Math.random()-.5)*shake,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#100a08');g.addColorStop(1,'#2a1408');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.save();ctx.translate(-camX,0);
  plats.forEach(p=>{ctx.fillStyle=p.fin?'#2a8a3a':'#5a3a22';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='rgba(255,138,0,.4)';ctx.fillRect(p.x,p.y,p.w,6);
    if(p.fin){ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText('🏁',p.x+20,p.y-14);}});
  stars.forEach(s=>{if(s.got)return;ctx.fillStyle='#ffd23f';ctx.shadowColor='#ffb300';ctx.shadowBlur=10;ctx.save();ctx.translate(s.x,s.y+Math.sin(time*4+s.x)*6);ctx.rotate(time*2);ctx.fillRect(-10,-10,20,20);ctx.restore();ctx.shadowBlur=0;});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life+2,0,7);ctx.fill();});ctx.globalAlpha=1;
  // Sizzle
  ctx.save();ctx.translate(px,py);const bg=ctx.createRadialGradient(-7,-7,3,0,0,24);bg.addColorStop(0,'#fff3a0');bg.addColorStop(1,'#e6a800');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-7,-3,4,0,7);ctx.arc(7,-3,4,0,7);ctx.fill();ctx.strokeStyle='#5a2000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,7,7,.3,Math.PI-.3);ctx.stroke();ctx.restore();
  ctx.restore();
}
let keys={l:0,r:0,u:0},last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);render();requestAnimationFrame(loop);}rs();requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key==='ArrowUp'||e.key===' ')keys.u=1;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0;if(e.key==='ArrowUp'||e.key===' ')keys.u=0;});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left;x<W*.4?keys.l=1:x>W*.6?keys.r=1:keys.u=1;});
cv.addEventListener('pointerup',()=>keys.l=keys.r=keys.u=0);
</script>
</body>
</html>
