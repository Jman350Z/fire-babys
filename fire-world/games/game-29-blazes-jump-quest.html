<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blaze's Jump Quest — Fire Babys</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#140a26;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;touch-action:none}
#fw{position:fixed;top:8px;left:8px;z-index:20;background:#ff9f1c;color:#3a1c00;font:bold 14px system-ui,sans-serif;padding:9px 13px;border-radius:12px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#gate{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(10,4,22,.82);padding:16px;box-sizing:border-box}
#gate .card{background:#2b1548;border:3px solid #ff9f1c;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;color:#fff}
#gate .ttl{font-size:26px;font-weight:900;color:#ffcf5c;margin-bottom:2px}
#gate .stars{font-size:14px;color:#ffd9a0;margin-bottom:12px}
#gate .lesson{background:#3a1c5c;border-radius:12px;padding:10px;font-size:14px;margin-bottom:14px;line-height:1.35}
#gate .q{font-size:19px;font-weight:700;margin-bottom:10px}
#gate input{font-size:22px;width:90px;text-align:center;border-radius:10px;border:2px solid #ff9f1c;padding:8px;margin-bottom:12px;background:#140a26;color:#fff}
#gate button{font-size:18px;font-weight:800;background:#ff9f1c;color:#3a1c00;border:none;border-radius:12px;padding:12px 30px;cursor:pointer}
</style>
</head>
<body>
<a id="fw" href="/fire-world.html">&#8592; Fire World</a>
<canvas id="c"></canvas>
<div id="gate">
  <div class="card">
    <div class="ttl">&#128293; Blaze's Jump Quest</div>
    <div class="stars">Starring Ruko &amp; Sizzle</div>
    <div class="lesson">&#128293; Fire Safety: If a door feels hot, DON'T open it &mdash; find another way out!</div>
    <div class="q">Grown-up check: <span id="qa">?</span> + <span id="qb">?</span> = ?</div>
    <input id="ans" type="number" inputmode="numeric" pattern="[0-9]*" aria-label="Answer">
    <br><button id="unlock">UNLOCK</button>
  </div>
</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,slide,delay){const a=ac();if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.2,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.05);}
function sfx(n){
  if(n==='click')tone(800,0.06,'square',0.1);
  else if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,0.25,'triangle',0.2,null,i*0.12));
  else if(n==='lose'){tone(220,0.5,'sawtooth',0.18,110);tone(160,0.6,'sawtooth',0.14,80,0.1);}
  else if(n==='round')tone(880,0.15,'triangle',0.16,1320);
}
function padTone(i){tone([261.63,329.63,392.00,523.25][i],0.35,'triangle',0.22);}

/* ---------- particles + shake ---------- */
let parts=[],shakeT=0;
function burst(x,y,c,n){n=n||24;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*240;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:0.5+Math.random()*0.5,t:0,color:c});}}
function shake(){shakeT=0.2;}

/* ---------- fire baby ---------- */
function fireBaby(x,y,s,mood){
  const g=ctx.createRadialGradient(x-s*0.3,y-s*0.25,s*0.1,x,y,s*1.15);
  g.addColorStop(0,'#fff6b0');g.addColorStop(0.45,'#ffb703');g.addColorStop(1,'#f4511e');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(x,y-s);
  ctx.bezierCurveTo(x+s*0.95,y-s*0.25,x+s*0.8,y+s*0.6,x,y+s*0.6);
  ctx.bezierCurveTo(x-s*0.8,y+s*0.6,x-s*0.95,y-s*0.25,x,y-s);
  ctx.fill();
  ctx.fillStyle='#4a2400';
  const ey=y+s*0.02,ex=s*0.28;
  ctx.beginPath();ctx.arc(x-ex,ey,Math.max(1.5,s*0.09),0,7);ctx.arc(x+ex,ey,Math.max(1.5,s*0.09),0,7);ctx.fill();
  ctx.strokeStyle='#4a2400';ctx.lineWidth=Math.max(2,s*0.07);ctx.lineCap='round';ctx.beginPath();
  if(mood==='sad')ctx.arc(x,y+s*0.45,s*0.2,Math.PI*1.15,Math.PI*1.85);
  else ctx.arc(x,y+s*0.08,s*0.24,Math.PI*0.15,Math.PI*0.85);
  ctx.stroke();
  ctx.fillStyle='rgba(255,130,130,0.5)';
  ctx.beginPath();ctx.arc(x-ex-s*0.14,ey+s*0.12,s*0.08,0,7);ctx.arc(x+ex+s*0.14,ey+s*0.12,s*0.08,0,7);ctx.fill();
}

/* ---------- game state ---------- */
const LESSON="If a door feels hot, DON'T open it — find another way out!";
const PADS=[
  {c:'#ff3b30',glow:'#ffb3ae',name:'Ruby'},
  {c:'#ff9500',glow:'#ffd9a0',name:'Ember'},
  {c:'#ffd60a',glow:'#fff3b0',name:'Sunny'},
  {c:'#0a84ff',glow:'#b3d9ff',name:'Splash'}
];
let screen='title',unlocked=false;
let phase='idle'; // idle | showing | input | celebrate
let seq=[],idx=0,round=0,score=0;
let showQueue=[],showT=0,litPad=-1,inputT=0,celebrateT=0;
let padR=0,padXY=[];
const FLASH_MS=520,GAP_MS=300;

function layoutPads(){
  padR=Math.min(W,H)*0.19;
  const cy=H*0.55,ox=W*0.24,oy=H*0.20;
  padXY=[{x:W/2-ox,y:cy-oy},{x:W/2+ox,y:cy-oy},{x:W/2-ox,y:cy+oy},{x:W/2+ox,y:cy+oy}];
}
layoutPads();
window.addEventListener('resize',layoutPads);

function startGame(){
  seq=[];round=0;score=0;idx=0;phase='idle';litPad=-1;
  screen='play';
  nextRound();
}
function nextRound(){
  round++;
  seq.push(Math.floor(Math.random()*4));
  showQueue=seq.slice();idx=0;phase='showing';showT=0.7;litPad=-1;
}
function updateShowing(dt){
  if(showQueue.length===0){
    if(litPad!==-1&&showT<=0){litPad=-1;}
    if(litPad===-1&&showT<=0){phase='input';sfx('round');}
    showT-=dt;return;
  }
  showT-=dt;
  if(showT<=0){
    if(litPad!==-1){litPad=-1;showT=GAP_MS/1000;}
    else{litPad=showQueue.shift();padTone(litPad);burst(padXY[litPad].x,padXY[litPad].y,PADS[litPad].glow,10);showT=FLASH_MS/1000;}
  }
}
function pressPad(i){
  if(phase!=='input')return;
  litPad=i;padTone(i);inputT=0.28;
  burst(padXY[i].x,padXY[i].y,PADS[i].glow,12);
  if(i===seq[idx]){
    idx++;
    if(idx>=seq.length){
      phase='celebrate';litPad=-1;score=round;sfx('win');celebrateT=0.9;
    }
  }else{
    gameOver();
  }
}
function gameOver(){
  screen='over';phase='idle';litPad=-1;
  shake();sfx('lose');
}

/* ---------- drawing ---------- */
let btns=[];
function button(x,y,w,h,label,act,bg){
  btns.push({x:x,y:y,w:w,h:h,act:act});
  ctx.fillStyle=bg||'#ff9f1c';
  ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();
  ctx.fillStyle='#3a1c00';ctx.font='800 19px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
}
function drawPad(i){
  const p=padXY[i],lit=(litPad===i);
  const r=padR*(lit?1.08:1);
  if(lit){ctx.shadowColor=PADS[i].c;ctx.shadowBlur=34;}
  ctx.fillStyle=lit?PADS[i].c:shade(PADS[i].c);
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=lit?'#ffffff':'rgba(255,255,255,0.25)';ctx.lineWidth=lit?5:3;ctx.stroke();
  fireBaby(p.x,p.y,r*0.55,lit?'wow':'happy');
}
function shade(hex){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return 'rgb('+Math.round(r*0.42)+','+Math.round(g*0.42)+','+Math.round(b*0.42)+')';
}
function wrapText(text,x,y,maxW,lh){
  ctx.font='700 15px system-ui,sans-serif';
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}
  ctx.fillText(line,x,yy);
}
function draw(){
  btns=[];
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*14,(Math.random()-0.5)*14);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141026');g.addColorStop(0.6,'#2b1548');g.addColorStop(1,'#4a1f3d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<36;i++){const sx=(i*89)%W,sy=(i*61)%(H*0.5);ctx.fillRect(sx,sy,2,2);}

  if(screen==='play'){
    // HUD
    ctx.fillStyle='#fff';ctx.font='800 17px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('Score: '+score,10,44);
    ctx.textAlign='right';ctx.fillText('Best: '+best,W-10,44);
    // big round number
    ctx.textAlign='center';ctx.fillStyle='#ffcf5c';ctx.font='900 52px system-ui,sans-serif';
    ctx.fillText('ROUND '+round,W/2,84);
    ctx.font='700 16px system-ui,sans-serif';ctx.fillStyle=phase==='input'?'#7CFF9B':'#ffd9a0';
    ctx.fillText(phase==='input'?'YOUR TURN \u2014 tap the pads!':'WATCH \u2026',W/2,148);
    for(let i=0;i<4;i++)drawPad(i);
    // progress dots
    ctx.fillStyle='#fff';
    for(let i=0;i<seq.length;i++){
      ctx.globalAlpha=i<idx?1:0.3;
      ctx.beginPath();ctx.arc(W/2-(seq.length-1)*11+i*22,H-24,6,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(screen==='title'){
    ctx.fillStyle='rgba(10,4,22,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='900 38px system-ui,sans-serif';ctx.fillStyle='#ffcf5c';
    ctx.fillText("Blaze's Jump Quest",W/2,H*0.16);
    ctx.font='700 16px system-ui,sans-serif';ctx.fillStyle='#ffd9a0';
    ctx.fillText('Starring Ruko & Sizzle',W/2,H*0.16+34);
    fireBaby(W/2-46,H*0.32,34,'happy');fireBaby(W/2+46,H*0.32,34,'happy');
    ctx.font='700 15px system-ui,sans-serif';ctx.fillStyle='#fff';
    ctx.fillText('\uD83D\uDD25 Fire Safety:',W/2,H*0.50);
    wrapText(LESSON,W/2,H*0.50+24,Math.min(W-60,360),17);
    ctx.fillText('Watch the pads flash, then tap them in the same order!',W/2,H*0.62);
    if(unlocked)button(W/2-110,H*0.72,220,58,'TAP TO START',startGame);
    else{ctx.font='700 16px system-ui,sans-serif';ctx.fillStyle='#ffcf5c';ctx.fillText('Finish the grown-up check above \u261D\uFE0F',W/2,H*0.72);}
  }else if(screen==='over'){
    ctx.fillStyle='rgba(10,4,22,0.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='900 36px system-ui,sans-serif';
    ctx.fillText('Oops! Wrong pad!',W/2,H*0.26);
    fireBaby(W/2,H*0.4,36,'sad');
    ctx.fillStyle='#fff';ctx.font='800 24px system-ui,sans-serif';
    ctx.fillText('Rounds completed: '+score,W/2,H*0.54);
    if(score>best){best=score;try{localStorage.setItem('fbjq_best',String(best));}catch(e){}}
    ctx.font='800 18px system-ui,sans-serif';ctx.fillStyle='#ffcf5c';
    ctx.fillText('Best: '+best,W/2,H*0.54+32);
    ctx.font='700 15px system-ui,sans-serif';ctx.fillStyle='#fff';
    ctx.fillText('\uD83D\uDD25 Fire Safety:',W/2,H*0.66);
    wrapText(LESSON,W/2,H*0.66+24,Math.min(W-60,360),17);
    button(W/2-120,H*0.8,240,58,'TAP TO RESTART',startGame);
  }
  for(const p of parts){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- input ---------- */
function handleTap(x,y){
  for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sfx('click');b.act();return;}}
  if(screen!=='play'||phase!=='input')return;
  for(let i=0;i<4;i++){
    const p=padXY[i],dx=x-p.x,dy=y-p.y;
    if(dx*dx+dy*dy<padR*padR*1.2){pressPad(i);break;}
  }
}
cv.addEventListener('touchstart',function(e){e.preventDefault();ac();},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  const t=e.changedTouches[0];
  handleTap(t.clientX,t.clientY);
},{passive:false});
cv.addEventListener('mousedown',function(e){ac();});
cv.addEventListener('mouseup',function(e){handleTap(e.clientX,e.clientY);});
document.addEventListener('keydown',function(e){
  if(screen!=='play'||phase!=='input')return;
  const map={ArrowUp:0,ArrowLeft:1,ArrowDown:2,ArrowRight:3,'1':0,'2':1,'3':2,'4':3};
  if(e.key in map){e.preventDefault();pressPad(map[e.key]);}
});

/* ---------- parental gate ---------- */
const GA=1+Math.floor(Math.random()*9),GB=1+Math.floor(Math.random()*9);
document.getElementById('qa').textContent=GA;
document.getElementById('qb').textContent=GB;
document.getElementById('unlock').addEventListener('click',function(){
  ac();
  const v=parseInt(document.getElementById('ans').value,10);
  if(v===GA+GB){unlocked=true;document.getElementById('gate').style.display='none';sfx('win');}
  else{sfx('lose');document.getElementById('ans').value='';document.getElementById('ans').placeholder='Try again!';shake();}
});

/* ---------- best score (device only, no PII) ---------- */
let best=0;
try{best=parseInt(localStorage.getItem('fbjq_best')||'0',10)||0;}catch(e){}

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.05)dt=0.05;
  if(screen==='play'&&phase==='showing')updateShowing(dt);
  if(screen==='play'&&phase==='celebrate'){celebrateT-=dt;if(celebrateT<=0)nextRound();}
  if(inputT>0){inputT-=dt;if(inputT<=0)litPad=-1;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  if(shakeT>0)shakeT-=dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
