<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blaze's Jump Quest — by Jman350Z & fire team</title>
<meta name="description" content="Run and jump! Side-scrolling platformer adventure. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140d08;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,6,3,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#1a0e08;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#lvlSel{display:flex;gap:8px;margin:12px 0}
.lvlBtn{width:48px;height:48px;border-radius:12px;border:3px solid #ff6a1a;background:#1a0e08;color:#ffd23f;font-size:16px;font-weight:900;cursor:pointer}
#jumpBtn{position:fixed;bottom:70px;right:20px;z-index:10;width:90px;height:90px;border-radius:50%;background:rgba(255,140,46,.8);border:3px solid #ff6a1a;color:#fff;font-size:16px;font-weight:900;display:none}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="level">LV 1/5</div>
<div class="pill" id="coins">🪙 0/0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<button id="jumpBtn">⤴️</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🏃 BLAZE'S JUMP QUEST</h1>
<div id="obody"><p>Run to the flag!</p><p><b>TAP RIGHT SIDE</b> or press <b>→</b> to run, <b>TAP LEFT SIDE / SPACE</b> to jump! Stomp enemies from above, grab all coins, reach the 🏁 flag!</p><div id="lvlSel"></div></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Jump to safety — know your escape route!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  jump(){tone(400,800,0.12,'square',0.09);},
  coin(){tone(900,1400,0.1,'sine',0.1);},
  stomp(){tone(500,150,0.12,'square',0.12);},
  hurt(){tone(300,100,0.25,'sawtooth',0.14);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.22,'triangle',0.16,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
// level maps (tile-based, 1=ground, 2=platform, 3=coin row handled separately)
// Simple: define platforms, coins, enemies, goal per level
const LEVELS=[
  {plats:[[0,0.8,3,0.2],[3.4,0.65,1.2,0.08],[5,0.5,1.2,0.08],[7,0.8,3,0.2]],
   coins:[[3.7,0.55],[5.3,0.4],[7.5,0.65]],enemies:[[4,0.72]],goal:9.2,len:10},
  {plats:[[0,0.8,2,0.2],[2.5,0.6,1,0.08],[4,0.75,1.5,0.08],[6,0.55,1,0.08],[7.5,0.8,2.5,0.2]],
   coins:[[2.8,0.5],[6.3,0.45],[8,0.7]],enemies:[[4.5,0.67],[8.2,0.72]],goal:9.3,len:10},
  {plats:[[0,0.8,1.5,0.2],[2,0.6,1,0.08],[3.5,0.75,1,0.08],[5,0.55,1,0.08],[6.5,0.7,1,0.08],[8,0.8,2,0.2]],
   coins:[[2.3,0.5],[5.3,0.45],[6.8,0.6],[8.5,0.7]],enemies:[[3.7,0.67],[8.3,0.72]],goal:9.3,len:10},
  {plats:[[0,0.8,1.2,0.2],[1.8,0.62,0.9,0.08],[3.2,0.78,1.2,0.08],[5,0.6,0.9,0.08],[6.5,0.75,1,0.08],[8,0.55,0.9,0.08],[9.2,0.8,1.8,0.2]],
   coins:[[2.1,0.52],[5.3,0.5],[8.3,0.45],[9.6,0.7]],enemies:[[3.5,0.7],[6.7,0.67],[9.5,0.72]],goal:10.5,len:11},
  {plats:[[0,0.8,1,0.2],[1.5,0.6,0.8,0.08],[2.8,0.75,0.8,0.08],[4,0.55,0.8,0.08],[5.2,0.7,0.8,0.08],[6.4,0.5,0.8,0.08],[7.6,0.65,0.8,0.08],[8.8,0.8,2.2,0.2]],
   coins:[[1.8,0.5],[4.3,0.45],[6.7,0.4],[7.9,0.55],[9.3,0.7]],enemies:[[3,0.67],[5.4,0.62],[9,0.72]],goal:10.5,len:11},
];
const TILE=90; // world units
const G={state:'title',level:1,score:0,
  px:0,py:0,vx:0,vy:0,onGround:false,face:1,
  camX:0,coins:[],enemies:[],time:0,shake:0,dead:false,coyote:0,jbuf:0};
function initLevel(n){
  const L=LEVELS[n-1];
  G.level=n;G.px=TILE*0.5;G.py=H*0.5;G.vx=0;G.vy=0;G.camX=0;
  G.time=0;G.shake=0;G.dead=false;G.score=G.score||0;
  G.coins=L.coins.map(c=>({x:c[0]*TILE,y:c[1]*H,taken:false,t:Math.random()*6}));
  G.enemies=L.enemies.map(e=>({x:e[0]*TILE,y:e[1]*H,vx:60,dir:1,dead:false,t:Math.random()*6,minX:(e[0]-0.6)*TILE,maxX:(e[0]+0.6)*TILE}));
  document.getElementById('level').textContent=`LV ${n}/5`;
  document.getElementById('coins').textContent=`🪙 0/${G.coins.length}`;
  updateHUD();
}
function updateHUD(){document.getElementById('score').textContent='⭐ '+G.score;}
// input
const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '||e.key==='ArrowUp'){jump();e.preventDefault();}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function jump(){
  if(G.state!=='play'||G.dead)return;
  if(G.onGround||G.coyote>0){
    G.vy=-780;G.onGround=false;G.coyote=0;sfx.jump();
  }else G.jbuf=0.12;
}
let touchL=false,touchR=false;
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;
  if(e.clientX<W*0.4)jump();
  else{touchR=true;canvas.setPointerCapture(e.pointerId);}
});
canvas.addEventListener('pointerup',e=>{touchR=false;});
canvas.addEventListener('pointercancel',()=>touchR=false);
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.stopPropagation();jump();});
if('ontouchstart'in window)document.getElementById('jumpBtn').style.display='block';
const particles=[];
for(let i=0;i<70;i++)particles.push({a:false});
function burst(x,y,color){
  for(let i=0;i<7;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*180;p.vy=Math.sin(a)*180-60;
    p.life=0.4;p.max=0.4;p.color=color;p.size=3+Math.random()*3;}
}
function plats(){
  return LEVELS[G.level-1].plats.map(p=>({x:p[0]*TILE,y:p[1]*H,w:p[2]*TILE,h:p[3]*H}));
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  const L=LEVELS[G.level-1];
  // move
  const SPEED=330;
  let ax=0;
  if(keys['arrowright']||keys['d']||touchR)ax+=1;
  if(keys['arrowleft']||keys['a'])ax-=1;
  G.vx=ax*SPEED;
  if(ax!==0)G.face=ax;
  G.vy+=2200*dt;G.vy=Math.min(G.vy,1200);
  G.px+=G.vx*dt;G.py+=G.vy*dt;
  G.px=Math.max(16,Math.min(L.len*TILE-16,G.px));
  // ground collision
  G.onGround=false;
  const pw=28,ph=32;
  for(const p of plats()){
    if(G.px+pw/2>p.x&&G.px-pw/2<p.x+p.w&&G.py+ph/2>p.y&&G.py+ph/2<p.y+p.h+20&&G.vy>=0){
      const prevY=G.py+ph/2-G.vy*dt;
      if(prevY<=p.y+8){
        G.py=p.y-ph/2;G.vy=0;G.onGround=true;G.coyote=0.1;
      }
    }
    // side bump
    if(G.px+pw/2>p.x&&G.px-pw/2<p.x+p.w&&G.py+ph/2>p.y+10&&G.py-ph/2<p.y+p.h){
      if(G.vx>0)G.px=p.x-pw/2;else if(G.vx<0)G.px=p.x+p.w+pw/2;
    }
  }
  G.coyote-=dt;G.jbuf-=dt;
  if(G.jbuf>0&&(G.onGround||G.coyote>0))jump();
  // camera
  G.camX+=((G.px-W*0.38)-G.camX)*Math.min(1,dt*5);
  G.camX=Math.max(0,Math.min(L.len*TILE-W,G.camX));
  // coins
  for(const c of G.coins){
    c.t+=dt*4;
    if(!c.taken&&Math.hypot(G.px-c.x,G.py-c.y)<36){
      c.taken=true;sfx.coin();
      const n=G.coins.filter(x=>x.taken).length;
      document.getElementById('coins').textContent=`🪙 ${n}/${G.coins.length}`;
      G.score+=25;updateHUD();
      burst(c.x,c.y,'#ffd23f');
    }
  }
  // enemies
  for(const e of G.enemies){
    if(e.dead)continue;
    e.t+=dt*6;
    e.x+=e.vx*e.dir*dt;
    if(e.x<e.minX||e.x>e.maxX)e.dir*=-1;
    if(Math.abs(G.px-e.x)<34&&Math.abs(G.py-e.y)<36){
      if(G.vy>200&&G.py<e.y-8){
        // stomp!
        e.dead=true;G.vy=-520;sfx.stomp();G.score+=100;updateHUD();
        burst(e.x,e.y,'#ff6a5a');
      }else if(!G.dead){
        G.dead=true;sfx.hurt();G.shake=0.4;
        setTimeout(()=>{
          showOverlay('💥 OUCH!',
            `<p>You got hit! Score: ${G.score}</p>`,
            '🔥 Fire Safety: Jump to safety!',
            '↻ TRY AGAIN',()=>{initLevel(G.level);G.state='play';});
        },500);
        return;
      }
    }
  }
  // fell in pit
  if(G.py>H+80&&!G.dead){
    G.dead=true;sfx.hurt();
    setTimeout(()=>{
      showOverlay('💥 YOU FELL!',
        `<p>Watch the gaps! Score: ${G.score}</p>`,
        '🔥 Fire Safety: Watch your step!',
        '↻ TRY AGAIN',()=>{initLevel(G.level);G.state='play';});
    },500);
    return;
  }
  // goal
  if(G.px>=L.goal*TILE&&!G.dead){
    G.dead=true;sfx.win();
    const coinBonus=G.coins.filter(c=>c.taken).length*25;
    G.score+=200+coinBonus;updateHUD();
    setTimeout(()=>{
      if(G.level>=5){
        showOverlay('🏆 QUEST COMPLETE!',
          `<p style="font-size:24px;font-weight:900">Final Score: ${G.score}</p><p>You finished all 5 levels!</p>`,
          '🔥 Fire Safety: You\'re a champion!',
          '↻ PLAY AGAIN',()=>{G.score=0;initLevel(1);G.state='play';});
      }else{
        showOverlay(`⭐ LEVEL ${G.level} CLEAR!`,
          `<p>Coins: ${G.coins.filter(c=>c.taken).length}/${G.coins.length}</p><p>Score: ${G.score}</p>`,
          '🔥 Fire Safety: Keep jumping to safety!',
          '▶ NEXT LEVEL',()=>{initLevel(G.level+1);G.state='play';});
      }
    },600);
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  // run dust
  if(G.onGround&&Math.abs(G.vx)>100&&Math.random()<0.3){
    const p=particles.find(p=>!p.a);
    if(p){p.a=true;p.x=G.px-G.face*14;p.y=G.py+16;p.vx=-G.face*60;p.vy=-40;
      p.life=0.3;p.max=0.3;p.color='#c89a6a';p.size=3;}
  }
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');showLevels();
  }else document.getElementById('ma').value='';
}
function showLevels(){
  otitle.innerHTML='🏃 PICK LEVEL';
  let h='';
  for(let i=1;i<=5;i++)h+=`<button class="lvlBtn" onclick="event.stopPropagation();pickLevel(${i})">${i}</button>`;
  obody.innerHTML=`<p>Run, jump, stomp, collect!</p><div id="lvlSel">${h}</div>`;
  obtn.style.display='none';
  overlay.classList.remove('hidden');
}
function pickLevel(n){sfx.click();audio();G.score=0;initLevel(n);G.state='play';overlay.classList.add('hidden');}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a2a4a');bg.addColorStop(0.6,'#2a1a3a');bg.addColorStop(1,'#140d08');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // parallax hills
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<6;i++){
    const hx=((i*400-G.camX*0.3)%(W+400)+(W+400))%(W+400)-200;
    ctx.beginPath();ctx.arc(hx,H*0.85,140,Math.PI,0);ctx.fill();
  }
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  ctx.translate(-G.camX,0);
  // platforms
  for(const p of plats()){
    const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,'#6a4a2a');g.addColorStop(1,'#3a2412');
    ctx.fillStyle=g;ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#8a6a3a';ctx.fillRect(p.x,p.y,p.w,10);
    // grass tufts
    ctx.fillStyle='#4caf50';
    for(let x=p.x+8;x<p.x+p.w;x+=24)ctx.fillRect(x,p.y-4,3,6);
  }
  // coins
  for(const c of G.coins){
    if(c.taken)continue;
    const bob=Math.sin(c.t)*6;
    ctx.save();ctx.translate(c.x,c.y+bob);ctx.scale(Math.abs(Math.cos(c.t*0.7))*0.6+0.4,1);
    const g=ctx.createRadialGradient(-4,-4,2,0,0,14);
    g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ffd23f');g.addColorStop(1,'#a37a00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // enemies (ash blobs)
  for(const e of G.enemies){
    if(e.dead)continue;
    const squash=1+Math.sin(e.t)*0.12;
    ctx.save();ctx.translate(e.x,e.y);ctx.scale(1/squash,squash);
    const g=ctx.createRadialGradient(-6,-7,3,0,0,20);
    g.addColorStop(0,'#6a6a7a');g.addColorStop(1,'#2a2a3a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff4a00';
    ctx.beginPath();ctx.arc(-6,-3,3.5,0,Math.PI*2);ctx.arc(6,-3,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a1a2a';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,6,7,0.2,Math.PI-0.2);ctx.stroke();
    ctx.restore();
  }
  // goal flag
  const L=LEVELS[G.level-1];
  const gx=L.goal*TILE;
  ctx.strokeStyle='#fff';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(gx,H*0.3);ctx.lineTo(gx,H*0.75);ctx.stroke();
  const wave=Math.sin(G.time*5)*4;
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.moveTo(gx,H*0.3);ctx.lineTo(gx+54+wave,H*0.36);ctx.lineTo(gx,H*0.44);ctx.closePath();ctx.fill();
  // player
  if(!G.dead){
    ctx.save();ctx.translate(G.px,G.py);ctx.scale(G.face,1);
    const runT=G.onGround?Math.sin(G.time*14)*3:0;
    // glow
    const gl=ctx.createRadialGradient(0,0,5,0,0,34);
    gl.addColorStop(0,'rgba(255,150,50,0.3)');gl.addColorStop(1,'rgba(255,150,50,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(-6,-7,3,0,0,20);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,runT*0.3,18,0,Math.PI*2);ctx.fill();
    // legs
    ctx.fillStyle='#a33c10';
    ctx.fillRect(-10,12+runT,7,10-runT);ctx.fillRect(3,12-runT,7,10+runT);
    // face
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(5,-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
