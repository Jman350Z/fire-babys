<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magma Jump 2D — by Jman350Z & fire team</title>
<meta name="description" content="Wall jump to the top! Bounce between walls. A Fire Babys climber.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140d08;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,6,3,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#1a0e08;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">📏 0m</div>
<div class="pill" id="combo">🔥 x1</div>
<div class="pill" id="best">🏆 0m</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🧗 MAGMA JUMP 2D</h1>
<div id="obody"><p>Wall-jump to the sky!</p><p><b>TAP</b> to jump to the opposite wall! Time it right to grab ⭐ stars. Avoid the 🔥 lava patches on the walls. Don't fall below the screen!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Climb to safety — know your exits!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  jump(){tone(450,750,0.09,'square',0.09);},
  star(){tone(900,1400,0.1,'sine',0.1);},
  lava(){tone(300,80,0.35,'sawtooth',0.15);},
  fall(){tone(400,80,0.5,'sawtooth',0.14);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,combo:1,
  px:0,py:0,vx:0,vy:0,onWall:1, // 1=right,-1=left
  camY:0,stars:[],lavas:[],time:0,dead:false,wallGap:0};
try{G.best=parseInt(localStorage.getItem('walljump_best')||'0',10)||0;}catch(e){}
function wallX(side,camY){
  // walls narrow as you climb
  const base=Math.min(W*0.42,180)-Math.min(60,-camY*0.008);
  return side>0?W/2+base:W/2-base;
}
function reset(){
  G.score=0;G.combo=1;G.camY=0;G.time=0;G.dead=false;
  G.stars=[];G.lavas=[];
  G.onWall=1;
  G.px=wallX(1,0)-18;G.py=H*0.7;G.vx=0;G.vy=0;
  // initial stars/lava
  for(let i=0;i<10;i++)spawnRow(-i*220);
  updateHUD();
  document.getElementById('best').textContent='🏆 '+Math.floor(G.best/10)+'m';
}
function spawnRow(y){
  // y is world y (negative up)
  if(Math.random()<0.7){
    const side=Math.random()<0.5?-1:1;
    G.stars.push({x:W/2+side*Math.min(W*0.3,130),y:y-Math.random()*120,t:Math.random()*6,taken:false});
  }
  if(Math.random()<0.45){
    const side=Math.random()<0.5?-1:1;
    G.lavas.push({side,y:y-Math.random()*160,h:60+Math.random()*60});
  }
}
function updateHUD(){
  document.getElementById('score').textContent='📏 '+Math.floor(G.score/10)+'m';
  document.getElementById('combo').textContent='🔥 x'+G.combo;
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.dead)return;
  e.preventDefault();
  // jump to opposite wall
  G.onWall*=-1;
  G.vx=G.onWall*420;
  G.vy=-560;
  sfx.jump();
});
const particles=[];
for(let i=0;i<60;i++)particles.push({a:false});
function update(dt){
  G.time+=dt;
  G.vy+=1800*dt;
  G.px+=G.vx*dt;G.py+=G.vy*dt;
  // wall stick
  const wl=wallX(-1,G.camY),wr=wallX(1,G.camY);
  if(G.px<wl+18){
    G.px=wl+18;
    if(G.vx<0){G.vx=0;G.vy=Math.min(G.vy,60);G.onWall=-1;}
  }
  if(G.px>wr-18){
    G.px=wr-18;
    if(G.vx>0){G.vx=0;G.vy=Math.min(G.vy,60);G.onWall=1;}
  }
  // lava collision
  const wy=G.py-G.camY;
  for(const l of G.lavas){
    const lx=wallX(l.side,G.camY);
    const ly=l.y+G.camY;
    if(Math.abs(G.px-lx)<30&&wy>ly&&wy<ly+l.h){
      G.dead=true;sfx.lava();
      gameOver('🔥 BURNED!');return;
    }
  }
  // stars
  for(const s of G.stars){
    s.t+=dt*3;
    if(!s.taken&&Math.hypot(G.px-s.x,G.py-(s.y+G.camY))<36){
      s.taken=true;sfx.star();
      G.score+=25*G.combo;G.combo=Math.min(8,G.combo+1);
      updateHUD();
      for(let i=0;i<6;i++){const p=particles.find(p=>!p.a);if(!p)break;
        p.a=true;p.x=s.x;p.y=s.y+G.camY;const a=Math.random()*Math.PI*2;
        p.vx=Math.cos(a)*160;p.vy=Math.sin(a)*160;
        p.life=0.4;p.max=0.4;p.color='#ffd23f';p.size=3;}
    }
  }
  G.stars=G.stars.filter(s=>!s.taken&&s.y+G.camY<H+60);
  // camera follows up
  const screenY=G.py-G.camY;
  if(screenY<H*0.35){
    G.camY-=(H*0.35-screenY);
    const h=Math.floor(-G.camY/10);
    if(h>G.score){G.score=h;updateHUD();}
  }
  // spawn more
  let topY=1e9;
  for(const s of G.stars)topY=Math.min(topY,s.y);
  for(const l of G.lavas)topY=Math.min(topY,l.y);
  while(topY>G.camY-400){
    topY-=200+Math.random()*80;
    spawnRow(topY-G.camY);
  }
  G.lavas=G.lavas.filter(l=>l.y+G.camY<H+100);
  // fell
  if(G.py-G.camY>H+60){
    G.dead=true;sfx.fall();
    gameOver('💥 YOU FELL!');
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
}
function gameOver(title){
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('walljump_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay(title,
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Height: ${Math.floor(G.score/10)}m</p><p>Best: ${Math.floor(G.best/10)}m</p>`,
      '🔥 Fire Safety: Climb to safety!',
      '↻ CLIMB AGAIN',()=>{reset();G.state='play';});
  },600);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#140d08');bg.addColorStop(1,'#1e1006');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const offY=-G.camY;
  // walls
  const wl=wallX(-1,G.camY),wr=wallX(1,G.camY);
  const wg=ctx.createLinearGradient(wl,0,wr,0);
  wg.addColorStop(0,'#3a2a1a');wg.addColorStop(0.5,'rgba(58,42,26,0)');wg.addColorStop(1,'#3a2a1a');
  ctx.fillStyle='#3a2a1a';
  ctx.fillRect(0,0,wl,H);
  ctx.fillRect(wr,0,W-wr,H);
  // wall texture
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let y=(offY%80);y<H;y+=80){
    ctx.fillRect(0,y,wl,4);ctx.fillRect(wr,y,W-wr,4);
  }
  // lava patches
  for(const l of G.lavas){
    const lx=wallX(l.side,G.camY);
    const ly=l.y+offY;
    if(ly<-100||ly>H+100)continue;
    const lg=ctx.createLinearGradient(0,ly,0,ly+l.h);
    lg.addColorStop(0,'#ff6a00');lg.addColorStop(1,'#a32a00');
    ctx.fillStyle=lg;
    const x0=l.side<0?lx-24:lx-6;
    ctx.fillRect(x0,ly,30,l.h);
    ctx.fillStyle='rgba(255,221,68,0.8)';
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(x0+15,ly+10+i*20+Math.sin(G.time*6+i)*3,4,0,Math.PI*2);ctx.fill();
    }
  }
  // stars
  for(const s of G.stars){
    const sy=s.y+offY;
    if(sy<-30||sy>H+30)continue;
    const bob=Math.sin(s.t)*4;
    ctx.save();ctx.translate(s.x,sy+bob);
    ctx.scale(Math.abs(Math.cos(s.t*0.5))*0.4+0.6,1);
    const g=ctx.createRadialGradient(-4,-4,2,0,0,12);
    g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ffd23f');g.addColorStop(1,'#a37a00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // player
  if(!G.dead){
    const py=G.py+offY;
    if(py<H+40){
      ctx.save();ctx.translate(G.px,py);ctx.scale(-G.onWall*0.6,1);
      const g=ctx.createRadialGradient(-6,-7,3,0,0,18);
      g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2b1a0e';
      ctx.beginPath();ctx.arc(5,-3,3,0,Math.PI*2);ctx.fill();
      // cling arms
      ctx.strokeStyle='#a33c10';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(8,-6);ctx.lineTo(18,-10);ctx.stroke();
      ctx.beginPath();ctx.moveTo(8,6);ctx.lineTo(18,10);ctx.stroke();
      ctx.restore();
    }
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    const sy=p.y;
    ctx.beginPath();ctx.arc(p.x,sy,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // combo
  if(G.combo>1){
    ctx.fillStyle='#ffd23f';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText(`🔥 COMBO x${G.combo}`,W/2,90);
    ctx.textAlign='left';
  }
  if(G.state==='play'&&G.time<3){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP TO JUMP TO THE OTHER WALL!',W/2,H*0.5);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+Math.floor(G.best/10)+'m';
requestAnimationFrame(loop);
</script>
</body>
</html>
