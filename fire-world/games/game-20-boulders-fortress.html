<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boulder's Fortress — by Jman350Z & fire team</title>
<meta name="description" content="Flap through crystal gates! Glide the fire baby in this Fire Babys flapper.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#bigscore{position:fixed;top:70px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:56px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;background:linear-gradient(180deg,#aee2ff,#4a90d9);-webkit-background-clip:text;background-clip:text;color:transparent}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#medal{font-size:64px;margin:8px 0}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="best">🏆 0</div>
</div>
<div id="bigscore" class="hidden">0</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🪨 BOULDER'S FORTRESS</h1>
<div id="obody"><p><b>Cinder</b> & <b>Blaze</b> are flying through the crystal fortress!</p><p><b>TAP</b> or press <b>SPACE</b> to flap! Glide through crystal gates — don't touch anything. It gets faster!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Flying is fun in games — in real life, stay grounded during storms!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson'),
      bigscore=document.getElementById('bigscore');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  flap(){tone(500,800,0.08,'sine',0.12);},
  score(){tone(800,1200,0.1,'triangle',0.14);},
  die(){tone(400,80,0.4,'sawtooth',0.18);},
  swoosh(){tone(300,600,0.15,'sine',0.08);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,py:0,vy:0,rot:0,pipes:[],time:0,
  speed:220,spawnT:0,dead:false,groundY:0,flash:0};
try{G.best=parseInt(localStorage.getItem('flap_best')||'0',10)||0;}catch(e){}
G.groundY=()=>H*0.88;
function reset(){
  G.score=0;G.py=H*0.42;G.vy=0;G.rot=0;G.pipes=[];G.time=0;
  G.speed=220;G.spawnT=1.4;G.dead=false;G.flash=0;
  bigscore.classList.remove('hidden');bigscore.textContent='0';
  document.getElementById('best').textContent='🏆 '+G.best;
  updateHUD();
}
function updateHUD(){document.getElementById('score').textContent='⭐ '+G.score;}
function flap(){
  if(G.state!=='play'||G.dead)return;
  G.vy=-560;sfx.flap();
  for(let i=0;i<5;i++)spawnP(W*0.32,G.py+16,(Math.random()-0.5)*120,Math.random()*100,0.3,'#fff',3);
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
addEventListener('keydown',e=>{if(e.key===' '){flap();e.preventDefault();}});
const particles=[];
for(let i=0;i<60;i++)particles.push({a:false});
function spawnP(x,y,vx,vy,life,color,size){const p=particles.find(p=>!p.a);if(!p)return;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.color=color;p.size=size;}
function spawnPipe(){
  const gap=Math.max(150,210-G.score*2);
  const margin=80;
  const gy=margin+Math.random()*(H*0.7-margin*2-gap);
  G.pipes.push({x:W+60,gapY:gy,gapH:gap,w:74,scored:false});
}
function update(dt){
  G.time+=dt;
  G.speed=Math.min(380,220+G.score*6);
  // physics
  G.vy+=2100*dt;
  G.vy=Math.min(G.vy,900);
  G.py+=G.vy*dt;
  G.rot=Math.max(-0.4,Math.min(1.2,G.vy/700));
  const px=W*0.32,pr=20;
  // spawn
  G.spawnT-=dt;
  if(G.spawnT<=0){spawnPipe();G.spawnT=Math.max(1.05,1.55-G.score*0.015);}
  // pipes
  for(const p of G.pipes){
    p.x-=G.speed*dt;
    // score
    if(!p.scored&&p.x+p.w<px){
      p.scored=true;G.score++;sfx.score();
      bigscore.textContent=G.score;updateHUD();
    }
    // collision
    if(px+pr>p.x&&px-pr<p.x+p.w){
      if(G.py-pr<p.gapY||G.py+pr>p.gapY+p.gapH){die();return;}
    }
    if(p.x<-100)p.gone=true;
  }
  G.pipes=G.pipes.filter(p=>!p.gone);
  // ground/ceiling
  if(G.py+pr>=G.groundY()){G.py=G.groundY()-pr;die();return;}
  if(G.py-pr<0){G.py=pr;G.vy=0;}
  // trail
  if(Math.random()<0.5)spawnP(px-14,G.py,(Math.random()-0.5)*40,Math.random()*40,0.35,'#ffd23f',3);
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
}
function die(){
  if(G.dead)return;
  G.dead=true;sfx.die();G.flash=0.4;
  for(let i=0;i<18;i++)spawnP(W*0.32,G.py,(Math.random()-0.5)*350,(Math.random()-0.5)*350,0.6,'#ff6a1a',5);
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('flap_best',String(G.best));}catch(e){}}
  const medal=G.score>=40?'🏆':G.score>=25?'🥇':G.score>=15?'🥈':G.score>=8?'🥉':'';
  setTimeout(()=>{
    bigscore.classList.add('hidden');
    showOverlay('💥 CRASHED!',
      `${medal?`<div id="medal">${medal}</div>`:''}${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:28px;font-weight:900">Score: ${G.score}</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Flying is fun in games — stay grounded during storms!',
      '↻ FLY AGAIN',()=>{reset();G.state='play';});
  },700);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');sfx.swoosh();}
obtn.onclick=()=>{showMathGate();};
function render(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  const t=(Math.sin(G.time*0.1)+1)/2;
  sky.addColorStop(0,'#0d1a2a');sky.addColorStop(0.7,'#1a2a4a');sky.addColorStop(1,'#2a1a3a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // parallax mountains
  ctx.fillStyle='#0a1220';
  for(let i=0;i<3;i++){
    const off=(G.time*G.speed*0.2*(i+1)/3)%(W+200);
    for(let x=-200;x<W+200;x+=220){
      const mx=x-off+((i*97)%220);
      ctx.beginPath();ctx.moveTo(mx,G.groundY());ctx.lineTo(mx+110,G.groundY()-120-i*40);ctx.lineTo(mx+220,G.groundY());ctx.closePath();ctx.fill();
    }
  }
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<6;i++){
    const cx=((i*311+G.time*G.speed*0.3)%(W+200)+(W+200))%(W+200)-100;
    const cy=(i*173)%(H*0.5);
    ctx.beginPath();ctx.ellipse(cx,cy,60,18,0,0,Math.PI*2);ctx.fill();
  }
  const gy=G.groundY();
  // pipes (crystal gates)
  for(const p of G.pipes){
    // top
    drawCrystal(p.x,0,p.w,p.gapY,true);
    // bottom
    drawCrystal(p.x,p.gapY+p.gapH,p.w,gy-(p.gapY+p.gapH),false);
  }
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#2a4a3a');gg.addColorStop(1,'#0d1a12');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='rgba(255,255,255,0.1)';
  for(let x=0;x<W;x+=40){
    const gx=((x-G.time*G.speed)%(W+40)+(W+40))%(W+40)-20;
    ctx.fillRect(gx,gy+8,20,4);
  }
  // player
  if(!G.dead||G.state!=='over'){
    const px=W*0.32;
    ctx.save();ctx.translate(px,G.py);ctx.rotate(G.rot);
    // glow
    const gl=ctx.createRadialGradient(0,0,5,0,0,36);
    gl.addColorStop(0,'rgba(255,150,50,0.35)');gl.addColorStop(1,'rgba(255,150,50,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(-6,-7,3,0,0,20);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff9a3a');g.addColorStop(1,'#e8352c');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
    // wing
    const wa=Math.sin(G.time*22)*0.5;
    ctx.fillStyle='#ff6a1a';
    ctx.save();ctx.rotate(-0.4+wa*0.4);
    ctx.beginPath();ctx.ellipse(-14,2,12,6,-0.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // face
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(5,-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2b1a0e';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(8,4,6,0.4,Math.PI-0.8);ctx.stroke();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // flash
  if(G.flash>0){
    ctx.fillStyle=`rgba(255,255,255,${G.flash})`;ctx.fillRect(0,0,W,H);
    G.flash-=0.06;
  }
  // get ready
  if(G.state==='play'&&G.score===0&&G.time<2){
    ctx.textAlign='center';ctx.font='900 28px system-ui';
    ctx.fillStyle='#fff';ctx.fillText('TAP TO FLAP!',W/2,H*0.35);
    ctx.textAlign='left';
  }
}
function drawCrystal(x,y,w,h,isTop){
  if(h<=0)return;
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#2a5a8a');g.addColorStop(0.5,'#5ab8e8');g.addColorStop(1,'#2a5a8a');
  ctx.fillStyle=g;
  ctx.fillRect(x+3,y,w-6,h);
  // crystal facets
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
  for(let i=0;i<3;i++){
    const fy=y+h*(i+0.5)/3;
    ctx.beginPath();ctx.moveTo(x+6,fy);ctx.lineTo(x+w-6,fy);ctx.stroke();
  }
  // cap
  ctx.fillStyle='#7fd4ff';
  if(isTop)ctx.fillRect(x,y+h-14,w,14);
  else ctx.fillRect(x,y,w,14);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  if(isTop){ctx.strokeRect(x+1,y+h-14,w-2,14);}
  else{ctx.strokeRect(x+1,y,w-2,14);}
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
