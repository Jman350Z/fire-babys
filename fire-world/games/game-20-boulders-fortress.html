<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boulder's Fortress — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140806;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#ff8a3d;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:34px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">HEIGHT 0</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🏰 BOULDER'S FORTRESS</h1>
<p>Hop Cinder up the endless fortress towers! Tap LEFT/RIGHT side to hop that way. Land on platforms — miss and fall! Grab gems for COMBO!</p>
<div class="lesson">🔥 Fire Safety: Climbing is fun on playgrounds — but never climb on stoves, heaters, or anything hot!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
const a=2+Math.floor(Math.random()*8),b=1+Math.floor(Math.random()*5);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else alert('Try again!');}
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let running=false,px,py,vy,plats=[],gems=[],parts=[],camY=0,height=0,combo=0,comboT=0,shake=0,hopDir=0;
function mkPlat(y){
  const w=90+Math.random()*70;
  return{x:Math.random()*(W-w),y,w,h:20,moving:Math.random()<0.25&&height>5,md:Math.random()<0.5?-1:1,broken:false};
}
function startGame(){
  running=true;px=W/2;py=H-120;vy=0;camY=0;height=0;combo=0;shake=0;parts=[];
  plats=[];for(let i=0;i<9;i++)plats.push(mkPlat(H-60-i*110));
  gems=[];overlay.classList.add('hidden');upd();
}
function upd(){scoreEl.textContent='HEIGHT '+Math.floor(height);}
function burst(x,y,c,n){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s-2,life:1,c,sz:3+Math.random()*5});}}
function gameOver(){
  running=false;
  overlay.querySelector('h1').textContent='💥 FELL DOWN!';
  overlay.querySelector('p').textContent='Cinder reached height '+Math.floor(height)+'!';
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ HOP AGAIN';
  overlay.classList.remove('hidden');beep(140,0.4,'sawtooth');
}
function hop(dir){
  if(!running)return;
  vy=-13;hopDir=dir;px+=dir*46;beep(420,0.12,'square');
}
function update(dt){
  if(!running)return;
  vy+=dt*30;py+=vy*dt;px+=hopDir*dt*160;hopDir*=0.9;
  if(px<20)px=20;if(px>W-20)px=W-20;
  if(vy>0){
    plats.forEach(p=>{
      if(!p.broken&&px>p.x-10&&px<p.x+p.w+10&&py+22>p.y&&py+22<p.y+p.h+14){
        py=p.y-22;vy=-13.5;hopDir=0;
        combo++;comboT=2;comboEl.textContent=combo>2?'🦘 HOP COMBO x'+combo:'';
        beep(400+combo*40,0.1,'triangle');burst(px,py+22,'#ffd23f',6);
        if(p.moving&&Math.random()<0.12){p.broken=true;burst(p.x+p.w/2,p.y,'#8a5a3a',10);}
      }
    });
  }
  // camera
  const target=py-H*0.55;
  if(target<camY){const dh=camY-target;height+=dh/40;camY=target;upd();}
  // gems
  if(Math.random()<0.008&&gems.length<3)gems.push({x:Math.random()*W,y:camY-40,r:12});
  gems.forEach(g=>{
    const sy=g.y-camY;
    if(Math.abs(g.x-px)<34&&Math.abs(sy-py)<40){g.got=true;combo+=2;comboT=2.5;comboEl.textContent='💎 GEM COMBO x'+combo;burst(px,py,'#7ae2ff',14);beep(900,0.2,'sine');}
  });
  gems=gems.filter(g=>!g.got&&g.y>camY-100);
  // platforms recycle
  plats.forEach(p=>{if(p.moving){p.x+=p.md*dt*80;if(p.x<0||p.x+p.w>W)p.md*=-1;}});
  plats=plats.filter(p=>p.y-camY<H+60);
  while(plats.length<10){const top=Math.min(...plats.map(p=>p.y));const np=mkPlat(top-100-Math.random()*40);plats.push(np);}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;comboEl.textContent='';}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.life-=dt*1.4;});
  parts=parts.filter(p=>p.life>0);
  shake*=0.88;
  if(py-camY>H+80)gameOver();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0505');g.addColorStop(1,'#2a1008');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // fortress bg bricks
  ctx.fillStyle='rgba(120,70,40,0.25)';
  const off=camY%60;
  for(let y=-off;y<H;y+=60)for(let x=((y/60)%2)*40;x<W;x+=80)ctx.fillRect(x,y,76,56);
  plats.forEach(p=>{
    if(p.broken)return;
    const sy=p.y-camY;
    ctx.fillStyle='#8a5a3a';ctx.fillRect(p.x,sy,p.w,p.h);
    ctx.fillStyle='#a06a45';ctx.fillRect(p.x,sy,p.w,6);
    ctx.strokeStyle='#4a2c1a';ctx.lineWidth=3;ctx.strokeRect(p.x,sy,p.w,p.h);
  });
  gems.forEach(gm=>{const sy=gm.y-camY;ctx.save();ctx.translate(gm.x,sy);ctx.rotate(Date.now()/500);
    ctx.fillStyle='#7ae2ff';ctx.shadowColor='#7ae2ff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,0);ctx.lineTo(0,14);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();ctx.restore();});
  // Cinder (blue-ish fire baby)
  const sy=py-camY;
  ctx.save();ctx.translate(px,sy);
  const cg=ctx.createRadialGradient(-6,-8,4,0,0,26);
  cg.addColorStop(0,'#bfefff');cg.addColorStop(0.5,'#4db8ff');cg.addColorStop(1,'#1e5ac4');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,24,0,6.29);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,0,4.5,0,6.29);ctx.arc(7,0,4.5,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-7,1,2.2,0,6.29);ctx.arc(7,1,2.2,0,6.29);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,8,6,0.3,2.8);ctx.stroke();
  ctx.restore();
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y-camY*0,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();(e.clientX-r.left)<W/2?hop(-1):hop(1);});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')hop(-1);if(e.key==='ArrowRight'||e.key==='d')hop(1);});
</script>
</body>
</html>
