<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magma Drop Physics — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0a08;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:18px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,10,8,.94);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(26px,6vw,40px);font-weight:900;margin-bottom:10px;color:#ff6a00}
#overlay p{font-size:15px;margin-bottom:8px;max-width:440px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:440px}
#overlay button{background:#e8640c;color:#fff;border:3px solid #fff;font-size:19px;font-weight:800;padding:12px 34px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#2a2a2a;border-radius:12px;padding:14px;margin:10px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:6px;border-radius:8px;border:2px solid #666;margin:0 6px}
.hidden{display:none!important}
#back{position:fixed;bottom:12px;left:10px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div id="moves">MOVES 0</div><div id="time">0:00</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🧩 MAGMA DROP PHYSICS</h1>
<div id="obody"><p>Slide the tiles to rebuild the <b style="color:#ffd23f">Fire Baby picture</b>!</p><p>Tap a tile next to the empty space to slide it. Fewest moves wins!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq"></span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Every piece matters — make a family fire escape plan where everyone knows their part!</div>
<button id="obtn">▶ START</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
const mathgate=document.getElementById('mathgate');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}addEventListener('resize',resize);resize();
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=type||'sine';o.frequency.setValueAtTime(f0,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),a.currentTime+dur);g.gain.setValueAtTime(0.2,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+dur);o.start();o.stop(a.currentTime+dur);}
let mathAns=0;
function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathAns=a+b;document.getElementById('mq').textContent=a+' + '+b;mathgate.classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathAns){mathgate.classList.add('hidden');start();}else document.getElementById('ma').value='';}
const N=4;
const G={state:'title',grid:[],moves:0,startT:0,elapsed:0,gx:0,gy:0,ts:0,win:false,parts:[]};
function shuffle(){
  G.grid=[];for(let i=0;i<N*N-1;i++)G.grid.push(i);G.grid.push(-1);
  let empty=N*N-1;
  for(let k=0;k<120;k++){
    const r=Math.floor(empty/N),c=empty%N;
    const opts=[];
    if(r>0)opts.push(empty-N);if(r<N-1)opts.push(empty+N);
    if(c>0)opts.push(empty-1);if(c<N-1)opts.push(empty+1);
    const t=opts[Math.floor(Math.random()*opts.length)];
    G.grid[empty]=G.grid[t];G.grid[t]=-1;empty=t;
  }
}
function layout(){
  const ts=Math.min(W*0.92,H*0.6)/N;
  G.ts=ts;G.gx=(W-ts*N)/2;G.gy=(H-ts*N)/2+30;
}
function start(){ac();layout();shuffle();G.state='play';G.moves=0;G.startT=Date.now();G.elapsed=0;G.win=false;G.parts=[];
  document.getElementById('moves').textContent='MOVES 0';
  overlay.classList.add('hidden');}
function solved(){for(let i=0;i<N*N-1;i++)if(G.grid[i]!==i)return false;return G.grid[N*N-1]===-1;}
function gameOver(){
  G.state='over';G.win=true;sfx(523,1047,0.6,'sine');
  for(let i=0;i<40;i++)G.parts.push({x:W/2+(Math.random()-0.5)*200,y:H/2+(Math.random()-0.5)*200,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:1,color:['#ffd23f','#ff6a00','#ff3b2e'][i%3],s:6});
  const s=Math.floor(G.elapsed);
  setTimeout(()=>{
    overlay.classList.remove('hidden');
    document.querySelector('#overlay h1').textContent='🎉 COMPLETE!';
    obody.innerHTML='<p>You rebuilt the Fire Baby in <b>'+G.moves+' moves</b> and <b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b>!</p>';
    obtn.textContent='↻ PLAY AGAIN';obtn.onclick=()=>{start();};
  },900);
}
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.win)return;
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const c=Math.floor((mx-G.gx)/G.ts),rr=Math.floor((my-G.gy)/G.ts);
  if(c<0||c>=N||rr<0||rr>=N)return;
  const idx=rr*N+c,empty=G.grid.indexOf(-1);
  const er=Math.floor(empty/N),ec=empty%N;
  if(Math.abs(er-rr)+Math.abs(ec-c)===1){
    G.grid[empty]=G.grid[idx];G.grid[idx]=-1;G.moves++;
    sfx(400,600,0.08,'square');
    document.getElementById('moves').textContent='MOVES '+G.moves;
    if(solved())gameOver();
  }
});
function drawTileContent(i,x,y,ts){
  ctx.save();ctx.beginPath();ctx.rect(x,y,ts,ts);ctx.clip();
  ctx.fillStyle='#2a1a10';ctx.fillRect(x,y,ts,ts);
  const tr=Math.floor(i/N),tc=i%N;
  const fcx=x+(N/2-tc)*ts, fcy=y+(N/2-tr)*ts;
  const R=ts*N*0.32;
  const g=ctx.createRadialGradient(fcx-R*0.2,fcy-R*0.25,R*0.1,fcx,fcy,R);
  g.addColorStop(0,'#fff3b0');g.addColorStop(0.6,'#ffb300');g.addColorStop(1,'#e8640c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(fcx,fcy,R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6a00';
  ctx.beginPath();ctx.moveTo(fcx-R*0.45,fcy-R*0.6);ctx.quadraticCurveTo(fcx,fcy-R*1.5,fcx+R*0.45,fcy-R*0.6);ctx.quadraticCurveTo(fcx,fcy-R*0.9,fcx-R*0.45,fcy-R*0.6);ctx.fill();
  ctx.fillStyle='#2b1a0e';
  ctx.beginPath();ctx.arc(fcx-R*0.25,fcy-R*0.05,R*0.1,0,Math.PI*2);ctx.arc(fcx+R*0.25,fcy-R*0.05,R*0.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2b1a0e';ctx.lineWidth=R*0.08;
  ctx.beginPath();ctx.arc(fcx,fcy+R*0.3,R*0.22,0.2,Math.PI-0.2);ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.fillStyle='#0f0a08';ctx.fillRect(0,0,W,H);
  if(G.state==='title')return;
  for(let i=0;i<N*N;i++){
    const r=Math.floor(i/N),c=i%N;
    const x=G.gx+c*G.ts,y=G.gy+r*G.ts;
    const v=G.grid[i];
    if(v===-1){ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(x+2,y+2,G.ts-4,G.ts-4);continue;}
    drawTileContent(v,x+2,y+2,G.ts-4);
    ctx.strokeStyle='#5a4a3a';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,G.ts-4,G.ts-4);
  }
  for(const p of G.parts){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  if(G.state==='play'){
    G.elapsed=(Date.now()-G.startT)/1000;
    const s=Math.floor(G.elapsed);
    document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }
}
obtn.onclick=()=>{showGate();};
function loop(){requestAnimationFrame(loop);render();}requestAnimationFrame(loop);
</script>
</body>
</html>
