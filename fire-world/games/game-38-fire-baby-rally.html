<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fire Baby Rally — by Jman350Z & fire team</title>
<meta name="description" content="Race the track! 3 laps against the clock. A Fire Babys racing game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#aee2ff}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#pedals{position:fixed;bottom:20px;right:16px;z-index:10;display:flex;gap:12px}
.pedal{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid #fff;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;font-weight:900}
.pedal:active{background:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="lap">LAP 1/3</div>
<div class="pill" id="time">⏱️ 0.0s</div>
<div class="pill" id="best">🏆 --</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="pedals"><div class="pedal" id="leftBtn">◀</div><div class="pedal" id="rightBtn">▶</div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🏁 FIRE BABY RALLY</h1>
<div id="obody"><p>3 laps — beat the clock!</p><p><b>HOLD</b> to accelerate, <b>◀ ▶</b> or <b>arrow keys</b> to steer! Stay on the track — grass slows you down. Hit the boost pads for speed!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Race to safety — never race real cars!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  boost(){tone(300,1200,0.3,'sawtooth',0.1);},
  lap(){tone(600,1000,0.2,'triangle',0.13);},
  count(n){tone(400+n*200,400+n*200,0.15,'square',0.12);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.2,'triangle',0.14,i*0.09));},
  click(){tone(600,600,0.06,'square',0.1);}
};
// track: oval with waypoints
function trackPoints(){
  const cx=W/2,cy=H/2,rx=W*0.36,ry=H*0.32;
  const pts=[];
  for(let i=0;i<48;i++){
    const a=i/48*Math.PI*2;
    // slight wobble for interest
    const w=1+0.08*Math.sin(a*3);
    pts.push({x:cx+Math.cos(a)*rx*w,y:cy+Math.sin(a)*ry*w});
  }
  return pts;
}
let TRACK=[];
const G={state:'title',lap:1,lapTimes:[],raceT:0,
  x:0,y:0,a:0,v:0,boost:0,countdown:0,
  best:null,offTrack:false,time:0,skid:[]};
try{const b=localStorage.getItem('rally_best');if(b)G.best=parseFloat(b);}catch(e){}
function reset(){
  TRACK=trackPoints();
  const p0=TRACK[0];
  G.x=p0.x;G.y=p0.y+40;G.a=-Math.PI/2;G.v=0;G.boost=0;
  G.lap=1;G.lapTimes=[];G.raceT=0;G.countdown=3;G.skid=[];
  G.state='countdown';G.countT=0;
  updateHUD();
}
function updateHUD(){
  document.getElementById('lap').textContent=`LAP ${Math.min(G.lap,3)}/3`;
  document.getElementById('time').textContent='⏱️ '+G.raceT.toFixed(1)+'s';
  document.getElementById('best').textContent='🏆 '+(G.best?G.best.toFixed(1)+'s':'--');
}
// input
let gas=false,steerL=false,steerR=false;
canvas.addEventListener('pointerdown',e=>{gas=true;});
canvas.addEventListener('pointerup',()=>gas=false);
canvas.addEventListener('pointercancel',()=>gas=false);
function bindHold(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.stopPropagation();fn(true);});
  el.addEventListener('pointerup',()=>fn(false));
  el.addEventListener('pointerleave',()=>fn(false));
}
bindHold('leftBtn',v=>steerL=v);
bindHold('rightBtn',v=>steerR=v);
const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='ArrowUp'||e.key===' ')gas=true;
});
addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
  if(e.key==='ArrowUp'||e.key===' ')gas=false;
});
function distToTrack(x,y){
  let best=1e9,bi=0;
  for(let i=0;i<TRACK.length;i++){
    const p=TRACK[i];
    const d=Math.hypot(x-p.x,y-p.y);
    if(d<best){best=d;bi=i;}
  }
  return{d:best,idx:bi};
}
// boost pads at fixed indices
const BOOSTS=[8,20,32,44];
function update(dt){
  G.time+=dt;
  if(G.state==='countdown'){
    G.countT+=dt;
    const n=3-Math.floor(G.countT);
    if(n!==G._cn&&n>0){G._cn=n;sfx.count(n);}
    if(G.countT>=3.6){G.state='play';sfx.count(4);}
    return;
  }
  if(G.state!=='play')return;
  G.raceT+=dt;G.boost=Math.max(0,G.boost-dt);
  const accel=gas||keys['w']?420:0;
  const maxV=G.boost>0?560:340;
  if(accel)G.v=Math.min(maxV,G.v+accel*dt);
  else G.v=Math.max(0,G.v-180*dt);
  // steering
  const steer=(steerL||keys['arrowleft']||keys['a']?-1:0)+(steerR||keys['arrowright']||keys['d']?1:0);
  if(G.v>20)G.a+=steer*2.4*dt*(G.v/maxV);
  G.x+=Math.cos(G.a)*G.v*dt;
  G.y+=Math.sin(G.a)*G.v*dt;
  // track check
  const{d,idx}=distToTrack(G.x,G.y);
  const trackW=54;
  G.offTrack=d>trackW;
  if(G.offTrack)G.v=Math.max(80,G.v-300*dt);
  // boost pads
  if(BOOSTS.includes(idx)&&G.v>50&&G.boost<=0){
    G.boost=1.2;sfx.boost();
    for(let i=0;i<10;i++)G.skid.push({x:G.x,y:G.y,vx:-Math.cos(G.a)*200+(Math.random()-0.5)*100,vy:-Math.sin(G.a)*200+(Math.random()-0.5)*100,life:0.5,color:'#7fd4ff'});
  }
  // lap detection (cross start/finish)
  G._lastIdx=G._lastIdx||0;
  if(G._lastIdx>40&&idx<8&&G.raceT>3){
    // crossed line
    const lt=G.raceT-(G.lapStart||0);
    G.lapTimes.push(lt);G.lapStart=G.raceT;
    sfx.lap();
    if(G.lap>=3){finishRace();return;}
    G.lap++;
  }
  G._lastIdx=idx;
  if(!G.lapStart&&G.raceT>0.5)G.lapStart=0;
  // skids
  if(steer!==0&&G.v>200&&Math.random()<0.4){
    G.skid.push({x:G.x-Math.cos(G.a)*14,y:G.y-Math.sin(G.a)*14,
      vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*40,life:0.6,color:'#555'});
  }
  for(const s of G.skid){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}
  G.skid=G.skid.filter(s=>s.life>0);
  updateHUD();
}
function finishRace(){
  G.state='over';
  const total=G.raceT;
  const isBest=!G.best||total<G.best;
  if(isBest){G.best=total;try{localStorage.setItem('rally_best',String(total));}catch(e){}}
  sfx.win();
  const laps=G.lapTimes.map((t,i)=>`Lap ${i+1}: ${t.toFixed(1)}s`).join('<br>');
  setTimeout(()=>{
    showOverlay('🏁 RACE COMPLETE!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST TIME!</p>':''}${laps}<p style="font-size:24px;font-weight:900">Total: ${total.toFixed(1)}s</p>`,
      '🔥 Fire Safety: Race to safety — never race real cars!',
      '↻ RACE AGAIN',()=>{reset();overlay.classList.add('hidden');});
  },600);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  // grass
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a3a1a');bg.addColorStop(1,'#0d2412');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(!TRACK.length)return;
  // track (wide dark)
  ctx.strokeStyle='#2a2a3a';ctx.lineWidth=116;ctx.lineJoin='round';
  ctx.beginPath();
  TRACK.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.stroke();
  // track surface
  ctx.strokeStyle='#3a3a4a';ctx.lineWidth=100;
  ctx.stroke();
  // center dashes
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=4;ctx.setLineDash([20,24]);
  ctx.beginPath();
  TRACK.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.stroke();
  ctx.setLineDash([]);
  // start/finish
  const p0=TRACK[0];
  ctx.save();ctx.translate(p0.x,p0.y);ctx.rotate(Math.atan2(TRACK[1].y-p0.y,TRACK[1].x-p0.x)+Math.PI/2);
  for(let i=0;i<4;i++)for(let j=0;j<6;j++){
    ctx.fillStyle=(i+j)%2?'#fff':'#111';
    ctx.fillRect(-50+i*25,-8+j*8,25,8);
  }
  ctx.restore();
  // boost pads
  for(const bi of BOOSTS){
    const p=TRACK[bi];
    const pulse=1+Math.sin(G.time*6)*0.12;
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(pulse,pulse);
    ctx.fillStyle='rgba(127,212,255,0.85)';
    ctx.font='30px system-ui';ctx.textAlign='center';
    ctx.fillText('⚡',0,10);ctx.textAlign='left';
    ctx.restore();
  }
  // skids
  for(const s of G.skid){
    ctx.globalAlpha=Math.min(0.5,s.life);
    ctx.fillStyle=s.color;
    ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // car
  if(G.state!=='title'){
    ctx.save();ctx.translate(G.x,G.y);ctx.rotate(G.a);
    if(G.boost>0){
      ctx.fillStyle='rgba(127,212,255,0.5)';
      ctx.beginPath();ctx.ellipse(-24,0,18,10,0,0,Math.PI*2);ctx.fill();
    }
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.roundRect(-20,-11+3,40,22,6);ctx.fill();
    // body
    const g=ctx.createLinearGradient(0,-11,0,11);
    g.addColorStop(0,'#ff8a3a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=G.offTrack?'#6a6a6a':g;
    ctx.beginPath();ctx.roundRect(-20,-11,40,22,6);ctx.fill();
    // cockpit (fire baby)
    ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(2,0,8,0,Math.PI*2);ctx.fill();
    // wheels
    ctx.fillStyle='#111';
    ctx.fillRect(-14,-15,10,5);ctx.fillRect(-14,10,10,5);
    ctx.fillRect(6,-15,10,5);ctx.fillRect(6,10,10,5);
    ctx.restore();
  }
  // countdown
  if(G.state==='countdown'){
    const n=3-Math.floor(G.countT);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=n>0?'#ffd23f':'#4caf50';
    ctx.font='900 90px system-ui';ctx.textAlign='center';
    ctx.fillText(n>0?n:'GO!',W/2,H/2);
    ctx.textAlign='left';
  }
  // gas hint
  if(G.state==='play'&&G.raceT<4){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 18px system-ui';ctx.textAlign='center';
    ctx.fillText('HOLD TO GO! ◀ ▶ TO STEER',W/2,H*0.85);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='countdown'||G.state==='play')update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+(G.best?G.best.toFixed(1)+'s':'--');
requestAnimationFrame(loop);
</script>
</body>
</html>
