<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#livesbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;gap:6px}
.heart{font-size:22px}.heart.lost{filter:grayscale(1);opacity:.3}
#ctl{position:fixed;top:108px;right:12px;z-index:15;display:flex;gap:8px}
#ctl button{background:rgba(0,0,0,.55);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:800;cursor:pointer;min-width:44px;min-height:44px}
</style>
<style data-fbvis-cycle1>
/* fbvis-cycle1: premium chrome pass — accent #ff8c2e / glow #ffd76a, presentation only */
:root{--fbacc:#ff8c2e;--fbglow:#ffd76a}
body{background:radial-gradient(120% 90% at 50% 0%,rgba(255,140,46,0.13),transparent 55%),radial-gradient(110% 100% at 50% 115%,rgba(255,140,46,0.09),transparent 60%),#140a06}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffd76a;outline-offset:2px;border-radius:6px}
.pill{background:linear-gradient(180deg,rgba(34,18,9,.85),rgba(14,7,3,.85));border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);text-shadow:0 1px 2px rgba(0,0,0,.65)}
#overlay{background:radial-gradient(90% 62% at 50% 28%,rgba(255,140,46,0.2),transparent 65%),radial-gradient(120% 100% at 50% 118%,rgba(0,0,0,.5),transparent 60%),linear-gradient(180deg,rgba(26,12,5,.96),rgba(13,6,3,.97))}
#overlay h1{filter:drop-shadow(0 3px 16px rgba(255,140,46,0.45))}
#overlay button{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
#overlay button:hover:not(:active){filter:brightness(1.08);transform:translateY(-1px)}
#overlay .lesson{border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#mathgate{border:1px solid rgba(255,140,46,0.55);box-shadow:0 8px 22px rgba(0,0,0,.4)}
#mathgate input{transition:border-color .12s ease,box-shadow .12s ease}
#mathgate input:focus{border-color:#ff8c2e;box-shadow:0 0 0 3px rgba(255,140,46,0.35);outline:none}
#back{background:linear-gradient(180deg,rgba(34,18,9,.88),rgba(14,7,3,.88));border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);transition:filter .12s ease,transform .12s ease}
#back:hover{filter:brightness(1.35)}
@media (prefers-reduced-motion:reduce){#overlay button,.lvlBtn,#back,#sysbtns button,#ctlBtns button,.btn,.dbtn,.abtn{transition:none}}
</style>

<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="combo">🔥 x1</div>
<div class="pill" id="best">🏆 0</div>
</div>
<div id="livesbar"><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="ctl"><button id="restartBtn" title="Restart">↻</button><button id="pauseBtn" title="Pause (P)">⏸</button><button id="muteBtn" title="Sound on/off">🔊</button></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🧺 CRATER CATCHER</h1>
<div id="obody"><p>Stars are falling from the sky!</p><p><b>DRAG</b> or move your <b>mouse</b> to slide the basket! Catch <b style="color:#ffd23f">stars</b>, avoid <b style="color:#ff4a5a">meteors</b>! Golden stars are worth 5x!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Catch good habits — always catch yourself before you fall!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  catch(){tone(700,1100,0.09,'sine',0.12);},
  golden(){tone(1000,2000,0.14,'sine',0.14);},
  bad(){tone(300,120,0.2,'sawtooth',0.14);},
  miss(){tone(400,200,0.12,'sine',0.08);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,lives:5,combo:1,comboT:0,
  bx:0,items:[],spawnT:0.7,time:0,shake:0};
try{G.best=parseInt(localStorage.getItem('catch_best')||'0',10)||0;}catch(e){}
const BASKET_Y=()=>H*0.86,BASKET_W=110;
function reset(){
  G.score=0;G.lives=5;G.combo=1;G.comboT=0;G.items=[];G.spawnT=0.5;G.time=0;
  G.bx=W/2;updateHUD();updateLives();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('combo').textContent='🔥 x'+G.combo;
}
function updateLives(){
  document.querySelectorAll('.heart').forEach((h,i)=>h.classList.toggle('lost',i>=G.lives));
}
function spawnItem(){
  const r=Math.random();
  let type='star';
  if(r<0.18)type='meteor';
  else if(r<0.28)type='golden';
  else if(r<0.36)type='heart';
  G.items.push({x:30+Math.random()*(W-60),y:-30,
    vy:180+G.time*3.5+Math.random()*90,
    type,spin:Math.random()*6,wob:Math.random()*6,
    vx:(Math.random()-0.5)*60});
}
function moveBasket(x){G.bx=Math.max(BASKET_W/2,Math.min(W-BASKET_W/2,x));}
canvas.addEventListener('pointermove',e=>moveBasket(e.clientX));
canvas.addEventListener('pointerdown',e=>moveBasket(e.clientX));
const keysOn={};
addEventListener('keydown',e=>{keysOn[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keysOn[e.key.toLowerCase()]=false;});
const particles=[],floaters=[];
for(let i=0;i<100;i++)particles.push({a:false});
for(let i=0;i<12;i++)floaters.push({a:false});
function burst(x,y,color){
  for(let i=0;i<8;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*180;p.vy=Math.sin(a)*180-60;
    p.life=0.4;p.max=0.4;p.color=color;p.size=3+Math.random()*3;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  if(keysOn['arrowleft']||keysOn['a'])moveBasket(G.bx-560*dt);
  if(keysOn['arrowright']||keysOn['d'])moveBasket(G.bx+560*dt);
  G.comboT-=dt;if(G.comboT<=0){G.combo=1;G.comboT=0;}
  G.spawnT-=dt;
  if(G.spawnT<=0){
    spawnItem();
    G.spawnT=Math.max(0.3,0.75-G.time*0.006)+Math.random()*0.3;
  }
  const by=BASKET_Y();
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    it.y+=it.vy*dt;it.x+=it.vx*dt;it.spin+=dt*4;it.wob+=dt*6;
    if(it.x<18){it.x=18;it.vx=Math.abs(it.vx);}
    if(it.x>W-18){it.x=W-18;it.vx=-Math.abs(it.vx);}
    // catch
    if(it.y+14>by-24&&it.y<by+20&&Math.abs(it.x-G.bx)<BASKET_W/2){
      G.items.splice(i,1);
      if(it.type==='meteor'){
        G.lives--;G.combo=1;sfx.bad();G.shake=0.4;updateLives();updateHUD();
        spawnText(it.x,by-40,'OUCH!','#ff4a5a');
        burst(it.x,by-20,'#ff4a5a');
        if(G.lives<=0){gameOver();return;}
      }else if(it.type==='heart'){
        G.lives=Math.min(5,G.lives+1);sfx.catch();updateLives();
        spawnText(it.x,by-40,'+❤️','#ff6a8a');
      }else{
        const pts=(it.type==='golden'?50:10)*G.combo;
        G.score+=pts;
        G.combo=Math.min(10,G.combo+1);G.comboT=2.5;
        if(it.type==='golden')sfx.golden();else sfx.catch();
        spawnText(it.x,by-40,'+'+pts,it.type==='golden'?'#ffd23f':'#fff');
        burst(it.x,by-20,it.type==='golden'?'#ffd23f':'#7fd4ff');
        updateHUD();
      }
      continue;
    }
    // missed
    if(it.y>H+30){
      G.items.splice(i,1);
      if(it.type==='star'||it.type==='golden'){
        G.combo=1;sfx.miss();updateHUD();
      }
    }
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=40*dt;f.life-=dt;if(f.life<=0)f.a=false;}
}
function gameOver(){
  G.state='over';
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('catch_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    showOverlay('💥 GAME OVER',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Survived: ${Math.floor(G.time)}s</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Catch good habits!',
      '↻ PLAY AGAIN',()=>{reset();G.state='play';});
  },600);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
/* [w5c perf] Pre-baked glow sprites — the W5b-proven pattern copied from game-04:
   the ember loop's 24 per-frame shadowBlur=8 fills collapsed FPS under software
   rendering (10.0 FPS); blit a one-time radial-glow sprite instead. Colours,
   falloff and alpha unchanged; no gameplay/balance changes. */
function makeGlowSprite(hex){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const gr=x.createRadialGradient(48,48,0,48,48,48);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.35,`rgba(${r},${g},${b},0.38)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,96,96);return c;}
const EMBER_SPRITE=makeGlowSprite('#ff7a2a');
const EMBER_SPRITE_GOLD=makeGlowSprite('#ffd23f');
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1420');bg.addColorStop(0.7,'#1a1a2e');bg.addColorStop(1,'#0d1420');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // stars bg
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<40;i++){
    const sx=(i*197)%W,sy=(i*131+G.time*12)%H;
    ctx.globalAlpha=0.15+((i*37)%40)/100;
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;
  // living ember background (additive glow)
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<24;i++){
    const ex=((i*173+Math.sin(G.time*0.7+i)*12)%W+W)%W;
    const ey=H-((i*137+G.time*(22+(i%5)*7))%(H+30));
    ctx.globalAlpha=0.08+((i*29)%26)/100;
    const r=(1.6+(i%3))*7;ctx.drawImage(i%3?EMBER_SPRITE:EMBER_SPRITE_GOLD,ex-r,ey-r,r*2,r*2); // [w5c perf] pre-baked glow (was shadowBlur=8 per ember per frame)
  }
  ctx.restore();ctx.globalAlpha=1;
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*12,(Math.random()-0.5)*G.shake*12);
  // items
  for(const it of G.items){
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.wob)*0.25);
    if(it.type==='meteor'){
      const g=ctx.createRadialGradient(-5,-5,3,0,0,18);
      g.addColorStop(0,'#8a5a3a');g.addColorStop(1,'#3a1a0a');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
      // fire trail
      ctx.fillStyle='#ff4a00';
      ctx.beginPath();ctx.arc(-4,-18-Math.random()*6,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff4a00';
      ctx.beginPath();ctx.arc(-5,-5,4,0,Math.PI*2);ctx.arc(5,-5,4,0,Math.PI*2);ctx.fill();
    }else if(it.type==='golden'){
      const pulse=1+Math.sin(it.spin*2)*0.15;
      ctx.scale(pulse,pulse);
      ctx.fillStyle='#ffd23f';ctx.strokeStyle='#a37a00';ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,a2=a+Math.PI/5;
        ctx.lineTo(Math.cos(a)*16,Math.sin(a)*16);ctx.lineTo(Math.cos(a2)*7,Math.sin(a2)*7);}
      ctx.closePath();ctx.fill();ctx.stroke();
    }else if(it.type==='heart'){
      ctx.font='26px system-ui';ctx.textAlign='center';
      ctx.fillText('❤️',0,9);ctx.textAlign='left';
    }else{
      ctx.fillStyle='#7fd4ff';ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.save();ctx.rotate(it.spin*0.5);
      ctx.beginPath();
      for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,a2=a+Math.PI/5;
        ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13);ctx.lineTo(Math.cos(a2)*6,Math.sin(a2)*6);}
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  // basket
  const by=BASKET_Y();
  const bw=BASKET_W;
  const bg2=ctx.createLinearGradient(0,by-24,0,by+16);
  bg2.addColorStop(0,'#8a5a2a');bg2.addColorStop(1,'#4a2a10');
  ctx.fillStyle=bg2;
  ctx.beginPath();
  ctx.moveTo(G.bx-bw/2,by-24);ctx.lineTo(G.bx+bw/2,by-24);
  ctx.lineTo(G.bx+bw/2-12,by+16);ctx.lineTo(G.bx-bw/2+12,by+16);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.stroke();
  // fire baby peeking
  const fg=ctx.createRadialGradient(G.bx-4,by-30,2,G.bx,by-26,14);
  fg.addColorStop(0,'#ffe9a0');fg.addColorStop(1,'#ff7a2a');
  ctx.fillStyle=fg;ctx.shadowColor='#ff7a2a';ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(G.bx,by-26,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#2b1a0e';
  ctx.beginPath();ctx.arc(G.bx-4,by-28,2.5,0,Math.PI*2);ctx.arc(G.bx+4,by-28,2.5,0,Math.PI*2);ctx.fill();
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.combo>1){
    const bw=130,bx=(W-bw)/2,by=100;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(bx,by,bw,8,4);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.roundRect(bx,by,bw*Math.max(0,G.comboT/2.5),8,4);ctx.fill();
  }
  if(PAUSED){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.textAlign='center';
    ctx.fillText('⏸ PAUSED',W/2,H/2);ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(G.state==='play'&&!PAUSED)update(dt);else G.time+=dt*0.2;
  render();
  requestAnimationFrame(loop);
}
document.getElementById('best').textContent='🏆 '+G.best;
let MUTED=false,PAUSED=false;
const _tone23=tone;
tone=function(f0,f1,dur,type,vol,delay=0){if(MUTED)return;_tone23(f0,f1,dur,type,vol,delay);};
document.getElementById('muteBtn').onclick=()=>{MUTED=!MUTED;document.getElementById('muteBtn').textContent=MUTED?'🔇':'🔊';if(!MUTED)sfx.click();};
function setPaused(p){PAUSED=p;document.getElementById('pauseBtn').textContent=PAUSED?'▶':'⏸';}
document.getElementById('pauseBtn').onclick=()=>{if(G.state==='play')setPaused(!PAUSED);};
document.getElementById('restartBtn').onclick=()=>{if(G.state==='play'){setPaused(false);reset();G.state='play';sfx.click();}};
addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P'||e.key==='Escape')&&G.state==='play')setPaused(!PAUSED);});
requestAnimationFrame(loop);
/* ===== MUSIC (Jeff 2026-10-15): 'Catch the Embers' — Crater Catcher's own
   track. Synthesized Web Audio only. 116 BPM, G major: a cheerful triangle
   lead with a skipping rhythm — half the fun lands on the off-beats.
   This shell has no noise() helper, so the drums are tone-only (the game-02
   Blaze Runner precedent).
   Starts on first interaction; 🔊 mute + pause freeze it. =====
   INSERT: paste at the end of game-23-crater-catcher.html's main
   <script> block (same scope as audio()/tone()/noise()). No extra tags. */
const _mf=m=>440*Math.pow(2,(m-69)/12);
const MUS={on:false,step:0,nextT:0,BPM:116,
 BASS:[43,0,50,43,0,50,0,0, 48,0,55,48,0,55,0,0, 40,0,47,40,0,47,0,0, 38,0,45,38,0,45,0,0],
 LEAD:[79,0,76,79,0,0,81,0, 79,0,76,0,74,0,0,0, 76,0,79,0,83,0,79,0, 81,0,79,0,78,0,74,0],
 start(){if(this.on)return;const ac=audio();if(!ac)return;this.on=true;this.nextT=ac.currentTime+0.08;
  setInterval(()=>this.tick(),42);},
 tick(){const ac=audio();if(!ac)return;
  if(MUTED||PAUSED||G.state!=='play'){this.nextT=ac.currentTime+0.06;return;}
  while(this.nextT<ac.currentTime+0.14){this.play(this.step,this.nextT);this.nextT+=60/this.BPM/2;this.step=(this.step+1)%32;}},
 play(s,t){const d=Math.max(0,t-audio().currentTime);
  const b=this.BASS[s];if(b)tone(_mf(b),_mf(b),0.15,'triangle',0.055,d);
  const l=this.LEAD[s];if(l)tone(_mf(l),_mf(l),0.18,'triangle',0.055,d);
  if(s%8===0||s%8===4)tone(120,45,0.11,'sine',0.12,d); // kick
  if(s%8===2||s%8===6)tone(190,120,0.07,'triangle',0.06,d); // tone-only snare
  if(s%2===1)tone(6800,6800,0.015,'square',0.008,d); // skipping off-beat hat click
 }};
addEventListener('pointerdown',()=>MUS.start());
addEventListener('keydown',()=>MUS.start());
</script>
