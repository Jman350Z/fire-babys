<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crater Catcher — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0505;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#7ae2ff;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:34px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">SCORE 0</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>💎 CRATER CATCHER</h1>
<p>Drag Ruko left &amp; right to catch falling crystals! Dodge the burning meteors — 3 hits and it's over. Chain catches for COMBO!</p>
<div class="lesson">🔥 Fire Safety: Catch falling stars in games — but NEVER try to catch anything falling in real life! Let it drop and step back!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
const a=4+Math.floor(Math.random()*5),b=4+Math.floor(Math.random()*5);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else alert('Try again!');}
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let running=false,px,items=[],parts=[],score=0,combo=0,comboT=0,lives=3,shake=0,spT=0,gameT=0;
function startGame(){running=true;px=W/2;items=[];parts=[];score=0;combo=0;lives=3;shake=0;spT=0;gameT=0;overlay.classList.add('hidden');upd();}
function upd(){scoreEl.textContent='SCORE '+score+' · '+'❤️'.repeat(lives);}
function burst(x,y,c,n){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s-2,life:1,c,sz:3+Math.random()*5});}}
function gameOver(){
  running=false;
  overlay.querySelector('h1').textContent='☄️ METEOR SHOWER!';
  overlay.querySelector('p').textContent='Final score: '+score;
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ CATCH AGAIN';
  overlay.classList.remove('hidden');beep(130,0.5,'sawtooth');
}
function spawn(){
  const meteor=Math.random()<0.35;
  items.push({x:40+Math.random()*(W-80),y:-40,vy:220+Math.random()*180+gameT*4,type:meteor?'meteor':'crystal',r:meteor?22:16,spin:Math.random()*6.28});
}
function update(dt){
  if(!running)return;
  gameT+=dt;
  spT+=dt;if(spT>Math.max(0.35,0.9-gameT*0.015)){spT=0;spawn();}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;comboEl.textContent='';}
  const py=H-90;
  items.forEach(it=>{
    it.y+=it.vy*dt;it.spin+=dt*3;
    if(Math.abs(it.x-px)<52&&Math.abs(it.y-py)<52){
      it.got=true;
      if(it.type==='crystal'){
        combo++;comboT=2;const p=50*combo;score+=p;
        comboEl.textContent=combo>1?'💎 COMBO x'+combo+' +'+p:'+'+p;
        burst(it.x,it.y,'#7ae2ff',14);beep(700+combo*60,0.18,'sine');
      }else{
        lives--;combo=0;comboEl.textContent='🔥 OUCH!';
        burst(it.x,it.y,'#ff3b2e',20);shake=16;beep(140,0.35,'sawtooth');upd();
        if(lives<=0){gameOver();return;}
      }
    }
    if(it.y>H+50)it.got=true;
  });
  items=items.filter(i=>!i.got);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;p.life-=dt*1.4;});
  parts=parts.filter(p=>p.life>0);
  shake*=0.88;upd();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050208');g.addColorStop(1,'#1a0a05');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#fff';
  for(let i=0;i<40;i++){const x=(i*97)%W,y=(i*61)%(H*0.5);ctx.globalAlpha=0.3+0.3*Math.sin(Date.now()/500+i);ctx.fillRect(x,y,2,2);}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // crater ground
  ctx.fillStyle='#2a1408';ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle='#ff6a00';
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.ellipse(x+30,H-50,30,10,0,0,6.29);ctx.fill();}
  items.forEach(it=>{
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.spin*0.3);
    if(it.type==='crystal'){
      ctx.fillStyle='#7ae2ff';ctx.shadowColor='#7ae2ff';ctx.shadowBlur=14;
      ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(13,0);ctx.lineTo(0,18);ctx.lineTo(-13,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    }else{
      const mg=ctx.createRadialGradient(-5,-5,3,0,0,22);
      mg.addColorStop(0,'#ffb300');mg.addColorStop(0.6,'#ff5a00');mg.addColorStop(1,'#7a2000');
      ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0,0,22,0,6.29);ctx.fill();
      ctx.strokeStyle='#3a1000';ctx.lineWidth=3;ctx.stroke();
    }
    ctx.restore();
  });
  // Ruko catcher
  const py=H-90;
  ctx.save();ctx.translate(px,py);
  const rg=ctx.createRadialGradient(-6,-8,4,0,0,30);
  rg.addColorStop(0,'#ff8a7a');rg.addColorStop(0.5,'#ff3b2e');rg.addColorStop(1,'#a01508');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,28,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.fillRect(-28,-12,56,10);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,2,5,0,6.29);ctx.arc(9,2,5,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-9,3,2.5,0,6.29);ctx.arc(9,3,2.5,0,6.29);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,10,7,0.2,2.9);ctx.stroke();
  // basket
  ctx.fillStyle='#8a5a3a';ctx.beginPath();ctx.moveTo(-34,-24);ctx.lineTo(34,-24);ctx.lineTo(24,-44);ctx.lineTo(-24,-44);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4a2c1a';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;const r=cv.getBoundingClientRect();px=e.clientX-r.left;});
addEventListener('pointermove',e=>{if(dragging){const r=cv.getBoundingClientRect();px=Math.max(30,Math.min(W-30,e.clientX-r.left));}});
addEventListener('pointerup',()=>dragging=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px=Math.max(30,px-40);if(e.key==='ArrowRight')px=Math.min(W-30,px+40);});
</script>
</body>
</html>
