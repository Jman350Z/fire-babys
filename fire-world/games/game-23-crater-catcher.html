<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crater Catcher — Fire Babys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0716;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#cv{position:absolute;inset:0;display:block}
#back{position:absolute;top:8px;left:8px;z-index:20;background:rgba(0,0,0,.55);color:#ffd166;border:1px solid #ffd166;border-radius:10px;padding:8px 12px;font-size:15px;text-decoration:none}
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,4,14,.92);color:#fff;padding:20px}
.overlay h1{color:#ffd166;font-size:30px;margin-bottom:8px}
.overlay .stars{color:#c77dff;font-size:15px;margin-bottom:10px}
.lesson{background:#3d2358;border:2px solid #ffd166;border-radius:12px;padding:10px 14px;font-size:16px;margin:10px 0;max-width:420px;color:#ffe8c2}
.gate{margin:12px 0;font-size:20px}
.gate input{font-size:22px;width:90px;text-align:center;border-radius:8px;border:2px solid #ffd166;background:#140a20;color:#fff;padding:6px}
.gate button{font-size:20px;background:#8338ec;color:#fff;border:none;border-radius:10px;padding:10px 22px;margin-top:10px;cursor:pointer}
.bigbtn{font-size:24px;background:#8338ec;color:#fff;border:none;border-radius:14px;padding:14px 40px;margin-top:14px;cursor:pointer}
.score-line{font-size:26px;color:#ffd166;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a id="back" href="/fire-world.html">← Fire World</a>
<div id="titleScr" class="overlay">
<h1>🌋 Crater Catcher</h1>
<div class="stars">Starring Ruko &amp; Sizzle</div>
<div class="lesson">🔥 Fire Safety: Never hide during a fire — get OUTSIDE!</div>
<div class="gate"><div>Grown-up check: <b id="q"></b> = ?</div>
<div><input id="ans" type="number" inputmode="numeric" placeholder="?"></div>
<div><button id="unlock">UNLOCK</button></div></div>
<div style="font-size:13px;color:#caa">Hold LEFT / RIGHT half of screen to slide the crater ledge. Don't drop Sizzle!</div>
</div>
<div id="overScr" class="overlay hidden">
<h1>Game Over</h1>
<div class="score-line">Score: <b id="finalScore">0</b></div>
<div class="lesson">🔥 Fire Safety: Never hide during a fire — get OUTSIDE!</div>
<button class="bigbtn" id="restart">TAP TO RESTART</button>
</div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();
var AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(type){var ac=audio();if(!ac)return;var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
var cfg={pop:[880,0.08,'sine'],click:[660,0.06,'square'],hit:[160,0.18,'sawtooth'],win:[1320,0.3,'sine'],lose:[110,0.5,'sawtooth']}[type]||[440,0.1,'sine'];
o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],t);g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+cfg[1]);
o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+cfg[1]);}
var shake=0,parts=[];
function doShake(){shake=0.2;}
function burst(x,y,color,n){for(var i=0;i<(n||14);i++){var a=Math.random()*6.283,s=60+Math.random()*220;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7+Math.random()*0.4,color:color});}}
function updateFx(dt){if(shake>0)shake-=dt;for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.life<=0)parts.splice(i,1);}}
function drawFx(){for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,6.283);ctx.fill();}ctx.globalAlpha=1;}
function drawBaby(x,y,r,c1,c2){var g=ctx.createRadialGradient(x,y-r*0.4,r*0.1,x,y,r*1.4);g.addColorStop(0,c2);g.addColorStop(1,c1);
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y+r);ctx.bezierCurveTo(x-r,y+r*0.3,x-r*0.85,y-r*0.35,x,y-r*1.25);ctx.bezierCurveTo(x+r*0.85,y-r*0.35,x+r,y+r*0.3,x,y+r);ctx.fill();
ctx.fillStyle='#3a1d00';ctx.beginPath();ctx.arc(x-r*0.32,y+r*0.1,r*0.11,0,6.283);ctx.arc(x+r*0.32,y+r*0.1,r*0.11,0,6.283);ctx.fill();
ctx.strokeStyle='#3a1d00';ctx.lineWidth=r*0.08;ctx.beginPath();ctx.arc(x,y+r*0.28,r*0.28,0.3,Math.PI-0.3);ctx.stroke();}
// PARENTAL GATE
var A=1+Math.floor(Math.random()*9),B=1+Math.floor(Math.random()*9);
document.getElementById('q').textContent=A+' + '+B;
document.getElementById('unlock').addEventListener('click',function(){var v=parseInt(document.getElementById('ans').value,10);if(v===A+B){sfx('click');document.getElementById('titleScr').classList.add('hidden');startGame();}else{sfx('lose');alert('Try again!');}});
// GAME
var ball,pad,score,lives,playing,last,moveDir=0,touching={left:false,right:false};
function startGame(){pad={x:W/2,w:Math.max(90,W*0.26),h:16,y:H-70};
ball={x:W/2,y:H*0.35,vx:230,vy:260,r:18};score=0;lives=3;playing=true;last=performance.now();requestAnimationFrame(loop);}
function loseLife(){lives--;doShake();sfx('hit');burst(ball.x,H-30,'#888888',18);
if(lives<=0){playing=false;setTimeout(function(){document.getElementById('finalScore').textContent=score;document.getElementById('overScr').classList.remove('hidden');sfx('lose');},600);}
else{ball.x=W/2;ball.y=H*0.3;ball.vx=(Math.random()<0.5?-1:1)*230;ball.vy=260;}}
function update(dt){
  var dir=0;if(touching.left)dir--;if(touching.right)dir++;if(moveDir!==0)dir=moveDir;
  pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,pad.x+dir*W*0.9*dt));
  var sp=1+score*0.012;
  ball.x+=ball.vx*sp*dt;ball.y+=ball.vy*sp*dt;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sfx('click');}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sfx('click');}
  if(ball.y<ball.r+40){ball.y=ball.r+40;ball.vy=Math.abs(ball.vy);}
  if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y+ball.r<=pad.y+pad.h+14&&Math.abs(ball.x-pad.x)<pad.w/2+ball.r){
    ball.y=pad.y-ball.r;ball.vy=-Math.abs(ball.vy)*1.03;ball.vx+=(ball.x-pad.x)*4;
    score++;sfx('pop');burst(ball.x,pad.y,'#ffd166',10);}
  if(ball.y>H+30)loseLife();}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*14,(Math.random()-0.5)*14);
var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#150b24');bg.addColorStop(1,'#0a0512');ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
ctx.fillStyle='#2c1a4d';ctx.fillRect(0,pad.y-6,W,6);
ctx.fillStyle='#fb8500';var gg=ctx.createLinearGradient(0,pad.y,0,pad.y+pad.h);gg.addColorStop(0,'#ffd166');gg.addColorStop(1,'#fb8500');
ctx.fillStyle=gg;ctx.beginPath();ctx.roundRect(pad.x-pad.w/2,pad.y,pad.w,pad.h,8);ctx.fill();
ctx.strokeStyle='rgba(255,209,102,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
drawBaby(ball.x,ball.y,ball.r,'#fb8500','#ffd166');
drawFx();
ctx.fillStyle='#ffd166';ctx.font='bold 26px system-ui';ctx.textAlign='left';ctx.fillText('Score: '+score,16,64);
ctx.textAlign='right';ctx.font='26px system-ui';ctx.fillText('❤'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives)),W-16,64);
ctx.restore();}
function loop(t){if(!playing)return;var dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);draw();updateFx(dt);requestAnimationFrame(loop);}
function setTouch(e){var t=e.touches;touching.left=false;touching.right=false;
for(var i=0;i<t.length;i++){if(t[i].clientX<W/2)touching.left=true;else touching.right=true;}}
cv.addEventListener('touchstart',function(e){e.preventDefault();audio();setTouch(e);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();setTouch(e);},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();setTouch(e);},{passive:false});
window.addEventListener('keydown',function(e){if(e.code==='ArrowLeft')moveDir=-1;if(e.code==='ArrowRight')moveDir=1;audio();});
window.addEventListener('keyup',function(e){if(e.code==='ArrowLeft'&&moveDir===-1)moveDir=0;if(e.code==='ArrowRight'&&moveDir===1)moveDir=0;});
document.getElementById('restart').addEventListener('click',function(){document.getElementById('overScr').classList.add('hidden');sfx('click');startGame();});
</script>
</body>
</html>
