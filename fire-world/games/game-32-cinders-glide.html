<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,20,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#aee2ff}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#d6e9ff}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#aee2ff,#4a90d9);color:#0d1420;border:3px solid #aee2ff;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #2a5a89}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5a89}
#mathgate{background:#0e1a2a;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #4a90d9}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
#ctl{position:fixed;top:56px;right:12px;z-index:15;display:flex;gap:8px}
#ctl button{width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;border:2px solid rgba(255,255,255,.35);font-size:20px;cursor:pointer}
</style>
<style data-fbvis-cycle1>
/* fbvis-cycle1: premium chrome pass — accent #4a90d9 / glow #aee2ff, presentation only */
:root{--fbacc:#4a90d9;--fbglow:#aee2ff}
body{background:radial-gradient(120% 90% at 50% 0%,rgba(74,144,217,0.13),transparent 55%),radial-gradient(110% 100% at 50% 115%,rgba(74,144,217,0.09),transparent 60%),#140a06}

#overlay{background:radial-gradient(90% 62% at 50% 28%,rgba(74,144,217,0.2),transparent 65%),radial-gradient(120% 100% at 50% 118%,rgba(0,0,0,.5),transparent 60%),linear-gradient(180deg,rgba(26,12,5,.96),rgba(13,6,3,.97))}

#overlay .lesson{border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#mathgate{border:1px solid rgba(74,144,217,0.55);box-shadow:0 8px 22px rgba(0,0,0,.4)}
#mathgate input{transition:border-color .12s ease,box-shadow .12s ease}
#mathgate input:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,0.35);outline:none}
#back{background:linear-gradient(180deg,rgba(34,18,9,.88),rgba(14,7,3,.88));border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);transition:filter .12s ease,transform .12s ease}
#back:hover{filter:brightness(1.35)}
@media (prefers-reduced-motion:reduce){#overlay button,.lvlBtn,#back,#sysbtns button,#ctlBtns button,.btn,.dbtn,.abtn{transition:none}}
</style>

<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="dist">📏 0m</div>
<div class="pill" id="best">🏆 0</div>
</div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="ctl"><button id="pauseBtn" aria-label="Pause">⏸</button><button id="muteBtn" aria-label="Mute sound">🔊</button></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🪂 CINDER'S GLIDE</h1>
<div id="obody"><p>Glide through the crystal caves!</p><p><b>HOLD</b> (touch or SPACE) to rise, <b>RELEASE</b> to dive! Thread the gaps between stalactites. Grab 💎 gems for bonus points!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Math Check</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Glide to safety — stay calm and move steadily!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){if(window.__muted)return;const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  gem(){tone(900,1500,0.1,'sine',0.1);},
  die(){tone(400,80,0.4,'sawtooth',0.15);},
  whoosh(){tone(200,400,0.1,'sine',0.05);},
  click(){tone(600,600,0.06,'square',0.1);}
};
const G={state:'title',score:0,best:0,dist:0,speed:300,
  py:0,vy:0,holding:false,wasHold:false,rot:0,
  walls:[],gems:[],spawnX:0,time:0,shake:0,dead:false,ceiling:[],floor:[],terr:[],bonus:0};
try{G.best=parseInt(localStorage.getItem('glide_best')||'0',10)||0;}catch(e){}
function reset(){
  G.score=0;G.bonus=0;G.dist=0;G.speed=300;G.py=H/2;G.vy=0;
  G.walls=[];G.gems=[];G.time=0;G.shake=0;G.dead=false;
  // init terrain
  G.terr=[];
  let top=H*0.15,bot=H*0.85;
  for(let x=0;x<W+400;x+=40){
    G.terr.push({x,top,bot});
    top+= (Math.random()-0.5)*36;bot+=(Math.random()-0.5)*36;
    top=Math.max(40,Math.min(H*0.45,top));
    bot=Math.max(H*0.55,Math.min(H-40,bot));
    if(bot-top<220){const mid=(top+bot)/2;top=mid-110;bot=mid+110;}
  }
  G.nextX=W+360;
  updateHUD();
  document.getElementById('best').textContent='🏆 '+G.best;
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('dist').textContent='📏 '+Math.floor(G.dist)+'m';
}
function extendTerrain(){
  let last=G.terr[G.terr.length-1];
  while(last.x<G.nextX+W){
    const nx=last.x+40;
    let top=last.top+(Math.random()-0.5)*40;
    let bot=last.bot+(Math.random()-0.5)*40;
    const gapShrink=Math.min(80,G.dist*0.06);
    top=Math.max(30,Math.min(H*0.5-140+gapShrink,top));
    bot=Math.max(H*0.5+140-gapShrink,Math.min(H-30,bot));
    if(bot-top<200-gapShrink){const mid=(top+bot)/2;top=mid-(100-gapShrink/2);bot=mid+(100-gapShrink/2);}
    G.terr.push({x:nx,top,bot});
    // gems in the gap
    if(Math.random()<0.35){
      const gy=(top+bot)/2+(Math.random()-0.5)*60;
      G.gems.push({x:nx+80,y:gy,t:Math.random()*6,taken:false});
    }
    last=G.terr[G.terr.length-1];
  }
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();G.holding=true;});
canvas.addEventListener('pointerup',()=>G.holding=false);
addEventListener('pointerup',()=>G.holding=false);
canvas.addEventListener('pointercancel',()=>G.holding=false);
addEventListener('keydown',e=>{if(e.key===' ')G.holding=true;});
addEventListener('keyup',e=>{if(e.key===' ')G.holding=false;});
const particles=[];
for(let i=0;i<70;i++)particles.push({a:false});
const pops=[]; // [gauntlet fix] floating score popups
const embers=[];for(let i=0;i<24;i++)embers.push({x:Math.random()*2200,y:Math.random()*1200,s:1+Math.random()*2.5,v:14+Math.random()*26,ph:Math.random()*6.28});
/* [w5c perf] Pre-baked glow sprites — the W5b-proven pattern copied from game-04:
   the ember loop's 24 per-frame shadowBlur=8 fills collapsed FPS under software
   rendering (10.0 FPS); blit a one-time radial-glow sprite instead. Colours,
   falloff and alpha unchanged; no gameplay/balance changes. */
function makeGlowSprite(hex){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const gr=x.createRadialGradient(48,48,0,48,48,48);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.35,`rgba(${r},${g},${b},0.38)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,96,96);return c;}
const EMBER_SPRITE=makeGlowSprite('#ff9a3a');
const GEM_GLOW=makeGlowSprite('#4ab8ff'); // [w5c perf] gem glow sprite
function drawEmbers(){ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of embers){e.y-=e.v*0.016;e.x+=Math.sin(G.time*0.9+e.ph)*0.3;
    if(e.y<-6){e.y=H+6;e.x=Math.random()*W;}
    const tw=0.5+0.5*Math.sin(G.time*2+e.ph);
    ctx.globalAlpha=0.13+0.22*tw;const r=e.s*7;ctx.drawImage(EMBER_SPRITE,(e.x%(W+12))-r,e.y-r,r*2,r*2);}
  ctx.restore();ctx.globalAlpha=1;}
function terrainY(x,isTop){
  // interpolate
  const t=G.terr||[];
  if(!t.length)return isTop?0:H;
  for(let i=0;i<t.length-1;i++){
    if(x>=t[i].x&&x<=t[i+1].x){
      const f=(x-t[i].x)/40;
      return isTop?t[i].top+(t[i+1].top-t[i].top)*f:t[i].bot+(t[i+1].bot-t[i].bot)*f;
    }
  }
  return isTop?t[0].top:t[0].bot;
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);
  G.speed=Math.min(650,300+G.dist*0.3);
  G.dist+=G.speed*dt/50;G.score=Math.floor(G.dist)+G.bonus;
  // glide physics
  if(G.holding&&!G.wasHold)sfx.whoosh();
  G.wasHold=G.holding;
  if(G.time<2)G.vy=0; // [gauntlet fix] gentle opener: glide level for the first 2s (corridor is provably clear at mid-height) while the player reads the hint
  else if(G.holding)G.vy-=1600*dt;else G.vy+=1100*dt;
  G.vy=Math.max(-520,Math.min(620,G.vy));
  G.py+=G.vy*dt;
  G.rot=Math.max(-0.5,Math.min(0.6,G.vy/900));
  // scroll terrain
  for(const s of G.terr)s.x-=G.speed*dt;
  for(const g of G.gems)g.x-=G.speed*dt;
  G.nextX-=G.speed*dt;
  while(G.terr.length&&G.terr[0].x<-80)G.terr.shift();
  extendTerrain();
  const px=W*0.32,pr=16;
  const topY=terrainY(px,true),botY=terrainY(px,false);
  // collision
  if(G.py-pr<topY||G.py+pr>botY){die();return;}
  // gems
  for(const g of G.gems){
    g.t+=dt*4;
    if(!g.taken&&Math.hypot(px-g.x,G.py-g.y)<34){
      g.taken=true;G.bonus+=25;G.score=Math.floor(G.dist)+G.bonus;sfx.gem();updateHUD();
      pops.push({x:g.x,y:g.y-18,t0:G.time}); // [gauntlet fix] '+25' popup at the gem
      for(let i=0;i<6;i++){const p=particles.find(p=>!p.a);if(!p)break;
        p.a=true;p.x=g.x;p.y=g.y;p.vx=(Math.random()-0.5)*200;p.vy=(Math.random()-0.5)*200;
        p.life=0.35;p.max=0.35;p.color='#7fd4ff';p.size=3;}
    }
  }
  G.gems=G.gems.filter(g=>!g.taken&&g.x>-40);
  // trail
  if(Math.random()<0.4){
    const p=particles.find(p=>!p.a);
    if(p){p.a=true;p.x=px-16;p.y=G.py;p.vx=-120;p.vy=(Math.random()-0.5)*60;
      p.life=0.4;p.max=0.4;p.color='#aee2ff';p.size=3;}
  }
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  if(Math.random()<0.1)updateHUD();
}
function die(){
  if(G.dead)return;
  G.dead=true;sfx.die();G.shake=0.5;
  const isBest=G.score>G.best;
  if(isBest){G.best=G.score;try{localStorage.setItem('glide_best',String(G.best));}catch(e){}}
  setTimeout(()=>{
    G.state='over'; // [gauntlet fix] same defect as game-20: music gate reads state!=='play' — keep it frozen behind the crash card
    showOverlay('💥 CRASHED!',
      `${isBest?'<p style="color:#ffd23f;font-weight:900">🏆 NEW BEST!</p>':''}<p style="font-size:26px;font-weight:900">Score: ${G.score}</p><p>Distance: ${Math.floor(G.dist)}m</p><p>Best: ${G.best}</p>`,
      '🔥 Fire Safety: Stay calm and move steadily!',
      '↻ GLIDE AGAIN',()=>{reset();G.state='play';});
  },700);
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  window.__paused=false;pauseBtn.textContent='⏸';
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1428');bg.addColorStop(0.5,'#0d1a30');bg.addColorStop(1,'#0a1428');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawEmbers();
  // bg crystals
  ctx.fillStyle='rgba(127,212,255,0.06)';
  for(let i=0;i<10;i++){
    const cx=((i*271-G.dist*20)%(W+40)+(W+40))%(W+40)-20,cy=(i*173)%H;
    ctx.beginPath();
    ctx.moveTo(cx,cy);ctx.lineTo(cx+16,cy+34);ctx.lineTo(cx-16,cy+34);ctx.closePath();ctx.fill();
  }
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*14,(Math.random()-0.5)*G.shake*14);
  // terrain
  const t=G.terr||[];
  if(t.length>1){
    // top (stalactites)
    ctx.fillStyle='#2a3a5a';
    ctx.beginPath();ctx.moveTo(t[0].x,0);
    for(const s of t)ctx.lineTo(s.x,s.top);
    ctx.lineTo(t[t.length-1].x,0);ctx.closePath();ctx.fill();
    // bottom
    ctx.beginPath();ctx.moveTo(t[0].x,H);
    for(const s of t)ctx.lineTo(s.x,s.bot);
    ctx.lineTo(t[t.length-1].x,H);ctx.closePath();ctx.fill();
    // crystal edges
    ctx.strokeStyle='#5ab8e8';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(t[0].x,t[0].top);
    for(const s of t)ctx.lineTo(s.x,s.top);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(t[0].x,t[0].bot);
    for(const s of t)ctx.lineTo(s.x,s.bot);
    ctx.stroke();
    // glow crystals on edges
    ctx.fillStyle='#7fd4ff';
    for(let i=0;i<t.length;i+=4){
      const s=t[i];
      if(s.x<-20||s.x>W+20)continue;
      ctx.save();ctx.translate(s.x,s.top);ctx.rotate(Math.PI);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,22);ctx.lineTo(-8,22);ctx.closePath();ctx.fill();
      ctx.restore();
      ctx.save();ctx.translate(s.x,s.bot);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,22);ctx.lineTo(-8,22);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  // gems
  for(const g of G.gems){
    const bob=Math.sin(g.t)*4;
    ctx.save();ctx.translate(g.x,g.y+bob);ctx.rotate(g.t*0.5);
    ctx.fillStyle='#7fd4ff';
    {ctx.save();ctx.globalAlpha=0.55;const gr2=26;ctx.drawImage(GEM_GLOW,-gr2,-gr2,gr2*2,gr2*2);ctx.restore();} // [w5c perf] pre-baked gem glow (was shadowBlur=12 per gem per frame)
    ctx.beginPath();
    ctx.moveTo(0,-12);ctx.lineTo(9,0);ctx.lineTo(0,12);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(4,-2);ctx.lineTo(-4,-2);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // player
  const px=W*0.32;
  if(!G.dead){
    ctx.save();ctx.translate(px,G.py);ctx.rotate(G.rot);
    // glider wings
    ctx.fillStyle='rgba(174,226,255,0.85)';
    const flap=Math.sin(G.time*10)*6;
    ctx.beginPath();
    ctx.moveTo(-6,-8);ctx.quadraticCurveTo(-34,-26-flap,-44,-6);
    ctx.quadraticCurveTo(-30,2,-6,4);ctx.closePath();ctx.fill();
    // body
    const g=ctx.createRadialGradient(-6,-7,3,0,0,18);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.shadowColor='#ff7a2a';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(5,-3,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // [gauntlet fix] score popups: rise + fade over 0.9s
  ctx.textAlign='center';ctx.font='900 22px system-ui';
  for(const pp of pops){const age=G.time-pp.t0,a=1-age/0.9;if(a<=0)continue;
    ctx.globalAlpha=a;ctx.fillStyle='#7fd4ff';ctx.fillText('+25',pp.x,pp.y-age*40);}
  ctx.globalAlpha=1;ctx.textAlign='left';
  for(let i=pops.length-1;i>=0;i--)if(G.time-pops[i].t0>0.9)pops.splice(i,1);
  // hold hint
  if(G.state==='play'&&G.dist<30){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 20px system-ui';ctx.textAlign='center';
    ctx.fillText('HOLD TO RISE • RELEASE TO DIVE',W/2,H*0.5);

window.__paused=false;window.__muted=false;
const pauseBtn=document.getElementById('pauseBtn'),muteBtn=document.getElementById('muteBtn');
function setPaused(v){if(!['play','countdown'].includes(G.state))return;window.__paused=v;pauseBtn.textContent=v?'▶':'⏸';}
pauseBtn.addEventListener('click',e=>{e.stopPropagation();setPaused(!window.__paused);});
function toggleMute(){window.__muted=!window.__muted;muteBtn.textContent=window.__muted?'🔇':'🔊';}
muteBtn.addEventListener('click',e=>{e.stopPropagation();toggleMute();});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='p'||k==='escape')setPaused(!window.__paused);if(k==='m')toggleMute();});
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(!window.__paused&&G.state==='play'&&!G.dead)update(dt);else if(!window.__paused)G.time+=dt;
  render();
  if(window.__paused){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.textAlign='center';ctx.fillText('⏸ PAUSED',W/2,H/2);ctx.font='700 17px system-ui';ctx.fillText('Tap ▶ or press P to resume',W/2,H/2+38);ctx.textAlign='left';}

}

/* ===== MUSIC (Jeff 2026-10-15): 'Thermal Glide' — Cinder's Glide's own
   track. Synthesized Web Audio only. 106 BPM, Eb major: a smooth legato sine
   lead that never quite touches the ground, over a soft pulsing bass —
   riding the thermal.
   This shell has no noise() helper, so the drums are tone-only (the game-02
   Blaze Runner precedent).
   Freeze gate CONFIRMED at insertion (2026-10-15): window.__muted mutes, window.__paused pauses, and music only
   plays while G.state==='play' — all read from this shell's own code.
   Starts on first interaction; 🔊 mute + pause freeze it. =====
   INSERT: paste at the end of game-32-cinders-glide.html's main
   <script> block (same scope as audio()/tone()/noise()). No extra tags. */
const _mf=m=>440*Math.pow(2,(m-69)/12);
// Freeze gate (insertion-confirmed 2026-10-15): hard-wired to this shell's
// own confirmed globals — window.__muted / window.__paused / G.state. try/catch kept so it can never throw.
const _mGate=()=>{try{return !!(window.__muted||window.__paused||G.state!=='play');}catch(e){return false;}};
const MUS={on:false,step:0,nextT:0,BPM:106,
 BASS:[39,0,51,0,39,0,51,0, 44,0,56,0,44,0,56,0, 36,0,48,0,36,0,48,0, 46,0,58,0,46,0,53,0],
 LEAD:[63,0,0,67,0,0,70,0, 68,0,0,67,0,0,63,0, 60,0,0,63,0,0,67,0, 70,0,0,67,0,0,0,0],
 start(){if(this.on)return;const ac=audio();if(!ac)return;this.on=true;this.nextT=ac.currentTime+0.08;
  setInterval(()=>this.tick(),42);},
 tick(){const ac=audio();if(!ac)return;
  if(_mGate()){this.nextT=ac.currentTime+0.06;return;}
  while(this.nextT<ac.currentTime+0.14){this.play(this.step,this.nextT);this.nextT+=60/this.BPM/2;this.step=(this.step+1)%32;}},
 play(s,t){const d=Math.max(0,t-audio().currentTime);
  const b=this.BASS[s];if(b)tone(_mf(b),_mf(b),0.3,'triangle',0.05,d);
  const l=this.LEAD[s];if(l)tone(_mf(l),_mf(l),0.34,'sine',0.05,d); // legato glide lead
  if(s%8===0)tone(108,45,0.12,'sine',0.09,d); // soft kick
  if(s%8===4)tone(185,115,0.08,'triangle',0.04,d); // soft tone-only snare
 }};
addEventListener('pointerdown',()=>MUS.start());
addEventListener('keydown',()=>MUS.start());
</script>

<script>
/* ============================================================
   Fire Babys Math Check — 24-HOUR UNLOCK (Jeff, 2026-10-21)
   The math check itself is unchanged. NEW: solve 5 problems in
   a row right here and ALL games unlock for 24 hours. The unlock
   is a device-side localStorage timestamp (fb_gate_unlock_until),
   checked by this snippet on every gated page, so it works the
   same on firebabys.io and in the offline downloadable build.
   When the 24 hours run out, the normal math check simply
   returns — no lockout, no progress lost.
   ============================================================ */
(function(){
'use strict';
var KEY='fb_gate_unlock_until';
function until(){try{var v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?0:v;}catch(e){return 0;}}
function unlocked(){return until()>Date.now();}
function leftStr(){var ms=until()-Date.now();if(ms<=0)return '';var h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h+'h '+(m<10?'0':'')+m+'m';}
function gateEl(){return document.getElementById('mathgate');}
function isVis(g){if(!g||g.classList.contains('hidden'))return false;var s=getComputedStyle(g);if(s.display==='none'||s.visibility==='hidden')return false;return g.offsetParent!==null||s.position==='fixed';}
var passed=false;
function tryPass(){
  var g=gateEl();if(!g)return;
  if(!isVis(g)){passed=false;return;}
  buildUI(g);
  if(!unlocked()||passed)return;
  var mq=document.getElementById('mq'),ma=document.getElementById('ma');
  if(!mq||!ma)return;
  var m=/(\d+)\s*([+\-x×*])\s*(\d+)/.exec(mq.textContent||'');
  if(!m)return;
  var a=+m[1],b=+m[3],ans=(m[2]==='+')?a+b:((m[2]==='-')?a-b:a*b);
  ma.value=ans;passed=true;
  var btn=g.querySelector('button');
  setTimeout(function(){if(btn)btn.click();},150);
  setTimeout(function(){if(isVis(gateEl()))passed=false;},1000);
}
function buildUI(g){
  if(g.querySelector('.fbg-chal'))return;
  var box=document.createElement('div');box.className='fbg-chal';
  box.style.cssText='margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.35);font-size:15px';
  if(unlocked()){
    box.innerHTML='<p style="margin:0">✅ <b>All games unlocked!</b> ⏰ '+leftStr()+' left</p>';
    g.appendChild(box);return;
  }
  box.innerHTML='<p style="margin:0 0 6px">🏆 <b>Math Challenge:</b> solve <b>5 problems in a row</b> to unlock <b>ALL games for 24 hours</b>!</p>'
    +'<button type="button" class="fbg-start" style="font-size:16px;font-weight:800;padding:8px 16px;border-radius:10px;cursor:pointer">START CHALLENGE</button>'
    +'<div class="fbg-play" style="display:none;margin-top:8px">'
    +'<p style="margin:0 0 6px">Problem <span class="fbg-n">1</span> of 5: <b class="fbg-q"></b> = '
    +'<input type="number" class="fbg-a" inputmode="numeric" style="width:84px;font-size:18px;text-align:center;padding:6px;border-radius:8px;border:2px solid #666;color:#000"> '
    +'<button type="button" class="fbg-check" style="font-size:16px;font-weight:800;padding:8px 14px;border-radius:10px;cursor:pointer">CHECK</button></p>'
    +'<p class="fbg-msg" style="margin:0;min-height:20px"></p></div>';
  g.appendChild(box);
  var n=0,ans=0;
  var qEl=box.querySelector('.fbg-q'),nEl=box.querySelector('.fbg-n'),
      aEl=box.querySelector('.fbg-a'),msgEl=box.querySelector('.fbg-msg');
  function next(){
    var kind=Math.floor(Math.random()*3),a,b;
    if(kind===0){a=2+Math.floor(Math.random()*19);b=2+Math.floor(Math.random()*19);ans=a+b;qEl.textContent=a+' + '+b;}
    else if(kind===1){a=5+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*a);ans=a-b;qEl.textContent=a+' − '+b;}
    else{a=2+Math.floor(Math.random()*8);b=2+Math.floor(Math.random()*8);ans=a*b;qEl.textContent=a+' × '+b;}
    nEl.textContent=(n+1);aEl.value='';
  }
  box.querySelector('.fbg-start').addEventListener('click',function(){
    this.style.display='none';box.querySelector('.fbg-play').style.display='';next();aEl.focus();
  });
  function check(){
    if(parseInt(aEl.value,10)===ans){
      n++;
      if(n>=5){
        try{localStorage.setItem(KEY,String(Date.now()+24*3600000));}catch(e){}
        box.innerHTML='<p style="margin:0">🎉 <b>You did it!</b> ALL games are unlocked for 24 hours! ⏰</p>';
        passed=false;setTimeout(tryPass,400);
      }else{msgEl.textContent='✅ Correct! '+(5-n)+' to go.';next();aEl.focus();}
    }else{
      n=0;msgEl.textContent='❌ Not quite — streak reset. Back to problem 1!';next();aEl.focus();
    }
  }
  box.querySelector('.fbg-check').addEventListener('click',check);
  aEl.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});
}
setInterval(tryPass,300);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tryPass);else tryPass();
})();
</script>
