<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caldera Climb — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#160d08;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(22,12,6,.94);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(28px,6vw,46px);font-weight:900;margin-bottom:12px;color:#ff8a00}
#overlay p{font-size:16px;margin-bottom:10px;max-width:460px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:#c45a1a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:14px 38px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#2a1c10;border-radius:12px;padding:16px;margin:12px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:8px;border-radius:8px;border:2px solid #555;margin:0 8px}
.hidden{display:none!important}
#back{position:fixed;top:56px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div id="score">SCORE 0</div><div id="moves">MOVES 30</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1>💎 CALDERA<br>CLIMB</h1>
<div id="obody"><p><b style="color:#ff8a00">Blaze</b> & <b style="color:#ff8a00">Boulder</b> need your matching magic!</p><p>🖱️ <b>Swap</b> adjacent ember blocks to match 3 or more! Score 2000 points in 30 moves to win!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()" style="font-size:16px;padding:8px 20px">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Matches are tools, not toys — only grown-ups should use them!</div>
<button id="obtn">▶ PLAY</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
let W,H,GS,GRID=8,OX,OY;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;GS=Math.min(W,H*0.72)/GRID;OX=(W-GS*GRID)/2;OY=H*0.16;}
addEventListener('resize',resize);resize();
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type,vol){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);g.gain.setValueAtTime(vol||0.18,t);g.gain.exponentialRampToValueAtTime(0.01,t+dur);o.start(t);o.stop(t+dur+0.05);}
let mathA=0;function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathA=a+b;document.getElementById('mq').textContent=a+' + '+b;document.getElementById('mathgate').classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathA){document.getElementById('mathgate').classList.add('hidden');startGame();}else document.getElementById('ma').value='';}
const COLORS=['#ff3b2e','#ff8a00','#ffd23f','#ff2a6d','#c4a0ff'];
const G={state:'title',score:0,moves:30,grid:[],sel:null,parts:[],shake:0,anim:0};
const GOAL=2000;
function rnd(){return Math.floor(Math.random()*COLORS.length);}
function startGame(){audio();G.score=0;G.moves=30;G.sel=null;G.parts=[];G.grid=[];
  for(let r=0;r<GRID;r++){G.grid[r]=[];for(let c=0;c<GRID;c++){let v;do{v=rnd();}while((c>=2&&G.grid[r][c-1]===v&&G.grid[r][c-2]===v)||(r>=2&&G.grid[r-1][c]===v&&G.grid[r-2][c]===v));G.grid[r][c]=v;}}
  G.state='play';updHud();overlay.classList.add('hidden');}
function updHud(){document.getElementById('score').textContent='SCORE '+G.score+'/'+GOAL;document.getElementById('moves').textContent='MOVES '+G.moves;}
function findMatches(){
  const matched=new Set();
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID-2;c++){const v=G.grid[r][c];if(v<0)continue;
    if(G.grid[r][c+1]===v&&G.grid[r][c+2]===v){let cc=c;while(cc<GRID&&G.grid[r][cc]===v){matched.add(r+','+cc);cc++;}}}
  for(let c=0;c<GRID;c++)for(let r=0;r<GRID-2;r++){const v=G.grid[r][c];if(v<0)continue;
    if(G.grid[r+1][c]===v&&G.grid[r+2][c]===v){let rr=r;while(rr<GRID&&G.grid[rr][c]===v){matched.add(rr+','+c);rr++;}}}
  return [...matched].map(s=>s.split(',').map(Number));
}
function clearMatches(){
  const m=findMatches();
  if(m.length===0)return false;
  for(const [r,c] of m){const x=OX+c*GS+GS/2,y=OY+r*GS+GS/2;
    for(let i=0;i<8;i++)G.parts.push({x,y,vx:(Math.random()-0.5)*250,vy:(Math.random()-0.5)*250,life:0.5,max:0.5,c:COLORS[G.grid[r][c]]});
    G.grid[r][c]=-1;}
  const pts=m.length*50*(m.length>4?2:1);G.score+=pts;G.shake=5;sfx(500,1000,0.2,'sine',0.2);
  // gravity
  for(let c=0;c<GRID;c++){let write=GRID-1;
    for(let r=GRID-1;r>=0;r--){if(G.grid[r][c]>=0){G.grid[write][c]=G.grid[r][c];if(write!==r)G.grid[r][c]=-1;write--;}}
    for(let r=write;r>=0;r--)G.grid[r][c]=rnd();}
  updHud();
  setTimeout(()=>{if(G.state==='play'&&clearMatches()){}},180);
  return true;
}
function trySwap(r1,c1,r2,c2){
  if(r2<0||r2>=GRID||c2<0||c2>=GRID)return;
  [G.grid[r1][c1],G.grid[r2][c2]]=[G.grid[r2][c2],G.grid[r1][c1]];
  if(findMatches().length>0){G.moves--;clearMatches();sfx(600,900,0.12,'triangle',0.15);}
  else{[G.grid[r1][c1],G.grid[r2][c2]]=[G.grid[r2][c2],G.grid[r1][c1]];sfx(200,150,0.12,'square',0.12);}
  G.sel=null;updHud();checkEnd();
}
function checkEnd(){
  if(G.score>=GOAL){endGame(true);}
  else if(G.moves<=0){setTimeout(()=>{if(findMatches().length===0)endGame(false);},600);}
}
function endGame(win){G.state='over';
  obody.innerHTML=win?'<p>🎉 You reached '+GOAL+' points with '+G.moves+' moves to spare!</p>':'<p>Out of moves! Score: <b>'+G.score+'</b> / '+GOAL+'</p>';
  document.querySelector('#overlay h1').textContent=win?'🏆 YOU WIN!':'💎 GAME OVER';
  obtn.textContent=win?'↻ PLAY AGAIN':'↻ TRY AGAIN';obtn.onclick=()=>{startGame();};overlay.classList.remove('hidden');}
function cellAt(x,y){const c=Math.floor((x-OX)/GS),r=Math.floor((y-OY)/GS);return(r>=0&&r<GRID&&c>=0&&c<GRID)?{r,c}:null;}
function tapAt(x,y){
  if(G.state!=='play')return;
  const cell=cellAt(x,y);if(!cell)return;
  if(!G.sel){G.sel=cell;sfx(700,700,0.06,'sine',0.1);}
  else{
    const dr=Math.abs(cell.r-G.sel.r),dc=Math.abs(cell.c-G.sel.c);
    if(dr+dc===1)trySwap(G.sel.r,G.sel.c,cell.r,cell.c);
    else G.sel=cell;
  }
}
function render(){
  ctx.fillStyle='#160d08';ctx.fillRect(0,0,W,H);
  ctx.save();if(G.shake>0){ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);G.shake*=0.9;}
  ctx.fillStyle='#241610';ctx.fillRect(OX-8,OY-8,GS*GRID+16,GS*GRID+16);
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const v=G.grid[r]&&G.grid[r][c];if(v===undefined||v<0)continue;
    const x=OX+c*GS,y=OY+r*GS;
    ctx.fillStyle=COLORS[v];
    ctx.beginPath();ctx.arc(x+GS/2,y+GS/2,GS*0.38,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(x+GS*0.35,y+GS*0.35,GS*0.12,0,Math.PI*2);ctx.fill();
    if(G.sel&&G.sel.r===r&&G.sel.c===c){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(x+3,y+3,GS-6,GS-6);}}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*0.016;p.y+=p.vy*0.016;p.life-=0.016;if(p.life<=0){G.parts.splice(i,1);continue;}ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x-4,p.y-4,8,8);}
  ctx.globalAlpha=1;ctx.restore();
}
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];tapAt(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('mousedown',e=>{tapAt(e.clientX,e.clientY);});
let lastT=0;function loop(t){const dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.parts.splice(i,1);}
  render();requestAnimationFrame(loop);}
obtn.onclick=()=>{showGate();};
requestAnimationFrame(loop);
</script>
</body>
</html>
