<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruko's Final Dash — by Jman350Z & fire team</title>
<meta name="description" content="The grand finale! Epic boss dash. A Fire Babys game.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a14;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill.gold{color:#ffd23f}
#bossbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(320px,72vw);z-index:5;pointer-events:none}
#bossbar .lbl{color:#ff8a8a;font-weight:900;font-size:13px;text-align:center;margin-bottom:3px}
#bosstrack{height:12px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff4a5a,#a3121f);border-radius:6px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,16,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(24px,6vw,42px);font-weight:900;margin-bottom:12px;color:#ffd76a}
#overlay p{font-size:16px;margin-bottom:10px;max-width:440px;line-height:1.6;color:#ffe9d6}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:linear-gradient(180deg,#ffd76a,#ff8c2e);color:#2a1206;border:3px solid #ff6a1a;font-size:20px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #a33c10}
#overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a33c10}
#mathgate{background:#141024;border-radius:12px;padding:16px;margin:14px 0;border:2px solid #ff6a1a}
#mathgate input{font-size:22px;width:90px;text-align:center;padding:8px;border-radius:8px;border:2px solid #666;margin:0 8px;background:#fff;color:#000}
.hidden{display:none!important}
#back{position:fixed;bottom:14px;left:12px;z-index:10;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="pill gold" id="score">⭐ 0</div>
<div class="pill" id="boss">👹 BOSS 1/3</div>
<div class="pill" id="lives">❤️❤️❤️</div>
</div>
<div id="bossbar"><div class="lbl" id="bossname">🔥 ASH TITAN</div><div id="bosstrack"><div id="bossfill"></div></div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1 id="otitle">🔥 RUKO'S FINAL DASH</h1>
<div id="obody"><p>The grand finale!</p><p><b>TAP</b> to dash-attack the bosses! <b>SWIPE / ◀ ▶</b> to dodge their fireballs! 3 bosses, 3 lives. Hit them when they're open — dodge when they glow!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate</p><p><span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"></p><button onclick="checkMath()">UNLOCK</button></div>
<div class="lesson" id="olesson">🔥 Fire Safety: Face danger smart — dodge, don't freeze!</div>
<button id="obtn">▶ PLAY</button>
</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  dash(){tone(700,1200,0.12,'sawtooth',0.1);},
  hit(){tone(300,600,0.1,'square',0.12);},
  dodge(){tone(900,500,0.08,'sine',0.08);},
  hurt(){tone(350,100,0.3,'sawtooth',0.14);},
  roar(){tone(120,60,0.5,'sawtooth',0.16);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.22,'triangle',0.14,i*0.1));},
  click(){tone(600,600,0.06,'square',0.1);}
};
const BOSSES=[
  {name:'🔥 ASH TITAN',hp:8,color:'#8a4a2a',atkT:2.2,fbSpeed:380},
  {name:'🌋 MAGMA LORD',hp:12,color:'#a32a10',atkT:1.7,fbSpeed:460},
  {name:'👹 INFERNO KING',hp:16,color:'#5a1a5a',atkT:1.3,fbSpeed:540},
];
const G={state:'title',score:0,lives:3,bossIdx:0,
  bossHp:8,bossX:0,bossT:0,atkTimer:2,open:false,openT:0,
  px:0,dashX:0,dashT:0,fireballs:[],time:0,shake:0,dead:false,hitT:0};
function startBoss(n){
  const B=BOSSES[n];
  G.bossIdx=n;G.bossHp=B.hp;G.bossX=W/2;G.bossT=0;
  G.atkTimer=1.5;G.open=false;G.fireballs=[];G.dead=false;G.hitT=0;
  document.getElementById('boss').textContent=`👹 BOSS ${n+1}/3`;
  document.getElementById('bossname').textContent=B.name;
  updBoss();
  sfx.roar();G.shake=0.4;
}
function updBoss(){
  const B=BOSSES[G.bossIdx];
  document.getElementById('bossfill').style.width=(G.bossHp/B.hp*100)+'%';
}
function reset(){
  G.score=0;G.lives=3;G.px=W/2;G.dashX=0;G.dashT=0;
  G.time=0;G.shake=0;G.dead=false;
  startBoss(0);
  updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,G.lives))||'💔';
}
const PY=()=>H*0.72;
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.dead)return;
  e.preventDefault();
  G._sx=e.clientX;G._moved=false;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(G._sx===undefined||G.state!=='play')return;
  const dx=e.clientX-G._sx;
  if(Math.abs(dx)>24)G._moved=true;
  G.px=Math.max(30,Math.min(W-30,G.px+dx*1.5));
  G._sx=e.clientX;
});
canvas.addEventListener('pointerup',e=>{
  if(G._sx===undefined)return;
  const wasSwipe=G._moved;
  G._sx=undefined;
  if(!wasSwipe&&G.state==='play'&&!G.dead)doDash();
});
addEventListener('keydown',e=>{
  if(G.state!=='play')return;
  if(e.key==='ArrowLeft'||e.key==='a'){G.px=Math.max(30,G.px-40);sfx.dodge();}
  if(e.key==='ArrowRight'||e.key==='d'){G.px=Math.min(W-30,G.px+40);sfx.dodge();}
  if(e.key===' '){doDash();e.preventDefault();}
});
function doDash(){
  if(G.dashT>0)return;
  G.dashT=0.28;G.dashX=G.px;
  sfx.dash();
  // dash toward boss x
  G.dashDir=Math.sign(G.bossX-G.px)||1;
  if(G.open&&Math.abs(G.px-G.bossX)<W*0.35){
    // HIT!
    G.bossHp--;G.hitT=0.2;G.shake=0.3;sfx.hit();
    const pts=100*(G.bossIdx+1);
    G.score+=pts;updateHUD();updBoss();
    burst(G.bossX,H*0.3,'#ffd23f',12);
    spawnText(G.bossX,H*0.22,'+'+pts,'#ffd23f');
    if(G.bossHp<=0){bossDown();return;}
  }
}
const particles=[],floaters=[];
for(let i=0;i<100;i++)particles.push({a:false});
for(let i=0;i<10;i++)floaters.push({a:false});
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const p=particles.find(p=>!p.a);if(!p)break;
    const a=Math.random()*Math.PI*2;
    p.a=true;p.x=x;p.y=y;p.vx=Math.cos(a)*220;p.vy=Math.sin(a)*220;
    p.life=0.45;p.max=0.45;p.color=color;p.size=4;}
}
function spawnText(x,y,txt,color){
  const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;
}
function bossAttack(){
  const B=BOSSES[G.bossIdx];
  const n=1+Math.floor(Math.random()*(1+G.bossIdx));
  for(let i=0;i<n;i++){
    G.fireballs.push({
      x:G.bossX+(Math.random()-0.5)*80,y:H*0.3,
      tx:G.px+(Math.random()-0.5)*120,ty:PY(),
      t:0,dur:0.9,glow:0.4
    });
  }
  sfx.roar();
}
function bossDown(){
  sfx.win();
  const bonus=500*(G.bossIdx+1);
  G.score+=bonus;updateHUD();
  setTimeout(()=>{
    if(G.bossIdx>=2){
      showOverlay('🏆 INFERNO KING DEFEATED!',
        `<p style="font-size:24px;font-weight:900">FINAL SCORE: ${G.score}</p><p>Lives left: ${G.lives}</p><p>🎉 YOU BEAT THE FINALE! 🎉</p>`,
        '🔥 Fire Safety: You\'re a true hero!',
        '↻ PLAY AGAIN',()=>{reset();G.state='play';});
    }else{
      showOverlay(`💥 ${BOSSES[G.bossIdx].name} DOWN!`,
        `<p>+${bonus} bonus!</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Keep going!',
        '▶ NEXT BOSS',()=>{startBoss(G.bossIdx+1);G.state='play';});
    }
  },800);
  G.state='bossdown';
}
function hurt(){
  if(G.dead)return;
  G.lives--;updateHUD();sfx.hurt();G.shake=0.45;
  burst(G.px,PY(),'#ff4a5a',12);
  if(G.lives<=0){
    G.dead=true;
    setTimeout(()=>{
      showOverlay('💥 GAME OVER',
        `<p>Boss: ${BOSSES[G.bossIdx].name}</p><p>Score: ${G.score}</p>`,
        '🔥 Fire Safety: Never give up!',
        '↻ TRY AGAIN',()=>{reset();G.state='play';});
    },700);
  }
}
function update(dt){
  G.time+=dt;G.shake=Math.max(0,G.shake-dt*3);G.hitT=Math.max(0,G.hitT-dt);
  const B=BOSSES[G.bossIdx];
  G.bossT+=dt;
  // boss sways
  G.bossX=W/2+Math.sin(G.bossT*1.2)*W*0.22;
  // dash anim
  if(G.dashT>0){
    G.dashT-=dt;
    G.px+=G.dashDir*900*dt;
    G.px=Math.max(30,Math.min(W-30,G.px));
  }
  // boss cycle: open -> attack -> open...
  if(G.open){
    G.openT-=dt;
    if(G.openT<=0){G.open=false;G.atkTimer=B.atkT;}
  }else{
    G.atkTimer-=dt;
    if(G.atkTimer<=0){bossAttack();G.open=true;G.openT=1.6;}
  }
  // fireballs
  for(let i=G.fireballs.length-1;i>=0;i--){
    const f=G.fireballs[i];
    f.glow-=dt;
    if(f.glow>0)continue;
    f.t+=dt;
    const p=Math.min(1,f.t/f.dur);
    f.x+=(f.tx-f.x)*Math.min(1,dt*4);
    f.y+=(f.ty-f.y)*Math.min(1,dt*4);
    if(p>=1||f.t>f.dur+0.4){
      // explode
      burst(f.x,f.y,'#ff6a00',10);
      if(Math.hypot(f.x-G.px,f.y-PY())<60&&!G.dead)hurt();
      G.fireballs.splice(i,1);
    }
  }
  if(G.dead)return;
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=36*dt;f.life-=dt;if(f.life<=0)f.a=false;}
}
let mathAnswer=0;
function showMathGate(){
  const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);
  mathAnswer=a+b;document.getElementById('mq').textContent=a+' + '+b;
  document.getElementById('mathgate').classList.remove('hidden');
}
function checkMath(){
  if(parseInt(document.getElementById('ma').value,10)===mathAnswer){
    document.getElementById('mathgate').classList.add('hidden');startGame();
  }else document.getElementById('ma').value='';
}
function showOverlay(title,body,lesson,btn,cb){
  otitle.innerHTML=title;obody.innerHTML=body;olesson.innerHTML=lesson;obtn.textContent=btn;
  obtn.onclick=()=>{sfx.click();overlay.classList.add('hidden');cb();};
  overlay.classList.remove('hidden');
}
function startGame(){audio();reset();G.state='play';overlay.classList.add('hidden');}
obtn.onclick=()=>{showMathGate();};
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0a1a');bg.addColorStop(0.6,'#2a0f14');bg.addColorStop(1,'#0d0a14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake*14,(Math.random()-0.5)*G.shake*14);
  const B=BOSSES[G.bossIdx];
  const bx=G.bossX,by=H*0.28;
  // boss arena glow
  const ag=ctx.createRadialGradient(bx,by,20,bx,by,180);
  ag.addColorStop(0,'rgba(255,74,90,0.15)');ag.addColorStop(1,'rgba(255,74,90,0)');
  ctx.fillStyle=ag;ctx.beginPath();ctx.arc(bx,by,180,0,Math.PI*2);ctx.fill();
  // boss
  const br=52+G.bossIdx*8;
  const hitFlash=G.hitT>0;
  const bg2=ctx.createRadialGradient(bx-12,by-14,8,bx,by,br);
  if(hitFlash){bg2.addColorStop(0,'#fff');bg2.addColorStop(1,'#fff');}
  else{bg2.addColorStop(0,B.color);bg2.addColorStop(1,'#1a0a0a');}
  ctx.fillStyle=bg2;
  // spiky body
  ctx.beginPath();
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2+G.bossT*0.6;
    const rr=br+(i%2?10:0)+Math.sin(G.bossT*4+i)*3;
    const px2=bx+Math.cos(a)*rr,py2=by+Math.sin(a)*rr;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
  }
  ctx.closePath();ctx.fill();
  // eyes (angry when attacking)
  const attacking=!G.open;
  ctx.fillStyle=attacking?'#ffdd00':'#fff';
  ctx.beginPath();ctx.arc(bx-16,by-6,8,0,Math.PI*2);ctx.arc(bx+16,by-6,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a3121f';
  ctx.beginPath();ctx.arc(bx-16,by-4,4,0,Math.PI*2);ctx.arc(bx+16,by-4,4,0,Math.PI*2);ctx.fill();
  // open indicator (green ring = attack now!)
  if(G.open){
    ctx.strokeStyle=`rgba(76,175,80,${0.6+Math.sin(G.time*10)*0.4})`;
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(bx,by,br+18,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#4caf50';ctx.font='900 16px system-ui';ctx.textAlign='center';
    ctx.fillText('⚡ ATTACK NOW!',bx,by+br+40);ctx.textAlign='left';
  }
  // fireballs
  for(const f of G.fireballs){
    if(f.glow>0){
      ctx.fillStyle=`rgba(255,106,0,${f.glow*2})`;
      ctx.font='30px system-ui';ctx.textAlign='center';
      ctx.fillText('⚠️',f.x,f.y-30);ctx.textAlign='left';
      continue;
    }
    const fg=ctx.createRadialGradient(f.x-4,f.y-4,2,f.x,f.y,16);
    fg.addColorStop(0,'#fff2c8');fg.addColorStop(0.5,'#ff8a3a');fg.addColorStop(1,'#a32a10');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,15,0,Math.PI*2);ctx.fill();
  }
  // player
  if(!G.dead){
    const py=PY();
    ctx.save();ctx.translate(G.px,py);
    if(G.dashT>0){
      // dash trail
      ctx.fillStyle='rgba(255,210,63,0.5)';
      ctx.beginPath();ctx.ellipse(-G.dashDir*36,0,30,12,0,0,Math.PI*2);ctx.fill();
    }
    const g=ctx.createRadialGradient(-7,-7,3,0,0,20);
    g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-20,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2b1a0e';
    ctx.beginPath();ctx.arc(-6,-24,3.2,0,Math.PI*2);ctx.arc(6,-24,3.2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='900 22px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  ctx.restore();
  if(G.state==='play'&&G.time<4){
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='900 16px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP = DASH ATTACK • SWIPE = DODGE',W/2,H*0.55);
    ctx.fillText('HIT WHEN THE GREEN RING SHOWS!',W/2,H*0.55+26);
    ctx.textAlign='left';
  }
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if((G.state==='play'||G.state==='bossdown')&&!G.dead)update(dt);else G.time+=dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
