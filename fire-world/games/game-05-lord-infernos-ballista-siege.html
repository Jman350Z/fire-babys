<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lord Inferno's Ballista Siege — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140a08;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px;color:#fff;font-weight:800;text-shadow:0 2px 0 #000;font-size:20px}
#hpbar{width:130px;height:12px;background:#333;border:2px solid #000;border-radius:6px;overflow:hidden;margin-top:4px}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3b2e,#ff8a00)}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,8,5,.93);color:#fff;text-align:center;padding:24px}
#overlay h1{font-size:clamp(26px,6vw,44px);font-weight:900;margin-bottom:12px;color:#ff8a00}
#overlay p{font-size:16px;margin-bottom:10px;max-width:460px;line-height:1.5}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:440px}
#overlay button{background:#c44a1a;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:14px 38px;border-radius:999px;cursor:pointer;margin-top:8px}
#mathgate{background:#2a1a10;border-radius:12px;padding:16px;margin:12px 0}
#mathgate input{font-size:22px;width:80px;text-align:center;padding:8px;border-radius:8px;border:2px solid #555;margin:0 8px}
.hidden{display:none!important}
#back{position:fixed;top:60px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div><div id="score">SCORE 0</div><div id="hpbar"><div id="hpfill"></div></div></div><div id="wave">WAVE 1</div></div>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🏰 LORD INFERNO'S<br>BALLISTA SIEGE</h1>
<div id="obody"><p><b style="color:#ff8a00">Ruko</b> & <b style="color:#ff8a00">Sizzle</b> man the sky-ballista!</p><p>🖱️ <b>Drag</b> to steer your fire baby. Ballista auto-fires upward — dodge rock fortresses and blast them apart!</p></div>
<div id="mathgate" class="hidden"><p>🔒 Parental Gate: <span id="mq">3 + 4</span> = <input type="number" id="ma" inputmode="numeric"> <button onclick="checkMath()" style="font-size:16px;padding:8px 20px">GO</button></p></div>
<div class="lesson">🔥 Fire Safety: Fireworks are for grown-ups only — never touch them yourself!</div>
<button id="obtn">▶ PLAY</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),obody=document.getElementById('obody'),obtn=document.getElementById('obtn');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}addEventListener('resize',resize);resize();
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(f0,f1,dur,type,vol){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.01,t+dur);o.start(t);o.stop(t+dur+0.05);}
let mathA=0;function showGate(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);mathA=a+b;document.getElementById('mq').textContent=a+' + '+b;document.getElementById('mathgate').classList.remove('hidden');}
function checkMath(){if(parseInt(document.getElementById('ma').value,10)===mathA){document.getElementById('mathgate').classList.add('hidden');startGame();}else document.getElementById('ma').value='';}
const G={state:'title',score:0,wave:1,hp:100,px:0,py:0,bullets:[],enemies:[],eparts:[],stars:[],fireT:0,spawnT:0,shake:0,combo:0,comboT:0};
function initStars(){G.stars=[];for(let i=0;i<60;i++)G.stars.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,v:60+Math.random()*120});}
function startGame(){audio();G.score=0;G.wave=1;G.hp=100;G.px=W/2;G.py=H-140;G.bullets=[];G.enemies=[];G.eparts=[];G.combo=0;initStars();G.state='play';document.getElementById('score').textContent='SCORE 0';document.getElementById('wave').textContent='WAVE 1';document.getElementById('hpfill').style.width='100%';overlay.classList.add('hidden');}
function spawnEnemy(){const w=40+Math.random()*40;G.enemies.push({x:Math.random()*(W-w),y:-60,w,h:44+Math.random()*30,hp:2+Math.floor(G.wave/2),vy:70+G.wave*12+Math.random()*40,ph:Math.random()*6});}
function boom(x,y,n,c1){for(let i=0;i<n;i++)G.eparts.push({x,y,vx:(Math.random()-0.5)*380,vy:(Math.random()-0.5)*380,life:0.7,max:0.7,c:c1||'#ff8a00'});}
function update(dt){
  if(G.shake>0)G.shake-=dt*30;
  for(const s of G.stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  G.fireT-=dt;if(G.fireT<=0){G.fireT=0.22;G.bullets.push({x:G.px-10,y:G.py-30},{x:G.px+10,y:G.py-30});sfx(900,1400,0.08,'square',0.08);}
  G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=Math.max(0.4,1.4-G.wave*0.12);spawnEnemy();}
  for(let i=G.bullets.length-1;i>=0;i--){const b=G.bullets[i];b.y-=520*dt;if(b.y<-20)G.bullets.splice(i,1);}
  for(let i=G.enemies.length-1;i>=0;i--){const e=G.enemies[i];e.y+=e.vy*dt;e.ph+=dt*3;
    for(let j=G.bullets.length-1;j>=0;j--){const b=G.bullets[j];
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){G.bullets.splice(j,1);e.hp--;
        boom(b.x,b.y,5,'#ffd23f');sfx(400,200,0.1,'square',0.12);
        if(e.hp<=0){G.enemies.splice(i,1);G.combo++;G.comboT=1.5;const pts=150*G.combo;G.score+=pts;boom(e.x+e.w/2,e.y+e.h/2,22,'#888');G.shake=6;sfx(200,60,0.25,'sawtooth',0.2);document.getElementById('score').textContent='SCORE '+G.score;break;}}}
    if(e.y>H+80){G.enemies.splice(i,1);continue;}
    if(Math.abs(e.x+e.w/2-G.px)<(e.w+36)/2&&Math.abs(e.y+e.h/2-G.py)<(e.h+36)/2){
      G.enemies.splice(i,1);G.hp-=15;G.combo=0;boom(G.px,G.py,16,'#ff3b2e');G.shake=10;sfx(300,80,0.3,'sawtooth',0.25);
      document.getElementById('hpfill').style.width=G.hp+'%';
      if(G.hp<=0){gameOver();return;}}}
  for(let i=G.eparts.length-1;i>=0;i--){const p=G.eparts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)G.eparts.splice(i,1);}
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;
  if(G.score>G.wave*1500){G.wave++;document.getElementById('wave').textContent='WAVE '+G.wave;sfx(500,1000,0.3,'sine',0.2);}
}
function gameOver(){G.state='over';
  obody.innerHTML='<p>The ballista is down! Final score: <b>'+G.score+'</b> — Wave '+G.wave+'</p>';
  document.querySelector('#overlay h1').textContent='💥 GAME OVER';obtn.textContent='↻ TRY AGAIN';
  obtn.onclick=()=>{startGame();};overlay.classList.remove('hidden');}
function drawBaby(x,y,r){const g=ctx.createRadialGradient(x-4,y-5,3,x,y,r);g.addColorStop(0,'#fff3b0');g.addColorStop(0.5,'#ff8a2e');g.addColorStop(1,'#e63900');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(x-r*0.4,y-r*0.7);ctx.quadraticCurveTo(x,y-r*1.7,x+r*0.4,y-r*0.7);ctx.quadraticCurveTo(x,y-r*1.1,x-r*0.4,y-r*0.7);ctx.fill();ctx.fillStyle='#2b1a0e';ctx.beginPath();ctx.arc(x-6,y-2,3,0,Math.PI*2);ctx.arc(x+6,y-2,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2b1a0e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+6,6,0.2,Math.PI-0.2);ctx.stroke();}
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0605');bg.addColorStop(1,'#2a1208');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';for(const s of G.stars)ctx.fillRect(s.x,s.y,s.s,s.s);
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  for(const e of G.enemies){ctx.fillStyle='#5a5a6a';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#3a3a4a';ctx.fillRect(e.x+6,e.y+6,e.w-12,e.h-12);ctx.fillStyle='#ff3b2e';ctx.fillRect(e.x+8,e.y+e.h/2-3,e.w-16,6);}
  ctx.fillStyle='#ffd23f';for(const b of G.bullets){ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();}
  drawBaby(G.px,G.py,20);
  for(const p of G.eparts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  if(G.combo>1){ctx.fillStyle='#ffd23f';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('COMBO x'+G.combo,W/2,70);ctx.textAlign='left';}
  ctx.restore();
}
let dragging=false;
canvas.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;const t=e.touches[0];G.px=t.clientX;G.py=Math.min(t.clientY,H-80);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(dragging){const t=e.touches[0];G.px=Math.max(20,Math.min(W-20,t.clientX));G.py=Math.max(H/2,Math.min(H-60,t.clientY));}},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=false;});
canvas.addEventListener('mousedown',e=>{dragging=true;G.px=e.clientX;G.py=Math.min(e.clientY,H-80);});
canvas.addEventListener('mousemove',e=>{if(dragging){G.px=Math.max(20,Math.min(W-20,e.clientX));G.py=Math.max(H/2,Math.min(H-60,e.clientY));}});
canvas.addEventListener('mouseup',()=>{dragging=false;});
let lastT=0;function loop(t){const dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;if(G.state==='play')update(dt);render();requestAnimationFrame(loop);}
obtn.onclick=()=>{showGate();};
requestAnimationFrame(loop);
</script>
</body>
</html>
