<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ash Storm Survivor — Fire Babys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0805;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#back{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:10px;pointer-events:none;z-index:5}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #000}
#combo{font-size:16px;font-weight:800;color:#ff8a3d;min-height:20px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,0,.88);color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:32px;font-weight:900;color:#ff6a00;margin-bottom:10px}
#overlay p{font-size:16px;max-width:400px;margin-bottom:6px}
#overlay .lesson{background:#1e6b26;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;max-width:420px}
#overlay button{background:#ff6a00;color:#fff;border:3px solid #fff;font-size:20px;font-weight:800;padding:12px 36px;border-radius:999px;margin-top:6px}
#mathgate input{font-size:28px;width:100px;text-align:center;border-radius:10px;border:3px solid #ff6a00;padding:6px;margin:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<button id="back" onclick="location.href='/fire-world.html'">← Fire World</button>
<div id="hud"><div id="score">SURVIVED 0s</div><div id="combo"></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<h1>🌪️ ASH STORM SURVIVOR</h1>
<p>Tug-of-war against the ash storm! TAP RAPIDLY (or mash SPACE) to pull the rope and keep Boulder anchored. Don't get blown away!</p>
<div class="lesson">🔥 Fire Safety: In smoky air, stay LOW where the air is clearer — smoke rises, so crawl under it!</div>
<div id="mathgate"><p>Parents: what's <b id="mq"></b>?</p><input id="ma" type="number" inputmode="numeric"><br><button onclick="checkMath()">START</button></div>
<button id="startbtn" class="hidden" onclick="startGame()">▶ PLAY</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',rs);rs();
const a=7+Math.floor(Math.random()*2),b=1+Math.floor(Math.random()*4);
document.getElementById('mq').textContent=a+' + '+b+' = ?';
function checkMath(){if(parseInt(document.getElementById('ma').value)===a+b){document.getElementById('mathgate').classList.add('hidden');document.getElementById('startbtn').classList.remove('hidden');}else alert('Try again!');}
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,t){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let running=false,anchor=0.5,stormP=0.5,surv=0,taps=0,combo=0,parts=[],shake=0,ash=[],ropeT=0,best=0;
function startGame(){running=true;anchor=0.5;stormP=0.5;surv=0;taps=0;combo=0;parts=[];shake=0;ash=[];ropeT=0;overlay.classList.add('hidden');}
function burst(x,y,c,n){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s-2,life:1,c,sz:3+Math.random()*5});}}
function gameOver(){
  running=false;best=Math.max(best,surv);
  overlay.querySelector('h1').textContent='🌪️ BLOWN AWAY!';
  overlay.querySelector('p').textContent='Boulder survived '+surv.toFixed(1)+'s with '+taps+' pulls!';
  document.getElementById('mathgate').classList.add('hidden');
  const sb=document.getElementById('startbtn');sb.classList.remove('hidden');sb.textContent='↻ HOLD ON AGAIN';
  overlay.classList.remove('hidden');beep(120,0.5,'sawtooth');
}
function pull(){
  if(!running)return;
  anchor=Math.min(1,anchor+0.035);taps++;
  combo++;if(combo%10===0){comboEl.textContent='💪 '+combo+' PULLS!';burst(W/2,H/2,'#ffd23f',12);beep(500+combo*5,0.12,'square');}
  if(taps%25===0)beep(700,0.15,'triangle');
}
function update(dt){
  if(!running)return;
  surv+=dt;ropeT+=dt;
  // storm pushes: grows over time, gusts randomly
  const base=0.32+surv*0.006;
  const gust=Math.max(0,Math.sin(ropeT*1.7)+Math.sin(ropeT*0.6))*0.25;
  stormP=base+gust;
  anchor-=stormP*dt*0.55;
  anchor=Math.max(0,Math.min(1,anchor));
  scoreEl.textContent='SURVIVED '+surv.toFixed(1)+'s';
  // ash particles
  if(Math.random()<0.5)ash.push({x:W+20,y:Math.random()*H,vx:-(200+Math.random()*300+surv*8),vy:(Math.random()-0.5)*80,sz:2+Math.random()*5,life:1});
  ash.forEach(a2=>{a2.x+=a2.vx*dt;a2.y+=a2.vy*dt;a2.life-=dt*0.3;});
  ash=ash.filter(a2=>a2.life>0&&a2.x>-30);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.4;});
  parts=parts.filter(p=>p.life>0);
  if(Math.random()<stormP*0.1)shake=Math.max(shake,6);
  shake*=0.9;
  if(anchor<=0){gameOver();}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0805');g.addColorStop(1,'#241408');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // ash
  ctx.fillStyle='#8a7a6a';
  ash.forEach(a2=>{ctx.globalAlpha=a2.life*0.6;ctx.beginPath();ctx.arc(a2.x,a2.y,a2.sz,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  // ground line + danger zone
  const ax=W*0.15+anchor*(W*0.7);
  ctx.fillStyle='#3a1a0c';ctx.fillRect(0,H*0.72,W,H*0.28);
  ctx.fillStyle='rgba(255,60,0,0.35)';ctx.fillRect(0,H*0.72,W*0.15,H*0.28);
  ctx.fillStyle='#ff3b2e';ctx.font='bold 16px sans-serif';ctx.fillText('⚠️ EDGE',14,H*0.72+30);
  // anchor rock
  ctx.fillStyle='#5a5a5a';ctx.beginPath();ctx.arc(W*0.85,H*0.72,34,0,6.29);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=4;ctx.stroke();
  // rope
  ctx.strokeStyle='#c4a06a';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(ax,H*0.72-20);ctx.lineTo(W*0.85,H*0.72-20);ctx.stroke();
  // Boulder (grey rock fire baby)
  ctx.save();ctx.translate(ax,H*0.72-52);
  const lean=(0.5-anchor)*0.6;
  ctx.rotate(-lean);
  const bg2=ctx.createRadialGradient(-6,-8,4,0,0,30);
  bg2.addColorStop(0,'#b0b0b0');bg2.addColorStop(0.5,'#7a7a7a');bg2.addColorStop(1,'#4a4a4a');
  ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(0,0,30,0,6.29);ctx.fill();
  ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(-10,-26);ctx.quadraticCurveTo(0,-44,10,-26);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,-2,5,0,6.29);ctx.arc(9,-2,5,0,6.29);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(-9,-1,2.5,0,6.29);ctx.arc(9,-1,2.5,0,6.29);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,12);ctx.lineTo(8,12);ctx.stroke();
  ctx.restore();
  // storm meter
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-150,30,300,24);
  ctx.fillStyle='#ff3b2e';ctx.fillRect(W/2-150,30,300*Math.min(1,stormP),24);
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('🌪️ STORM',W/2,48);ctx.textAlign='left';
  // anchor meter
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-150,60,300,24);
  ctx.fillStyle='#7dff9a';ctx.fillRect(W/2-150,60,300*anchor,24);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('⚓ HOLD',W/2,78);ctx.textAlign='left';
  // tap hint
  if(surv<3){ctx.fillStyle='#ffd23f';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('TAP TAP TAP!',W/2,H*0.4);ctx.textAlign='left';}
  parts.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.restore();
}
let lt=0;function loop(t){const dt=Math.min((t-lt)/1000||0,0.05);lt=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
cv.addEventListener('pointerdown',pull);
addEventListener('keydown',e=>{if(e.key===' ')pull();});
</script>
</body>
</html>
