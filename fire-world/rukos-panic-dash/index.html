<style>

<body>
<div id="game">

<script>
'use strict';
/* ============================================================
   RUKO'S PANIC DASH — COMPLETE OVERHAUL (Jeff's order, 2026-10-13)
   "VOLCANO ESCAPE": a 20-level 3-lane dash. A lava wave is chasing
   Ruko — reach the finish banner before it catches him!
   - ◀ ▶ lanes · ▲ jump (lava pools, rocks) · ▼ slide (tall pillars)
   - 🌪️ TORNADO DASH (Space / DASH button): smash through anything,
     0.45s, 2.5s cooldown — the only way through Bone Barricades
   - ⭐ Ember stars push the lava wave back; stumbling lets it surge
   - 3 hearts per level. Stars at the finish: 3♥=★★★, 2♥=★★, 1♥=★
   ============================================================ */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),otitle=document.getElementById('otitle'),
      obody=document.getElementById('obody'),obtn=document.getElementById('obtn'),olesson=document.getElementById('olesson');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);calcLanes();}
addEventListener('resize',resize);

/* lanes */
const LANES=[0,0,0];
function calcLanes(){const cx=W/2,sp=Math.min(W*0.22,140);LANES[0]=cx-sp;LANES[1]=cx;LANES[2]=cx+sp;}

/* audio */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){if(window.__fbMuted)return;const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}
function noise(dur,vol,delay=0,lp=1000){if(window.__fbMuted)return;const ac=audio();if(!ac)return;const t=ac.currentTime+delay;
  const len=ac.sampleRate*dur,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource();s.buffer=buf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);}
const sfx={
  jump(){tone(300,700,0.15,'sine',0.15);},
  slide(){noise(0.2,0.15,0,600);},
  swipe(){tone(500,900,0.08,'sine',0.1);},
  star(){tone(1200,1800,0.12,'sine',0.15);tone(1800,2400,0.1,'sine',0.08,0.05);},
  near(){tone(800,1200,0.1,'triangle',0.12);},
  dash(){noise(0.35,0.3,0,2400);tone(200,1400,0.3,'sawtooth',0.12);},
  smash(){noise(0.25,0.4,0,900);tone(160,50,0.25,'square',0.2);},
  hit(){noise(0.3,0.4,0,500);tone(200,50,0.3,'sawtooth',0.25);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.25,'triangle',0.18,i*0.1));},
  click(){tone(600,600,0.06,'square',0.1);},
  go(){[523,659,784].forEach((f,i)=>tone(f,f,0.15,'triangle',0.15,i*0.08));}
};

/* pools */
const particles=[],floaters=[];
for(let i=0;i<220;i++)particles.push({a:false});
for(let i=0;i<20;i++)floaters.push({a:false});
function spawnP(x,y,vx,vy,life,color,size){const p=particles.find(p=>!p.a);if(!p)return;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.color=color;p.size=size;}
function spawnText(x,y,txt,color='#ffd23f'){const f=floaters.find(f=>!f.a);if(!f)return;
  f.a=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.life=1;}

/* trauma */
let trauma=0,hitStop=0,shakeX=0,shakeY=0;
function addTrauma(t){trauma=Math.min(1,trauma+t);}

/* game state */
const MAX_LEVEL=20;
const G={state:'title',level:1,score:0,best:0,speed:0,lane:1,laneX:0,
  y:0,vy:0,jumping:false,sliding:false,slideT:0,
  dist:0,goal:300,hearts:3,wave:26,dashT:0,dashCD:0,
  obstacles:[],stars:[],spawnT:0,starSpawnT:0,time:0,
  combo:0,comboT:0,invuln:0,runT:0,levelStartScore:0};
try{G.best=parseInt(localStorage.getItem('ruko_best')||'0',10)||0;}catch(e){}
const groundY=()=>H*0.78;
const GRAV=3200;

function levelParams(n){
  return {goal:260+(n-1)*25,
    baseSpeed:430+(n-1)*14,
    spawn:Math.max(0.5,1.05-(n-1)*0.028),
    creep:2.15+(n-1)*0.07,
    barrier:n>=6, rows:n>=4};
}
function startLevel(n){
  const P=levelParams(n);
  G.level=n;G.goal=P.goal;G.dist=0;G.hearts=3;G.wave=26;
  G.speed=P.baseSpeed;G.lane=1;G.laneX=LANES[1];
  G.y=0;G.vy=0;G.jumping=false;G.sliding=false;G.slideT=0;
  G.dashT=0;G.dashCD=0;G.invuln=0;
  G.obstacles=[];G.stars=[];G.spawnT=1.0;G.starSpawnT=0.4;
  G.combo=0;G.comboT=0;G.runT=0;G.levelStartScore=G.score;
  document.getElementById('level').textContent='LEVEL '+n+'/'+MAX_LEVEL;
  updateHUD();
}
function reset(){ // used by the fb-cycle2 restart cluster: restart current level, fresh score
  G.score=0;startLevel(G.level||1);updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent='⭐ '+G.score;
  document.getElementById('dist').textContent='🏁 '+Math.max(0,Math.ceil(G.goal-G.dist))+'m to go!';
  document.getElementById('best').textContent='🏆 '+G.best;
}

/* spawning — always solvable: never blocks all 3 lanes in one z-band,
   and a free lane (or a dashable barricade lane) always exists */
function spawnObstacle(){
  const P=levelParams(G.level);
  const lane=Math.floor(Math.random()*3);
  const r=Math.random();
  let type='rock';
  if(r<0.28)type='lava';else if(r<0.48)type='tall';else if(P.barrier&&r<0.62)type='barrier';
  const near=G.obstacles.filter(o=>o.z<220);
  const lanesUsed=new Set(near.map(o=>o.lane));
  if(lanesUsed.size>=2&&lanesUsed.has(lane))return;
  G.obstacles.push({lane,z:-100,type,w:type==='tall'?50:60,h:type==='tall'?110:(type==='lava'?50:60),passed:false,dead:false});
  // from L4: sometimes a second obstacle in the same band, different lane
  if(P.rows&&Math.random()<0.4){
    const others=[0,1,2].filter(l=>l!==lane&&!lanesUsed.has(l));
    if(others.length&&lanesUsed.size<2){
      const l2=others[Math.floor(Math.random()*others.length)];
      const t2=Math.random()<0.5?'rock':'lava';
      G.obstacles.push({lane:l2,z:-100,type:t2,w:60,h:t2==='lava'?50:60,passed:false,dead:false});
    }
  }
}
function spawnStar(){
  const lane=Math.floor(Math.random()*3);
  for(let i=0;i<3;i++)G.stars.push({lane,z:-100-i*70,y:0,collected:false,spin:Math.random()*6});
}

/* input */
function doLeft(){if(G.state!=='play')return;if(G.lane>0){G.lane--;sfx.swipe();}}
function doRight(){if(G.state!=='play')return;if(G.lane<2){G.lane++;sfx.swipe();}}
function doJump(){if(G.state!=='play')return;if(!G.jumping){G.jumping=true;G.vy=-1150;G.sliding=false;sfx.jump();
  for(let i=0;i<8;i++)spawnP(G.laneX,groundY(),(Math.random()-0.5)*200,-Math.random()*100,0.4,'#ffb347',4);}}
function doSlide(){if(G.state!=='play')return;if(!G.jumping&&!G.sliding){G.sliding=true;G.slideT=0.6;sfx.slide();}}
function doDash(){if(G.state!=='play')return;
  if(G.dashCD<=0&&G.dashT<=0){G.dashT=0.45;G.dashCD=2.5;sfx.dash();
    document.getElementById('dashBtn').classList.add('cd');}}
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')doLeft();
  else if(e.key==='ArrowRight'||e.key==='d')doRight();
  else if(e.key==='ArrowUp'||e.key==='w')doJump();
  else if(e.key==='ArrowDown'||e.key==='s')doSlide();
  else if(e.key===' '||e.key==='Shift'||e.key==='x'||e.key==='X')doDash();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});
document.getElementById('dashBtn').addEventListener('pointerdown',e=>{e.stopPropagation();doDash();});
let touchSX=0,touchSY=0,lastTapT=0,lastTapX=0;
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];touchSX=t.clientX;touchSY=t.clientY;
  const now=Date.now();
  if(now-lastTapT<300&&Math.abs(t.clientX-lastTapX)<60)doDash(); // double-tap = dash
  lastTapT=now;lastTapX=t.clientX;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-touchSX,dy=t.clientY-touchSY;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<24){
    if(t.clientY<H*0.5)doJump();else doSlide();return;
  }
  if(adx>ady){dx>0?doRight():doLeft();}else{dy<0?doJump():doSlide();}
},{passive:true});
let mouseSX=0,mouseSY=0;
canvas.addEventListener('mousedown',e=>{mouseSX=e.clientX;mouseSY=e.clientY;});
canvas.addEventListener('mouseup',e=>{
  const dx=e.clientX-mouseSX,dy=e.clientY-mouseSY,adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<10)return;
  if(adx>ady){dx>0?doRight():doLeft();}else{dy<0?doJump():doSlide();}
});
canvas.addEventListener('dblclick',()=>doDash());

/* update */
function update(dt){
  G.time+=dt;G.runT+=dt;
  const P=levelParams(G.level);
  G.speed=Math.min(920,P.baseSpeed+G.runT*9);
  G.dist+=G.speed*dt/50;
  // --- the lava wave: creeps closer; Ruko's run + stars push it back ---
  const escape=(G.speed/50)*0.30;
  G.wave+=(escape-P.creep)*dt;
  if(G.dashT>0)G.wave+=3.2*dt; // dashing outruns it
  G.wave=Math.min(30,G.wave);
  if(G.wave<=0){gameOver('wave');return;}
  // lane lerp
  const targetX=LANES[G.lane];
  G.laneX+=(targetX-G.laneX)*Math.min(1,dt*12);
  // jump physics
  if(G.jumping){G.vy+=GRAV*dt;G.y+=G.vy*dt;
    if(G.y>=0){G.y=0;G.vy=0;G.jumping=false;
      for(let i=0;i<6;i++)spawnP(G.laneX,groundY(),(Math.random()-0.5)*150,-Math.random()*80,0.3,'#8a6a4a',3);}}
  if(G.sliding){G.slideT-=dt;if(G.slideT<=0)G.sliding=false;}
  if(G.invuln>0)G.invuln-=dt;
  if(G.dashT>0)G.dashT-=dt;
  if(G.dashCD>0){G.dashCD-=dt;if(G.dashCD<=0)document.getElementById('dashBtn').classList.remove('cd');}
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;
  // spawn
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.dist<G.goal-30){spawnObstacle();G.spawnT=P.spawn*(0.8+Math.random()*0.5);}
  G.starSpawnT-=dt;
  if(G.starSpawnT<=0){spawnStar();G.starSpawnT=1.4+Math.random()*1.6;}
  const dz=G.speed*dt;
  const py=groundY();
  const dashing=G.dashT>0;
  for(const o of G.obstacles){
    o.z+=dz;
    const scale=Math.max(0.15,1+o.z/900);
    const ox=LANES[o.lane];
    const ow=o.w*scale;
    if(!o.passed&&o.z>0&&o.z<90){
      const px=G.laneX,pr=26;
      const inLane=Math.abs(px-ox)<(ow/2+pr*0.7);
      if(inLane){
        if(dashing){ // 🌪️ SMASH!
          o.dead=true;o.passed=true;
          G.score+=150;G.wave=Math.min(30,G.wave+1.5);
          sfx.smash();addTrauma(0.3);
          spawnText(px,py-130,'🌪️ SMASH +150','#7fd4ff');
          for(let i=0;i<14;i++)spawnP(px,py-50,(Math.random()-0.5)*420,(Math.random()-0.5)*420,0.6,'#cfc4b0',5);
        }else{
          let hit=false;
          if(o.type==='lava'){if(G.y>-40)hit=true;}
          else if(o.type==='tall'){if(!G.sliding&&G.y>-30)hit=true;}
          else if(o.type==='barrier'){hit=true;} // only dash or dodge beats it
          else{if(G.y>-50)hit=true;}
          if(hit&&G.invuln<=0){hurtPlayer(o);if(G.state!=='play')return;}
          if(!hit&&!o.passed){
            G.combo++;G.comboT=1.5;
            const bonus=10*G.combo;G.score+=bonus;
            spawnText(px,py-120,'NEAR MISS +'+bonus,'#7fd4ff');
            sfx.near();
          }
        }
      }
      o.passed=true;
    }
    if(o.z>300)o.dead=true;
  }
  G.obstacles=G.obstacles.filter(o=>!o.dead);
  // stars
  for(const s of G.stars){
    s.z+=dz;s.spin+=dt*5;
    if(!s.collected&&s.z>0&&s.z<90){
      const px=G.laneX,sx=LANES[s.lane];
      if(Math.abs(px-sx)<50&&G.y>-60){
        s.collected=true;
        G.combo++;G.comboT=2;
        const pts=25*(1+Math.floor(G.combo/5));
        G.score+=pts;G.wave=Math.min(30,G.wave+2);sfx.star();
        spawnText(sx,py-100,'+'+pts+' 🌊⬇');
        for(let i=0;i<8;i++)spawnP(sx,py-60,(Math.random()-0.5)*250,(Math.random()-0.5)*250,0.5,'#ffd23f',4);
        if(G.combo>0&&G.combo%10===0)spawnText(W/2,H*0.3,'🔥 COMBO x'+G.combo+'!','#ff6a1a');
      }
    }
    if(s.z>300)s.collected=true;
  }
  G.stars=G.stars.filter(s=>!s.collected);
  updateHUD();
  if(G.dist>=G.goal)levelComplete();
}
function hurtPlayer(o){
  G.hearts--;G.invuln=1.4;G.wave=Math.max(0.5,G.wave-7);
  sfx.hit();addTrauma(0.6);hitStop=0.12;
  for(let i=0;i<16;i++)spawnP(G.laneX,groundY()-40,(Math.random()-0.5)*400,(Math.random()-0.5)*400,0.6,'#ff6a1a',5);
  spawnText(G.laneX,groundY()-140,'💥 OUCH! '+(G.hearts>0?G.hearts+' ♥ left':'') ,'#ff5a4a');

}

        '🔥 Fire Safety: If there\'s smoke, stay LOW and go — crawl under it to safety!',

/* rendering */
function drawRuko(x,y,squash,sliding){
  ctx.save();ctx.translate(x,y);
  const h=sliding?34:64;
  ctx.scale(1+squash*0.5,1-squash);
  const gl=ctx.createRadialGradient(0,-h/2,5,0,-h/2,50);
  gl.addColorStop(0,'rgba(255,80,0,0.3)');gl.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,-h/2,50,0,Math.PI*2);ctx.fill();
  const g=ctx.createRadialGradient(-8,-h/2-10,5,0,-h/2,30);
  g.addColorStop(0,'#ffe9a0');g.addColorStop(0.5,'#ff7a2a');g.addColorStop(1,'#d42a1a');
  ctx.fillStyle=g;
  if(sliding){ctx.beginPath();ctx.ellipse(0,-17,30,17,0,0,Math.PI*2);ctx.fill();}
  else{ctx.beginPath();ctx.arc(0,-h/2,26,0,Math.PI*2);ctx.fill();}
  const w=Math.sin(G.time*12)*4;
  ctx.fillStyle='#ff4a00';
  ctx.beginPath();
  if(sliding){ctx.moveTo(-20,-28);ctx.quadraticCurveTo(w,-52,20,-28);ctx.quadraticCurveTo(0,-38,-20,-28);}
  else{ctx.moveTo(-14,-h+6);ctx.quadraticCurveTo(w,-h-22,14,-h+6);ctx.quadraticCurveTo(0,-h-8,-14,-h+6);}
  ctx.fill();
  ctx.strokeStyle='#2b1a0e';ctx.lineWidth=3;ctx.lineCap='round';
  const ey=sliding?-22:-h/2-6;
  ctx.beginPath();ctx.moveTo(-16,ey-8);ctx.lineTo(-4,ey-3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,ey-8);ctx.lineTo(4,ey-3);ctx.stroke();
  ctx.fillStyle='#2b1a0e';
  ctx.beginPath();ctx.arc(-9,ey+2,4,0,Math.PI*2);ctx.arc(9,ey+2,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-8,ey+14);ctx.lineTo(8,ey+14);ctx.stroke();
  if(!sliding&&G.state==='play'){
    const lp=Math.sin(G.time*18)*10;
    ctx.strokeStyle='#a32a10';ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(-8+lp,6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(8-lp,6);ctx.stroke();
  }
  ctx.restore();
  // tornado dash swirl
  if(G.dashT>0){
    ctx.save();ctx.translate(x,y-32);
    ctx.strokeStyle='rgba(160,220,255,0.85)';ctx.lineWidth=4;
    for(let i=0;i<3;i++){
      const rr=20+i*9,off=G.time*22+i*2.1;
      ctx.beginPath();ctx.arc(0,0,rr,off,off+3.6);ctx.stroke();
    }
    ctx.restore();
  }
}
function render(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#12081f');sky.addColorStop(0.5,'#4a1428');sky.addColorStop(0.8,'#a83a10');sky.addColorStop(1,'#2a1008');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#160a12';
  ctx.beginPath();ctx.moveTo(W*0.3,groundY());ctx.lineTo(W*0.5,H*0.3);ctx.lineTo(W*0.7,groundY());ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff4a00';
  ctx.beginPath();ctx.ellipse(W*0.5,H*0.31,20,6,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const sy=(i*97+G.time*G.speed*0.8)%H;
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(60+((i*53)%40),sy);ctx.stroke();
  }

  ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  ctx.strokeStyle='rgba(255,200,100,0.25)';ctx.lineWidth=3;ctx.setLineDash([24,30]);
  ctx.lineDashOffset=-(G.time*Math.max(G.speed,1)*0.9)%54;
  for(let i=0;i<2;i++){const lx=(LANES[i]+LANES[i+1])/2;
    ctx.beginPath();ctx.moveTo(lx,gy);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);
  ctx.fillStyle='#ff4a00';
  for(let i=0;i<8;i++){
    const cx=(i*239+G.time*Math.max(G.speed,1)*0.5)%(W+100)-50;
    ctx.globalAlpha=0.5+Math.sin(G.time*5+i)*0.2;

    ctx.beginPath();ctx.moveTo(LANES[2]+44,gy);ctx.lineTo(LANES[2]+44,by);ctx.stroke();
    const bw=(LANES[2]-LANES[0])+88,sq=11;
    for(let cx2=0;cx2<bw/sq;cx2++)for(let ry=0;ry<2;ry++){
      ctx.fillStyle=(cx2+ry)%2?'#fff':'#141414';
      ctx.fillRect(LANES[0]-44+cx2*sq,by+ry*sq,sq,sq);
    }
    ctx.fillStyle='#ffd23f';ctx.font='900 15px system-ui';ctx.textAlign='center';
    ctx.fillText('🏁 FINISH!',W/2,by-8);ctx.textAlign='left';
  }
  // stars (collectibles)
  for(const s of G.stars){
    const scale=Math.max(0.2,1+s.z/900);
    const sx=LANES[s.lane],sy=gy-60*scale+s.y*scale;

    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#a37a00';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+i*Math.PI*2/5,a2=a+Math.PI/5;

  // obstacles
  for(const o of G.obstacles){

    const ox=LANES[o.lane],oy=gy;
    ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
    if(o.type==='lava'){
      const lg=ctx.createRadialGradient(0,-10,5,0,-10,40);
      lg.addColorStop(0,'#ffdd44');lg.addColorStop(0.5,'#ff6a00');lg.addColorStop(1,'#a31a00');
      ctx.fillStyle=lg;
      ctx.beginPath();ctx.ellipse(0,-12,34,14+Math.sin(G.time*8)*3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffdd44';
      for(let i=0;i<3;i++){const bx=Math.sin(G.time*6+i*2)*20;
        ctx.beginPath();ctx.arc(bx,-14-((G.time*40+i*25)%25),3,0,Math.PI*2);ctx.fill();}
    }else if(o.type==='tall'){
      const rg=ctx.createLinearGradient(-25,0,25,0);
      rg.addColorStop(0,'#6a5a4a');rg.addColorStop(0.5,'#9a8a7a');rg.addColorStop(1,'#4a3a2a');
      ctx.fillStyle=rg;ctx.fillRect(-25,-110,50,110);
      ctx.fillStyle='#3a2a1a';ctx.fillRect(-25,-110,50,10);
      ctx.fillStyle='#ff4a00';
      for(let i=0;i<3;i++)ctx.fillRect(-25,-90+i*30,50,8);
    }else if(o.type==='barrier'){
      // BONE BARRICADE — dash or dodge only!
      ctx.fillStyle='#e8e4da';
      for(let i=0;i<5;i++){const bx=-28+i*14;
        ctx.beginPath();ctx.moveTo(bx,-64);ctx.lineTo(bx+6,-78);ctx.lineTo(bx+12,-64);ctx.lineTo(bx+12,0);ctx.lineTo(bx,0);ctx.closePath();ctx.fill();}
      ctx.fillStyle='#cfc9bc';ctx.fillRect(-32,-58,64,12);ctx.fillRect(-32,-22,64,12);
      ctx.fillStyle='#e8e4da';ctx.beginPath();ctx.arc(0,-38,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(-4,-39,3,0,Math.PI*2);ctx.arc(4,-39,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff4a00';ctx.font='900 10px system-ui';ctx.textAlign='center';
      ctx.fillText('DASH!',0,14);ctx.textAlign='left';
    }else{
      const rg=ctx.createRadialGradient(-10,-40,5,0,-30,40);
      rg.addColorStop(0,'#9a8a7a');rg.addColorStop(1,'#4a3a2a');
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(0,-30,30+Math.sin(G.time*3+o.lane)*2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a1a0a';
      ctx.beginPath();ctx.arc(-10,-38,6,0,Math.PI*2);ctx.arc(8,-28,4,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  // player
  if(G.state==='play'||G.state==='over'||G.state==='clear'){
    const squash=G.jumping?Math.min(0.25,Math.abs(G.vy)/6000):(Math.sin(G.time*18)*0.04);
    const blink=G.invuln>0&&Math.sin(G.time*30)>0;
    ctx.globalAlpha=blink?0.4:1;
    drawRuko(G.laneX,gy+G.y,squash,G.sliding);
    ctx.globalAlpha=1;
  }
  // hearts + dash meter
  if(G.state==='play'){
    ctx.textAlign='left';ctx.font='20px system-ui';
    ctx.fillText('♥'.repeat(Math.max(0,G.hearts))+'♡'.repeat(Math.max(0,3-G.hearts)),14,104);
    if(G.dashCD>0){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(14,112,90,9);
      ctx.fillStyle='#7fd4ff';ctx.fillRect(14,112,90*(1-G.dashCD/2.5),9);}
    else{ctx.fillStyle='#7fd4ff';ctx.font='900 13px system-ui';ctx.fillText('🌪️ DASH READY!',14,122);}
  }
  // particles
  for(const p of particles){
    if(!p.a)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.max),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){
    if(!f.a)continue;
    ctx.globalAlpha=Math.min(1,f.life*1.5);
    ctx.font='900 20px system-ui';ctx.fillStyle='#000';
    ctx.fillText(f.txt,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  if(G.combo>=5){
    ctx.textAlign='center';ctx.font='900 26px system-ui';
    ctx.fillStyle='#000';ctx.fillText('🔥 x'+G.combo,W/2+2,80);
    ctx.fillStyle='#ff6a1a';ctx.fillText('🔥 x'+G.combo,W/2,78);
    ctx.textAlign='left';
  }
  ctx.restore();
  // THE LAVA WAVE (bottom of screen — taller = closer!)
  const waveH=8+Math.pow(1-G.wave/30,2)*(H*0.34);
  const wg=ctx.createLinearGradient(0,H-waveH,0,H);
  wg.addColorStop(0,'rgba(255,90,0,0)');wg.addColorStop(0.35,'#ff6a00');wg.addColorStop(1,'#a31a00');
  ctx.fillStyle=wg;ctx.fillRect(0,H-waveH,W,waveH);
  ctx.fillStyle='#ffdd44';
  for(let i=0;i<14;i++){
    const fx=(i*113+((G.time*160)%113))%W;
    const fh=6+Math.sin(G.time*9+i*1.7)*5+(1-G.wave/30)*16;
    ctx.beginPath();ctx.ellipse(fx,H-waveH+4,7,fh,0,0,Math.PI*2);ctx.fill();
  }
  if(G.state==='play'&&G.wave<9){
    ctx.fillStyle='rgba(255,40,0,'+(0.25+0.2*Math.sin(G.time*8))+')';
    ctx.font='900 22px system-ui';ctx.textAlign='center';
    ctx.fillText('🌋 THE WAVE IS RIGHT BEHIND YOU!',W/2,H*0.22);
    ctx.textAlign='left';
  }
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

/* main loop */
let lastT=0;
function loop(t){
  const rawDt=Math.min((t-lastT)/1000||0,1/30);lastT=t;
  if(window.__fbPaused){requestAnimationFrame(loop);return;} // [w5b] pause freeze
  let dt=rawDt;
  if(hitStop>0){hitStop-=rawDt;dt=rawDt*0.1;}
  trauma=Math.max(0,trauma-dt*1.8);
  const sh=trauma*trauma*20;
  shakeX=(Math.random()-0.5)*sh*2;shakeY=(Math.random()-0.5)*sh*2;
  if(G.state==='play')update(dt);
  else G.time+=dt;
  for(const p of particles){if(!p.a)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt;if(p.life<=0)p.a=false;}
  for(const f of floaters){if(!f.a)continue;f.y-=60*dt;f.life-=dt;if(f.life<=0)f.a=false;}
  render();
  requestAnimationFrame(loop);
}

/* ===== MUSIC (Jeff 2026-10-13): 'Panic at 154' — Panic Dash's own track.
   Synthesized Web Audio only. 154 BPM, D minor: relentless ostinato bass,
   sawtooth arpeggio lead, four-on-the-floor kick — pure chase energy.
   Starts on first interaction; 🔊 mute + pause freeze it. ===== */
const _mf=m=>440*Math.pow(2,(m-69)/12);
const MUS={on:false,step:0,nextT:0,BPM:154,
 BASS:[38,38,0,38,38,0,38,38, 38,38,0,38,41,0,43,0, 38,38,0,38,38,0,38,38, 46,0,45,0,43,0,41,0],
 LEAD:[74,77,81,86,81,77,74,77, 74,77,81,86,89,86,81,77, 74,77,81,86,81,77,74,77, 82,81,77,74,77,74,0,0],
 start(){if(this.on)return;const ac=audio();if(!ac)return;this.on=true;this.nextT=ac.currentTime+0.08;
  setInterval(()=>this.tick(),42);},
 tick(){const ac=audio();if(!ac)return;
  if(window.__fbMuted||window.__fbPaused||G.state!=='play'){this.nextT=ac.currentTime+0.06;return;}
  while(this.nextT<ac.currentTime+0.14){this.play(this.step,this.nextT);this.nextT+=60/this.BPM/2;this.step=(this.step+1)%32;}},
 play(s,t){const d=Math.max(0,t-audio().currentTime);
  const b=this.BASS[s];if(b)tone(_mf(b),_mf(b),0.11,'sawtooth',0.06,d);
  const l=this.LEAD[s];if(l&&s%2===0)tone(_mf(l),_mf(l),0.1,'square',0.035,d);
  if(s%2===0)tone(125,45,0.11,'sine',0.15,d); // four-on-the-floor
  if(s%8===2||s%8===6)noise(0.08,0.09,d,1700); // snare
  noise(0.02,0.018,d,7000); // driving hats
 }};
addEventListener('pointerdown',()=>MUS.start());
addEventListener('keydown',()=>MUS.start());

/* [w5b] pause + mute controls.
   Pause: the main loop early-returns before any sim update while
   window.__fbPaused is set; the "⏸ Paused" overlay shows. */
const __pb=document.getElementById('pauseBtn'),__mb=document.getElementById('muteBtn'),__pt=document.getElementById('pausedTxt');
function __setPaused(v){if(v&&G.state!=='play')return;window.__fbPaused=!!v;__pb.textContent=window.__fbPaused?'▶':'⏸';__pt.classList.toggle('hidden',!window.__fbPaused);}
__pb.addEventListener('click',e=>{e.stopPropagation();__setPaused(!window.__fbPaused);});
__mb.addEventListener('click',e=>{e.stopPropagation();window.__fbMuted=!window.__fbMuted;__mb.textContent=window.__fbMuted?'🔇':'🔊';try{if(typeof AC!=='undefined'&&AC){if(window.__fbMuted)AC.suspend();else AC.resume();}}catch(err){}});
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'||e.key==='Escape')__setPaused(!window.__fbPaused);if(e.key==='m'||e.key==='M')__mb.click();});
</script>
<script data-fbcycle2>
/* fb-cycle2: in-play restart — the cluster button runs the game's own overlay reset path. */
(function(){var b=document.getElementById('restartBtn');if(!b)return;b.addEventListener('click',function(e){e.stopPropagation();if(typeof G==='undefined'||G.state!=='play')return;window.__fbPaused=false;document.getElementById('pauseBtn').textContent='\u23f8';document.getElementById('pausedTxt').classList.add('hidden');reset();G.state='play';document.getElementById('overlay').classList.add('hidden');try{sfx.go();}catch(err){}});})();
</script>
